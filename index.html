<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lesson materials and classroom resources for Syl's middle school classes.">
  <title>Syl's Corner | Middle School English</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header>
    <a class="wordmark" href="#top" aria-label="Syl's Corner home">
      <img class="mark" src="assets/syl-corner-mark.png" alt="">
    </a>
    <nav aria-label="Main navigation"><a href="#classes">Classes</a><a href="tools.html">Tools</a></nav>
  </header>

  <main>
    <section class="hero" id="top" aria-label="Syl's Corner">
      <div class="hero-visual" aria-hidden="true">
        <picture>
          <source media="(max-width: 650px)" srcset="assets/syl-corner-hero-watercolor-mobile.png">
          <img src="assets/syl-corner-hero-watercolor-v2.png" alt="">
        </picture>
      </div>
      <a class="scroll" href="#classes" aria-label="Choose your class"><span aria-hidden="true">↓</span></a>
    </section>

    <section class="classes" id="classes">
      <div class="tabs">
        <div class="tab-list" role="tablist" aria-label="Choose your class">
          <button class="tab" role="tab" id="tab-6LVA" aria-controls="panel-6LVA" aria-selected="true" data-class="6LVA"><span class="tab-name">6LVA</span><span class="tab-detail">Games are ready.</span></button>
          <button class="tab" role="tab" id="tab-6SI" aria-controls="panel-6SI" aria-selected="false" data-class="6SI" tabindex="-1"><span class="tab-name">6SI</span><span class="tab-detail">Week 1 lessons are ready.</span></button>
          <button class="tab" role="tab" id="tab-5SI" aria-controls="panel-5SI" aria-selected="false" data-class="5SI" tabindex="-1"><span class="tab-name">5SI</span><span class="tab-detail">Week 1 lessons are ready.</span></button>
        </div>
        <div id="panels"></div>
      </div>
    </section>
  </main>

  <footer><p>© <span id="year"></span> Syl's Corner</p></footer>
</body>
</html>
