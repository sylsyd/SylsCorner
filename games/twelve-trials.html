<title>Twelve Trials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ground:#0E1119;
    --ground2:#161B27;
    --line:#2A3040;
    --vellum:#EDE3CE;
    --dim:#8C8878;
    --gold:#D9A441;
    --ember:#C4462E;
    --moss:#7E9B6A;
    --display:"Cinzel", "Times New Roman", serif;
    --body:"Spectral", Georgia, serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  .crossed{
    --ground:#140F14;
    --ground2:#1E1720;
    --line:#3B2C34;
    --vellum:#E9DCCB;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--ground);
    color:var(--vellum);
    font-family:var(--body);
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    transition:background .9s ease;
  }
  #cabinet{
    width:min(980px,100%);
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* ---- top rail ---- */
  #rail{
    display:flex;
    align-items:center;
    gap:14px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
  }
  #rail .stage{
    color:var(--vellum);
    letter-spacing:.18em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #rail .num{color:var(--gold);font-weight:600;}
  #rail .spacer{flex:1;}
  #rail button{
    font:inherit;
    letter-spacing:.14em;
    background:none;
    border:1px solid var(--line);
    color:var(--dim);
    padding:4px 9px;
    cursor:pointer;
    border-radius:2px;
  }
  #rail button:hover{color:var(--vellum);border-color:var(--dim);}
  #rail button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  #timer{
    height:3px;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  #timerfill{
    position:absolute;inset:0;
    transform-origin:left center;
    background:var(--gold);
    transform:scaleX(1);
  }
  #timerfill.low{background:var(--ember);}

  /* ---- screen ---- */
  #stage{
    position:relative;
    border:1px solid var(--line);
    background:var(--ground2);
    aspect-ratio:900/520;
    overflow:hidden;
  }
  #screen{display:block;width:100%;height:100%;}

  #overlay{
    position:absolute;inset:0;
    background:var(--ground);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(18px,4.2vw,44px);
    gap:clamp(10px,1.6vw,18px);
    overflow-y:auto;
  }
  #overlay[hidden]{display:none;}

  .eyebrow{
    font-family:var(--mono);
    font-size:clamp(9px,1.15vw,11px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
  }
  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(30px,6.4vw,62px);
    letter-spacing:.1em;
    line-height:1;
    margin:0;
    text-wrap:balance;
  }
  h2{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(21px,3.6vw,36px);
    letter-spacing:.06em;
    line-height:1.08;
    margin:0;
    text-wrap:balance;
  }
  .lede{
    font-size:clamp(13px,1.85vw,17px);
    line-height:1.55;
    max-width:56ch;
    margin:0;
    color:var(--vellum);
  }
  .lede em{color:var(--gold);font-style:italic;}
  .muted{color:var(--dim);}
  .cta{
    font-family:var(--mono);
    font-size:clamp(10px,1.3vw,12px);
    letter-spacing:.24em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--gold);
    color:var(--gold);
    min-height:48px;
    padding:11px 22px;
    cursor:pointer;
    align-self:flex-start;
    border-radius:2px;
  }
  .cta:hover{background:var(--gold);color:var(--ground);}
  .cta:focus-visible{outline:2px solid var(--vellum);outline-offset:3px;}
  .keys{
    font-family:var(--mono);
    font-size:clamp(9px,1.2vw,11px);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .keys b{color:var(--vellum);font-weight:600;}

  .verdict{
    display:inline-block;
    font-family:var(--mono);
    font-size:clamp(9px,1.2vw,11px);
    letter-spacing:.24em;
    text-transform:uppercase;
    padding:4px 10px;
    border:1px solid currentColor;
    border-radius:2px;
    align-self:flex-start;
  }
  .v-pass{color:var(--moss);}
  .v-fail{color:var(--ember);}
  .v-mark{color:var(--gold);}

  /* two-column split for intro/outro */
  .split{
    display:grid;
    grid-template-columns:1fr auto;
    gap:clamp(16px,3vw,40px);
    align-items:center;
  }
  .split .wheelbox{width:clamp(110px,17vw,178px);}
  @media (max-width:640px){
    .split{grid-template-columns:1fr;}
    .split .wheelbox{display:none;}
  }

  .wheel{width:100%;height:auto;display:block;}
  .sceneart{width:100%;max-width:430px;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--gold);border-radius:7px;box-shadow:8px 8px 0 rgba(0,0,0,.26);}
  .heroart{width:100%;max-width:170px;max-height:240px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(7px 8px 0 rgba(0,0,0,.28));}
  .modebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .modebtn{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:var(--ground2);color:var(--vellum);cursor:pointer;}
  .modebtn.on,.modebtn:hover{border-color:var(--gold);color:var(--gold);}
  .choicegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;max-width:680px;}
  .choicebtn{min-height:66px;text-align:left;font:600 12px var(--body);line-height:1.25;padding:12px;border:1px solid var(--line);border-radius:4px;background:#0a0d15;color:var(--vellum);cursor:pointer;}
  .choicebtn:hover,.choicebtn:focus-visible{border-color:var(--gold);color:var(--gold);outline:none;}
  .teacher-panel{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:6px;max-width:620px;}
  .teacher-panel button{font:600 10px var(--mono);letter-spacing:.08em;padding:9px 5px;background:var(--ground2);color:var(--vellum);border:1px solid var(--line);cursor:pointer;border-radius:3px;}
  .teacher-panel button:hover{border-color:var(--gold);color:var(--gold);}
  .leaderboard{border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.2);padding:12px;max-width:640px;}
  .leaderboard h3{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 9px;}
  .leaderboard table{width:100%;border-collapse:collapse;font:11px var(--mono);color:var(--vellum);}
  .leaderboard td,.leaderboard th{padding:6px 3px;border-top:1px solid var(--line);text-align:left;}
  .leaderboard th{font-weight:400;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
  .leaderboard td:last-child,.leaderboard th:last-child{text-align:right;}
  .leader-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .leader-form input{min-height:42px;min-width:170px;flex:1;padding:8px 10px;background:#090c14;border:1px solid var(--line);border-radius:4px;color:var(--vellum);font:14px var(--body);}
  .leader-form button{min-height:42px;padding:8px 12px;background:var(--gold);border:1px solid var(--gold);border-radius:4px;color:var(--ground);font:600 10px var(--mono);letter-spacing:.12em;cursor:pointer;}
  .clear-scores{margin-top:9px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:3px;padding:7px 9px;font:10px var(--mono);cursor:pointer;}

  /* end card */
  .endgrid{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:clamp(16px,3vw,36px);
    align-items:start;
  }
  .endgrid .wheelbox{width:clamp(130px,20vw,200px);}
  @media (max-width:700px){
    .endgrid{grid-template-columns:1fr;}
  }
  .tally{
    display:flex;
    flex-wrap:wrap;
    gap:6px 18px;
    font-family:var(--mono);
    font-size:clamp(9px,1.2vw,11px);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
    padding-top:2px;
  }
  .tally b{color:var(--vellum);font-weight:600;font-variant-numeric:tabular-nums;}
  ol.questions{
    margin:0;
    padding-left:1.15em;
    font-size:clamp(12px,1.6vw,15px);
    line-height:1.5;
    max-width:58ch;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  ol.questions::marker{color:var(--gold);}
  .rule{height:1px;background:var(--line);}

  .stagelist{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    gap:2px 14px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .stagelist span b{color:var(--vellum);font-weight:400;}

  /* ---- touch pad ---- */
  #pad{
    display:none;
    grid-template-columns:repeat(4,minmax(48px,1fr));
    gap:8px;
  }
  #pad.on{display:grid;}
  #pad button{
    font-family:var(--mono);
    font-size:18px;
    font-weight:600;
    min-height:58px;
    padding:10px 4px;
    background:var(--ground2);
    border:2px solid var(--line);
    color:var(--vellum);
    border-radius:8px;
    cursor:pointer;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #pad button:active,#pad button.pressed{background:var(--gold);color:var(--ground);border-color:var(--gold);transform:translateY(2px);}
  #pad button.wide{grid-column:span 2;letter-spacing:.16em;font-size:12px;}
  #pad button.symbol{font-size:14px;color:var(--gold);}
  @media (max-width:640px){
    body{padding:8px;align-items:flex-start;}
    #pad{gap:6px;}
    #pad button{min-height:56px;font-size:17px;}
    #pad button.wide{font-size:11px;}
  }

  footer{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  footer a{color:var(--dim);}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>

<div id="cabinet">
  <div id="rail">
    <span class="num" id="railNum">—</span>
    <span class="stage" id="railStage">The Hero&rsquo;s Journey</span>
    <span class="spacer"></span>
    <button id="btnSound" type="button">Sound on</button>
  </div>
  <div id="timer"><div id="timerfill"></div></div>

  <div id="stage">
    <canvas id="screen" width="900" height="520"></canvas>
    <div id="overlay"></div>
  </div>

  <div id="pad">
    <button type="button" data-key="ArrowLeft" aria-label="Move left">&#9664;</button>
    <button type="button" data-key="ArrowUp" aria-label="Move up">&#9650;</button>
    <button type="button" data-key="ArrowDown" aria-label="Move down">&#9660;</button>
    <button type="button" data-key="ArrowRight" aria-label="Move right">&#9654;</button>
    <button type="button" data-key="Space" class="wide">ACT</button>
    <button type="button" data-key="Digit1" class="symbol">1</button>
    <button type="button" data-key="Digit2" class="symbol">2</button>
    <button type="button" data-key="Digit3" class="symbol">3</button>
    <button type="button" data-key="Digit4" class="symbol">4</button>
  </div>

  <footer>
    <span>Twelve Trials &middot; Year 7 English</span>
    <span>Keyboard: arrows &middot; space &middot; 1&ndash;4</span>
  </footer>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   ENGINE
   ============================================================ */
var W = 900, H = 520;
var cv  = document.getElementById('screen');
var ctx = cv.getContext('2d');
var overlay   = document.getElementById('overlay');
var railNum   = document.getElementById('railNum');
var railStage = document.getElementById('railStage');
var timerfill = document.getElementById('timerfill');
var pad       = document.getElementById('pad');
var btnSound  = document.getElementById('btnSound');

/* Actual illustrated game art — generated for this game, not CSS decoration. */
var ART = {};
['farm','threshold','return','hero'].forEach(function(name){
  var im = new Image(); im.src = 'twelve-trials-assets/' + name + '.png'; ART[name] = im;
});
function drawArt(name, alpha){
  var im = ART[name];
  if(!im || !im.complete || !im.naturalWidth) return;
  var s = Math.max(W/im.naturalWidth,H/im.naturalHeight), iw=im.naturalWidth*s, ih=im.naturalHeight*s;
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.drawImage(im,(W-iw)/2,(H-ih)/2,iw,ih); ctx.restore();
}
function drawHero(x,y,h){
  var im=ART.hero; if(!im || !im.complete || !im.naturalWidth) return;
  var w=h*im.naturalWidth/im.naturalHeight;
  ctx.drawImage(im,x-w/2,y-h,w,h);
}
function artFor(t){ return t.art || (run && run.idx < 3 ? 'farm' : run && run.idx < 9 ? 'threshold' : 'return'); }

function fit(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline = 'middle';
}
fit();
window.addEventListener('resize', fit);

/* palette (single committed dark world; shifts once the threshold is crossed) */
var PAL = {
  ground:'#0E1119', ground2:'#161B27', line:'#2A3040',
  vellum:'#EDE3CE', dim:'#8C8878',
  gold:'#D9A441', ember:'#C4462E', moss:'#7E9B6A'
};
function crossWorld(){
  PAL.ground='#140F14'; PAL.ground2='#1E1720'; PAL.line='#3B2C34'; PAL.vellum='#E9DCCB';
  document.body.classList.add('crossed');
}

/* ---- input ---- */
var keys = {}, just = {}, taps = [];
var CLAIM = {ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1,Space:1,Digit1:1,Digit2:1,Digit3:1,Digit4:1};

window.addEventListener('keydown', function(e){
  if(CLAIM[e.code]) e.preventDefault();
  if(e.repeat) return;
  keys[e.code] = true; just[e.code] = true;
  if(e.code === 'KeyM') toggleSound();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ keys = {}; });

function press(code){ return !!just[code]; }
function held(code){ return !!keys[code]; }

Array.prototype.forEach.call(pad.querySelectorAll('button'), function(b){
  var k = b.getAttribute('data-key');
  function down(ev){ ev.preventDefault(); keys[k]=true; just[k]=true; b.classList.add('pressed'); resumeAudio(); try{b.setPointerCapture(ev.pointerId);}catch(err){} }
  function up(ev){ ev.preventDefault(); keys[k]=false; b.classList.remove('pressed'); }
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
});
if ((window.matchMedia && window.matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0) pad.classList.add('on');

cv.addEventListener('pointerdown', function(e){
  resumeAudio();
  var r = cv.getBoundingClientRect();
  taps.push({ x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H });
});

/* ---- audio ---- */
var AC = null, muted = false;
function resumeAudio(){
  if(muted) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
  }catch(err){ AC = null; }
}
function tone(freq, dur, type, vol){
  if(muted || !AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol == null ? 0.05 : vol;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur + 0.02);
  }catch(err){}
}
function sfx(name){
  if(name==='tick')  tone(440,0.06,'square',0.03);
  if(name==='good')  tone(660,0.14,'triangle',0.05);
  if(name==='bad')   tone(120,0.22,'sawtooth',0.04);
  if(name==='call')  tone(880,0.18,'sine',0.05);
  if(name==='deep')  tone(70,0.5,'sine',0.06);
  if(name==='gold'){ tone(523,0.12,'triangle',0.05); setTimeout(function(){tone(784,0.24,'triangle',0.05);},110); }
}
function toggleSound(){
  muted = !muted;
  btnSound.textContent = muted ? 'Sound off' : 'Sound on';
  if(!muted) resumeAudio();
}
btnSound.addEventListener('click', toggleSound);

/* ---- draw helpers ---- */
function clear(){
  ctx.fillStyle = PAL.ground; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.5;
  for(var y=40;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function txt(s,x,y,opt){
  opt = opt || {};
  var size = opt.size || 16;
  var fam  = opt.font === 'mono' ? '"IBM Plex Mono", monospace'
           : opt.font === 'display' ? '"Cinzel", serif'
           : '"Spectral", Georgia, serif';
  var wt = opt.weight || 400;
  ctx.font = wt + ' ' + size + 'px ' + fam;
  ctx.fillStyle = opt.color || PAL.vellum;
  ctx.textAlign = opt.align || 'center';
  if(opt.track){
    var chars = s.split(''), total = 0, i;
    for(i=0;i<chars.length;i++) total += ctx.measureText(chars[i]).width + opt.track;
    total -= opt.track;
    var cx = opt.align === 'left' ? x : opt.align === 'right' ? x - total : x - total/2;
    ctx.textAlign = 'left';
    for(i=0;i<chars.length;i++){
      ctx.fillText(chars[i], cx, y);
      cx += ctx.measureText(chars[i]).width + opt.track;
    }
  } else {
    ctx.fillText(s,x,y);
  }
  ctx.textAlign = 'left';
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ============================================================
   RUN STATE
   ============================================================ */
var run = null;
var gameMode = 'standard';
var teacherMode = false;
var LEADERBOARD_KEY = 'twelveTrialsYear7LeaderboardV1';
function safeText(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function loadLeaderboard(){ try{ var data=JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]'); return Array.isArray(data)?data:[]; }catch(err){return [];} }
function saveLeaderboard(board){ try{localStorage.setItem(LEADERBOARD_KEY,JSON.stringify(board.slice(0,10)));}catch(err){} }
function runScore(){ return run.cleared*100 + run.debriefs.filter(function(d){return d.ok;}).length*10; }
function leaderboardHTML(){
  var board=loadLeaderboard();
  var rows=board.length ? board.map(function(e,i){return '<tr><td>'+(i+1)+'</td><td>'+safeText(e.name)+'</td><td>'+e.score+'</td><td>'+e.cleared+'/12</td><td>'+e.seconds+'s</td></tr>';}).join('') : '<tr><td colspan="5" class="muted">No completed runs on this device yet.</td></tr>';
  return '<div class="leaderboard"><h3>Local legends</h3><table><thead><tr><th>#</th><th>Hero</th><th>Score</th><th>Trials</th><th>Time</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function addLeaderboardEntry(name){
  if(run.leaderboardSaved) return;
  name=String(name||'Anonymous hero').trim().replace(/[^a-zA-Z0-9 .,'-]/g,'').slice(0,18)||'Anonymous hero';
  var board=loadLeaderboard();
  board.push({name:name,score:runScore(),cleared:run.cleared,seconds:Math.max(1,Math.round(run.playSeconds)),mode:gameMode});
  board.sort(function(a,b){return b.score-a.score || b.cleared-a.cleared || a.seconds-b.seconds;});
  saveLeaderboard(board); run.leaderboardSaved=true;
}
function newRun(){
  run = {
    idx: 0,
    cleared: 0,
    gift: null,
    allies: 0,
    light: 100,
    prize: null,
    prizeGloss: '',
    chores: 0,
    leaps: 0,
    ordeal: '',
    roadHits: 0,
    resurrect: 0,
    calls: 0,
    refusal: '',
    finalChoice: '',
    debriefs: [],
    playSeconds: 0,
    leaderboardSaved: false
  };
  PAL.ground='#0E1119'; PAL.ground2='#161B27'; PAL.line='#2A3040'; PAL.vellum='#EDE3CE';
  document.body.classList.remove('crossed');
}

/* ============================================================

var STAGES = ['Ordinary World','Call to Adventure','Refusal of the Call','Meeting the Mentor',
  'Crossing the Threshold','Tests, Allies, Enemies','Approach to the Inmost Cave','The Ordeal',
  'Seizing the Reward','The Road Back','Resurrection','Return with the Elixir'];

function wheelSVG(litCount, current){
  var cx=100, cy=100, ro=92, ri=58, i, out='';
  for(i=0;i<12;i++){
    var a0 = -Math.PI/2 + (i/12)*Math.PI*2 + 0.022;
    var a1 = -Math.PI/2 + ((i+1)/12)*Math.PI*2 - 0.022;
    var p = ['M', (cx+ro*Math.cos(a0)).toFixed(2), (cy+ro*Math.sin(a0)).toFixed(2),
             'A', ro, ro, 0, 0, 1, (cx+ro*Math.cos(a1)).toFixed(2), (cy+ro*Math.sin(a1)).toFixed(2),
             'L', (cx+ri*Math.cos(a1)).toFixed(2), (cy+ri*Math.sin(a1)).toFixed(2),
             'A', ri, ri, 0, 0, 0, (cx+ri*Math.cos(a0)).toFixed(2), (cy+ri*Math.sin(a0)).toFixed(2), 'Z'].join(' ');
    var fill = i < litCount ? 'var(--gold)' : 'var(--line)';
    var op = i === current ? '1' : (i < litCount ? '0.55' : '0.85');
    if(i === current) fill = 'var(--vellum)';
    out += '<path d="'+p+'" fill="'+fill+'" opacity="'+op+'"></path>';
    var am = (a0+a1)/2, rl = (ro+ri)/2;
    out += '<text x="'+(cx+rl*Math.cos(am)).toFixed(2)+'" y="'+(cy+rl*Math.sin(am)+3.5).toFixed(2)+
           '" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="'+
           (i<litCount||i===current ? 'var(--ground)' : 'var(--dim)')+'">'+(i+1)+'</text>';
  }
  out += '<circle cx="100" cy="100" r="44" fill="none" stroke="var(--line)"></circle>';
  return '<svg class="wheel" viewBox="0 0 200 200" role="img" aria-label="Wheel of the hero&#39;s journey, '+
         litCount+' of 12 stages complete">'+out+'</svg>';
}

var cur = null, tLeft = 0, st = null;

function startTrial(){
  mode = 'play';
  cur = TRIALS[run.idx];
  tLeft = gameMode === 'relaxed' ? 9999 : cur.dur;
  st = {};
  cur.init();
  hideOverlay();
  resumeAudio();
}
function finish(verdict, note){
  if(mode !== 'play') return;
  mode = 'wait';
  if(verdict === 'pass'){ run.cleared++; sfx('good'); } else if(verdict === 'fail'){ sfx('bad'); }
  var t = cur;
  setTimeout(function(){ outroScreen(t, verdict, note || ''); }, 620);
}

var last = 0;
function frame(now){
  var dt = last ? Math.min(0.05, (now - last)/1000) : 0;
  last = now;
  if(mode === 'play'){
    if(run) run.playSeconds += dt;
    tLeft -= dt;
    var frac = clamp(tLeft/cur.dur, 0, 1);
    timerfill.style.transform = 'scaleX(' + frac + ')';
    if(gameMode === 'relaxed') timerfill.style.transform = 'scaleX(1)';
    timerfill.classList.toggle('low', frac < 0.25);
    cur.update(dt);
    if(mode === 'play' && tLeft <= 0) cur.timeout();
    cur.draw();
  } else if(mode === 'wait' && cur){
    cur.draw();
  } else {
    if(press('Space') || press('Enter')) doAdvance();
  }
  just = {};
  taps.length = 0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* helper: did a tap land in this box? */
function tapped(x,y,w,h){
  for(var i=0;i<taps.length;i++){
    var t = taps[i];
    if(t.x>=x && t.x<=x+w && t.y>=y && t.y<=y+h) return true;
  }
  return false;
}

/* ============================================================
   TRIAL 1 — ORDINARY WORLD
   ============================================================ */
var CHORES = [
  { key:'ArrowLeft',  label:'DRAW WATER',  cue:'◀' },
  { key:'ArrowDown',  label:'FEED THE GOATS', cue:'▼' },
  { key:'ArrowRight', label:'SWEEP THE YARD', cue:'▶' }
];

function drawChoreScene(active, hits, need, stormy, flash){
  drawArt('farm',1); ctx.fillStyle=stormy?'rgba(25,6,45,.58)':'rgba(6,10,20,.52)';ctx.fillRect(0,0,W,H);
  /* sky band */
  ctx.fillStyle = stormy ? '#241A22' : '#1A2030';
  ctx.fillRect(0,0,W,190);
  /* sun that goes nowhere */
  ctx.globalAlpha = stormy ? 0.25 : 0.6;
  ctx.fillStyle = stormy ? PAL.ember : PAL.gold;
  circle(150, 128, 26); ctx.fill();
  ctx.globalAlpha = 1;
  /* horizon */
  ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,190.5); ctx.lineTo(W,190.5); ctx.stroke();
  /* three chore stations */
  for(var i=0;i<3;i++){
    var x = 130 + i*260, y = 250, w = 200, h = 150;
    var on = i === active;
    ctx.fillStyle = on ? 'rgba(217,164,65,0.10)' : 'rgba(0,0,0,0.18)';
    rrect(x,y,w,h,3); ctx.fill();
    ctx.strokeStyle = on ? PAL.gold : PAL.line;
    ctx.lineWidth = on ? 2 : 1;
    rrect(x,y,w,h,3); ctx.stroke();
    /* glyphs */
    ctx.strokeStyle = on ? PAL.gold : PAL.dim;
    ctx.lineWidth = 2;
    var gx = x + w/2, gy = y + 58;
    if(i===0){ /* bucket */
      ctx.beginPath(); ctx.moveTo(gx-16,gy-14); ctx.lineTo(gx-11,gy+16); ctx.lineTo(gx+11,gy+16); ctx.lineTo(gx+16,gy-14); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(gx,gy-14,16,Math.PI,0,true); ctx.stroke();
    } else if(i===1){ /* goat */
      circle(gx, gy+2, 13); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx-9,gy-10); ctx.lineTo(gx-15,gy-22); ctx.moveTo(gx+9,gy-10); ctx.lineTo(gx+15,gy-22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx-4,gy+14); ctx.lineTo(gx-4,gy+22); ctx.moveTo(gx+4,gy+14); ctx.lineTo(gx+4,gy+22); ctx.stroke();
    } else { /* broom */
      ctx.beginPath(); ctx.moveTo(gx,gy-20); ctx.lineTo(gx,gy+6); ctx.stroke();
      ctx.beginPath();
      for(var b=-12;b<=12;b+=6){ ctx.moveTo(gx,gy+6); ctx.lineTo(gx+b,gy+22); }
      ctx.stroke();
    }
    txt(CHORES[i].label, gx, y+110, {size:11, font:'mono', color: on?PAL.vellum:PAL.dim, track:1.6});
    txt(CHORES[i].cue,   gx, y+132, {size:13, font:'mono', color: on?PAL.gold:PAL.line});
  }
  /* counter */
  ctx.fillStyle = flash > 0 ? PAL.gold : PAL.vellum;
  txt(hits + ' / ' + need, W/2, 452, {size:30, font:'mono', weight:600, color: flash>0?PAL.gold:PAL.vellum});
  txt('DO THE CHORE THAT IS LIT', W/2, 60, {size:11, font:'mono', color:PAL.dim, track:2.4});
}

var T1 = {

/* ============================================================
   TRIAL 2 — CALL TO ADVENTURE
   ============================================================ */
var T2 = {
  stage:'Call to Adventure', title:'Answer It', dur:22,
  brief:'A message arrives in a village of a hundred lit windows, and most of them are nothing. Find the gold one and answer it before it stops. Five calls, each with more noise than the last.',
  controls:'<b>Arrows</b> move the eye &middot; <b>Space</b> answers &middot; or tap a window',
  lesson:'The Call is rarely a shout. It arrives among ordinary things, it looks like the ordinary things, and it does not repeat forever. Miss it and the story either finds another way to reach the hero, or it ends here.',
  init:function(){
    st = {cx:2, cy:1, answered:0, missed:0, round:0, rt:0, call:{x:0,y:0}, decoys:[], pulse:0};
    this.nextRound();
  },
  nextRound:function(){
    st.round++;
    st.rt = Math.max(2.0, 3.6 - st.round*0.32);
    st.call = { x: Math.floor(rand(0,6)), y: Math.floor(rand(0,4)) };
    st.decoys = [];
    var n = Math.min(11, 2 + st.round*2), guard = 0;
    while(st.decoys.length < n && guard++ < 200){
      var d = { x: Math.floor(rand(0,6)), y: Math.floor(rand(0,4)), ph: rand(0,6) };
      if(d.x === st.call.x && d.y === st.call.y) continue;
      st.decoys.push(d);
    }
    sfx('call');
  },
  cell:function(x,y){ return { x: 120 + x*112, y: 130 + y*82, w: 86, h: 60 }; },
  update:function(dt){
    st.pulse += dt; st.rt -= dt;
    if(press('ArrowLeft'))  st.cx = clamp(st.cx-1,0,5);
    if(press('ArrowRight')) st.cx = clamp(st.cx+1,0,5);
    if(press('ArrowUp'))    st.cy = clamp(st.cy-1,0,3);
    if(press('ArrowDown'))  st.cy = clamp(st.cy+1,0,3);

    var chose = null;
    if(press('Space')) chose = { x: st.cx, y: st.cy };
    for(var y=0;y<4 && !chose;y++) for(var x=0;x<6 && !chose;x++){
      var c = this.cell(x,y);
      if(tapped(c.x,c.y,c.w,c.h)){ chose = {x:x,y:y}; st.cx=x; st.cy=y; }
    }
    if(chose){
      if(chose.x === st.call.x && chose.y === st.call.y){
        st.answered++; sfx('good');
        if(st.answered >= 5){ run.calls = st.answered; finish('pass'); return; }
        this.nextRound();
      } else { sfx('bad'); st.rt -= 0.45; }
    }
    if(st.rt <= 0){ st.missed++; sfx('deep'); this.nextRound(); }
  },
  timeout:function(){
    run.calls = st.answered;
    finish(st.answered >= 4 ? 'pass' : 'mark', st.answered + ' of 5 calls answered, ' + st.missed + ' missed.');
  },
  draw:function(){
    drawArt('threshold',1);ctx.fillStyle='rgba(5,5,15,.54)';ctx.fillRect(0,0,W,H);
    txt('ANSWER THE GOLD WINDOW', W/2, 56, {size:11, font:'mono', color:PAL.dim, track:2.4});
    txt(st.answered + ' / 5', W/2, 84, {size:18, font:'mono', weight:600, color:PAL.vellum});
    var i,x,y,c;
    for(y=0;y<4;y++) for(x=0;x<6;x++){
      c = this.cell(x,y);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      rrect(c.x,c.y,c.w,c.h,2); ctx.fill();
      ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
      rrect(c.x,c.y,c.w,c.h,2); ctx.stroke();
    }
    for(i=0;i<st.decoys.length;i++){
      var d = st.decoys[i]; c = this.cell(d.x,d.y);
      var a = 0.18 + 0.16*Math.abs(Math.sin(st.pulse*2.4 + d.ph));
      ctx.globalAlpha = a; ctx.fillStyle = PAL.ember;
      rrect(c.x+3,c.y+3,c.w-6,c.h-6,2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    c = this.cell(st.call.x, st.call.y);
    var g = 0.45 + 0.4*Math.abs(Math.sin(st.pulse*4.2));
    ctx.globalAlpha = g; ctx.fillStyle = PAL.gold;
    rrect(c.x+3,c.y+3,c.w-6,c.h-6,2); ctx.fill();
    ctx.globalAlpha = 1;
    /* cursor */
    c = this.cell(st.cx, st.cy);
    ctx.strokeStyle = PAL.vellum; ctx.lineWidth = 2;
    rrect(c.x-4,c.y-4,c.w+8,c.h+8,3); ctx.stroke();
    /* round timer */
    ctx.fillStyle = PAL.line; ctx.fillRect(300,470,300,3);
    ctx.fillStyle = st.rt < 0.9 ? PAL.ember : PAL.gold;
    ctx.fillRect(300,470, 300*clamp(st.rt/3.6,0,1), 3);
  }
};

var SYMS = [
  {name:'LOOK',   key:'Digit1'},
  {name:'LISTEN', key:'Digit2'},
  {name:'CHOOSE', key:'Digit3'},
  {name:'SHARE',  key:'Digit4'}
];
function symBox(i){ return { x: 132 + i*168, y: 210, w: 130, h: 130 }; }
function drawSymbol(i, x, y, lit){
  var col = lit ? PAL.gold : PAL.dim;
  ctx.strokeStyle = col; ctx.lineWidth = lit ? 3 : 2;
  if(i===0){ circle(x,y,17); ctx.stroke();
    for(var a=0;a<8;a++){ var an=a/8*Math.PI*2; ctx.beginPath();
      ctx.moveTo(x+Math.cos(an)*24, y+Math.sin(an)*24);
      ctx.lineTo(x+Math.cos(an)*32, y+Math.sin(an)*32); ctx.stroke(); } }
  if(i===1){ ctx.beginPath();
    for(var k=-30;k<=30;k++){ var yy = y + Math.sin(k/9)*11; if(k===-30) ctx.moveTo(x+k,yy); else ctx.lineTo(x+k,yy); }
    ctx.stroke();
    ctx.beginPath();
    for(var k2=-30;k2<=30;k2++){ var yy2 = y + 18 + Math.sin(k2/9 + 1.2)*9; if(k2===-30) ctx.moveTo(x+k2,yy2); else ctx.lineTo(x+k2,yy2); }
    ctx.stroke(); }
  if(i===2){ ctx.beginPath(); ctx.moveTo(x,y-28); ctx.lineTo(x,y+26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x+18,y-20); ctx.moveTo(x,y+6); ctx.lineTo(x-18,y-6); ctx.stroke(); }
  if(i===3){ circle(x,y-14,12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x,y+28); ctx.moveTo(x,y+14); ctx.lineTo(x+12,y+14); ctx.moveTo(x,y+22); ctx.lineTo(x+9,y+22); ctx.stroke(); }
}
var SYMFREQ = [523,392,311,659];

  lesson:'Mentors do not solve the adventure for the hero. They give a tool, a rule or a warning — then leave the hero to use it at the hard moment.',

        st.step = idx; st.lit = st.pat[idx];

    if(chosen >= 0){
      st.lit = chosen; st.t = 0;

var T5 = {
  stage:'Crossing the Threshold', title:'One Leap', dur:24,

  init:function(){ st = { m:0, dir:1, tries:0, done:0, zone:0.42, res:'', shake:0 }; },

    } else {
      ctx.strokeStyle = PAL.ember; ctx.lineWidth = 3;

var T7 = {
  stage:'Approach to the Inmost Cave', title:'The Descent', dur:24,
  brief:'Nothing attacks you here. The tunnel simply narrows and the light goes. Steer. Every wall you scrape costs light, and you will want that light in a minute.',
  controls:'<b>&#9664; &#9654;</b> steer',
  lesson:'The Approach is the quiet before, and stories almost always slow down here. The tension does not come from danger arriving; it comes from the hero going towards it anyway with less than they started with.',
  init:function(){ st = { x:W/2, d:0, light:100, scrape:0, dust:[] };
    for(var i=0;i<60;i++) st.dust.push({x:rand(0,W), y:rand(0,H), s:rand(12,40)}); },
  wall:function(d){
    return { c: W/2 + Math.sin(d*0.0052)*135 + Math.sin(d*0.0121)*62,
             h: Math.max(56, 190 - d*0.036) };
  },
  update:function(dt){
    st.d += 165*dt;
    st.scrape = Math.max(0, st.scrape - dt);
    if(held('ArrowLeft'))  st.x -= 250*dt;
    if(held('ArrowRight')) st.x += 250*dt;
    st.x = clamp(st.x, 20, W-20);
    var w = this.wall(st.d + 220);
    if(st.x < w.c - w.h || st.x > w.c + w.h){
      if(st.scrape <= 0){ st.light -= 13; st.scrape = 0.5; sfx('bad'); }
      st.x = clamp(st.x, w.c - w.h, w.c + w.h);
    }
    if(st.light <= 0){ st.light = 0; run.light = 0; finish('mark', 'You reached the cave in the dark.'); }

  timeout:function(){ run.light = st.light; finish(st.light > 40 ? 'pass' : 'mark', Math.round(st.light) + '% of your light remains.'); },

    for(y=0;y<=H;y+=10){ w = this.wall(st.d + y); ctx.lineTo(w.c - w.h, y); }
    ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W,0);
    for(y=0;y<=H;y+=10){ w = this.wall(st.d + y); ctx.lineTo(w.c + w.h, y); }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
    ctx.beginPath(); for(y=0;y<=H;y+=10){ w = this.wall(st.d+y); if(y===0) ctx.moveTo(w.c-w.h,y); else ctx.lineTo(w.c-w.h,y); } ctx.stroke();
    ctx.beginPath(); for(y=0;y<=H;y+=10){ w = this.wall(st.d+y); if(y===0) ctx.moveTo(w.c+w.h,y); else ctx.lineTo(w.c+w.h,y); } ctx.stroke();
    for(i=0;i<st.dust.length;i++){

      st.input.push(chosen);
      var n = st.input.length;
      if(run.gift && st.input[n-1] !== run.gift[n-1]){
        st.input = []; st.size = Math.min(230, st.size + 10);
        st.msg = 'Wrong order. It grows.'; sfx('bad');
      } else if(n === 4){
        st.won = 0.001; st.msg = ''; sfx('gold');
      }
    }
  },
  timeout:function(){
    run.allies = 0; run.light = 0; run.ordeal = 'taken';
    finish('mark', 'It took what you carried before you found the order.');
  },
  draw:function(){
    drawArt('threshold',1);ctx.fillStyle='rgba(5,3,15,.62)';ctx.fillRect(0,0,W,H);
    var sx = st.shake > 0 ? rand(-4,4) : 0, sy = st.shake > 0 ? rand(-3,3) : 0;
    ctx.save(); ctx.translate(sx,sy);
    /* the shadow */
    var cxp = W/2, cyp = 236, s = st.size;
    ctx.fillStyle = '#05070B';
    circle(cxp, cyp, s); ctx.fill();
    ctx.strokeStyle = PAL.ember; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    for(var r=0;r<5;r++){
      ctx.beginPath();
      for(var a=0;a<=40;a++){
        var an = a/40*Math.PI*2;
        var rad = s*(0.55 + r*0.1) + Math.sin(an*3 + st.t*1.4 + r)*7;
        var px = cxp + Math.cos(an)*rad, py = cyp + Math.sin(an)*rad;
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if(!st.won && st.msg) txt(st.msg, W/2, 74, {size:15, color: st.msg==='It feeds.' ? PAL.ember : PAL.dim});
    if(st.won) txt('IT BREAKS', W/2, 74, {size:18, font:'display', weight:700, color:PAL.gold, track:5});
    /* carried */
    txt('ALLIES ' + Math.round(st.allies), 40, 430, {size:12, font:'mono', color: st.allies>0?PAL.moss:PAL.dim, align:'left', track:1.6});
    txt('LIGHT ' + Math.round(st.light) + '%', 40, 452, {size:12, font:'mono', color: st.light>0?PAL.gold:PAL.dim, align:'left', track:1.6});
    /* symbol row */
    for(var i=0;i<4;i++){
      var b = symBox(i), bx = b.x + b.w/2, by = 404;
      var lit = st.input.length > 0 && st.input[st.input.length-1] === i;
      ctx.strokeStyle = lit ? PAL.gold : PAL.line; ctx.lineWidth = 1;
      rrect(b.x+18, by-34, b.w-36, 68, 3); ctx.stroke();
      drawSymbol(i, bx, by, lit);
      txt(String(i+1), bx, by+44, {size:10, font:'mono', color:PAL.dim});
    }
    for(var s2=0;s2<4;s2++){
      var x = W/2 - 60 + s2*40;
      ctx.strokeStyle = PAL.line; rrect(x,478,28,18,2); ctx.stroke();
      if(s2 < st.input.length){ ctx.fillStyle = PAL.gold; rrect(x,478,28,18,2); ctx.fill(); }
    }
    ctx.restore();
  }
};

/* ============================================================
   TRIAL 9 — REWARD
   ============================================================ */
var PRIZES = [
  { name:'the Crown', gloss:'power over others' },
  { name:'the Map',   gloss:'knowledge of the way' },
  { name:'the Seed',  gloss:'something that can grow' }
];
var T9 = {
  stage:'Seizing the Reward', title:'Seize One', dur:16,
  art:'threshold',
  brief:'Three things are lying where the shadow fell. Take one, then decide why your hero takes it. That reason will shape the road home.',
  controls:'<b>&#9664; &#9654;</b> choose &middot; <b>Space</b> takes it',
  lesson:'The Reward is not always treasure. It is whatever the hero could only have got by going through the Ordeal, and choosing one thing means refusing the others. That refusal is the character.',
  init:function(){ st = { sel:1, t:0, taken:0, motive:-1 }; },
  update:function(dt){
    st.t += dt;
    if(st.taken){
      st.taken += dt;
      if(st.motive>=0 && st.taken>0.35){ var why=['because the hero wants control','because the hero wants a way home','because the hero wants the village to grow'][st.motive]; run.prizeWhy=why; finish('pass','You took '+run.prize+' '+why+'. That choice follows you home.'); }
      if(st.motive<0){ if(press('Digit1'))st.motive=0; if(press('Digit2'))st.motive=1; if(press('Digit3'))st.motive=2; }

    if(press('ArrowLeft'))  { st.sel = clamp(st.sel-1,0,2); sfx('tick'); }

    for(var i=0;i<3;i++){ if(tapped(120 + i*230, 180, 190, 220)){ st.sel = i; } }

      run.prize = PRIZES[st.sel].name;
      run.prizeGloss = PRIZES[st.sel].gloss;
      st.taken = 0.001; sfx('gold');
    }
  },
  timeout:function(){
    run.prize = PRIZES[st.sel].name; run.prizeGloss = PRIZES[st.sel].gloss;
    run.prizeWhy='because there was no time left to decide'; finish('mark', 'You grabbed '+run.prize+' without deciding why.');
  },
  draw:function(){
    drawArt('threshold',1);ctx.fillStyle='rgba(5,3,15,.62)';ctx.fillRect(0,0,W,H);
    txt('TAKE ONE. LEAVE TWO.', W/2, 66, {size:11, font:'mono', color:PAL.gold, track:2.6});
    for(var i=0;i<3;i++){
      var x = 120 + i*230, y = 180, w = 190, h = 220;
      var on = i === st.sel;
      var gone = st.taken && i !== st.sel;
      ctx.globalAlpha = gone ? Math.max(0, 1 - st.taken*2) : 1;
      ctx.fillStyle = on ? 'rgba(217,164,65,0.09)' : 'rgba(0,0,0,0.22)';
      rrect(x,y,w,h,3); ctx.fill();
      ctx.strokeStyle = on ? PAL.gold : PAL.line; ctx.lineWidth = on ? 2 : 1;
      rrect(x,y,w,h,3); ctx.stroke();
      var gx = x+w/2, gy = y+82, col = on ? PAL.gold : PAL.dim;
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      if(i===0){ ctx.beginPath(); ctx.moveTo(gx-30,gy+18); ctx.lineTo(gx-30,gy-14); ctx.lineTo(gx-14,gy+2);
        ctx.lineTo(gx,gy-20); ctx.lineTo(gx+14,gy+2); ctx.lineTo(gx+30,gy-14); ctx.lineTo(gx+30,gy+18); ctx.closePath(); ctx.stroke(); }
      if(i===1){ rrect(gx-28,gy-22,56,44,2); ctx.stroke();
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(gx-18,gy+14); ctx.lineTo(gx-4,gy-6); ctx.lineTo(gx+8,gy+6); ctx.lineTo(gx+20,gy-14); ctx.stroke();
        circle(gx+20,gy-14,3); ctx.stroke(); }
      if(i===2){ ctx.beginPath(); ctx.ellipse(gx,gy+6,13,19,0,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx,gy-13); ctx.lineTo(gx,gy-28); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(gx+10,gy-26,10,5,-0.5,0,Math.PI*2); ctx.stroke(); }
      txt(PRIZES[i].name.toUpperCase(), gx, y+152, {size:13, font:'display', weight:700, color: on?PAL.vellum:PAL.dim, track:2});
      txt(PRIZES[i].gloss, gx, y+180, {size:12, color:PAL.dim});
      ctx.globalAlpha = 1;
    }
    if(st.taken){ txt('WHY TAKE IT?  1 CONTROL   2 HOME   3 GROW', W/2, 448, {size:12, font:'mono', color:PAL.gold, track:1.3}); }
    else txt('SPACE TO TAKE', W/2, 448, {size:11, font:'mono', color:PAL.dim, track:2});
  }
};

/* ============================================================
   TRIAL 10 — ROAD BACK
   ============================================================ */
var T10 = {
  stage:'The Road Back', title:'Run', dur:22,
  brief:'The cave wants its reward returned and it has sent something after you. You cannot fight it. Change lanes, keep moving, and do not let it close the gap.',
  controls:'<b>&#9664; &#9654;</b> change lane',
  lesson:'Getting the thing is not the same as getting home. The Road Back is the story reminding you that the old world does not simply reopen because the hero is ready to come back to it.',
  init:function(){ st = { lane:1, x:W/2, obs:[], spawn:0, sp:300, chase:22, hits:0, t:0 }; },
  laneX:function(l){ return 250 + l*200; },
  update:function(dt){
    st.t += dt;
    st.sp += dt*17;
    st.chase = clamp(st.chase - dt*1.7, 0, 100);
    if(press('ArrowLeft'))  { st.lane = clamp(st.lane-1,0,2); sfx('tick'); }
    if(press('ArrowRight')) { st.lane = clamp(st.lane+1,0,2); sfx('tick'); }
    if(tapped(0,0,W/2,H))  st.lane = clamp(st.lane-1,0,2);
    if(tapped(W/2,0,W/2,H)) st.lane = clamp(st.lane+1,0,2);
    st.x += (this.laneX(st.lane) - st.x) * Math.min(1, dt*13);
    st.spawn -= dt;
    if(st.spawn <= 0){
      st.spawn = Math.max(0.34, 0.85 - st.t*0.021);
      var l = Math.floor(rand(0,3));
      st.obs.push({ l:l, y:-40, hit:false });
      if(Math.random() < 0.32){
        var l2 = (l + 1 + Math.floor(rand(0,2))) % 3;
        st.obs.push({ l:l2, y:-40 - rand(30,90), hit:false });
      }
    }
    for(var i=st.obs.length-1;i>=0;i--){
      var o = st.obs[i];
      o.y += st.sp*dt;
      if(!o.hit && o.y > 370 && o.y < 430 && o.l === st.lane){
        o.hit = true; st.hits++; st.chase += 15; sfx('bad');
      }
      if(o.y > H + 60) st.obs.splice(i,1);
    }
    if(st.chase >= 100){ run.roadHits = st.hits; finish('fail', 'It caught you at the tree line, and took the long way out of your hands.'); }
  },
  timeout:function(){ run.roadHits = st.hits; finish(st.hits <= 3 ? 'pass' : 'mark', st.hits + ' collisions on the way out.'); },
  draw:function(){
    clear();
    var i;
    ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
    for(i=0;i<4;i++){ var lx = 150 + i*200; ctx.beginPath(); ctx.moveTo(lx,90); ctx.lineTo(lx,H); ctx.stroke(); }
    ctx.globalAlpha = 0.25; ctx.strokeStyle = PAL.dim;
    for(i=0;i<12;i++){ var yy = ((st.t*st.sp) + i*70) % (H+70) - 40;
      ctx.beginPath(); ctx.moveTo(150,yy); ctx.lineTo(750,yy); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for(i=0;i<st.obs.length;i++){
      var o = st.obs[i];
      ctx.fillStyle = o.hit ? PAL.line : PAL.ember;
      var ox = this.laneX(o.l);
      ctx.beginPath(); ctx.moveTo(ox, o.y-22); ctx.lineTo(ox+26, o.y+18); ctx.lineTo(ox-26, o.y+18); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = PAL.vellum;
    circle(st.x, 391, 8); ctx.fill();
    ctx.fillRect(st.x-6, 399, 12, 18);
    ctx.fillStyle = PAL.gold;
    circle(st.x+13, 404, 4); ctx.fill();
    /* pursuer bar */
    txt('IT IS BEHIND YOU', W/2, 46, {size:11, font:'mono', color:PAL.dim, track:2.4});
    ctx.fillStyle = PAL.line; ctx.fillRect(300,62,300,6);
    ctx.fillStyle = st.chase > 65 ? PAL.ember : PAL.gold;
    ctx.fillRect(300,62, 300*clamp(st.chase/100,0,1), 6);
  }
};

/* ============================================================
   TRIAL 11 — RESURRECTION
   ============================================================ */
var T11 = {
  stage:'Resurrection', title:'One More Time', dur:20,
  brief:'You are back at the farm and the sky has turned. Same three chores as the very first trial, but the order is gone and the storm is here. Twenty of them. You know how to do this.',
  controls:'<b>&#9664;</b> water &middot; <b>&#9660;</b> goats &middot; <b>&#9654;</b> sweep',
  lesson:'This is the final test, and the point is that it is the first test again. The task never changed. The hero did. That is why the Resurrection always echoes something from the Ordinary World.',
  init:function(){ st = { cur: Math.floor(rand(0,3)), hits:0, need:20, miss:0, flash:0, bolt:0 }; },
  update:function(dt){
    st.flash = Math.max(0, st.flash - dt);
    st.bolt  = Math.max(0, st.bolt - dt);
    if(Math.random() < dt*0.6) st.bolt = 0.14;
    for(var i=0;i<3;i++){
      if(press(CHORES[i].key)){
        if(i === st.cur){
          st.hits++; st.flash = 0.14; sfx('tick');
          var n = st.cur; while(n === st.cur) n = Math.floor(rand(0,3));
          st.cur = n;
        } else { st.miss++; sfx('bad'); }
      }
    }
    if(st.hits >= st.need){ run.resurrect = st.hits; finish('pass', st.miss + ' mistakes.'); }
  },
  timeout:function(){ run.resurrect = st.hits; finish(st.hits >= 15 ? 'pass' : 'mark', st.hits + ' of 20 done, ' + st.miss + ' mistakes.'); },
  draw:function(){
    drawChoreScene(st.cur, st.hits, st.need, true, st.flash);
    if(st.bolt > 0){
      ctx.globalAlpha = st.bolt*3;
      ctx.fillStyle = PAL.vellum; ctx.fillRect(0,0,W,190);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = 'rgba(237,227,206,0.18)'; ctx.lineWidth = 1;
    for(var i=0;i<70;i++){
      var x = (i*137 + Date.now()*0.35) % W, y = (i*211 + Date.now()*0.9) % H;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+13); ctx.stroke();
    }
    txt('MISTAKES ' + st.miss, W/2, 486, {size:11, font:'mono', color: st.miss>4?PAL.ember:PAL.dim, track:1.8});
  }
};

/* ============================================================
   TRIAL 12 — RETURN
   ============================================================ */
var T12 = {
  stage:'Return with the Elixir', title:'Give It Away', dur:30,
  art:'return',
  brief:'You are home. Keep the reward, give it to one person, or share it with the whole village. The final choice decides whether this was an adventure or a hero’s journey.',
  controls:'<b>◀</b> keep &middot; <b>▼</b> give one &middot; <b>▶</b> share',
  lesson:'The return matters because the hero brings change back. Keeping the reward ends an adventure. Sharing it closes the hero’s journey: the ordinary world is better because the hero left it.',
  init:function(){ st = { choice:-1, done:0, t:0 }; },
  update:function(dt){
    st.t += dt;
    if(st.choice>=0){if(st.done>1.1){run.ordeal=run.ordeal||'taken';finish(st.choice===2?'pass':'mark',st.choice===0?'You keep it. You returned, but nothing at home changed.':st.choice===1?'You give it to one person. Kind, but the wider world is still waiting.':'You share it. The gift changes the village, not just the hero.');}st.done+=dt;return;}
    var c=-1;if(press('ArrowLeft'))c=0;if(press('ArrowDown'))c=1;if(press('ArrowRight'))c=2;for(var i=0;i<3;i++)if(tapped(85+i*255,218,230,180))c=i;if(c>=0){st.choice=c;run.finalChoice=['keep','one','share'][c];sfx(c===2?'gold':'deep');}
  },
  timeout:function(){run.finalChoice='keep';finish('mark','The village waits while you hold on to the reward.');},
  draw:function(){
    drawArt('return',1);ctx.fillStyle='rgba(5,8,18,.44)';ctx.fillRect(0,0,W,H);txt('THE ELIXIR IS '+(run.prize||'THE COMPASS').toUpperCase()+'. WHAT DO YOU DO?',W/2,58,{size:14,font:'mono',color:PAL.vellum,track:1.5});var labs=['KEEP IT','GIVE TO ONE','SHARE IT'];for(var i=0;i<3;i++){var x=85+i*255,on=st.choice===i;ctx.fillStyle=on?'rgba(255,214,65,.92)':'rgba(5,8,18,.9)';rrect(x,218,230,180,14);ctx.fill();ctx.strokeStyle=on?PAL.gold:PAL.vellum;ctx.lineWidth=3;rrect(x,218,230,180,14);ctx.stroke();txt(['◀','▼','▶'][i],x+115,266,{size:36,font:'mono',color:on?PAL.ground:PAL.gold});txt(labs[i],x+115,338,{size:13,font:'mono',color:on?PAL.ground:PAL.vellum,track:1.2});}if(st.choice>=0)txt(['A reward kept only changes one person.','One person is helped. Is that enough?','The village changes because the hero returned.'][st.choice],W/2,452,{size:16,color:PAL.vellum});
  }
};

var TRIALS = [T1,T2,T3,T4,T5,T6,T7,T8,T9,T10,T11,T12];
var CHECKS = [
  ['Why show the farm before the danger?', ['So we see what “normal” looks like','To make the game longer'],0,'The Ordinary World gives the audience a baseline: we see what the hero could lose.'],

  ['What does refusal reveal?', ['What the hero fears or values','That the hero is automatically weak'],0,'Refusal makes the hero human by showing what they risk leaving behind.'],
  ['What should a mentor give?', ['A tool, rule or warning','A complete solution to every problem'],0,'A mentor equips the hero; they do not do the journey for them.'],
  ['Why is this a threshold?', ['It is a point of no easy return','It is just a jump'],0,'The Threshold separates familiar rules from the special world.'],
  ['Why are allies and enemies here?', ['The hero learns who to trust','The story needs random people'],0,'Tests and relationships prepare the hero for the central crisis.'],
  ['Why does the story slow down before the cave?', ['To build tension before the main crisis','Because nothing important is happening'],0,'The Approach makes the audience feel the hero deliberately moving toward danger.'],

  ['What has changed in the final test?', ['The hero, not merely the task','Only the weather'],0,'Resurrection echoes the start so we can see the hero’s change clearly.'],

titleScreen();

})();
