<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ANNOTATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E2DA;
  --paper-dark:#CFCCC2;
  --ink:#16181C;
  --ink-soft:#5A5C60;
  --hi:#F5E33A;
  --hi-pink:#FF4FA3;
  --red:#D6202B;
  --grid:rgba(22,24,28,.07);
}
/* one highlighter colour per story, so the sheet looks different per text */
body.s-missbrill{--hi:#F5E33A;--hi-pink:#FF4FA3}
body.s-telltale{--hi:#E9E24A;--hi-pink:#FF6B4A;--red:#B3121C}
body.s-monkeyspaw{--hi:#7FE0B0;--hi-pink:#FFB03A;--red:#C2331F}
body.s-ladytiger{--hi:#FFAE3B;--hi-pink:#E85CC8;--red:#C41E3A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  overflow:hidden;position:fixed;width:100%;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 28px);
  transition:background-color .6s ease;
}
body.act3{--paper:#CFCCC2;--grid:rgba(22,24,28,.11);background-color:var(--paper)}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  opacity:.5;mix-blend-mode:multiply;
  background-image:radial-gradient(circle at 20% 30%,rgba(0,0,0,.05) 0 1px,transparent 1px),
                   radial-gradient(circle at 70% 80%,rgba(0,0,0,.04) 0 1px,transparent 1px);
  background-size:7px 7px,11px 11px;
}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:2}

#bar{
  flex:0 0 auto;padding:8px 12px 6px;
  font-family:'Courier Prime',monospace;font-size:12px;
  display:flex;gap:10px;align-items:baseline;
  border-bottom:1.5px solid var(--ink);letter-spacing:.02em;
}
#bar .slot{white-space:nowrap}
#bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#bar b{font-weight:700}
#chain{color:var(--red);font-weight:700}
#chain.on{background:var(--hi);padding:0 4px}
.btns{display:flex;gap:6px}
.mini{
  font-family:'Courier Prime',monospace;font-size:11px;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:1px 6px;cursor:pointer;
}
.mini:hover,.mini:focus-visible{background:var(--ink);color:var(--paper);outline:none}

#timerwrap{flex:0 0 auto;height:12px;border-bottom:1.5px solid var(--ink);position:relative;overflow:hidden}
#timer{position:absolute;inset:0;width:100%;background:var(--hi);transform-origin:left center}
#timer.pink{background:var(--hi-pink)}
#timer.hot{background:var(--red)}

#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:center;padding:16px 16px 24px}
.sheet,.card{width:100%;max-width:640px;margin:0 auto}

.instruction{font-family:'Anton',Impact,sans-serif;font-size:clamp(20px,6.2vw,30px);line-height:1.05;margin:0 0 4px}
.instruction em{font-style:normal;background:var(--hi);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-soft);margin:0 0 14px}
.lead{font-size:15px;font-style:italic;color:var(--ink-soft);margin:0 0 10px;line-height:1.45}

.passage{font-size:clamp(19px,5.1vw,25px);line-height:1.85;margin:0}
.w{padding:1px 1px;border-radius:2px;cursor:pointer;transition:background .12s}
.w:hover{background:rgba(0,0,0,.08)}
.w.lit{background:var(--hi);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.w.bad{background:var(--red);color:var(--paper)}
.w.struck{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;opacity:.55}
.passage.locked .w{cursor:default}
.passage.locked .w:hover{background:none}
.passage.locked .w.lit:hover{background:var(--hi)}

.opts{display:grid;gap:8px;margin-top:18px}
.opt{
  font-family:'Courier Prime',monospace;font-size:15px;text-align:left;
  padding:11px 12px;border:2px solid var(--ink);background:var(--paper);
  color:var(--ink);cursor:pointer;line-height:1.35;
}
.opt:hover,.opt:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.opt .k{font-weight:700;margin-right:8px}
.opt.right{background:var(--hi);border-color:var(--ink);color:var(--ink)}
.opt.wrong{background:var(--red);color:var(--paper);border-color:var(--red)}
.opt.mute{opacity:.35}
.opt:disabled{cursor:default}

.pen{margin-top:16px;border-left:5px solid var(--red);padding:10px 0 10px 12px;animation:penin .22s ease-out}
@keyframes penin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.pen .who{font-family:'Anton',sans-serif;font-size:15px;color:var(--red);letter-spacing:.02em;margin-bottom:6px}
.pen .mutated{font-size:19px;line-height:1.55;color:var(--red);font-style:italic}
.pen .why{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5;margin-top:9px;color:var(--ink)}
.correct-note{margin-top:16px;border-left:5px solid var(--ink);padding:10px 0 10px 12px}
.correct-note .why{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5}
.callback{margin-top:14px;background:var(--ink);color:var(--paper);padding:10px 12px;font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5}
.callback b{color:var(--hi)}

body.freeze{background-color:#F2F0E9}
body.freeze #timerwrap{opacity:.25}
.freezetag{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.16em;color:var(--ink-soft);margin-bottom:10px}
.builder{font-size:clamp(18px,4.8vw,23px);line-height:1.7;margin:0 0 16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.slot{background:var(--hi);padding:0 5px}
.slot.empty{background:none;border-bottom:3px solid var(--red);padding:0 26px;color:transparent}

#stamp{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-6deg);
  font-family:'Anton',sans-serif;font-size:clamp(38px,13vw,84px);line-height:.9;
  color:var(--ink);pointer-events:none;z-index:50;opacity:0;text-align:center;
  padding:6px 16px;border:5px solid var(--ink);background:var(--hi);max-width:92vw;
}
#stamp.red{background:var(--red);color:var(--paper);border-color:var(--paper);box-shadow:0 0 0 5px var(--red)}
#stamp.go{animation:stampin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampin{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(2.4)}
  22%,78%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1.05)}
}
body.shake #app{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.title-big{font-family:'Anton',sans-serif;font-size:clamp(48px,15vw,100px);line-height:.82;margin:0 0 2px;letter-spacing:-.01em}
.title-big span{background:var(--hi);padding:0 4px}
.tagline{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.6;margin:14px 0 0;max-width:46ch}
.rule{border:0;border-top:2px solid var(--ink);margin:18px 0}
.big-btn{
  font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.02em;
  padding:12px 20px;border:3px solid var(--ink);background:var(--hi);color:var(--ink);
  cursor:pointer;width:100%;margin-top:6px;display:block;text-align:center;text-decoration:none;
}
.big-btn:hover,.big-btn:focus-visible{background:var(--ink);color:var(--hi);outline:none}
.big-btn.ghost{background:var(--paper)}
.big-btn.ghost:hover,.big-btn.ghost:focus-visible{background:var(--ink);color:var(--paper)}
.actnum{font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:.2em;color:var(--ink-soft)}
.acttitle{font-family:'Anton',sans-serif;font-size:clamp(32px,9vw,56px);line-height:.95;margin:4px 0 12px}
.blurb{font-size:17px;line-height:1.6;max-width:46ch}
.blurb + .blurb{margin-top:10px}

/* --- story picker --- */
.pick{display:grid;gap:10px;margin-top:16px}
.storybtn{
  display:block;width:100%;text-align:left;cursor:pointer;
  border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:12px 14px;
}
.storybtn:hover,.storybtn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.storybtn:hover .sname,.storybtn:focus-visible .sname{background:none;color:var(--paper)}
.storybtn:hover .smeta,.storybtn:focus-visible .smeta{color:var(--paper-dark)}
.sname{font-family:'Anton',sans-serif;font-size:clamp(21px,5.6vw,28px);line-height:1.05;display:inline-block;background:var(--hi);padding:0 4px}
.smeta{font-family:'Courier Prime',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}
.shook{font-size:15.5px;line-height:1.45;margin-top:6px}
.p1 .sname{background:#F5E33A}
.p2 .sname{background:#E9E24A}
.p3 .sname{background:#7FE0B0}
.p4 .sname{background:#FFAE3B}

#overlay{position:fixed;inset:0;background:var(--paper);z-index:70;display:none;overflow-y:auto;padding:20px 16px 40px}
#overlay.on{display:block}
#overlay h2{font-family:'Anton',sans-serif;font-size:32px;margin:0 0 10px}
#overlay h3{font-family:'Anton',sans-serif;font-size:19px;margin:22px 0 6px}
#overlay p,#overlay li{font-family:'Courier Prime',monospace;font-size:13.5px;line-height:1.65}
#overlay ul{padding-left:18px;margin:6px 0}
#overlay a{color:var(--ink)}
kbd{font-family:'Courier Prime',monospace;border:1.5px solid var(--ink);padding:0 5px;font-size:12px;background:var(--paper-dark)}

.report-line{border-top:1.5px solid var(--ink);padding:12px 0}
.report-line .num{font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.12em}
.report-line .quote{font-size:17px;line-height:1.6;margin:4px 0 6px}
.report-line .quote mark{background:var(--hi);color:var(--ink);padding:0 3px}
.report-line .lab{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--red);font-weight:700}
.report-line .eff{font-family:'Courier Prime',monospace;font-size:12.5px;line-height:1.55;margin-top:3px}
.report-line.missed{opacity:.55}
.scoreblock{display:flex;gap:22px;flex-wrap:wrap;font-family:'Courier Prime',monospace;font-size:13px;margin:10px 0 4px}
.scoreblock b{display:block;font-family:'Anton',sans-serif;font-size:30px;line-height:1.1;color:var(--ink)}
.qs li{margin-bottom:10px}
.h3a{font-family:'Anton',sans-serif;font-size:20px;margin:0 0 6px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="slot">NAME: <b>YEAR 8</b></span>
    <span class="slot grow">TEXT: <b id="htext">—</b></span>
    <span class="slot">SCORE: <b id="hscore">0</b></span>
    <span class="slot" id="chain">CHAIN x1</span>
    <span class="btns">
      <button class="mini" id="bhelp" title="Help">?</button>
      <button class="mini" id="bmute" title="Sound">&#9834;</button>
    </span>
  </div>
  <div id="timerwrap"><div id="timer"></div></div>
  <div id="stage"></div>
</div>
<div id="stamp"></div>
<div id="overlay"></div>
<script>
/* ============================================================
   ANNOTATOR
   Four public-domain short stories. Every quoted line is from
   the original text, lightly trimmed for screen width and with
   spacing added around dashes so words can be tapped
   individually. No words are changed or added.
   Every instruction, roast, rewrite and effect option is
   original writing for this game.

   TO SWAP A READING LINK: each story's `read:{url:...}` is at
   the top of its block below.
   TO CHANGE THE ANNOUNCER VOICE: edit ANNOUNCER, just here.
   ============================================================ */

const ANNOUNCER = {
  spotGood:["SPOTTED","THAT'S THE ONE","LOCKED IN","EYES"],
  nameGood:["NAMED","CORRECT","YOU KNOW IT"],
  effGood:["COOKED","FULL CHAIN","NO NOTES","ANNOTATED"],
  bad:["RED PEN","NOPE","MARKED DOWN","OOF"],
  chain:["CHAIN x2","CHAIN x3","ON FIRE"]
};

const STORIES = {};
STORIES.missbrill = {
  title:"MISS<br>BRILL",
  short:"Miss Brill",
  author:"Katherine Mansfield",
  year:"1920",
  hook:"A lonely woman goes to the park and decides she is in a play.",
  pitch:"The gentlest story here and the cruellest ending. Mansfield builds a beautiful afternoon out of similes and then lets two strangers use the same techniques as weapons. Two words you annotate in Act Two come back in Act Three.",
  read:{url:"https://www.gutenberg.org/cache/epub/1429/pg1429-images.html",kind:"web page \u2014 find \u201cMiss Brill\u201d in the collection"},
  words:"about 2,000 words",
  pd:"Mansfield died in 1923. Public domain worldwide.",
  acts:{
    1:{sub:"ACT ONE",title:"THE SUNDAY",blurb:[
      "Miss Brill goes to the park. The world is beautiful and she is looking very carefully at it.",
      "Four annotations. Spot it, name it, then say what it does. A full chain is worth nine times a lucky tap."]},
    2:{sub:"ACT TWO",title:"THE COMPANY",blurb:[
      "She works out what the park is, and what she is in it.",
      "Faster now. Two of these four come back in Act Three, so annotate like you will be asked about them. You will."]},
    3:{sub:"ACT THREE",title:"THE FRIED WHITING",blurb:[
      "Two young people sit down on her bench.",
      "Everything from Acts One and Two is about to be used against her. Same techniques. Different hands."]}
  },
  end:{
    lines:["FUNNY \u2014 her fond word in Act Two, the girl\u2019s weapon in Act Three.",
      "EXACTLY LIKE \u2014 her phrase for the play, the girl\u2019s phrase for the fish.",
      "THE EYES \u2014 she rubbed life into them on page one; the lid goes on at the end."],
    qs:["In Act Two Miss Brill uses \u201cfunny\u201d to mean odd, and a little lovable. In Act Three the girl uses the same word to wound her. What changed \u2014 the word, or who was holding it?",
      "Miss Brill decides the park is \u201cexactly like a play\u201d and that she has a part in it. Is she wrong? What does the story gain by letting her be right for four pages before it takes it away?",
      "The last line says she thought she heard something crying. Mansfield never says who. Why refuse to tell us, and what would be lost if she did?"],
    verdicts:["You annotated this story properly. Take it to the exam.",
      "Solid. The gaps are all in the same place: saying what it DOES.",
      "You can spot. You can name. The third move is the one worth marks.",
      "Spotting is not annotating. Run it again and go slower on the freezes."]
  },
  items:[
/* ---------------- ACT I ---------------- */
{
  act:1,
  lead:"Sunday. Miss Brill has come to the Jardins Publiques, as she does every week.",
  text:"The blue sky powdered with gold and great spots of light like white wine splashed over the Jardins Publiques.",
  target:[[3,5]],
  decoy:{range:[11,14],msg:"That's an image too — but it's wearing a \"like\". Different animal. Find the one that just states it."},
  spot:"Two images here. Tap the one that <em>doesn't</em> use \"like\".",
  tech:"metaphor",
  opts:["metaphor","simile","alliteration","onomatopoeia"],
  mut:{
    simile:"The blue sky was fairly similar to some gold powder, in a way, if you thought about it.",
    alliteration:"The bright blue sky bore beautiful bits of blondish bling.",
    onomatopoeia:"The blue sky went POWD! POWD! and gold fell out of it."
  },
  roast:{
    simile:"A simile says one thing is LIKE another. This line says the sky IS powdered. No like, no as. So here's the simile you ordered.",
    alliteration:"Alliteration is repeated opening sounds. You've turned a sky into a shampoo advert.",
    onomatopoeia:"Onomatopoeia is a word that makes the noise. The sky is silent. Enjoy."
  },
  slotA:{q:"Powdered makes the reader see the sky as",opts:[
    {t:"something soft and expensive, dusted on by hand",ok:true},
    {t:"a really nice colour",ok:false,why:"True of any sky ever written. Say what THIS word does."},
    {t:"the most beautiful sky in literature",ok:false,why:"Overclaiming. Stay inside the sentence."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"Miss Brill is treating a public park as a luxury",ok:true},
    {t:"weather is important in stories",ok:false,why:"Vague. That sentence would fit any story."},
    {t:"gold is worth a lot of money",ok:false,why:"You've annotated the object, not the effect."}
  ]}
},
{
  act:1,
  lead:"She notices the cold before she can name it.",
  text:"The air was motionless, but when you opened your mouth there was just a faint chill, like a chill from a glass of iced water before you sip.",
  target:[[16,27]],
  spot:"Tap where the cold turns into a <em>taste</em>.",
  tech:"simile",
  opts:["simile","metaphor","personification","alliteration"],
  mut:{
    metaphor:"The air was a glass of iced water and everyone in the park drank it.",
    personification:"The air opened its own mouth, sipped, and shivered.",
    alliteration:"The chilly chill chilled the chatty chill-seekers."
  },
  roast:{
    metaphor:"Metaphor drops the \"like\". Watch what happens when you do — the comparison stops being delicate and starts being a claim.",
    personification:"Personification gives it a body. Now the air has a mouth. Congratulations.",
    alliteration:"You heard sounds. Mansfield wrote a sensation. Here's your version."
  },
  slotA:{q:"Comparing cold air to iced water makes the reader",opts:[
    {t:"feel the cold in the mouth rather than on the skin",ok:true},
    {t:"understand that it was a cold day",ok:false,why:"The word \"chill\" already did that. What does the SIMILE add?"},
    {t:"think about drinks",ok:false,why:"You've followed the image out of the story."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"Miss Brill notices tiny physical detail — she has time, and nobody to talk to",ok:true},
    {t:"it shows the writer is good at description",ok:false,why:"Never say this. It's true of every line and it explains nothing."},
    {t:"cold weather is sad",ok:false,why:"Too big a leap from too small a detail."}
  ]}
},
{
  act:1,
  lead:"Her fur necklet has been in a box since last winter.",
  text:"She had taken it out of its box that afternoon, shaken out the moth-powder, given it a good brush, and rubbed the life back into the dim little eyes.",
  target:[[20,28]],
  spot:"Tap the moment a dead fur gets a <em>heartbeat</em>.",
  tech:"personification",
  opts:["personification","metaphor","simile","hyperbole"],
  mut:{
    metaphor:"She had taken out her box of small dead friendship and given it a brush.",
    simile:"She rubbed at the eyes, which were rather like eyes that had once been alive.",
    hyperbole:"She rubbed the eyes for nine hours until they blazed like headlamps."
  },
  roast:{
    metaphor:"Metaphor renames it. Personification gives it a life. Mansfield wanted the second one — the fur has to be a companion, not a symbol.",
    simile:"A simile would hold the fur at arm's length. She isn't holding it at arm's length.",
    hyperbole:"Hyperbole exaggerates. This line is quiet on purpose. Here it is loud."
  },
  slotA:{q:"\"Rubbed the life back into\" makes the reader treat the fur as",opts:[
    {t:"a small creature she is caring for, not an object she owns",ok:true},
    {t:"an old and dusty item",ok:false,why:"That's what it IS. What has the verb done to it?"},
    {t:"a symbol of death",ok:false,why:"Too fast. She's bringing it TO life. Read the verb."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"it is the closest thing to company she has, and she is talking to it",ok:true},
    {t:"she likes animals",ok:false,why:"You've annotated a hobby, not a loneliness."},
    {t:"fur was fashionable in the 1920s",ok:false,why:"Context, not effect. Save it for a different question."}
  ]}
},
{
  act:1,
  lead:"She tells it so, out loud, in her head.",
  text:"Little rogue! Yes, she really felt like that about it. Little rogue biting its tail just by her left ear.",
  target:[[0,1],[10,11]],
  spot:"Tap the <em>name</em> she gives it.",
  tech:"personification",
  opts:["personification","simile","hyperbole","alliteration"],
  mut:{
    simile:"The fur was rather like a rogue, she thought, in the way that furs sometimes are.",
    hyperbole:"The greatest rogue in the history of all rogues! An absolute legend of a rogue!",
    alliteration:"Rakish rascal! Rogueish rogue! Really rather roguish!"
  },
  roast:{
    simile:"You've made her compare it to something. She isn't comparing. She's naming it, the way you'd name a pet.",
    hyperbole:"Hyperbole shouts. \"Little rogue\" is said fondly, under the breath. Volume changes everything.",
    alliteration:"Sounds are there, but they're not the point. The point is that she gave it a NAME."
  },
  slotA:{q:"Calling the fur \"little rogue\" makes the reader hear",opts:[
    {t:"the affectionate voice she'd use with a person, aimed at a scarf",ok:true},
    {t:"that the fur is naughty",ok:false,why:"The fur is not doing anything. She is."},
    {t:"a strange and creepy tone",ok:false,why:"Not yet. It's warm here. The story turns it later — don't spoil your own reading."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"we are watching someone build a companion out of an object, and we're allowed to find it sweet",ok:true},
    {t:"it makes her seem mad",ok:false,why:"Harsh, and it flattens the story. Mansfield is not laughing at her yet."},
    {t:"the fur will be important later",ok:false,why:"That's a plot note, not an annotation. What does the LANGUAGE do here?"}
  ]}
},
/* ---------------- ACT II ---------------- */
{
  act:2,
  lead:"The band strikes up. The Season has begun.",
  text:"The conductor flapped his arms like a rooster about to crow, and the bandsmen blew out their cheeks and glared at the music.",
  target:[[5,10]],
  spot:"Tap the <em>bird</em>.",
  tech:"simile",
  opts:["simile","metaphor","personification","onomatopoeia"],
  mut:{
    metaphor:"The conductor was a rooster. He had feathers, a comb and enormous claws.",
    personification:"The conductor's arms decided, independently, that they had had enough.",
    onomatopoeia:"The conductor went FLAP FLAP COCK-A-DOODLE and the band went PARP."
  },
  roast:{
    metaphor:"Drop the \"like\" and the joke turns into a hallucination. Similes are how you make fun of someone gently.",
    personification:"Nothing lifeless comes alive here. A man is being compared to an animal. That's a simile.",

    {t:"see the inheritance completed at the exact moment she has to choose",ok:true},
    {t:"remember the beginning of the story",ok:false,why:"Yes, and then what? Finish the thought."},
    {t:"know she is from a barbaric country",ok:false,why:"Half the word again. Read both halves."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"if she is half-savage like him, the question of which door becomes genuinely open",ok:true},
    {t:"she is a bad person",ok:false,why:"Semi. That's the word, and that's the difficulty."},
    {t:"repetition creates unity",ok:false,why:"A worksheet phrase. What does THIS repeat do to the ending?"}
  ]}
},
{
  act:3,
  lead:"He describes what she thought about, night after night.",
  text:"She had lost him, but who should have him?",
  target:[[7,7]],
  spot:"Tap the verb. She does <em>not</em> say \"love\".",
  decoy:{range:[4,6],msg:"That's the question, and it is a real technique. But you were asked for one verb inside it."},
  tech:"word choice",
  opts:["word choice","rhetorical question","personification","alliteration"],
  mut:{
    "rhetorical question":"She had lost him. Had she? Truly? And who among us has not lost someone?",
    personification:"She had lost him, and Jealousy took a seat beside her and put its arm around her shoulders.",
    alliteration:"She had lost her love, her lord, her long-belovèd lad."
  },
  roast:{
    "rhetorical question":"It IS a question, and you were told so. The mark is the single word she uses for what love has become.",
    personification:"Naming the feeling as a character explains it. The story never explains it. It just picks a verb.",
    alliteration:"You collected letters and lost the verb. \"Have\" is the ugliest word in the sentence."
  },
  slotA:{q:"Choosing \"have\" rather than \"love\" makes the reader",opts:[
    {t:"hear the man turn into property in the middle of her grief",ok:true},
    {t:"know she is sad",ok:false,why:"She is. The verb is doing something less sympathetic than that."},
    {t:"understand she wants him back",ok:false,why:"Read it again. She is thinking about who else gets him."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"if he cannot be hers, the tiger starts to look like an option to her",ok:true},
    {t:"jealousy is a strong emotion",ok:false,why:"General. Bring it back to this verb and this door."},
    {t:"she is possessive",ok:false,why:"Right word, no working. Show how the sentence proves it."}
  ]}
},
{
  act:3,
  lead:"No timer. The last sentence of the story, and of the game.",
  text:"And so I leave it with all of you: Which came out of the opened door — the lady, or the tiger?",
  target:[[2,8]],
  spot:"Tap where the narrator <em>hands you the story and walks off</em>.",
  tech:"direct address",
  alsoOk:{k:"ambiguity",msg:"Correct in substance — the ending is deliberately unresolved. The technique in these seven words, though, is that he speaks straight to you to do it. Taking it."},
  opts:["direct address","ambiguity","metaphor","repetition"],
  notimer:true,
  mut:{
    metaphor:"And so I set the question down on the table between us like a covered dish.",
    repetition:"And so I leave it with you. I leave it with you. I leave it with you."
  },
  roast:{
    metaphor:"An image would be a flourish. He wants no flourish. He wants to be looking at you when he stops.",
    repetition:"Saying it three times is a performance. Saying it once, to your face, is an exit."
  },
  flag:"THE TITLE IS A QUESTION. THE LAST LINE IS THE SAME QUESTION. NOTHING BETWEEN THEM ANSWERS IT.",
  slotA:{q:"Speaking straight to \"all of you\" makes the reader",opts:[
    {t:"take responsibility for the ending, because there is nobody else left to decide it",ok:true},
    {t:"feel included in the story",ok:false,why:"Included in what? Say what you have been handed."},
    {t:"realise the narrator is a character",ok:false,why:"He has been talking to you since Act One. What is different NOW?"}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"your answer says more about what you think of the princess than about the door",ok:true},
    {t:"open endings are interesting",ok:false,why:"A review. Say what this one asks of you."},
    {t:"the story is unfinished",ok:false,why:"It is finished. It just isn't resolved. Different things."}
  ]}
}
]};

const ORDER = ["missbrill","telltale","monkeyspaw","ladytiger"];
</script>
<script>
/* ================= engine ================= */
const $=s=>document.querySelector(s);
const stage=$('#stage'),timer=$('#timer'),timerwrap=$('#timerwrap'),stamp=$('#stamp'),overlay=$('#overlay');

let ST=null, KEY=null;
let S={i:0,score:0,chain:0,mult:1,muted:false,paused:false,results:[],res:null};
let tEnd=0,tDur=0,tRaf=null,onTimeout=null;

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(f,d,type,vol){
  if(S.muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.06,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.1));
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.1));
}
function sGood(){beep(660,.07);setTimeout(()=>beep(990,.09),70)}
function sChain(){beep(660,.06);setTimeout(()=>beep(880,.06),60);setTimeout(()=>beep(1320,.14),120)}
function sBad(){beep(150,.22,'sawtooth',.09);setTimeout(()=>beep(110,.28,'sawtooth',.08),90)}
function sTick(){beep(1400,.02,'sine',.03)}
function sFreeze(){beep(420,.5,'sine',.05)}

function say(txt,red){
  stamp.textContent=txt;stamp.className=red?'red':'';
  void stamp.offsetWidth; stamp.classList.add('go');
  if(red){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),320)}
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function startTimer(ms,cb){
  stopTimer(); tDur=ms; tEnd=performance.now()+ms; onTimeout=cb;
  timerwrap.style.opacity='1';
  let lastTick=6;
  (function loop(){
    if(S.paused){tRaf=requestAnimationFrame(loop);return}
    const left=tEnd-performance.now(), r=Math.max(0,left/tDur);
    timer.style.transform='scaleX('+r+')';
    timer.className = r<.28?'hot':(r<.55?'pink':'');
    const secs=Math.ceil(left/1000);
    if(secs<=3&&secs!==lastTick&&secs>0){lastTick=secs;sTick()}
    if(left<=0){timer.style.transform='scaleX(0)';const f=onTimeout;onTimeout=null;if(f)f();return}
    tRaf=requestAnimationFrame(loop);
  })();
}
function stopTimer(){if(tRaf)cancelAnimationFrame(tRaf);tRaf=null;onTimeout=null;timer.style.transform='scaleX(0)';timer.className=''}
function hideTimer(){stopTimer();timerwrap.style.opacity='.15'}

function hud(){
  $('#hscore').textContent=S.score.toLocaleString();
  $('#htext').textContent=ST?ST.short.toUpperCase():'—';
  const c=$('#chain');
  c.textContent='CHAIN x'+(S.mult%1?S.mult.toFixed(1):S.mult);
  c.classList.toggle('on',S.mult>1);
}
function addScore(n){S.score+=Math.round(n*S.mult);hud()}
function bumpChain(){S.chain++;S.mult=Math.min(3,1+Math.min(S.chain,4)*.5);hud();if(S.chain===2||S.chain===4)say(pick(ANNOUNCER.chain))}
function breakChain(){S.chain=0;S.mult=1;hud()}

function tokens(t){return t.split(' ')}
function inTarget(it,i){return it.target.some(r=>i>=r[0]&&i<=r[1])}
function renderPassage(it,o){
  o=o||{};
  const ws=tokens(it.text).map((w,i)=>{
    const cls=['w']; if(o.lit&&inTarget(it,i))cls.push('lit');
    return '<span class="'+cls.join(' ')+'" data-i="'+i+'">'+esc(w)+'</span>';
  }).join(' ');
  return '<p class="passage'+(o.locked?' locked':'')+'" id="psg">'+ws+'</p>';
}
function litTarget(it){document.querySelectorAll('#psg .w').forEach(el=>{if(inTarget(it,+el.dataset.i))el.classList.add('lit')})}
function setStoryClass(){
  document.body.className=document.body.className.replace(/\bs-\w+/g,'').trim();
  if(KEY)document.body.classList.add('s-'+KEY);
}

/* ============ 1 : SPOT ============ */
function roundSpot(){
  stage._keys=null;
  const it=ST.items[S.i];
  document.body.classList.toggle('act3',it.act===3);
  document.body.classList.remove('freeze');
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">ACT '+it.act+' &middot; '+(S.i+1)+' OF 12 &middot; SPOT</p>'+
    '<h1 class="instruction">'+it.spot+'</h1>'+
    '<p class="lead">'+it.lead+'</p>'+
    renderPassage(it)+'</div>';
  stage.scrollTop=0;
  let settled=false;
  const done=(ok,el,msg)=>{
    if(settled)return; settled=true;
    stopTimer();
    document.querySelectorAll('#psg .w').forEach(w=>{w.onclick=null});
    document.getElementById('psg').classList.add('locked');
    litTarget(it);
    if(ok){sGood();say(pick(ANNOUNCER.spotGood));addScore(100);S.res.spot=true;setTimeout(roundName,620);return}
    if(el)el.classList.add('bad');
    sBad();say('MISSED',true);breakChain();
    const p=document.createElement('div');p.className='pen';
    p.innerHTML='<div class="who">RED PEN</div><div class="why">'+(msg||'The highlighted words were the ones. Look at them before you name them.')+'</div>';
    stage.querySelector('.sheet').appendChild(p);
    const b=document.createElement('button');b.className='big-btn';b.textContent='NAME IT ANYWAY';
    b.onclick=roundName;p.appendChild(b);b.focus();
  };
  document.querySelectorAll('#psg .w').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i;
      if(inTarget(it,i))return done(true,el);
      if(it.decoy&&i>=it.decoy.range[0]&&i<=it.decoy.range[1])return done(false,el,it.decoy.msg);
      done(false,el);
    };
  });
  if(it.notimer)hideTimer();
  else startTimer(it.act===1?7000:it.act===2?6000:5000,()=>done(false,null,'Out of time. The highlighted words were the ones.'));
}

/* ============ 2 : NAME ============ */
function roundName(){
  const it=ST.items[S.i];
  const opts=shuffle(it.opts);
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">ACT '+it.act+' &middot; '+(S.i+1)+' OF 12 &middot; NAME</p>'+
    '<h1 class="instruction">You found it. Now <em>name</em> it.</h1>'+
    renderPassage(it,{locked:true,lit:true})+
    '<div class="opts" id="opts">'+opts.map((o,n)=>
      '<button class="opt" data-o="'+esc(o)+'"><span class="k">'+(n+1)+'</span>'+esc(o)+'</button>').join('')+'</div></div>';
  stage.scrollTop=0;
  const buttons=[].slice.call(document.querySelectorAll('#opts .opt'));
  const finish=()=>{const b=document.createElement('button');b.className='big-btn';b.textContent='CONTINUE';
    b.onclick=roundEffect;stage.querySelector('.sheet').appendChild(b);b.focus();};
  let answered=false;
  const answer=(choice,el)=>{
    if(answered)return; answered=true;
    stopTimer(); buttons.forEach(b=>{b.disabled=true;if(b!==el)b.classList.add('mute')});
    const half = it.alsoOk && choice===it.alsoOk.k;
    if(choice===it.tech||half){
      if(el)el.classList.add('right'); sGood(); say(pick(ANNOUNCER.nameGood)); addScore(200); S.res.name=true;
      if(half){
        const d=document.createElement('div');d.className='correct-note';
        d.innerHTML='<div class="why">'+it.alsoOk.msg+'</div>';
        stage.querySelector('.sheet').appendChild(d); finish();
      } else setTimeout(roundEffect,560);
      return;
    }
    if(el)el.classList.add('wrong'); sBad(); say(pick(ANNOUNCER.bad),true); breakChain();
    const right=buttons.filter(b=>b.dataset.o===it.tech)[0]; if(right)right.classList.add('right');
    document.querySelectorAll('#psg .w').forEach(w=>{if(inTarget(it,+w.dataset.i)){w.classList.remove('lit');w.classList.add('struck')}});
    const timedout = choice==='__timeout__';
    const mutated = timedout ? it.text : (it.mut[choice]||it.text);
    const why = timedout
      ? 'Clock ran out, so the page marked it for you. It was <b>'+it.tech+'</b>. Say that word to yourself before you move on.'
      : (it.roast[choice]||'');
    const p=document.createElement('div');p.className='pen';
    p.innerHTML='<div class="who">'+(timedout?'TOO SLOW':'SO THE STORY OBEYS YOU:')+'</div>'+
      '<div class="mutated">'+mutated+'</div><div class="why">'+why+'</div>';
    stage.querySelector('.sheet').insertBefore(p,$('#opts'));
    finish();
  };
  buttons.forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  stage._keys=n=>{if(buttons[n]&&!buttons[n].disabled)buttons[n].click()};
  if(it.notimer)hideTimer();
  else startTimer(it.act===1?6000:it.act===2?5000:4500,()=>answer('__timeout__',null));
}

/* ============ 3 : EFFECT (the freeze) ============ */
function roundEffect(){
  const it=ST.items[S.i];
  hideTimer(); document.body.classList.add('freeze'); sFreeze();
  let A=null,B=null,clean=true;
  const draw=()=>{
    const aTxt=A?'<span class="slot">'+esc(A.t)+'</span>':'<span class="slot empty">xxxxxx</span>';
    const bTxt=B?'<span class="slot">'+esc(B.t)+'</span>':'<span class="slot empty">xxxxxx</span>';
    const active = A? it.slotB : it.slotA;
    const opts = shuffle(active.opts);
    stage.innerHTML='<div class="sheet">'+
      '<p class="freezetag">EVERYTHING STOPS. NO CLOCK.</p>'+
      '<h1 class="instruction">Say what it <em>does</em>.</h1>'+
      '<p class="sub">'+it.tech.toUpperCase()+' &middot; BUILD THE SENTENCE &middot; FIRST TRY IS WORTH 600</p>'+
      '<p class="builder">'+it.slotA.q+' '+aTxt+', '+it.slotB.q+' '+bTxt+'.</p>'+
      '<div class="opts" id="opts">'+opts.map((o,n)=>
        '<button class="opt" data-n="'+n+'"><span class="k">'+(n+1)+'</span>'+esc(o.t)+'</button>').join('')+'</div></div>';
    stage.scrollTop=0;
    const buttons=[].slice.call(document.querySelectorAll('#opts .opt'));
    buttons.forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.n];
      if(o.ok){
        b.classList.add('right');buttons.forEach(x=>x.disabled=true);sGood();
        if(!A){A=o;setTimeout(draw,340)}else{B=o;setTimeout(settle,420)}
      }else{
        clean=false;b.classList.add('wrong');b.disabled=true;sBad();breakChain();
        const old=stage.querySelector('.pen'); if(old)old.remove();
        const d=document.createElement('div');d.className='pen';
        d.innerHTML='<div class="who">NOT THAT ONE</div><div class="why">'+o.why+'</div>';
        stage.querySelector('.sheet').appendChild(d);
      }
    });
    stage._keys=n=>{if(buttons[n]&&!buttons[n].disabled)buttons[n].click()};
  };
  const settle=()=>{
    S.res.eff=true; S.res.clean=clean;
    S.res.sentence=it.slotA.q+' '+A.t+', '+it.slotB.q+' '+B.t+'.';
    if(clean&&S.res.spot&&S.res.name){addScore(600);bumpChain();say(pick(ANNOUNCER.effGood));sChain()}
    else{addScore(clean?600:200);say('LOGGED')}
    itemResult();
  };
  draw();
}

/* ============ item result ============ */
function itemResult(){
  stage._keys=null;
  const it=ST.items[S.i];
  document.body.classList.remove('freeze');
  const full=S.res.spot&&S.res.name&&S.res.clean;
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">'+(S.i+1)+' OF 12 &middot; '+(full?'FULL CHAIN':'LOGGED')+'</p>'+
    '<h1 class="instruction">'+(full?'That is a whole annotation.':'Annotation saved.')+'</h1>'+
    renderPassage(it,{locked:true,lit:true})+
    '<div class="correct-note"><div class="why"><b>'+it.tech.toUpperCase()+'</b><br>'+esc(S.res.sentence)+'</div></div>'+
    (it.flag?'<div class="callback">'+it.flag+'</div>':'')+'</div>';
  stage.scrollTop=0;
  const b=document.createElement('button');b.className='big-btn';
  const last=S.i===ST.items.length-1;
  const newAct = !last && ST.items[S.i+1].act!==it.act;
  b.textContent= last?'FINISH':(newAct?'NEXT ACT':'NEXT');
  b.onclick=()=>{
    S.results.push(Object.assign({idx:S.i},S.res)); S.i++;
    if(S.i>=ST.items.length)return endCard();
    if(ST.items[S.i].act!==it.act)return actCard(ST.items[S.i].act);
    nextItem();
  };
  stage.querySelector('.sheet').appendChild(b);b.focus();
}
function nextItem(){S.res={spot:false,name:false,eff:false,clean:false,sentence:''};roundSpot()}

/* ============ act card ============ */
function actCard(n){
  stage._keys=null;
  const a=ST.acts[n]; hideTimer(); document.body.classList.toggle('act3',n===3);
  stage.innerHTML='<div class="card"><p class="actnum">'+a.sub+' &middot; '+ST.short.toUpperCase()+'</p>'+
    '<h1 class="acttitle">'+a.title+'</h1>'+
    a.blurb.map(b=>'<p class="blurb">'+b+'</p>').join('')+
    '<hr class="rule"><button class="big-btn" id="go">BEGIN</button></div>';
  stage.scrollTop=0;
  $('#go').onclick=nextItem; $('#go').focus();
}

/* ============ story picker ============ */
function pickerCard(){
  stage._keys=null; ST=null; KEY=null;
  hideTimer(); document.body.classList.remove('act3','freeze'); setStoryClass(); hud();
  stage.innerHTML='<div class="card">'+
    '<h1 class="title-big">ANNO<br><span>TATOR</span></h1>'+
    '<p class="tagline">Twelve lines. Spot the technique before the highlighter runs out, name it, then everything stops and you say what it does.<br><br>'+
    'Name it wrong and the story rewrites itself to obey you. It will not be an improvement.<br><br>'+
    '<b>Choose your text.</b></p>'+
    '<div class="pick">'+ORDER.map((k,n)=>{
      const s=STORIES[k];
      return '<button class="storybtn p'+(n+1)+'" data-k="'+k+'">'+
        '<span class="sname">'+s.short+'</span>'+
        '<div class="smeta">'+s.author.toUpperCase()+' &middot; '+s.year+' &middot; '+s.words.toUpperCase()+'</div>'+
        '<div class="shook">'+s.hook+'</div></button>';
    }).join('')+'</div>'+
    '<button class="big-btn ghost" id="hlp" style="margin-top:14px">HOW IT WORKS</button></div>';
  stage.scrollTop=0;
  document.querySelectorAll('.storybtn').forEach(b=>b.onclick=()=>{ac();storyCard(b.dataset.k)});
  $('#hlp').onclick=showHelp;
}

/* ============ story intro + read first ============ */
function storyCard(k){
  stage._keys=null; KEY=k; ST=STORIES[k];
  S={i:0,score:0,chain:0,mult:1,muted:S.muted,paused:false,results:[],res:null};
  setStoryClass(); hud(); hideTimer(); document.body.classList.remove('act3','freeze');
  stage.innerHTML='<div class="card">'+
    '<p class="actnum">'+ST.author.toUpperCase()+' &middot; '+ST.year+'</p>'+
    '<h1 class="title-big" style="font-size:clamp(38px,11vw,72px)">'+ST.title+'</h1>'+
    '<p class="blurb" style="margin-top:14px">'+ST.pitch+'</p>'+
    '<hr class="rule">'+
    '<p class="tagline" style="margin:0 0 8px"><b>Read the story first.</b> The game quotes twelve lines out of it. They land much harder if you have met them in place. '+ST.words+'.</p>'+
    '<a class="big-btn ghost" id="read" href="'+ST.read.url+'" target="_blank" rel="noopener">READ THE STORY &nearr;</a>'+
    '<p class="tagline" style="margin:6px 0 0;font-size:11.5px">Opens in a new tab &middot; '+ST.read.kind+' &middot; '+ST.pd+'</p>'+
    '<hr class="rule">'+
    '<button class="big-btn" id="go">START ANNOTATING</button>'+
    '<button class="big-btn ghost" id="back">PICK A DIFFERENT STORY</button></div>';
  stage.scrollTop=0;
  $('#go').onclick=()=>{ac();actCard(1)};
  $('#back').onclick=pickerCard;
  $('#go').focus();
}

/* ============ end card ============ */
function endCard(){
  stage._keys=null; hideTimer(); document.body.classList.remove('freeze');
  const spots=S.results.filter(r=>r.spot).length;
  const names=S.results.filter(r=>r.name).length;
  const cleans=S.results.filter(r=>r.clean&&r.spot&&r.name).length;
  const lines=S.results.map(r=>{
    const it=ST.items[r.idx];
    const q=tokens(it.text).map((w,i)=>inTarget(it,i)?'<mark>'+esc(w)+'</mark>':esc(w)).join(' ');
    return '<div class="report-line'+(r.spot&&r.name?'':' missed')+'">'+
      '<div class="num">'+String(r.idx+1).padStart(2,'0')+' &middot; ACT '+it.act+'</div>'+
      '<div class="quote">'+q+'</div>'+
      '<div class="lab">'+it.tech.toUpperCase()+(r.name?'':'  (you named it something else)')+'</div>'+
      '<div class="eff">'+esc(r.sentence)+'</div></div>';
  }).join('');
  const v=ST.end.verdicts;
  const verdict = cleans>=10?v[0] : cleans>=7?v[1] : cleans>=4?v[2] : v[3];
  stage.innerHTML='<div class="card">'+
    '<p class="actnum">ANNOTATION SHEET</p>'+
    '<h1 class="acttitle">'+ST.short.toUpperCase()+'</h1>'+
    '<div class="scoreblock">'+
      '<div>SCORE<b>'+S.score.toLocaleString()+'</b></div>'+
      '<div>SPOTTED<b>'+spots+'/12</b></div>'+
      '<div>NAMED<b>'+names+'/12</b></div>'+
      '<div>FULL CHAINS<b>'+cleans+'/12</b></div></div>'+
    '<p class="blurb">'+verdict+'</p><hr class="rule">'+
    '<h3 class="h3a">WHAT CAME BACK</h3>'+
    '<p class="tagline">'+ST.end.lines.join('<br>')+'</p><hr class="rule">'+lines+'<hr class="rule">'+
    '<h3 class="h3a">TALK ABOUT IT</h3>'+
    '<ol class="qs">'+ST.end.qs.map(q=>'<li>'+q+'</li>').join('')+'</ol><hr class="rule">'+
    '<button class="big-btn" id="copy">COPY MY ANNOTATION SHEET</button>'+
    '<button class="big-btn ghost" id="again">PLAY THIS STORY AGAIN</button>'+
    '<button class="big-btn ghost" id="another">TRY A DIFFERENT STORY</button>'+
    '<p class="tagline" style="margin-top:18px">'+ST.short+', '+ST.author+', '+ST.year+'. '+ST.pd+
    ' Lines trimmed for the screen and spaced around dashes; no words changed. Everything else here is written for this game.</p></div>';
  stage.scrollTop=0;
  $('#again').onclick=()=>storyCard(KEY);
  $('#another').onclick=pickerCard;
  $('#copy').onclick=()=>{
    let out='ANNOTATION SHEET — '+ST.short.toUpperCase()+' ('+ST.author+', '+ST.year+')\nScore '+S.score+' | full chains '+cleans+'/12\n\n';
    S.results.forEach(r=>{const it=ST.items[r.idx];
      out+=(r.idx+1)+'. '+it.text+'\n   TECHNIQUE: '+it.tech+'\n   EFFECT: '+r.sentence+'\n\n';});
    out+='WHAT CAME BACK\n'+ST.end.lines.map(l=>'- '+l.replace(/<[^>]+>/g,'')).join('\n')+'\n';
    const ta=document.createElement('textarea');ta.value=out;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');say('COPIED')}catch(e){say('SELECT + COPY',true)}
    document.body.removeChild(ta);
  };
}

/* ============ help ============ */
function showHelp(){
  overlay.classList.add('on');
  overlay.innerHTML='<h2>ANNOTATOR</h2>'+
    '<p>Four short stories, twelve lines each. Every line is a three-link chain.</p>'+
    '<h3>1 &middot; SPOT</h3><p>Tap the words. The highlighter bar is your clock: 7 seconds in Act I, 5 by Act III. Worth 100.</p>'+
    '<h3>2 &middot; NAME</h3><p>Pick the technique. Worth 200. Get it wrong and the sentence is rewritten to actually BE the thing you called it. Read the rewrite. That is the lesson, not the punishment.</p>'+
    '<h3>3 &middot; EFFECT</h3><p>Everything stops. No clock. Build a sentence saying what the technique does and why it matters. Clean first try is worth 600.</p>'+
    '<h3>CHAIN</h3><p>All three links clean, back to back, multiplies everything up to x3. One lucky tap is worth 100. A full chain is 900 before the multiplier.</p>'+
    '<h3>CONTROLS</h3><p><kbd>1</kbd>&ndash;<kbd>4</kbd> choose &middot; <kbd>Space</kbd> continue &middot; <kbd>H</kbd> help &middot; <kbd>M</kbd> sound &middot; <kbd>Esc</kbd> pause. Tap works everywhere.</p>'+
    '<h3>HOW EACH STORY IS BUILT</h3><ul>'+
    '<li>Act I sets up the techniques. Act III uses the same ones against the characters.</li>'+
    '<li>At least two things you annotate early come back later, changed. The game tells you when.</li>'+
    '<li>Item 12 never has a timer. It is the last line of the story and it is not a race.</li></ul>'+
    '<h3>THE TEXTS</h3><ul>'+ORDER.map(k=>{const s=STORIES[k];
      return '<li><b>'+s.short+'</b> &mdash; '+s.author+', '+s.year+'. '+s.pd+' <a href="'+s.read.url+'" target="_blank" rel="noopener">Read it</a> ('+s.read.kind+').</li>';}).join('')+'</ul>'+
    '<p>Quoted lines are original text, trimmed for screen width, with spacing added around dashes so words can be tapped one at a time. No words are changed or added. Every instruction, rewrite, roast and effect option is written for this game.</p>'+
    '<button class="big-btn" id="close">BACK</button>';
  $('#close').onclick=()=>overlay.classList.remove('on');
  $('#close').focus();
}
$('#bhelp').onclick=showHelp;
$('#bmute').onclick=()=>{S.muted=!S.muted;$('#bmute').textContent=S.muted?'\u266A\u0338':'\u266A'};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(overlay.classList.contains('on'))overlay.classList.remove('on');
    else if(ST){S.paused=!S.paused;say(S.paused?'PAUSED':'GO')}
    return;
  }
  if(overlay.classList.contains('on'))return;
  const k=e.key.toLowerCase();
  if(k==='h'){showHelp();return}
  if(k==='m'){$('#bmute').click();return}
  if('1234'.indexOf(k)>-1&&stage._keys){stage._keys(+k-1);return}
  if(k===' '||k==='enter'){const b=stage.querySelector('.big-btn');if(b&&b.tagName==='BUTTON'){e.preventDefault();b.click()}}
});

hud(); pickerCard();
</script>
</body>
</html>
