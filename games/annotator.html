<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ANNOTATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E2DA;
  --paper-dark:#CFCCC2;
  --ink:#16181C;
  --ink-soft:#5A5C60;
  --hi:#F5E33A;
  --hi-pink:#FF4FA3;
  --red:#D6202B;
  --grid:rgba(22,24,28,.07);
}
/* one highlighter colour per story, so the sheet looks different per text */
body.s-missbrill{--hi:#F5E33A;--hi-pink:#FF4FA3}
body.s-telltale{--hi:#E9E24A;--hi-pink:#FF6B4A;--red:#B3121C}
body.s-monkeyspaw{--hi:#7FE0B0;--hi-pink:#FFB03A;--red:#C2331F}
body.s-ladytiger{--hi:#FFAE3B;--hi-pink:#E85CC8;--red:#C41E3A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'EB Garamond',Georgia,serif;
  overflow:hidden;position:fixed;width:100%;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 28px);
  transition:background-color .6s ease;
}
body.act3{--paper:#CFCCC2;--grid:rgba(22,24,28,.11);background-color:var(--paper)}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  opacity:.5;mix-blend-mode:multiply;
  background-image:radial-gradient(circle at 20% 30%,rgba(0,0,0,.05) 0 1px,transparent 1px),
                   radial-gradient(circle at 70% 80%,rgba(0,0,0,.04) 0 1px,transparent 1px);
  background-size:7px 7px,11px 11px;
}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:2}

#bar{
  flex:0 0 auto;padding:8px 12px 6px;
  font-family:'Courier Prime',monospace;font-size:12px;
  display:flex;gap:10px;align-items:baseline;
  border-bottom:1.5px solid var(--ink);letter-spacing:.02em;
}
#bar .slot{white-space:nowrap}
#bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#bar b{font-weight:700}
#chain{color:var(--red);font-weight:700}
#chain.on{background:var(--hi);padding:0 4px}
.btns{display:flex;gap:6px}
.mini{
  font-family:'Courier Prime',monospace;font-size:11px;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:1px 6px;cursor:pointer;
}
.mini:hover,.mini:focus-visible{background:var(--ink);color:var(--paper);outline:none}

#timerwrap{flex:0 0 auto;height:12px;border-bottom:1.5px solid var(--ink);position:relative;overflow:hidden}
#timer{position:absolute;inset:0;width:100%;background:var(--hi);transform-origin:left center}
#timer.pink{background:var(--hi-pink)}
#timer.hot{background:var(--red)}

#stage{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:center;padding:16px 16px 24px}
.sheet,.card{width:100%;max-width:640px;margin:0 auto}

.instruction{font-family:'Anton',Impact,sans-serif;font-size:clamp(20px,6.2vw,30px);line-height:1.05;margin:0 0 4px}
.instruction em{font-style:normal;background:var(--hi);padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-soft);margin:0 0 14px}
.lead{font-size:15px;font-style:italic;color:var(--ink-soft);margin:0 0 10px;line-height:1.45}

.passage{font-size:clamp(19px,5.1vw,25px);line-height:1.85;margin:0}
.w{padding:1px 1px;border-radius:2px;cursor:pointer;transition:background .12s}
.w:hover{background:rgba(0,0,0,.08)}
.w.lit{background:var(--hi);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.w.bad{background:var(--red);color:var(--paper)}
.w.struck{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;opacity:.55}
.passage.locked .w{cursor:default}
.passage.locked .w:hover{background:none}
.passage.locked .w.lit:hover{background:var(--hi)}

.opts{display:grid;gap:8px;margin-top:18px}
.opt{
  font-family:'Courier Prime',monospace;font-size:15px;text-align:left;
  padding:11px 12px;border:2px solid var(--ink);background:var(--paper);
  color:var(--ink);cursor:pointer;line-height:1.35;
}
.opt:hover,.opt:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.opt .k{font-weight:700;margin-right:8px}
.opt.right{background:var(--hi);border-color:var(--ink);color:var(--ink)}
.opt.wrong{background:var(--red);color:var(--paper);border-color:var(--red)}
.opt.mute{opacity:.35}
.opt:disabled{cursor:default}

.pen{margin-top:16px;border-left:5px solid var(--red);padding:10px 0 10px 12px;animation:penin .22s ease-out}
@keyframes penin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.pen .who{font-family:'Anton',sans-serif;font-size:15px;color:var(--red);letter-spacing:.02em;margin-bottom:6px}
.pen .mutated{font-size:19px;line-height:1.55;color:var(--red);font-style:italic}
.pen .why{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5;margin-top:9px;color:var(--ink)}
.correct-note{margin-top:16px;border-left:5px solid var(--ink);padding:10px 0 10px 12px}
.correct-note .why{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5}
.callback{margin-top:14px;background:var(--ink);color:var(--paper);padding:10px 12px;font-family:'Courier Prime',monospace;font-size:13px;line-height:1.5}
.callback b{color:var(--hi)}

body.freeze{background-color:#F2F0E9}
body.freeze #timerwrap{opacity:.25}
.freezetag{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.16em;color:var(--ink-soft);margin-bottom:10px}
.builder{font-size:clamp(18px,4.8vw,23px);line-height:1.7;margin:0 0 16px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.slot{background:var(--hi);padding:0 5px}
.slot.empty{background:none;border-bottom:3px solid var(--red);padding:0 26px;color:transparent}

#stamp{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-6deg);
  font-family:'Anton',sans-serif;font-size:clamp(38px,13vw,84px);line-height:.9;
  color:var(--ink);pointer-events:none;z-index:50;opacity:0;text-align:center;
  padding:6px 16px;border:5px solid var(--ink);background:var(--hi);max-width:92vw;
}
#stamp.red{background:var(--red);color:var(--paper);border-color:var(--paper);box-shadow:0 0 0 5px var(--red)}
#stamp.go{animation:stampin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampin{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(2.4)}
  22%,78%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-6deg) scale(1.05)}
}
body.shake #app{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}

.title-big{font-family:'Anton',sans-serif;font-size:clamp(48px,15vw,100px);line-height:.82;margin:0 0 2px;letter-spacing:-.01em}
.title-big span{background:var(--hi);padding:0 4px}
.tagline{font-family:'Courier Prime',monospace;font-size:13px;line-height:1.6;margin:14px 0 0;max-width:46ch}
.rule{border:0;border-top:2px solid var(--ink);margin:18px 0}
.big-btn{
  font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.02em;
  padding:12px 20px;border:3px solid var(--ink);background:var(--hi);color:var(--ink);
  cursor:pointer;width:100%;margin-top:6px;display:block;text-align:center;text-decoration:none;
}
.big-btn:hover,.big-btn:focus-visible{background:var(--ink);color:var(--hi);outline:none}
.big-btn.ghost{background:var(--paper)}
.big-btn.ghost:hover,.big-btn.ghost:focus-visible{background:var(--ink);color:var(--paper)}
.actnum{font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:.2em;color:var(--ink-soft)}
.acttitle{font-family:'Anton',sans-serif;font-size:clamp(32px,9vw,56px);line-height:.95;margin:4px 0 12px}
.blurb{font-size:17px;line-height:1.6;max-width:46ch}
.blurb + .blurb{margin-top:10px}

/* --- story picker --- */
.pick{display:grid;gap:10px;margin-top:16px}
.storybtn{
  display:block;width:100%;text-align:left;cursor:pointer;
  border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:12px 14px;
}
.storybtn:hover,.storybtn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.storybtn:hover .sname,.storybtn:focus-visible .sname{background:none;color:var(--paper)}
.storybtn:hover .smeta,.storybtn:focus-visible .smeta{color:var(--paper-dark)}
.sname{font-family:'Anton',sans-serif;font-size:clamp(21px,5.6vw,28px);line-height:1.05;display:inline-block;background:var(--hi);padding:0 4px}
.smeta{font-family:'Courier Prime',monospace;font-size:11.5px;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}
.shook{font-size:15.5px;line-height:1.45;margin-top:6px}
.p1 .sname{background:#F5E33A}
.p2 .sname{background:#E9E24A}
.p3 .sname{background:#7FE0B0}
.p4 .sname{background:#FFAE3B}
.p5 .sname{background:#A7D8FF}
.p6 .sname{background:#FF9EB5}
.p7 .sname{background:#C7A7FF}

#overlay{position:fixed;inset:0;background:var(--paper);z-index:70;display:none;overflow-y:auto;padding:20px 16px 40px}
#overlay.on{display:block}
#overlay h2{font-family:'Anton',sans-serif;font-size:32px;margin:0 0 10px}
#overlay h3{font-family:'Anton',sans-serif;font-size:19px;margin:22px 0 6px}
#overlay p,#overlay li{font-family:'Courier Prime',monospace;font-size:13.5px;line-height:1.65}
#overlay ul{padding-left:18px;margin:6px 0}
#overlay a{color:var(--ink)}
kbd{font-family:'Courier Prime',monospace;border:1.5px solid var(--ink);padding:0 5px;font-size:12px;background:var(--paper-dark)}

.report-line{border-top:1.5px solid var(--ink);padding:12px 0}
.report-line .num{font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.12em}
.report-line .quote{font-size:17px;line-height:1.6;margin:4px 0 6px}
.report-line .quote mark{background:var(--hi);color:var(--ink);padding:0 3px}
.report-line .lab{font-family:'Courier Prime',monospace;font-size:12.5px;color:var(--red);font-weight:700}
.report-line .eff{font-family:'Courier Prime',monospace;font-size:12.5px;line-height:1.55;margin-top:3px}
.report-line.missed{opacity:.55}
.scoreblock{display:flex;gap:22px;flex-wrap:wrap;font-family:'Courier Prime',monospace;font-size:13px;margin:10px 0 4px}
.scoreblock b{display:block;font-family:'Anton',sans-serif;font-size:30px;line-height:1.1;color:var(--ink)}
.qs li{margin-bottom:10px}
.h3a{font-family:'Anton',sans-serif;font-size:20px;margin:0 0 6px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="slot">NAME: <b>YEAR 8</b></span>
    <span class="slot grow">TEXT: <b id="htext">—</b></span>
    <span class="slot">SCORE: <b id="hscore">0</b></span>
    <span class="slot" id="chain">CHAIN x1</span>
    <span class="btns">
      <button class="mini" id="bhelp" title="Help">?</button>
      <button class="mini" id="bmute" title="Sound">&#9834;</button>
    </span>
  </div>
  <div id="timerwrap"><div id="timer"></div></div>
  <div id="stage"></div>
</div>
<div id="stamp"></div>
<div id="overlay"></div>
<script>
/* ============================================================
   ANNOTATOR
   Four public-domain short stories. Every quoted line is from
   the original text, lightly trimmed for screen width and with
   spacing added around dashes so words can be tapped
   individually. No words are changed or added.
   Every instruction, roast, rewrite and effect option is
   original writing for this game.

   TO SWAP A READING LINK: each story's `read:{url:...}` is at
   the top of its block below.
   TO CHANGE THE ANNOUNCER VOICE: edit ANNOUNCER, just here.
   ============================================================ */

const ANNOUNCER = {
  spotGood:["SPOTTED","THAT'S THE ONE","LOCKED IN","EYES"],
  nameGood:["NAMED","CORRECT","YOU KNOW IT"],
  effGood:["COOKED","FULL CHAIN","NO NOTES","ANNOTATED"],
  bad:["RED PEN","NOPE","MARKED DOWN","OOF"],
  chain:["CHAIN x2","CHAIN x3","ON FIRE"]
};

const STORIES = {};
STORIES.missbrill = {
  title:"MISS<br>BRILL",
  short:"Miss Brill",
  author:"Katherine Mansfield",
  year:"1920",
  hook:"A lonely woman goes to the park and decides she is in a play.",
  pitch:"The gentlest story here and the cruellest ending. Mansfield builds a beautiful afternoon out of similes and then lets two strangers use the same techniques as weapons. Two words you annotate in Act Two come back in Act Three.",
  read:{url:"https://www.gutenberg.org/cache/epub/1429/pg1429-images.html",kind:"web page \u2014 find \u201cMiss Brill\u201d in the collection"},
  words:"about 2,000 words",
  pd:"Mansfield died in 1923. Public domain worldwide.",
  acts:{
    1:{sub:"ACT ONE",title:"THE SUNDAY",blurb:[
      "Miss Brill goes to the park. The world is beautiful and she is looking very carefully at it.",
      "Four annotations. Spot it, name it, then say what it does. A full chain is worth nine times a lucky tap."]},
    2:{sub:"ACT TWO",title:"THE COMPANY",blurb:[
      "She works out what the park is, and what she is in it.",
      "Faster now. Two of these four come back in Act Three, so annotate like you will be asked about them. You will."]},
    3:{sub:"ACT THREE",title:"THE FRIED WHITING",blurb:[
      "Two young people sit down on her bench.",
      "Everything from Acts One and Two is about to be used against her. Same techniques. Different hands."]}
  },
  end:{
    lines:["FUNNY \u2014 her fond word in Act Two, the girl\u2019s weapon in Act Three.",
      "EXACTLY LIKE \u2014 her phrase for the play, the girl\u2019s phrase for the fish.",
      "THE EYES \u2014 she rubbed life into them on page one; the lid goes on at the end."],
    qs:["In Act Two Miss Brill uses \u201cfunny\u201d to mean odd, and a little lovable. In Act Three the girl uses the same word to wound her. What changed \u2014 the word, or who was holding it?",
      "Miss Brill decides the park is \u201cexactly like a play\u201d and that she has a part in it. Is she wrong? What does the story gain by letting her be right for four pages before it takes it away?",
      "The last line says she thought she heard something crying. Mansfield never says who. Why refuse to tell us, and what would be lost if she did?"],
    verdicts:["You annotated this story properly. Take it to the exam.",
      "Solid. The gaps are all in the same place: saying what it DOES.",
      "You can spot. You can name. The third move is the one worth marks.",
      "Spotting is not annotating. Run it again and go slower on the freezes."]
  },
  items:[
/* ---------------- ACT I ---------------- */
{
  act:1,
  lead:"Sunday. Miss Brill has come to the Jardins Publiques, as she does every week.",
  text:"The blue sky powdered with gold and great spots of light like white wine splashed over the Jardins Publiques.",
  target:[[3,5]],
  decoy:{range:[11,14],msg:"That's an image too — but it's wearing a \"like\". Different animal. Find the one that just states it."},
  spot:"Two images here. Tap the one that <em>doesn't</em> use \"like\".",
  tech:"metaphor",
  opts:["metaphor","simile","alliteration","onomatopoeia"],
  mut:{
    simile:"The blue sky was fairly similar to some gold powder, in a way, if you thought about it.",
    alliteration:"The bright blue sky bore beautiful bits of blondish bling.",
    onomatopoeia:"The blue sky went POWD! POWD! and gold fell out of it."
  },
  roast:{
    simile:"A simile says one thing is LIKE another. This line says the sky IS powdered. No like, no as. So here's the simile you ordered.",
    alliteration:"Alliteration is repeated opening sounds. You've turned a sky into a shampoo advert.",
    onomatopoeia:"Onomatopoeia is a word that makes the noise. The sky is silent. Enjoy."
  },
  slotA:{q:"Powdered makes the reader see the sky as",opts:[
    {t:"something soft and expensive, dusted on by hand",ok:true},
    {t:"a really nice colour",ok:false,why:"True of any sky ever written. Say what THIS word does."},
    {t:"the most beautiful sky in literature",ok:false,why:"Overclaiming. Stay inside the sentence."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"Miss Brill is treating a public park as a luxury",ok:true},
    {t:"weather is important in stories",ok:false,why:"Vague. That sentence would fit any story."},
    {t:"gold is worth a lot of money",ok:false,why:"You've annotated the object, not the effect."}
  ]}
},
{
  act:1,
  lead:"She notices the cold before she can name it.",
  text:"The air was motionless, but when you opened your mouth there was just a faint chill, like a chill from a glass of iced water before you sip.",
  target:[[16,27]],
  spot:"Tap where the cold turns into a <em>taste</em>.",
  tech:"simile",
  opts:["simile","metaphor","personification","alliteration"],
  mut:{
    metaphor:"The air was a glass of iced water and everyone in the park drank it.",
    personification:"The air opened its own mouth, sipped, and shivered.",
    alliteration:"The chilly chill chilled the chatty chill-seekers."
  },
  roast:{
    metaphor:"Metaphor drops the \"like\". Watch what happens when you do — the comparison stops being delicate and starts being a claim.",
    personification:"Personification gives it a body. Now the air has a mouth. Congratulations.",
    alliteration:"You heard sounds. Mansfield wrote a sensation. Here's your version."
  },
  slotA:{q:"Comparing cold air to iced water makes the reader",opts:[
    {t:"feel the cold in the mouth rather than on the skin",ok:true},
    {t:"understand that it was a cold day",ok:false,why:"The word \"chill\" already did that. What does the SIMILE add?"},
    {t:"think about drinks",ok:false,why:"You've followed the image out of the story."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"Miss Brill notices tiny physical detail — she has time, and nobody to talk to",ok:true},
    {t:"it shows the writer is good at description",ok:false,why:"Never say this. It's true of every line and it explains nothing."},
    {t:"cold weather is sad",ok:false,why:"Too big a leap from too small a detail."}
  ]}
},
{
  act:1,
  lead:"Her fur necklet has been in a box since last winter.",
  text:"She had taken it out of its box that afternoon, shaken out the moth-powder, given it a good brush, and rubbed the life back into the dim little eyes.",
  target:[[20,28]],
  spot:"Tap the moment a dead fur gets a <em>heartbeat</em>.",
  tech:"personification",
  opts:["personification","metaphor","simile","hyperbole"],
  mut:{
    metaphor:"She had taken out her box of small dead friendship and given it a brush.",
    simile:"She rubbed at the eyes, which were rather like eyes that had once been alive.",
    hyperbole:"She rubbed the eyes for nine hours until they blazed like headlamps."
  },
  roast:{
    metaphor:"Metaphor renames it. Personification gives it a life. Mansfield wanted the second one — the fur has to be a companion, not a symbol.",
    simile:"A simile would hold the fur at arm's length. She isn't holding it at arm's length.",
    hyperbole:"Hyperbole exaggerates. This line is quiet on purpose. Here it is loud."
  },
  slotA:{q:"\"Rubbed the life back into\" makes the reader treat the fur as",opts:[
    {t:"a small creature she is caring for, not an object she owns",ok:true},
    {t:"an old and dusty item",ok:false,why:"That's what it IS. What has the verb done to it?"},
    {t:"a symbol of death",ok:false,why:"Too fast. She's bringing it TO life. Read the verb."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"it is the closest thing to company she has, and she is talking to it",ok:true},
    {t:"she likes animals",ok:false,why:"You've annotated a hobby, not a loneliness."},
    {t:"fur was fashionable in the 1920s",ok:false,why:"Context, not effect. Save it for a different question."}
  ]}
},
{
  act:1,
  lead:"She tells it so, out loud, in her head.",
  text:"Little rogue! Yes, she really felt like that about it. Little rogue biting its tail just by her left ear.",
  target:[[0,1],[10,11]],
  spot:"Tap the <em>name</em> she gives it.",
  tech:"personification",
  opts:["personification","simile","hyperbole","alliteration"],
  mut:{
    simile:"The fur was rather like a rogue, she thought, in the way that furs sometimes are.",
    hyperbole:"The greatest rogue in the history of all rogues! An absolute legend of a rogue!",
    alliteration:"Rakish rascal! Rogueish rogue! Really rather roguish!"
  },
  roast:{
    simile:"You've made her compare it to something. She isn't comparing. She's naming it, the way you'd name a pet.",
    hyperbole:"Hyperbole shouts. \"Little rogue\" is said fondly, under the breath. Volume changes everything.",
    alliteration:"Sounds are there, but they're not the point. The point is that she gave it a NAME."
  },
  slotA:{q:"Calling the fur \"little rogue\" makes the reader hear",opts:[
    {t:"the affectionate voice she'd use with a person, aimed at a scarf",ok:true},
    {t:"that the fur is naughty",ok:false,why:"The fur is not doing anything. She is."},
    {t:"a strange and creepy tone",ok:false,why:"Not yet. It's warm here. The story turns it later — don't spoil your own reading."}
  ]},
  slotB:{q:"which matters because",opts:[
    {t:"we are watching someone build a companion out of an object, and we're allowed to find it sweet",ok:true},
    {t:"it makes her seem mad",ok:false,why:"Harsh, and it flattens the story. Mansfield is not laughing at her yet."},
    {t:"the fur will be important later",ok:false,why:"That's a plot note, not an annotation. What does the LANGUAGE do here?"}
  ]}
},
/* ---------------- ACT II ---------------- */
{
  act:2,
  lead:"The band strikes up. The Season has begun.",
  text:"The conductor flapped his arms like a rooster about to crow, and the bandsmen blew out their cheeks and glared at the music.",
  target:[[5,10]],
  spot:"Tap the <em>bird</em>.",
  tech:"simile",
  opts:["simile","metaphor","personification","onomatopoeia"],
  mut:{
    metaphor:"The conductor was a rooster. He had feathers, a comb and enormous claws.",
    personification:"The conductor's arms decided, independently, that they had had enough.",
    onomatopoeia:"The conductor went FLAP FLAP COCK-A-DOODLE and the band went PARP."
  },

/* ================= added story packs =================
   These are deliberately built from short, exact lines in the supplied texts.
   The helper supplies useful distractors while each story supplies its own
   evidence, target phrase, and cause/effect debrief.
*/
function annotated(spec){
  const opts=spec.opts||[spec.tech,"imagery","repetition","tone"].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);
  const mut=Object.assign({},spec.mut||{}),roast=Object.assign({},spec.roast||{});
  opts.filter(x=>x!==spec.tech).forEach(x=>{
    if(!mut[x])mut[x]=spec.text;
    if(!roast[x])roast[x]="That label does not quite fit this line. Look at the exact words and the response they create.";
  });
  const lastToken=Math.max(0,spec.text.split(' ').length-1);
  const target=(spec.target||[]).map(([a,b])=>[Math.min(a,lastToken),Math.min(b,lastToken)]);
  return Object.assign({},spec,{opts,mut,roast,target});
}
function addedStory(spec){return Object.assign({},spec,{items:spec.items.map(annotated)});}

    {act:1,lead:"Paint the crowd before you judge it.",text:"Before daybreak the crowds would form, long lines of children and adults both, each one clutching his or her dollar, and waiting with wonderment to see what race of strange creatures the Professor had brought this year.",target:[[18,22]],spot:"Tap the phrase that shows <em>anticipation becoming a public spectacle</em>.",tech:"imagery",opts:["imagery","simile","repetition","tone"],mut:{tone:"Before daybreak the crowds would form, long lines of children and adults both, each one clutching his or her dollar.",simile:"The crowds formed like ants around the exhibit.",repetition:"Crowds formed, crowds waited, crowds wondered."},roast:{tone:"Tone is the feeling of the passage. This answer needs the concrete details that make the feeling visible.",simile:"There is no comparison using like or as in the target phrase.",repetition:"The power here comes from a picture of the queue, not repeated words."},slotA:{q:"Why do “clutching” and “wonderment” matter?",opts:[{t:"They make the crowd’s excitement physical and easy to picture",ok:true},{t:"They prove the crowd is being compared to animals",ok:false,why:"No comparison is made in this phrase."},{t:"They show that every visitor is frightened",ok:false,why:"The feeling is wonder, not fear."}]},slotB:{q:"What does that picture make us question?",opts:[{t:"Whether curiosity has already become a kind of consumption",ok:true},{t:"Whether the Professor has arrived before daybreak",ok:false,why:"That is a detail, not the effect."},{t:"Whether the creatures are definitely dangerous",ok:false,why:"The crowd’s behaviour tells us more about the humans."}]}},

    {act:1,lead:"Spot the performance around the science.",text:"wearing his many-colored rainbow cape and top hat",target:[[3,9]],spot:"Tap the costume that turns Professor Hugo into a <em>showman</em>.",tech:"visual imagery",opts:["visual imagery","understatement","repetition","foreshadowing"],mut:{understatement:"wearing his many-colored rainbow cape and top hat",repetition:"cape and top hat, cape and top hat",foreshadowing:"wearing his many-colored rainbow cape and top hat"},roast:{understatement:"A rainbow cape and top hat are conspicuous, not understated.",repetition:"The phrase is memorable because of the image, not because it repeats.",foreshadowing:"This target presents Hugo now; it does not hint at a later event by itself."},slotA:{q:"How does the costume shape our view of Hugo?",opts:[{t:"It makes discovery look like entertainment and salesmanship",ok:true},{t:"It makes him seem invisible",ok:false,why:"The costume makes him conspicuous."},{t:"It proves he is a magician",ok:false,why:"The story gives him a theatrical look, not magic powers."}]},slotB:{q:"Why does that matter in this story?",opts:[{t:"It prepares us to notice how the zoo turns wonder into a show",ok:true},{t:"It explains exactly how the spaceship works",ok:false,why:"The costume reveals character, not technology."},{t:"It tells us what the creatures think of Earth",ok:false,why:"That viewpoint arrives later."}]}},

    {act:2,lead:"Read the price tag as a clue.",text:"This is certainly worth a dollar",target:[[0,5]],spot:"Tap the phrase that makes an extraordinary event sound like <em>ordinary value for money</em>.",tech:"irony",opts:["irony","simile","imagery","personification"],mut:{simile:"This is certainly worth a dollar, like a fairground ride.",imagery:"This is certainly worth a dollar.",personification:"This is certainly worth a dollar."},roast:{simile:"There is no comparison in the original line.",imagery:"The line is an evaluation, not a sensory picture.",personification:"Nothing non-human is being given human behaviour here. The irony is in the mismatch between price and event."},slotA:{q:"Where is the mismatch?",opts:[{t:"A visit to another planet’s creatures is judged by a cheap everyday price",ok:true},{t:"The dollar is too expensive for the crowd",ok:false,why:"The line says the price is worth it."},{t:"The creatures are actually ordinary",ok:false,why:"Their extraordinariness is the point."}]},slotB:{q:"What does the irony expose?",opts:[{t:"The humans’ habit of turning wonder into a transaction",ok:true},{t:"The Professor’s lack of imagination",ok:false,why:"His show is imaginative; the criticism is aimed at the transaction."},{t:"The creatures’ dislike of money",ok:false,why:"We are still in the human viewpoint."}]}},
    {act:2,lead:"One number can make a crowd feel enormous.",text:"ten thousand people had filed by the barred cages",target:[[0,1]],spot:"Tap the detail that enlarges the event beyond one family’s day out.",tech:"hyperbole",opts:["hyperbole","metaphor","dialogue","foreshadowing"],mut:{metaphor:"ten thousand people had filed by the barred cages, a river of faces",dialogue:"“Ten thousand people had filed by the barred cages,” someone said.",foreshadowing:"ten thousand people had filed by the barred cages"},roast:{metaphor:"The number is not an image comparing two things; it enlarges the scale directly.",dialogue:"No one is speaking in this phrase. It is narration.",foreshadowing:"The crowd’s size does not itself predict the ending."},slotA:{q:"What does the number do to the scene?",opts:[{t:"It makes the zoo feel like a major public event",ok:true},{t:"It proves every person enjoyed the visit",ok:false,why:"Size and enjoyment are not the same thing."},{t:"It makes the cages disappear",ok:false,why:"The cages remain central."}]},slotB:{q:"Why pair a huge crowd with barred cages?",opts:[{t:"The excitement and confinement sit uncomfortably beside each other",ok:true},{t:"To show the crowd is trapped inside the cages",ok:false,why:"The crowd is outside; the creatures are inside."},{t:"To make the setting peaceful",ok:false,why:"A huge crowd is not peaceful by default."}]}},

    {act:3,lead:"Let the alien voice describe us.",text:"The creatures there wear garments over skins, and they walk on two legs.",target:[[1,12]],spot:"Tap the description that makes ordinary humans sound like an exhibit.",tech:"irony",opts:["irony","simile","hyperbole","onomatopoeia"],mut:{simile:"The creatures there wear garments over skins, like painted figures.",hyperbole:"The creatures there wear a thousand garments over skins.",onomatopoeia:"The creatures there wear garments over skins — rustle, rustle."},roast:{simile:"The alien description does not compare humans to something else here.",hyperbole:"The sentence is strange because it is calm and literal, not exaggerated.",onomatopoeia:"No sound is being imitated. The irony comes from the viewpoint."},slotA:{q:"Why does the description sound funny?",opts:[{t:"It uses detached alien language for things humans consider normal",ok:true},{t:"It uses a joke about fashion",ok:false,why:"Clothing is only strange because of the viewpoint."},{t:"It exaggerates how humans walk",ok:false,why:"The statement is calm and matter-of-fact."}]},slotB:{q:"What does the irony make us do?",opts:[{t:"See our own habits as strange enough to be displayed",ok:true},{t:"Forget the humans are being observed",ok:false,why:"Observation is exactly what the reversal foregrounds."},{t:"Decide the aliens are less intelligent",ok:false,why:"The language makes the humans look limited, not the aliens."}]}},

    {act:1,lead:"A tiny sentence can carry a huge loss.",text:"And the trees all died.",target:[[0,4]],spot:"Tap the blunt sentence that reports disaster without drama.",tech:"understatement",opts:["understatement","hyperbole","simile","dialogue"],mut:{hyperbole:"And the trees all died, every tree in the whole world.",simile:"And the trees all died like soldiers on a battlefield.",dialogue:"“And the trees all died,” I told the class."},roast:{hyperbole:"The original is deliberately small in scale and emotion.",simile:"There is no comparison in the sentence.",dialogue:"The narrator reports; no one speaks in this line."},slotA:{q:"What does the short sentence refuse to do?",opts:[{t:"It refuses to explain or decorate the death",ok:true},{t:"It refuses to tell us that anything happened",ok:false,why:"It states the event clearly."},{t:"It makes the trees sound cheerful",ok:false,why:"The flatness is not cheerfulness."}]},slotB:{q:"What effect does that create?",opts:[{t:"The calm delivery makes the loss feel more disturbing",ok:true},{t:"It makes the event feel unimportant",ok:false,why:"The lack of emotion can make readers supply their own response."},{t:"It turns the scene into a celebration",ok:false,why:"Nothing celebrates the deaths."}]}},
    {act:1,lead:"Put the children’s view beside the adult label.",text:"All these kids looking at these little brown sticks, it was depressing.",target:[[5,10]],spot:"Tap the ordinary image that makes the dead trees feel personal.",tech:"visual imagery",opts:["visual imagery","metaphor","repetition","irony"],mut:{metaphor:"All these kids looking at these little brown sticks, the school was a graveyard.",repetition:"All these kids looking, looking, looking at these little brown sticks.",irony:"All these kids looking at these little brown sticks, it was hilarious."},roast:{metaphor:"The original gives us a concrete picture rather than a comparison.",repetition:"The repeated “these” points the camera at the scene; it is not a repeated action pattern.",irony:"The word “depressing” is direct rather than a reversal of meaning."},slotA:{q:"Why call the branches “little brown sticks”?",opts:[{t:"It shows how the children’s familiar trees have been reduced to lifeless objects",ok:true},{t:"It proves the trees were always tiny",ok:false,why:"The description is about what remains, not their original size."},{t:"It makes the children sound expert",ok:false,why:"The phrase is simple and child-facing."}]},slotB:{q:"How does the image support the deadpan tone?",opts:[{t:"It is concrete and sad, but the narrator states it almost casually",ok:true},{t:"It adds a magical forest setting",ok:false,why:"The image strips the setting back rather than making it magical."},{t:"It turns the trees into characters who can speak",ok:false,why:"They remain objects in the children’s view."}]}},
    {act:1,lead:"Listen for the tidy explanation.",text:"With the herb gardens it was probably a case of overwatering",target:[[7,12]],spot:"Tap the phrase that makes another death sound like a manageable mistake.",tech:"euphemism",opts:["euphemism","hyperbole","simile","onomatopoeia"],mut:{hyperbole:"With the herb gardens it was certainly the most catastrophic watering disaster ever.",simile:"With the herb gardens it was like overwatering a whole world.",onomatopoeia:"With the herb gardens it was splash, splash, splash."},roast:{hyperbole:"The teacher chooses a cautious, ordinary explanation, not an extreme one.",simile:"There is no direct comparison here.",onomatopoeia:"No sound is being imitated. The effect comes from the polite wording."},slotA:{q:"Why does “probably a case of” matter?",opts:[{t:"It softens uncertainty and makes a disturbing loss sound administrative",ok:true},{t:"It proves the teacher investigated carefully",ok:false,why:"“Probably” signals that he does not really know."},{t:"It makes the garden sound enormous",ok:false,why:"The phrase reduces the drama."}]},slotB:{q:"What does this reveal about the narrator?",opts:[{t:"He reaches for ordinary explanations even when they do not satisfy the class",ok:true},{t:"He has solved every mystery",ok:false,why:"The word “probably” leaves uncertainty."},{t:"He wants to frighten the children",ok:false,why:"His language tries to manage fear."}]}},
    {act:1,lead:"Make the list feel like a pattern.",text:"And finally the tragedy.",target:[[0,3]],spot:"Tap the phrase that suddenly upgrades the catalogue of deaths.",tech:"tone shift",opts:["tone shift","simile","alliteration","personification"],mut:{simile:"And finally the tragedy, like a storm breaking over the school.",alliteration:"And finally the terrible tragedy.",personification:"And finally the tragedy knocked on the door."},roast:{simile:"The line does not compare the tragedy to another thing.",alliteration:"The sound pattern is not what changes the mood.",personification:"The tragedy is named, not made into a person."},slotA:{q:"Why is “finally” important?",opts:[{t:"It makes the losses feel like a sequence that has reached a new level",ok:true},{t:"It proves nothing else can happen",ok:false,why:"The story continues to surprise us."},{t:"It makes the narrator forget the earlier deaths",ok:false,why:"The word gathers them into a sequence."}]},slotB:{q:"Why is the single word “tragedy” so strange here?",opts:[{t:"It suddenly gives formal weight to the narrator’s flat list",ok:true},{t:"It makes the sentence cheerful",ok:false,why:"The word is serious, not cheerful."},{t:"It explains exactly why everyone died",ok:false,why:"It labels the event but does not explain it."}]}},
    {act:2,lead:"Let the children’s question break the calm.",text:"We weren't even supposed to have a puppy.",target:[[0,6]],spot:"Tap the line that makes the puppy’s death feel unfair before it feels philosophical.",tech:"irony",opts:["irony","metaphor","catalogue","alliteration"],mut:{metaphor:"We weren't even supposed to have a puppy, a small storm of fur.",catalogue:"We weren't even supposed to have a puppy, a kitten, a bird or a fish.",alliteration:"We weren't even supposed to have a precious puppy."},roast:{metaphor:"The line’s force comes from the contradiction, not an image.",catalogue:"It focuses on one puppy rather than a list.",alliteration:"Repeated sounds are not the main source of meaning."},slotA:{q:"Where is the irony?",opts:[{t:"The class is punished by losing something they were not meant to have anyway",ok:true},{t:"The puppy is secretly still alive",ok:false,why:"The line does not say that."},{t:"The children never wanted the puppy",ok:false,why:"The wording shows attachment and unfairness."}]},slotB:{q:"What does the line add to the wider story?",opts:[{t:"It shows that grief does not wait for events to be officially permitted",ok:true},{t:"It proves rules prevent sadness",ok:false,why:"The loss hurts despite the rule."},{t:"It changes the story into a realistic pet-care guide",ok:false,why:"The absurd pattern continues."}]}},
    {act:2,lead:"Catch the prediction hiding inside the joke.",text:"Oh Christ, I bet it will live for about two weeks and then ...",target:[[4,16]],spot:"Tap the unfinished prediction that turns a new pet into a future loss.",tech:"foreshadowing",opts:["foreshadowing","simile","hyperbole","dialogue"],mut:{simile:"I bet it will live for about two weeks like a candle in the wind.",hyperbole:"I bet it will live for two seconds and then explode.",dialogue:"“I bet it will live,” I said, “for about two weeks.”"},roast:{simile:"The line does not compare the pet to something else.",hyperbole:"The prediction is grimly ordinary, not wildly exaggerated.",dialogue:"The words are reported in the flow of narration; the key effect is what they predict."},slotA:{q:"What is being foreshadowed?",opts:[{t:"The children expect the new life to be followed by another death",ok:true},{t:"The puppy will become a teacher",ok:false,why:"The line predicts an ending, not a career."},{t:"The class will leave school in two weeks",ok:false,why:"The time limit is attached to the puppy’s life."}]},slotB:{q:"Why is the unfinished “then ...” effective?",opts:[{t:"It lets the children and reader complete the grim thought",ok:true},{t:"It proves the speaker has forgotten the sentence",ok:false,why:"The pause is meaningful, not accidental."},{t:"It makes the future sound guaranteed to be happy",ok:false,why:"The surrounding pattern makes the future ominous."}]}},
    {act:2,lead:"Sometimes the narrator names the game.",text:"They enjoyed the ambiguity. I enjoyed it myself.",target:[[0,8]],spot:"Tap the admission that the story’s uncertainty is part of the pleasure.",tech:"ambiguity",opts:["ambiguity","simile","onomatopoeia","hyperbole"],mut:{simile:"They enjoyed the ambiguity like children at a magic show.",onomatopoeia:"They enjoyed the ambiguity — hmm, hmm.",hyperbole:"They enjoyed the ambiguity more than anything in the universe."},roast:{simile:"No comparison is needed; the point is that the meaning stays open.",onomatopoeia:"There is no sound effect here.",hyperbole:"The statement is controlled, not exaggerated."},slotA:{q:"What is ambiguous?",opts:[{t:"The children’s questions and the teacher’s answers can carry more than one meaning",ok:true},{t:"The names of all the characters are missing",ok:false,why:"The ambiguity is about ideas and explanations."},{t:"The story has no setting at all",ok:false,why:"The school setting is clear."}]},slotB:{q:"Why does the narrator admit enjoying it?",opts:[{t:"It makes him part of the story’s playful uncertainty rather than a secure authority",ok:true},{t:"It proves he does not care about the children",ok:false,why:"Enjoying ambiguity is not the same as lacking care."},{t:"It gives one final correct answer",ok:false,why:"Ambiguity keeps answers open."}]}},
    {act:2,lead:"Find the polite phrase that hides a hard action.",text:"I gave it to the custodian.",target:[[0,5]],spot:"Tap the small sentence that skips over a child’s loss.",tech:"euphemism",opts:["euphemism","metaphor","repetition","rhetorical question"],mut:{metaphor:"I gave it to the custodian, a door closing on the classroom.",repetition:"I gave it to the custodian. I gave it away. I gave it away.","rhetorical question":"What else could I do but give it to the custodian?"},roast:{metaphor:"The original does not build a comparison.",repetition:"The single sentence suppresses repetition; that restraint is the point.","rhetorical question":"The line avoids a question instead of asking one."},slotA:{q:"What does “gave it” conceal?",opts:[{t:"The emotional and practical decision to remove a living thing from the class",ok:true},{t:"The custodian receiving a present from the teacher",ok:false,why:"The context makes the phrase sound deliberately mild."},{t:"The teacher explaining every detail",ok:false,why:"The sentence withholds detail."}]},slotB:{q:"Why does the euphemism fit the narrator’s voice?",opts:[{t:"He keeps using tidy language to survive an untidy sequence of losses",ok:true},{t:"He is always completely honest about feelings",ok:false,why:"His voice often avoids direct emotion."},{t:"He wants to turn the custodian into a villain",ok:false,why:"The custodian is not blamed here."}]}},
    {act:3,lead:"A repeated phrase can sound like a mind stuck in place.",text:"I don't know, I don't know.",target:[[0,5]],spot:"Tap the repetition that shows the teacher’s certainty collapsing.",tech:"repetition",opts:["repetition","simile","metaphor","catalogue"],mut:{simile:"I don't know, like a boat without a compass.",metaphor:"I don't know; my answer is a locked door.",catalogue:"I don't know death, life, meaning or value."},roast:{simile:"There is no comparison in the repeated phrase.",metaphor:"The line does not turn the uncertainty into an image.",catalogue:"The same words repeat; this is not a list."},slotA:{q:"What does repeating “I don’t know” show?",opts:[{t:"The teacher cannot keep his role as the person with every answer",ok:true},{t:"The teacher is making a confident announcement",ok:false,why:"The repetition signals uncertainty."},{t:"The teacher is listing the class rules",ok:false,why:"No rules are listed."}]},slotB:{q:"Why might the children need to hear this?",opts:[{t:"It makes the adults’ uncertainty visible instead of pretending death is easily explained",ok:true},{t:"It proves nobody in the room is listening",ok:false,why:"The children are listening intensely."},{t:"It solves their fear immediately",ok:false,why:"The fear remains."}]}},
    {act:3,lead:"The class asks for a meaning they can stand on.",text:"we require an assertion of value, we are frightened.",target:[[3,9]],spot:"Tap the demand that turns fear into a formal, almost official phrase.",tech:"juxtaposition",opts:["juxtaposition","simile","personification","onomatopoeia"],mut:{simile:"we require an assertion of value, like a ladder in the dark, we are frightened.",personification:"we require an assertion of value; value must speak to us, we are frightened.",onomatopoeia:"we require an assertion of value — ah! — we are frightened."},roast:{simile:"The phrase does not use a comparison; its power comes from the mismatch of registers.",personification:"Value is not made to act like a person here.",onomatopoeia:"There is no imitated sound. The formal wording is the key."},slotA:{q:"What is being placed side by side?",opts:[{t:"Formal, abstract language and the raw statement “we are frightened”",ok:true},{t:"Two characters arguing about a school rule",ok:false,why:"The contrast is between language styles and emotion."},{t:"A sound and a colour",ok:false,why:"No sensory comparison is being made."}]},slotB:{q:"Why does that contrast matter?",opts:[{t:"It shows that clever language cannot fully protect the children from fear",ok:true},{t:"It proves the children are not frightened",ok:false,why:"The sentence states the opposite."},{t:"It turns fear into a solved problem",ok:false,why:"The demand has not yet been satisfied."}]}},
    {act:3,lead:"Now read the ending as a tonal collision.",text:"And the new gerbil walked in. The children cheered wildly.",target:[[0,11]],spot:"Tap the sudden arrival and celebration that interrupt the death story.",tech:"juxtaposition",opts:["juxtaposition","metaphor","understatement","alliteration"],mut:{metaphor:"And the new gerbil walked in, a small sun in the room.",understatement:"And the new gerbil walked in. The children gave a small, polite clap.",alliteration:"And the new gerbil gently got going."},roast:{metaphor:"The gerbil is not compared to another object in the original.",understatement:"“Cheered wildly” is the opposite of an understated reaction.",alliteration:"The ending’s force comes from the sudden contrast, not repeated starting sounds."},slotA:{q:"What is juxtaposed?",opts:[{t:"The class’s recent deaths and the wildly joyful arrival of new life",ok:true},{t:"Two identical descriptions of the gerbil",ok:false,why:"The sentences change the emotional direction."},{t:"The teacher’s speech and a scientific report",ok:false,why:"The main contrast is grief and celebration."}]},slotB:{q:"Why is the ending more than just a joke?",opts:[{t:"It suggests that meaning may come from continuing to care for fragile life",ok:true},{t:"It proves the earlier deaths never mattered",ok:false,why:"The joy does not erase the losses."},{t:"It gives the teacher a perfect explanation",ok:false,why:"The class receives an event, not a theory."}]}}
    ,
    {act:3,lead:"The smallest life can carry the largest answer.",text:"life gives meaning to life",target:[[0,4]],spot:"Tap the repeated word that turns the teacher’s answer into a compact assertion.",tech:"repetition",opts:["repetition","simile","hyperbole","dialogue"],mut:{simile:"life gives meaning to life like a lamp in a dark room",hyperbole:"life gives every possible meaning to all life",dialogue:"“Life gives meaning to life,” I announced."},roast:{simile:"There is no comparison here; the force comes from the repeated word.",hyperbole:"The sentence is compact rather than exaggerated.",dialogue:"The line is reported as an idea, not staged as a full exchange."},slotA:{q:"What does repeating “life” do?",opts:[{t:"It makes the answer sound circular but also insists that living matters",ok:true},{t:"It makes the answer scientific and measurable",ok:false,why:"The sentence is philosophical, not scientific."},{t:"It proves the teacher has solved every question",ok:false,why:"The circular wording leaves room for doubt."}]},slotB:{q:"Why does the gerbil make this answer feel less empty?",opts:[{t:"A real, fragile life has just entered the room for the class to care about",ok:true},{t:"The gerbil explains death in a lecture",ok:false,why:"It offers an experience, not an explanation."},{t:"The gerbil makes all earlier losses disappear",ok:false,why:"New life does not erase grief."}]}}
  ],
  end:{lines:["The school cannot explain death. It can still cheer when life walks in.","Absurdity is not the absence of feeling; it is a strange way of showing feeling."] ,qs:["Which loss changes the class most?", "Does the gerbil solve the children’s question or only interrupt it?", "Where does the deadpan voice make the story funnier — and sadder?"],verdicts:["You tracked the story’s tonal collisions.","You explained how structure creates meaning.","You can now discuss absurdity without treating it as random."]}

  title:"Eleven",short:"Eleven",author:"Sandra Cisneros",year:"1991",words:"12 rounds · voice, metaphor & power",
  hook:"Rachel turns eleven — but every younger self comes to school with her.",
  pitch:"Rachel’s voice moves between sharp observation, memory and helplessness. Annotate the comparisons and repetitions that show how age, power and embarrassment collide.",
  read:{url:"https://sylscorner.netlify.app/lessons/5si/unit-1/Short%20Stories/eleven.pdf",kind:"full story, PDF"},
  pd:"Use this pack to track first-person voice, simile, metaphor, repetition and emotional perspective.",
  acts:{
    1:{sub:"ACT 1 · ALL THE AGES INSIDE",title:"Eleven is not just eleven",blurb:["Rachel explains that growing older does not erase the younger selves underneath.","Track the images she uses to make age feel physical and crowded."]},
    2:{sub:"ACT 2 · THE RED SWEATER",title:"A public mistake",blurb:["A teacher’s assumption becomes a whole-class humiliation.","Notice how Rachel’s voice shrinks, repeats and moves backwards through the ages."]},

  items:[
    {act:1,lead:"Age becomes something you can carry.",text:"when you’re eleven, you’re also ten, and nine, and eight, and seven, and six, and five, and four, and three, and two, and one.",target:[[2,21]],spot:"Tap the chain of younger ages that makes growing up feel <em>layered rather than replacing</em>.",tech:"repetition",opts:["repetition","simile","irony","onomatopoeia"],mut:{simile:"when you’re eleven, you’re also ten, like a stack of old photographs",irony:"when you’re eleven, you’re also ten, but none of those ages are real",onomatopoeia:"when you’re eleven — tap, tap, tap — you’re also ten"},roast:{simile:"The comparison comes later; this line works through its repeated sequence.",irony:"There is no reversal of meaning here; the list develops a serious idea.",onomatopoeia:"No sound word creates the effect. The ages accumulate."},slotA:{q:"What does the repeated age-list suggest?",opts:[{t:"Older Rachel still contains the feelings and needs of younger Rachel",ok:true},{t:"Rachel forgets how old she is",ok:false,why:"She is deliberately counting the ages inside her."},{t:"Rachel wants to become younger immediately",ok:false,why:"The list explains identity before the sweater incident."}]},slotB:{q:"Why use a list instead of one sentence saying “I remember being younger”?",opts:[{t:"The list makes the past feel crowded and present inside her",ok:true},{t:"It makes the story sound like a maths lesson",ok:false,why:"The counting is emotional, not mathematical."},{t:"It proves every age feels exactly the same",ok:false,why:"The list shows coexistence, not sameness."}]}},
    {act:1,lead:"Find the everyday comparisons doing big work.",text:"kind of like an onion or like the rings inside a tree trunk or like my little wooden dolls",target:[[3,23]],spot:"Tap the comparisons Rachel uses to picture the layers of a person.",tech:"simile",opts:["simile","metaphor","personification","hyperbole"],mut:{metaphor:"I am an onion with rings inside me.",personification:"The rings inside a tree trunk remember every year for me.",hyperbole:"I have a million ages stacked inside me."},roast:{metaphor:"The line openly uses “like”, so it is a simile rather than a hidden comparison.",personification:"The objects are not acting like people; they are examples Rachel compares herself to.",hyperbole:"The images are precise and familiar, not exaggerated for scale."},slotA:{q:"Why are these similes effective for a Year 11?",opts:[{t:"They turn an invisible feeling about growing up into objects she can picture",ok:true},{t:"They make Rachel sound older than everyone else",ok:false,why:"The images make the feeling accessible, not superior."},{t:"They show Rachel wants to eat an onion",ok:false,why:"The onion is a comparison, not a wish."}]},slotB:{q:"What connects the onion, tree and dolls?",opts:[{t:"Each has layers or smaller selves held inside a larger shape",ok:true},{t:"Each is found in the classroom",ok:false,why:"They come from Rachel’s imaginative explanation."},{t:"Each is a symbol of being perfect",ok:false,why:"They show complexity, not perfection."}]}},
    {act:1,lead:"Make the inner noise audible.",text:"eleven years rattling inside me like pennies in a tin Band-Aid box.",target:[[2,13]],spot:"Tap the comparison that makes Rachel’s age feel noisy and trapped.",tech:"simile",opts:["simile","metaphor","repetition","understatement"],mut:{metaphor:"Eleven years are pennies in a tin Band-Aid box.",repetition:"eleven years rattling, rattling, rattling inside me",understatement:"eleven years sitting quietly inside me like pennies in a tin Band-Aid box"},roast:{metaphor:"The word “like” makes the comparison explicit: this is a simile.",repetition:"“Rattling” is not repeated; its sound-image does the work.",understatement:"Rattling pennies suggest disturbance, not quiet restraint."},slotA:{q:"What does “rattling” add to the image?",opts:[{t:"It makes the ages feel jumbled, noisy and difficult to settle",ok:true},{t:"It makes the ages sound perfectly organised",ok:false,why:"Rattling suggests movement and disorder."},{t:"It makes Rachel feel silent and invisible",ok:false,why:"The inner feeling is loud even when she cannot speak."}]},slotB:{q:"Why a Band-Aid box?",opts:[{t:"It combines something ordinary and childlike with the discomfort of an old hurt",ok:true},{t:"It proves Rachel is injured in the scene",ok:false,why:"The box is part of the comparison."},{t:"It makes the teacher seem kind",ok:false,why:"The image belongs to Rachel’s inner voice."}]}},
    {act:1,lead:"One object can become a whole landscape.",text:"a big red mountain",target:[[1,3]],spot:"Tap the description that makes the sweater seem too large to ignore.",tech:"metaphor",opts:["metaphor","simile","dialogue","repetition"],mut:{simile:"a big red mountain, like a wall in front of me",dialogue:"“A big red mountain,” I thought.",repetition:"a big red mountain, a big red mountain, a big red mountain"},roast:{simile:"There is no “like” or “as” in the original; the sweater is directly turned into a mountain.",dialogue:"The phrase is Rachel’s description, not spoken dialogue.",repetition:"The size comes from the metaphor and adjectives, not repeated wording."},slotA:{q:"What does the mountain metaphor suggest?",opts:[{t:"The sweater becomes an obstacle Rachel cannot get around",ok:true},{t:"The sweater is natural and peaceful",ok:false,why:"A mountain can be imposing; Rachel feels blocked by it."},{t:"Rachel wants to climb the sweater",ok:false,why:"The metaphor shows humiliation, not adventure."}]},slotB:{q:"Why red?",opts:[{t:"It makes the object visually loud and impossible for Rachel to hide inside the class",ok:true},{t:"It proves Rachel likes bright colours",ok:false,why:"The colour is about exposure in this moment."},{t:"It makes the sweater invisible",ok:false,why:"Red draws attention."}]}},
    {act:2,lead:"Hear the protest become smaller.",text:"Not mine, not mine, not mine.",target:[[0,6]],spot:"Tap the repeated denial that shows Rachel trying to push the sweater away.",tech:"repetition",opts:["repetition","metaphor","simile","catalogue"],mut:{metaphor:"Not mine — this sweater is a locked cage.",simile:"Not mine, not mine, not mine, like a bell in my head.",catalogue:"Not mine, not yours, not hers, not anyone’s."},roast:{metaphor:"The original does not turn the sweater into another object.",simile:"There is no comparison; the force is in the repeated denial.",catalogue:"The same short phrase repeats rather than expanding into a list of owners."},slotA:{q:"What does the repetition sound like?",opts:[{t:"A desperate attempt to make an adult believe what Rachel knows",ok:true},{t:"A calm legal statement",ok:false,why:"The repeated phrase is emotional and urgent."},{t:"A description of the sweater’s colour",ok:false,why:"It is about ownership and protest."}]},slotB:{q:"Why does repetition matter when Mrs Price ignores it?",opts:[{t:"It shows that Rachel’s voice is present but powerless in the room",ok:true},{t:"It proves Rachel has control of the class",ok:false,why:"The adult controls the decision."},{t:"It makes the sweater more beautiful",ok:false,why:"The repetition intensifies distress."}]}},
    {act:2,lead:"Let a younger self take over the sentence.",text:"that’s the part of me that’s three wants to come out of my eyes",target:[[2,12]],spot:"Tap the younger self that Rachel says is trying to escape through tears.",tech:"personification",opts:["personification","simile","hyperbole","alliteration"],mut:{simile:"that’s the part of me that’s three, like a small child behind my eyes",hyperbole:"that’s the part of me that’s three, screaming louder than the whole school",alliteration:"that’s the part of me that’s three, trembling through tears"},roast:{simile:"The original does not use “like”; it gives the younger self an action.",hyperbole:"The feeling is intense, but the sentence focuses on one younger self rather than a huge exaggeration.",alliteration:"Repeated starting sounds are not the main effect."},slotA:{q:"How is the three-year-old self personified?",opts:[{t:"It is given a desire to come out, as if it were a separate child inside Rachel",ok:true},{t:"It is compared to a mountain",ok:false,why:"The mountain belongs to another image."},{t:"It is made to speak directly to Mrs Price",ok:false,why:"The younger self is described, not given dialogue."}]},slotB:{q:"What does this reveal about age?",opts:[{t:"Being older does not stop younger feelings from returning under pressure",ok:true},{t:"Rachel has literally become three again",ok:false,why:"The language is figurative and emotional."},{t:"Rachel thinks children never cry",ok:false,why:"She is explaining why she does cry."}]}},
    {act:2,lead:"Find the feeling pushing against the body.",text:"all the years inside of me ... are pushing at the back of my eyes",target:[[0,13]],spot:"Tap the image that makes memory feel physically impossible to contain.",tech:"personification",opts:["personification","simile","dialogue","understatement"],mut:{simile:"all the years inside of me are like a crowd behind my eyes",dialogue:"“All the years inside of me are pushing,” I tell myself.",understatement:"all the years inside of me are resting quietly at the back of my eyes"},roast:{simile:"The original gives the years an action rather than using “like”.",dialogue:"The line is internal narration, not speech to another character.",understatement:"Pushing is forceful and uncomfortable, not quiet or reduced."},slotA:{q:"What does the personification make visible?",opts:[{t:"Rachel’s memories and ages seem to press towards tears",ok:true},{t:"The years are shown as a real crowd in the classroom",ok:false,why:"The crowd is an image for inner pressure."},{t:"The teacher is physically pushing Rachel",ok:false,why:"The pressure is emotional and internal."}]},slotB:{q:"Why is “at the back of my eyes” precise?",opts:[{t:"It connects the abstract years to the physical place where tears are held",ok:true},{t:"It proves Rachel has hurt her eyes",ok:false,why:"The phrase describes emotion, not injury."},{t:"It makes the memory seem far away and irrelevant",ok:false,why:"The pressure makes it immediate."}]}},
    {act:2,lead:"Notice the voice slipping backwards.",text:"I finally say in a little voice that was maybe me when I was four.",target:[[5,17]],spot:"Tap the phrase that shows Rachel speaking from a younger version of herself.",tech:"first-person narration",opts:["first-person narration","metaphor","simile","onomatopoeia"],mut:{metaphor:"I finally say in a little voice, a tiny bird trapped in my throat.",simile:"I finally say in a little voice like a four-year-old’s whisper.",onomatopoeia:"I finally say in a little voice — squeak — that was maybe me when I was four."},roast:{metaphor:"The original does not create an object-image; it directly locates the voice in Rachel’s memory.",simile:"The phrase does not use “like”; it identifies a remembered self.",onomatopoeia:"No sound is imitated. The important evidence is “me when I was four”."},slotA:{q:"Why call the voice “maybe me when I was four”?",opts:[{t:"It shows the humiliation has made Rachel feel younger and less powerful",ok:true},{t:"It proves Rachel has forgotten her birthday",ok:false,why:"Her age is not the problem; her confidence is."},{t:"It makes the teacher sound four years old",ok:false,why:"The voice belongs to Rachel."}]},slotB:{q:"What does first-person narration let us hear?",opts:[{t:"The gap between what Rachel thinks and what she can actually say aloud",ok:true},{t:"The teacher’s private thoughts",ok:false,why:"The story stays close to Rachel’s experience."},{t:"An objective report with no emotion",ok:false,why:"The “I” gives us intimate emotion."}]}},
