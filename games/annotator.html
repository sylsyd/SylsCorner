<script src="annotator-leaderboard.js"></script>
<script>
/* ================= engine ================= */
const $=s=>document.querySelector(s);
const stage=$('#stage'),timer=$('#timer'),timerwrap=$('#timerwrap'),stamp=$('#stamp'),overlay=$('#overlay');

let ST=null, KEY=null;
let onlineStarted=0;
let S={i:0,score:0,chain:0,mult:1,muted:false,paused:false,results:[],res:null};
let tEnd=0,tDur=0,tRaf=null,onTimeout=null;

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function beep(f,d,type,vol){
  if(S.muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.06,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.1));
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.1));
}
function sGood(){beep(660,.07);setTimeout(()=>beep(990,.09),70)}
function sChain(){beep(660,.06);setTimeout(()=>beep(880,.06),60);setTimeout(()=>beep(1320,.14),120)}
function sBad(){beep(150,.22,'sawtooth',.09);setTimeout(()=>beep(110,.28,'sawtooth',.08),90)}
function sTick(){beep(1400,.02,'sine',.03)}
function sFreeze(){beep(420,.5,'sine',.05)}

function say(txt,red){
  stamp.textContent=txt;stamp.className=red?'red':'';
  void stamp.offsetWidth; stamp.classList.add('go');
  if(red){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),320)}
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function startTimer(ms,cb){
  stopTimer(); tDur=ms; tEnd=performance.now()+ms; onTimeout=cb;
  timerwrap.style.opacity='1';
  let lastTick=6;
  (function loop(){
    if(S.paused){tRaf=requestAnimationFrame(loop);return}
    const left=tEnd-performance.now(), r=Math.max(0,left/tDur);
    timer.style.transform='scaleX('+r+')';
    timer.className = r<.28?'hot':(r<.55?'pink':'');
    const secs=Math.ceil(left/1000);
    if(secs<=3&&secs!==lastTick&&secs>0){lastTick=secs;sTick()}
    if(left<=0){timer.style.transform='scaleX(0)';const f=onTimeout;onTimeout=null;if(f)f();return}
    tRaf=requestAnimationFrame(loop);
  })();
}
function stopTimer(){if(tRaf)cancelAnimationFrame(tRaf);tRaf=null;onTimeout=null;timer.style.transform='scaleX(0)';timer.className=''}
function hideTimer(){stopTimer();timerwrap.style.opacity='.15'}

function hud(){
  $('#hscore').textContent=S.score.toLocaleString();
  $('#htext').textContent=ST?ST.short.toUpperCase():'—';
  const c=$('#chain');
  c.textContent='CHAIN x'+(S.mult%1?S.mult.toFixed(1):S.mult);
  c.classList.toggle('on',S.mult>1);
}
function addScore(n){S.score+=Math.round(n*S.mult);hud()}
function bumpChain(){S.chain++;S.mult=Math.min(3,1+Math.min(S.chain,4)*.5);hud();if(S.chain===2||S.chain===4)say(pick(ANNOUNCER.chain))}
function breakChain(){S.chain=0;S.mult=1;hud()}

function tokens(t){return t.split(' ')}
function inTarget(it,i){return it.target.some(r=>i>=r[0]&&i<=r[1])}
function renderPassage(it,o){
  o=o||{};
  const ws=tokens(it.text).map((w,i)=>{
    const cls=['w']; if(o.lit&&inTarget(it,i))cls.push('lit');
    return '<span class="'+cls.join(' ')+'" data-i="'+i+'">'+esc(w)+'</span>';
  }).join(' ');
  return '<p class="passage'+(o.locked?' locked':'')+'" id="psg">'+ws+'</p>';
}
function litTarget(it){document.querySelectorAll('#psg .w').forEach(el=>{if(inTarget(it,+el.dataset.i))el.classList.add('lit')})}
function setStoryClass(){
  document.body.className=document.body.className.replace(/\bs-\w+/g,'').trim();
  if(KEY)document.body.classList.add('s-'+KEY);
}

/* ============ 1 : SPOT ============ */
function roundSpot(){
  stage._keys=null;
  const it=ST.items[S.i];
  document.body.classList.toggle('act3',it.act===3);
  document.body.classList.remove('freeze');
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">ACT '+it.act+' &middot; '+(S.i+1)+' OF 12 &middot; SPOT</p>'+
    '<h1 class="instruction">'+it.spot+'</h1>'+
    '<p class="lead">'+it.lead+'</p>'+
    renderPassage(it)+'</div>';
  stage.scrollTop=0;
  let settled=false;
  const done=(ok,el,msg)=>{
    if(settled)return; settled=true;
    stopTimer();
    document.querySelectorAll('#psg .w').forEach(w=>{w.onclick=null});
    document.getElementById('psg').classList.add('locked');
    litTarget(it);
    if(ok){sGood();say(pick(ANNOUNCER.spotGood));addScore(100);S.res.spot=true;setTimeout(roundName,620);return}
    if(el)el.classList.add('bad');
    sBad();say('MISSED',true);breakChain();
    const p=document.createElement('div');p.className='pen';
    p.innerHTML='<div class="who">RED PEN</div><div class="why">'+(msg||'The highlighted words were the ones. Look at them before you name them.')+'</div>';
    stage.querySelector('.sheet').appendChild(p);
    const b=document.createElement('button');b.className='big-btn';b.textContent='NAME IT ANYWAY';
    b.onclick=roundName;p.appendChild(b);b.focus();
  };
  document.querySelectorAll('#psg .w').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i;
      if(inTarget(it,i))return done(true,el);
      if(it.decoy&&i>=it.decoy.range[0]&&i<=it.decoy.range[1])return done(false,el,it.decoy.msg);
      done(false,el);
    };
  });
  if(it.notimer)hideTimer();
  else startTimer(it.act===1?7000:it.act===2?6000:5000,()=>done(false,null,'Out of time. The highlighted words were the ones.'));
}

/* ============ 2 : NAME ============ */
function roundName(){
  const it=ST.items[S.i];
  const opts=shuffle(it.opts);
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">ACT '+it.act+' &middot; '+(S.i+1)+' OF 12 &middot; NAME</p>'+
    '<h1 class="instruction">You found it. Now <em>name</em> it.</h1>'+
    renderPassage(it,{locked:true,lit:true})+
    '<div class="opts" id="opts">'+opts.map((o,n)=>
      '<button class="opt" data-o="'+esc(o)+'"><span class="k">'+(n+1)+'</span>'+esc(o)+'</button>').join('')+'</div></div>';
  stage.scrollTop=0;
  const buttons=[].slice.call(document.querySelectorAll('#opts .opt'));
  const finish=()=>{const b=document.createElement('button');b.className='big-btn';b.textContent='CONTINUE';
    b.onclick=roundEffect;stage.querySelector('.sheet').appendChild(b);b.focus();};
  let answered=false;
  const answer=(choice,el)=>{
    if(answered)return; answered=true;
    stopTimer(); buttons.forEach(b=>{b.disabled=true;if(b!==el)b.classList.add('mute')});
    const half = it.alsoOk && choice===it.alsoOk.k;
    if(choice===it.tech||half){
      if(el)el.classList.add('right'); sGood(); say(pick(ANNOUNCER.nameGood)); addScore(200); S.res.name=true;
      if(half){
        const d=document.createElement('div');d.className='correct-note';
        d.innerHTML='<div class="why">'+it.alsoOk.msg+'</div>';
        stage.querySelector('.sheet').appendChild(d); finish();
      } else setTimeout(roundEffect,560);
      return;
    }
    if(el)el.classList.add('wrong'); sBad(); say(pick(ANNOUNCER.bad),true); breakChain();
    const right=buttons.filter(b=>b.dataset.o===it.tech)[0]; if(right)right.classList.add('right');
    document.querySelectorAll('#psg .w').forEach(w=>{if(inTarget(it,+w.dataset.i)){w.classList.remove('lit');w.classList.add('struck')}});
    const timedout = choice==='__timeout__';
    const mutated = timedout ? it.text : (it.mut[choice]||it.text);
    const why = timedout
      ? 'Clock ran out, so the page marked it for you. It was <b>'+it.tech+'</b>. Say that word to yourself before you move on.'
      : (it.roast[choice]||'');
    const p=document.createElement('div');p.className='pen';
    p.innerHTML='<div class="who">'+(timedout?'TOO SLOW':'SO THE STORY OBEYS YOU:')+'</div>'+
      '<div class="mutated">'+mutated+'</div><div class="why">'+why+'</div>';
    stage.querySelector('.sheet').insertBefore(p,$('#opts'));
    finish();
  };
  buttons.forEach(b=>b.onclick=()=>answer(b.dataset.o,b));
  stage._keys=n=>{if(buttons[n]&&!buttons[n].disabled)buttons[n].click()};
  if(it.notimer)hideTimer();
  else startTimer(it.act===1?6000:it.act===2?5000:4500,()=>answer('__timeout__',null));
}

/* ============ 3 : EFFECT (the freeze) ============ */
function roundEffect(){
  const it=ST.items[S.i];
  hideTimer(); document.body.classList.add('freeze'); sFreeze();
  let A=null,B=null,clean=true;
  const draw=()=>{
    const aTxt=A?'<span class="slot">'+esc(A.t)+'</span>':'<span class="slot empty">xxxxxx</span>';
    const bTxt=B?'<span class="slot">'+esc(B.t)+'</span>':'<span class="slot empty">xxxxxx</span>';
    const active = A? it.slotB : it.slotA;
    const opts = shuffle(active.opts);
    stage.innerHTML='<div class="sheet">'+
      '<p class="freezetag">EVERYTHING STOPS. NO CLOCK.</p>'+
      '<h1 class="instruction">Say what it <em>does</em>.</h1>'+
      '<p class="sub">'+it.tech.toUpperCase()+' &middot; BUILD THE SENTENCE &middot; FIRST TRY IS WORTH 600</p>'+
      '<p class="builder">'+it.slotA.q+' '+aTxt+', '+it.slotB.q+' '+bTxt+'.</p>'+
      '<div class="opts" id="opts">'+opts.map((o,n)=>
        '<button class="opt" data-n="'+n+'"><span class="k">'+(n+1)+'</span>'+esc(o.t)+'</button>').join('')+'</div></div>';
    stage.scrollTop=0;
    const buttons=[].slice.call(document.querySelectorAll('#opts .opt'));
    buttons.forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.n];
      if(o.ok){
        b.classList.add('right');buttons.forEach(x=>x.disabled=true);sGood();
        if(!A){A=o;setTimeout(draw,340)}else{B=o;setTimeout(settle,420)}
      }else{
        clean=false;b.classList.add('wrong');b.disabled=true;sBad();breakChain();
        const old=stage.querySelector('.pen'); if(old)old.remove();
        const d=document.createElement('div');d.className='pen';
        d.innerHTML='<div class="who">NOT THAT ONE</div><div class="why">'+o.why+'</div>';
        stage.querySelector('.sheet').appendChild(d);
      }
    });
    stage._keys=n=>{if(buttons[n]&&!buttons[n].disabled)buttons[n].click()};
  };
  const settle=()=>{
    S.res.eff=true; S.res.clean=clean;
    S.res.sentence=it.slotA.q+' '+A.t+', '+it.slotB.q+' '+B.t+'.';
    if(clean&&S.res.spot&&S.res.name){addScore(600);bumpChain();say(pick(ANNOUNCER.effGood));sChain()}
    else{addScore(clean?600:200);say('LOGGED')}
    itemResult();
  };
  draw();
}

/* ============ item result ============ */
function itemResult(){
  stage._keys=null;
  const it=ST.items[S.i];
  document.body.classList.remove('freeze');
  const full=S.res.spot&&S.res.name&&S.res.clean;
  stage.innerHTML='<div class="sheet">'+
    '<p class="sub">'+(S.i+1)+' OF 12 &middot; '+(full?'FULL CHAIN':'LOGGED')+'</p>'+
    '<h1 class="instruction">'+(full?'That is a whole annotation.':'Annotation saved.')+'</h1>'+
    renderPassage(it,{locked:true,lit:true})+
    '<div class="correct-note"><div class="why"><b>'+it.tech.toUpperCase()+'</b><br>'+esc(S.res.sentence)+'</div></div>'+
    (it.flag?'<div class="callback">'+it.flag+'</div>':'')+'</div>';
  stage.scrollTop=0;
  const b=document.createElement('button');b.className='big-btn';
  const last=S.i===ST.items.length-1;
  const newAct = !last && ST.items[S.i+1].act!==it.act;
  b.textContent= last?'FINISH':(newAct?'NEXT ACT':'NEXT');
  b.onclick=()=>{
    S.results.push(Object.assign({idx:S.i},S.res)); S.i++;
    if(S.i>=ST.items.length)return endCard();
    if(ST.items[S.i].act!==it.act)return actCard(ST.items[S.i].act);
    nextItem();
  };
  stage.querySelector('.sheet').appendChild(b);b.focus();
}
function nextItem(){S.res={spot:false,name:false,eff:false,clean:false,sentence:''};roundSpot()}

/* ============ act card ============ */
function actCard(n){
  stage._keys=null;
  const a=ST.acts[n]; hideTimer(); document.body.classList.toggle('act3',n===3);
  stage.innerHTML='<div class="card"><p class="actnum">'+a.sub+' &middot; '+ST.short.toUpperCase()+'</p>'+
    '<h1 class="acttitle">'+a.title+'</h1>'+
    a.blurb.map(b=>'<p class="blurb">'+b+'</p>').join('')+
    '<hr class="rule"><button class="big-btn" id="go">BEGIN</button></div>';
  stage.scrollTop=0;
  $('#go').onclick=nextItem; $('#go').focus();
}

/* ============ story picker ============ */
function pickerCard(){
  stage._keys=null; ST=null; KEY=null;
  hideTimer(); document.body.classList.remove('act3','freeze'); setStoryClass(); hud();
  stage.innerHTML='<div class="card">'+
    '<h1 class="title-big">ANNO<br><span>TATOR</span></h1>'+
    '<p class="tagline">Twelve lines. Spot the technique before the highlighter runs out, name it, then everything stops and you say what it does.<br><br>'+
    'Name it wrong and the story rewrites itself to obey you. It will not be an improvement.<br><br>'+
    '<b>Choose your text.</b></p>'+
    '<div class="pick">'+ORDER.map((k,n)=>{
      const s=STORIES[k];
      return '<button class="storybtn p'+(n+1)+'" data-k="'+k+'">'+
        '<span class="sname">'+s.short+'</span>'+
        '<div class="smeta">'+s.author.toUpperCase()+' &middot; '+s.year+' &middot; '+s.words.toUpperCase()+'</div>'+
        '<div class="shook">'+s.hook+'</div></button>';
    }).join('')+'</div>'+
    '<button class="big-btn ghost" id="hlp" style="margin-top:14px">HOW IT WORKS</button></div>';
  stage.scrollTop=0;
  document.querySelectorAll('.storybtn').forEach(b=>b.onclick=()=>{ac();storyCard(b.dataset.k)});
  $('#hlp').onclick=showHelp;
}

/* ============ story intro + read first ============ */
function storyCard(k){
  stage._keys=null; KEY=k; ST=STORIES[k];
  S={i:0,score:0,chain:0,mult:1,muted:S.muted,paused:false,results:[],res:null};
  setStoryClass(); hud(); hideTimer(); document.body.classList.remove('act3','freeze');
  stage.innerHTML='<div class="card">'+
    '<p class="actnum">'+ST.author.toUpperCase()+' &middot; '+ST.year+'</p>'+
    '<h1 class="title-big" style="font-size:clamp(38px,11vw,72px)">'+ST.title+'</h1>'+
    '<p class="blurb" style="margin-top:14px">'+ST.pitch+'</p>'+
    '<hr class="rule">'+
    '<p class="tagline" style="margin:0 0 8px"><b>Read the story first.</b> The game quotes twelve lines out of it. They land much harder if you have met them in place. '+ST.words+'.</p>'+
    '<a class="big-btn ghost" id="read" href="'+ST.read.url+'" target="_blank" rel="noopener">READ THE STORY &nearr;</a>'+
    '<p class="tagline" style="margin:6px 0 0;font-size:11.5px">Opens in a new tab &middot; '+ST.read.kind+' &middot; '+ST.pd+'</p>'+
    '<hr class="rule">'+
    '<button class="big-btn" id="go">START ANNOTATING</button>'+
    '<button class="big-btn ghost" id="back">PICK A DIFFERENT STORY</button></div>';
  stage.scrollTop=0;
  $('#go').onclick=()=>{onlineStarted=Date.now();ac();actCard(1)};
  OnlineBoard.mount(stage.querySelector('.card'),KEY);
  $('#back').onclick=pickerCard;
  $('#go').focus();
}

/* ============ end card ============ */
function endCard(){
  stage._keys=null; hideTimer(); document.body.classList.remove('freeze');
  const spots=S.results.filter(r=>r.spot).length;
  const names=S.results.filter(r=>r.name).length;
  const cleans=S.results.filter(r=>r.clean&&r.spot&&r.name).length;
  const lines=S.results.map(r=>{
    const it=ST.items[r.idx];
    const q=tokens(it.text).map((w,i)=>inTarget(it,i)?'<mark>'+esc(w)+'</mark>':esc(w)).join(' ');
    return '<div class="report-line'+(r.spot&&r.name?'':' missed')+'">'+
      '<div class="num">'+String(r.idx+1).padStart(2,'0')+' &middot; ACT '+it.act+'</div>'+
      '<div class="quote">'+q+'</div>'+
      '<div class="lab">'+it.tech.toUpperCase()+(r.name?'':'  (you named it something else)')+'</div>'+
      '<div class="eff">'+esc(r.sentence)+'</div></div>';
  }).join('');
  const v=ST.end.verdicts;
  const verdict = cleans>=10?v[0] : cleans>=7?v[1] : cleans>=4?v[2] : v[3];
  stage.innerHTML='<div class="card">'+
    '<p class="actnum">ANNOTATION SHEET</p>'+
    '<h1 class="acttitle">'+ST.short.toUpperCase()+'</h1>'+
    '<div class="scoreblock">'+
      '<div>SCORE<b>'+S.score.toLocaleString()+'</b></div>'+
      '<div>SPOTTED<b>'+spots+'/12</b></div>'+
      '<div>NAMED<b>'+names+'/12</b></div>'+
      '<div>FULL CHAINS<b>'+cleans+'/12</b></div></div>'+
    '<p class="blurb">'+verdict+'</p><hr class="rule">'+
    '<h3 class="h3a">WHAT CAME BACK</h3>'+
    '<p class="tagline">'+ST.end.lines.join('<br>')+'</p><hr class="rule">'+lines+'<hr class="rule">'+
    '<h3 class="h3a">TALK ABOUT IT</h3>'+
    '<ol class="qs">'+ST.end.qs.map(q=>'<li>'+q+'</li>').join('')+'</ol><hr class="rule">'+
    '<button class="big-btn" id="copy">COPY MY ANNOTATION SHEET</button>'+
    '<button class="big-btn ghost" id="again">PLAY THIS STORY AGAIN</button>'+
    '<button class="big-btn ghost" id="another">TRY A DIFFERENT STORY</button>'+
    '<p class="tagline" style="margin-top:18px">'+ST.short+', '+ST.author+', '+ST.year+'. '+ST.pd+
    ' Lines trimmed for the screen and spaced around dashes; no words changed. Everything else here is written for this game.</p></div>';
  stage.scrollTop=0;
  $('#again').onclick=()=>storyCard(KEY);
  OnlineBoard.mount(stage.querySelector('.card'),KEY,{score:S.score,chains:cleans,completed:S.results.length,seconds:Math.round((Date.now()-onlineStarted)/1000),runId:crypto.randomUUID()});
  $('#another').onclick=pickerCard;
  $('#copy').onclick=()=>{
    let out='ANNOTATION SHEET — '+ST.short.toUpperCase()+' ('+ST.author+', '+ST.year+')\nScore '+S.score+' | full chains '+cleans+'/12\n\n';
    S.results.forEach(r=>{const it=ST.items[r.idx];
      out+=(r.idx+1)+'. '+it.text+'\n   TECHNIQUE: '+it.tech+'\n   EFFECT: '+r.sentence+'\n\n';});
    out+='WHAT CAME BACK\n'+ST.end.lines.map(l=>'- '+l.replace(/<[^>]+>/g,'')).join('\n')+'\n';
    const ta=document.createElement('textarea');ta.value=out;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');say('COPIED')}catch(e){say('SELECT + COPY',true)}
    document.body.removeChild(ta);
  };
}

/* ============ help ============ */
function showHelp(){
  overlay.classList.add('on');
  overlay.innerHTML='<h2>ANNOTATOR</h2>'+
    '<p>Four short stories, twelve lines each. Every line is a three-link chain.</p>'+
    '<h3>1 &middot; SPOT</h3><p>Tap the words. The highlighter bar is your clock: 7 seconds in Act I, 5 by Act III. Worth 100.</p>'+
    '<h3>2 &middot; NAME</h3><p>Pick the technique. Worth 200. Get it wrong and the sentence is rewritten to actually BE the thing you called it. Read the rewrite. That is the lesson, not the punishment.</p>'+
    '<h3>3 &middot; EFFECT</h3><p>Everything stops. No clock. Build a sentence saying what the technique does and why it matters. Clean first try is worth 600.</p>'+
    '<h3>CHAIN</h3><p>All three links clean, back to back, multiplies everything up to x3. One lucky tap is worth 100. A full chain is 900 before the multiplier.</p>'+
    '<h3>CONTROLS</h3><p><kbd>1</kbd>&ndash;<kbd>4</kbd> choose &middot; <kbd>Space</kbd> continue &middot; <kbd>H</kbd> help &middot; <kbd>M</kbd> sound &middot; <kbd>Esc</kbd> pause. Tap works everywhere.</p>'+
    '<h3>HOW EACH STORY IS BUILT</h3><ul>'+
    '<li>Act I sets up the techniques. Act III uses the same ones against the characters.</li>'+
    '<li>At least two things you annotate early come back later, changed. The game tells you when.</li>'+
    '<li>Item 12 never has a timer. It is the last line of the story and it is not a race.</li></ul>'+
    '<h3>THE TEXTS</h3><ul>'+ORDER.map(k=>{const s=STORIES[k];
      return '<li><b>'+s.short+'</b> &mdash; '+s.author+', '+s.year+'. '+s.pd+' <a href="'+s.read.url+'" target="_blank" rel="noopener">Read it</a> ('+s.read.kind+').</li>';}).join('')+'</ul>'+
    '<p>Quoted lines are original text, trimmed for screen width, with spacing added around dashes so words can be tapped one at a time. No words are changed or added. Every instruction, rewrite, roast and effect option is written for this game.</p>'+
    '<button class="big-btn" id="close">BACK</button>';
  $('#close').onclick=()=>overlay.classList.remove('on');
  $('#close').focus();
}
$('#bhelp').onclick=showHelp;
$('#bmute').onclick=()=>{S.muted=!S.muted;$('#bmute').textContent=S.muted?'\u266A\u0338':'\u266A'};

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable="true"],.online-board'))return;
  if(e.key==='Escape'){
    if(overlay.classList.contains('on'))overlay.classList.remove('on');
    else if(ST){S.paused=!S.paused;say(S.paused?'PAUSED':'GO')}
    return;
  }
  if(overlay.classList.contains('on'))return;
  const k=e.key.toLowerCase();
  if(k==='h'){showHelp();return}
  if(k==='m'){$('#bmute').click();return}
  if('1234'.indexOf(k)>-1&&stage._keys){stage._keys(+k-1);return}
  if(k===' '||k==='enter'){const b=stage.querySelector('.big-btn');if(b&&b.tagName==='BUTTON'){e.preventDefault();b.click()}}
});

hud(); pickerCard();
</script>
</body>
</html>
