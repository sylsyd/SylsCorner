<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6SI Lesson 3 - Epic of Gilgamesh</title>
<style>
:root{--navy:#18395F;--navy2:#102B49;--teal:#2D817C;--orange:#D6902E;--paper:#FFFDF8;--ink:#202A35;--muted:#68737E;--line:#D6DEE4;--pale:#EEF4F7;--green:#E6F1EA;--gold:#F8ECD8;--clay:#B8613E}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9edf0;color:var(--ink)}body{overflow:hidden}button,input{font:inherit}
.app{height:100%;display:grid;grid-template-columns:292px 1fr}aside{background:linear-gradient(180deg,var(--navy2),#1f456a);color:white;padding:20px 16px;display:flex;flex-direction:column;gap:14px}.brand small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bfd0df;font-weight:900}.brand h1{font:700 25px/1.05 Georgia,serif;margin:8px 0}.brand p{font-size:12.5px;color:#dce7ef;line-height:1.4}#nav{display:flex;flex-direction:column;gap:6px;overflow:auto}#nav button{border:0;background:rgba(255,255,255,.07);color:white;padding:9px 10px;border-radius:11px;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:9px;cursor:pointer}#nav button.active{background:white;color:var(--navy2)}.n{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:900}#nav button.active .n{background:var(--gold);color:#7b5011}#nav strong{display:block;font-size:12px}#nav span{font-size:10px;opacity:.72}.sidefoot{margin-top:auto;display:flex;gap:7px}.sidefoot button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:white;padding:8px;border-radius:9px;font-weight:800}
.main{display:grid;grid-template-rows:72px 1fr 68px;min-width:0}header{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.kicker{font-size:10px;letter-spacing:.15em;color:var(--clay);font-weight:900;text-transform:uppercase}#topTitle{font:700 21px Georgia,serif;color:var(--navy2)}.tools{display:flex;gap:8px;align-items:center}.timer{display:flex;gap:6px;align-items:center;background:var(--pale);border:1px solid #cad8de;padding:6px 8px;border-radius:11px}.timer b{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:8px 10px;border-radius:9px;font-weight:850;cursor:pointer}.btn.dark{background:var(--navy);color:white}
.content{padding:20px 24px;overflow:auto}#slide{max-width:1190px;margin:auto;background:var(--paper);border:1px solid #dce2e7;border-radius:22px;min-height:calc(100vh - 176px);padding:28px 32px;box-shadow:0 18px 50px rgba(16,43,73,.14)}.head{display:flex;justify-content:space-between;gap:18px}.stage{display:inline-block;background:var(--clay);color:white;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900}h2{font:700 38px/1.05 Georgia,serif;color:var(--navy2);margin:11px 0 7px}.lead{font-size:18px;line-height:1.5;color:#3e4b58;margin:0}.time{background:var(--gold);color:#865812;border-radius:11px;padding:8px 11px;font-weight:900;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.card.gold{background:var(--gold)}.card.green{background:var(--green)}.card h3{margin:0 0 7px;color:var(--teal);font-size:14px;text-transform:uppercase}.card p{font-size:16px;line-height:1.45}.task{margin-top:17px;border:2px solid var(--teal);border-radius:17px;background:#fbffff;padding:18px 20px}.task small{display:block;color:var(--teal);text-transform:uppercase;letter-spacing:.13em;font-weight:900}.task .big{font:700 28px/1.3 Georgia,serif;color:var(--navy2);margin-top:6px}.prompt{margin-top:18px;border-left:5px solid var(--orange);background:#fff8ed;border-radius:0 15px 15px 0;padding:17px 20px;font:700 24px/1.35 Georgia,serif;color:#4b351c}.note{margin-top:17px;border:1px dashed #b9c6cf;background:#f8fafb;border-radius:13px;padding:12px 14px;color:#4b5966;font-size:13px}body.hide .note{display:none}

.reveal{margin-top:18px;background:var(--navy);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:900;cursor:pointer}.answer{display:none;margin-top:12px;background:var(--green);border:1px solid #bed8c8;border-radius:12px;padding:16px;line-height:1.5}.answer.show{display:block}
.stagegrid{display:grid;gap:9px;margin-top:18px}.stagegrid>div{display:grid;grid-template-columns:34px 180px 1fr;gap:10px;align-items:center;border:1px solid var(--line);background:white;border-radius:13px;padding:10px}.stagegrid b{width:30px;height:30px;border-radius:50%;background:var(--clay);color:white;display:grid;place-items:center}.stagegrid span{font-weight:850;color:var(--navy2)}.stagegrid input{border:0;border-bottom:1px solid #aeb9c2;padding:7px;outline:none}
.wordcloud{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.wordcloud button{border:1px solid #cbd7df;background:white;color:var(--navy);border-radius:999px;padding:10px 13px;font-weight:850;cursor:pointer}.wordcloud button.on{background:var(--gold);border-color:#deb979;color:#7e5316}
footer{background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.progress{height:7px;background:#e8eef2;border-radius:99px;overflow:hidden;flex:1;max-width:560px}#prog{height:100%;background:linear-gradient(90deg,var(--clay),var(--navy));width:0}.pager{display:flex;align-items:center;gap:8px}.pager button{border:0;border-radius:10px;padding:9px 15px;font-weight:900;cursor:pointer}.prev{background:#eaf0f4;color:var(--navy)}.next{background:var(--navy);color:white}#counter{font-size:12px;color:var(--muted);font-weight:800;min-width:60px;text-align:center}
.lb{position:fixed;inset:0;background:rgba(7,19,32,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.lb.show{display:flex}.lb img{max-width:96vw;max-height:94vh}.lb button{position:absolute;top:16px;right:20px;width:42px;height:42px;border:0;border-radius:50%;background:white;font-size:20px;font-weight:900}

n</span></div><div class=\"grid3\"><div class=\"card\"><h3>Before fighting</h3><p>What happens between Gilgamesh and Humbaba?</p></div><div class=\"card gold\"><h3>Challenge</h3><p>Why does victory seem unlikely?</p></div><div class=\"card green\"><h3>Ending</h3><p>What changes after Gilgamesh wins?</p></div></div><div class=\"prompt\">Which stage of the Hero's Journey is most obvious here?</div>"}, {"title": "Map Gilgamesh", "time": 12, "html": "<div class=\"head\"><div><span class=\"stage\">23–35 MIN · APPLY</span><h2>Map the extract onto the five stages</h2><p class=\"lead\">Use Worksheet 2. Every stage needs evidence from p.13.</p></div><span class=\"time\">12 min</span></div><div class=\"stagegrid\"><div><b>1</b><span>Call to adventure</span><input placeholder=\"Evidence…\"></div><div><b>2</b><span>Into the unknown</span><input placeholder=\"Evidence…\"></div><div><b>3</b><span>Trials and tests</span><input placeholder=\"Evidence…\"></div><div><b>4</b><span>Final challenge</span><input placeholder=\"Evidence…\"></div><div><b>5</b><span>Reward and return</span><input placeholder=\"Evidence…\"></div></div><div class=\"note\"><b>Teacher:</b> Allow students to mark a stage as uncertain if they can explain why.</div>"}, {"title": "Evidence Check", "time": 8, "html": "<div class=\"head\"><div><span class=\"stage\">35–43 MIN · WHOLE CLASS</span><h2>How strong is our evidence?</h2><p class=\"lead\">Defend one stage. Then decide which stage is least clearly developed.</p></div><span class=\"time\">8 min</span></div><div class=\"grid2\"><div class=\"card green\"><h3>Strongest fits</h3><p>Call to adventure? Into the unknown? Final challenge? Reward and return?</p></div><div class=\"card gold\"><h3>The awkward one</h3><p>Is <b>trials and tests</b> clearly separate in this compressed extract?</p></div></div><button class=\"reveal\" onclick=\"document.getElementById('r2').classList.toggle('show')\">Show teacher mapping</button><div class=\"answer\" id=\"r2\"><b>Call:</b> threat to Uruk / Humbaba. <b>Unknown:</b> long hazardous journey to remote forest. <b>Trials:</b> compressed; journey and taunting exchanges are reasonable evidence. <b>Final:</b> titanic struggle with Humbaba. <b>Reward/return:</b> threat lifted, kingdom saved, return home triumphant.</div>"}, {"title": "Similar Stories", "time": 8, "html": "<div class=\"head\"><div><span class=\"stage\">43–51 MIN · IGNITE ACTIVITY 3</span><h2>Why does Gilgamesh feel familiar?</h2><p class=\"lead\">Compare the plot with an adventure story, film, myth or game you know.</p></div><span class=\"time\">8 min</span></div><div class=\"grid3\"><div class=\"card\"><h3>Threat</h3><p>What endangers the hero's world?</p></div><div class=\"card\"><h3>Journey</h3><p>Where must the hero go?</p></div><div class=\"card\"><h3>Confrontation</h3><p>What final enemy or challenge must be faced?</p></div></div><div class=\"prompt\">Give one <b>structural</b> similarity, not just “both have a monster”.</div>"}, {"title": "Earliest Adventure?", "time": 6, "html": "<div class=\"head\"><div><span class=\"stage\">51–57 MIN · DISCUSS</span><h2>What still feels modern?</h2><p class=\"lead\">Booker describes this as the earliest ever adventure story. Based on this extract, what makes that claim feel plausible?</p></div><span class=\"time\">6 min</span></div><div class=\"wordcloud\"><button onclick=\"this.classList.toggle('on')\">threatened community</button><button onclick=\"this.classList.toggle('on')\">heroic protagonist</button><button onclick=\"this.classList.toggle('on')\">special weapons</button><button onclick=\"this.classList.toggle('on')\">dangerous journey</button><button onclick=\"this.classList.toggle('on')\">remote setting</button><button onclick=\"this.classList.toggle('on')\">monstrous enemy</button><button onclick=\"this.classList.toggle('on')\">apparently impossible struggle</button><button onclick=\"this.classList.toggle('on')\">victory and return</button></div><div class=\"prompt\">Which of these ingredients still appears constantly in adventure stories today?</div>"}, {"title": "Exit Ticket", "time": 3, "html": "<div class=\"head\"><div><span class=\"stage\">57–60 MIN · EXIT</span><h2>One stage. Exact evidence. Explain the fit.</h2><p class=\"lead\">Write 2–3 sentences.</p></div><span class=\"time\">3 min</span></div><div class=\"prompt\">Choose one Hero's Journey stage. Explain exactly where it appears in the Gilgamesh extract and why your evidence fits that stage.</div><div class=\"card green\" style=\"margin-top:18px\"><h3>Next lesson</h3><p>We use conjunctions to compare and contrast adventure stories.</p></div>"}];let current=0,secs=0,running=false,intv=null,hide=false;const nav=document.getElementById('nav');slides.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML='<div class="n">'+(i+1)+'</div><div><strong>'+s.title+'</strong><span>'+s.time+' min</span></div>';b.onclick=()=>render(i);nav.appendChild(b);});
function render(i){current=i;document.getElementById('slide').innerHTML=slides[i].html;document.getElementById('topTitle').textContent=slides[i].title;document.getElementById('counter').textContent=(i+1)+' / '+slides.length;document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';[...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));reset(slides[i].time);document.querySelector('.content').scrollTop=0;}
function next(){if(current<slides.length-1)render(current+1)}function prev(){if(current>0)render(current-1)}function update(){let m=Math.floor(secs/60),s=secs%60;document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function reset(m){clearInterval(intv);running=false;secs=m*60;document.getElementById('timerBtn').textContent='Start';update()}function toggleTimer(){if(running){clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Start'}else{running=true;document.getElementById('timerBtn').textContent='Pause';intv=setInterval(()=>{if(secs>0){secs--;update()}else{clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Done'}},1000)}}function plus(){secs+=60;update()}function minus(){secs=Math.max(0,secs-60);update()}function toggleNotes(){hide=!hide;document.body.classList.toggle('hide',hide)}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}function openLB(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('show')}function closeLB(){document.getElementById('lb').classList.remove('show')}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();toggleTimer()}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();if(e.key==='Escape')closeLB();});render(0);
</script></body></html>
