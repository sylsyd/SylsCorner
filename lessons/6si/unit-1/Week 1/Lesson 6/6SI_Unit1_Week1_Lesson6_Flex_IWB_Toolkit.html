<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>6SI Lesson 6 - Flex Lesson Toolkit</title>
<style>
:root{--navy:#17375E;--navy2:#0F2B49;--teal:#2D817C;--orange:#D6902E;--paper:#fffdf8;--ink:#202A35;--muted:#68737E;--line:#D6DEE4;--pale:#EEF4F7;--green:#E6F1EA;--gold:#F8ECD8}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9eef1;color:var(--ink)} body{overflow:hidden} button,input{font:inherit}
.app{height:100%;display:grid;grid-template-columns:292px 1fr}
aside{background:linear-gradient(180deg,var(--navy2),var(--navy));color:white;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.brand small{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#bfd0df;font-weight:900}
.brand h1{font:700 25px Georgia,serif;margin:8px 0}
.brand p{font-size:12px;color:#dce7ef;line-height:1.4}
#nav{display:flex;flex-direction:column;gap:6px;overflow:auto}
#nav button{border:0;background:rgba(255,255,255,.08);color:white;border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
#nav button.active{background:white;color:var(--navy2)}
#nav .n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;flex:0 0 26px}
#nav button.active .n{background:var(--teal);color:white}
.sidefoot{margin-top:auto;display:grid;gap:8px}
.sidefoot button{border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.12);color:white;font-weight:800}
main{display:grid;grid-template-rows:72px 1fr 68px;min-width:0}
header{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.kicker{font-size:10px;letter-spacing:.15em;color:var(--teal);font-weight:900;text-transform:uppercase}
#topTitle{font:700 21px Georgia,serif;color:var(--navy2)}
.tools{display:flex;gap:8px;align-items:center}
.timer{display:flex;gap:6px;align-items:center;background:var(--pale);border:1px solid #cad6df;border-radius:14px;padding:6px 7px}
.btn{border:0;border-radius:9px;padding:8px 12px;background:white}
.btn.dark{background:var(--navy);color:white;font-weight:900}
.content{padding:20px 24px;overflow:auto}
#slide{max-width:1190px;margin:auto;background:var(--paper);border:1px solid #dce2e7;border-radius:22px;min-height:calc(100vh - 176px);padding:28px 32px;box-shadow:0 18px 50px rgba(16,43,73,.14)}
.head{display:flex;justify-content:space-between;gap:18px}
.stage{display:inline-block;background:var(--navy);color:white;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900}
h2{font:700 38px/1.05 Georgia,serif;color:var(--navy2);margin:11px 0 7px}
.lead{margin:0;color:#36414d;font-size:18px;max-width:900px;line-height:1.45}
.time{background:var(--gold);border:1px solid #e4c483;color:#7f5418;border-radius:14px;padding:10px 14px;font-weight:900;height:fit-content}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}
.card.green{background:var(--green)}
.card.gold{background:var(--gold)}
.card h3{margin:0 0 8px;color:var(--teal);font-size:14px;text-transform:uppercase}
.card p, .card li{font-size:16px;line-height:1.45}
.card ul{margin:6px 0 0 20px;padding:0}
.task{margin-top:17px;border:2px solid var(--teal);border-radius:18px;padding:16px;background:linear-gradient(180deg,#fff,#f3faf9)}
.task small{display:block;text-transform:uppercase;letter-spacing:.11em;color:var(--teal);font-weight:900;font-size:11px}
.task .big{font-size:24px;line-height:1.3;color:var(--navy2);font-weight:800;margin-top:6px}
.prompt{margin-top:18px;background:var(--pale);border:1px solid #ced8df;border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.45}
.fiveblank{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.fiveblank div{background:white;border:1px dashed #a9b6c2;border-radius:14px;min-height:90px;display:grid;place-items:center;font-size:34px;color:#9aabba;font-weight:900}
.photo-card{margin:0;background:white;border:1px solid var(--line);border-radius:17px;padding:10px}
.photo-card img{width:100%;max-height:60vh;object-fit:contain;border-radius:11px;cursor:zoom-in}
.photo-card figcaption{font-size:11px;color:var(--muted);padding:8px 4px 1px}
.quotepara{margin-top:18px;background:white;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:20px;line-height:1.6}
.reveal{margin-top:18px;background:var(--navy);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:900}
.answer{display:none;margin-top:12px;background:var(--green);border:1px solid #bed8c8;border-radius:12px;padding:16px;line-height:1.5;font-size:18px}
.answer.show{display:block}
.stagegrid{display:grid;gap:10px;margin-top:18px}
.stagegrid>div{display:grid;grid-template-columns:40px 220px 1fr;gap:12px;align-items:start;border:1px solid var(--line);background:white;border-radius:13px;padding:12px}
.stagegrid b{width:32px;height:32px;border-radius:50%;background:var(--teal);color:white;display:grid;place-items:center}
.stagegrid span{font-weight:850;color:var(--navy2);font-size:17px}
.notes{margin-top:20px;background:#fff7e8;border:1px solid #ead0a0;border-radius:14px;padding:14px 16px}
.notes h4{margin:0 0 6px;color:#7d5118;text-transform:uppercase;font-size:12px;letter-spacing:.12em}
.notes p{margin:0;font-size:15px;line-height:1.45}
.hide-notes .notes{display:none}
footer{background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.progress{height:7px;background:#e8eef2;border-radius:99px;overflow:hidden;flex:1;max-width:560px}
#prog{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));width:0}
.pager{display:flex;align-items:center;gap:8px}
.pager button{border:0;border-radius:10px;padding:9px 15px;font-weight:900}
.prev{background:#eaf0f4;color:var(--navy)} .next{background:var(--navy);color:white}
.lb{position:fixed;inset:0;background:rgba(7,19,32,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.lb.show{display:flex} .lb img{max-width:96vw;max-height:94vh} .lb button{position:absolute;top:16px;right:20px;width:42px;height:42px;border:0;border-radius:50%;background:white;font-size:20px;font-weight:900}
@media(max-width:900px){.app{grid-template-columns:1fr} aside{display:none} .grid2,.fiveblank{grid-template-columns:1fr} .stagegrid>div{grid-template-columns:40px 1fr} }
</style></head><body>
<div class="app">
<aside>
  <div class="brand"><small>6SI English · Unit 1</small><h1>Lesson 6 Flex Toolkit</h1><p>Extended paragraph or catch-up<br>Built so a teacher can just click and teach.</p></div>
  <div id="nav"></div>
  <div class="sidefoot"><button onclick="toggleNotes()">Teacher notes</button><button onclick="full()">Fullscreen</button></div>
</aside>
<main>
  <header>
    <div><div class="kicker">Week 1 · Lesson 6 · 60 minutes</div><div id="topTitle"></div></div>
    <div class="tools">
      <div class="timer"><button class="btn" onclick="minus()">−1</button><b id="clock">04:00</b><button class="btn" onclick="plus()">+1</button><button class="btn dark" id="timerBtn" onclick="toggleTimer()">Start</button></div>
      <button class="btn" onclick="render(current)">Reset</button>
    </div>
  </header>
  <section class="content"><div id="slide"></div></section>
  <footer><div class="progress"><div id="prog"></div></div><div class="pager"><button class="prev" onclick="prev()">← Prev</button><span id="counter"></span><button class="next" onclick="next()">Next →</button></div></footer>
</main></div>

<script>
const slides=[{"title": "Lesson overview", "time": 4, "notes": "Read the lesson goal aloud. Explain that this is a flex lesson: students will either complete the extended paragraph challenge or the catch-up route. Emphasise that both routes matter and neither is a punishment.", "html": "\n<div class=\"head\"><div><span class=\"stage\">START HERE</span><h2>Lesson 6 • Flex: extended paragraph or catch-up</h2><p class=\"lead\">Goal: trace a familiar story's Hero's Journey using conjunctions — or rebuild the skills needed to do that confidently.</p></div><span class=\"time\">4 min</span></div>\n<div class=\"grid2\">\n  <div class=\"card green\"><h3>Route A</h3><p>Students who are secure with the stages and can usually write complete sentences complete the <b>extended paragraph challenge</b>.</p></div>\n  <div class=\"card gold\"><h3>Route B</h3><p>Students who need more support complete the <b>catch-up clinic</b>, then write a shorter paragraph.</p></div>\n</div>\n<div class=\"task\"><small>Teacher reminder</small><div class=\"big\">Use the starter to decide routes. This toolkit is designed so you can teach the whole lesson from here.</div></div>\n"}, {"title": "Quick diagnostic", "time": 6, "notes": "Give students 3-4 minutes to write the five stages from memory and one sentence using any conjunction. Cold-call a few answers, then reveal. Students who can name at least four stages securely and write a sensible full sentence are usually fine for Route A.", "html": "\n<div class=\"head\"><div><span class=\"stage\">0–6 MIN · QUICK DIAGNOSTIC</span><h2>Do Now</h2><p class=\"lead\">1) Write the five stages in order. 2) Write one sentence about a story using a conjunction.</p></div><span class=\"time\">6 min</span></div>\n<div class=\"fiveblank\"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div>\n<div class=\"prompt\">Example conjunctions: because, although, when, while, after, since, but, so</div>\n<button class=\"reveal\" onclick=\"toggle('diagans')\">Reveal the stage order</button>\n<div id=\"diagans\" class=\"answer\">Call to adventure → Into the unknown → Trials and tests → The final challenge → Reward and return</div>\n"}, {"title": "What a strong answer does", "time": 6, "notes": "Teach the success criteria explicitly. Students need event + explanation, not just labels. Point out that conjunctions help the paragraph flow and show relationships between ideas.", "html": "\n<div class=\"head\"><div><span class=\"stage\">6–12 MIN · RECAP</span><h2>What makes this task strong?</h2></div><span class=\"time\">6 min</span></div>\n<div class=\"grid2\">\n  <div class=\"card\">\n    <h3>Strong tracing</h3>\n    <ul>\n      <li>Names the stages in a logical order</li>\n      <li>Uses specific events from a familiar story</li>\n      <li>Explains why the events fit</li>\n      <li>Uses conjunctions to connect ideas</li>\n    </ul>\n  </div>\n  <div class=\"card green\">\n    <h3>Weak tracing</h3>\n    <ul>\n      <li>Just lists stage names</li>\n      <li>Gives vague story references</li>\n      <li>Doesn't explain the fit</li>\n      <li>Uses no clear linking words</li>\n    </ul>\n  </div>\n</div>\n"}, {"title": "Teacher model paragraph", "time": 6, "notes": "Read the paragraph aloud. Then ask students to identify at least three conjunctions and locate where different stages appear. This gives a model of the finished writing, not just the worksheet.", "html": "\n<div class=\"head\"><div><span class=\"stage\">MODEL</span><h2>Example paragraph</h2><p class=\"lead\">Use it to show what 'trace + explain' looks like.</p></div><span class=\"time\">6 min</span></div>\n<div class=\"quotepara\">\nIn <b>Moana</b>, the Hero's Journey begins when the island starts to fail and Moana is drawn towards a mission beyond the reef, <b>so</b> this becomes her call to adventure. <b>Although</b> leaving home frightens her, she enters the unknown when she sails into unfamiliar waters to find Maui. During the trials and tests stage, Moana survives storms, struggles to work with Maui and gradually becomes more confident <b>because</b> each setback teaches her something. The final challenge arrives when she confronts Te Kā and must act with courage instead of fear. In the reward and return stage, Moana restores the heart of Te Fiti, saves her people and returns changed, <b>since</b> she now understands both her identity and her responsibility.\n</div>\n<div class=\"prompt\">Ask: Which conjunctions can you spot? Which sentence clearly shows 'into the unknown'?</div>\n"}, {"title": "Choose the route", "time": 3, "notes": "Give a calm route choice. Tell students clearly which worksheet to use. If uncertain, start a student on Route B; it still ends with writing. Keep it brisk and matter-of-fact.", "html": "\n<div class=\"head\"><div><span class=\"stage\">12–15 MIN · ROUTE CHOICE</span><h2>Which worksheet are you using?</h2></div><span class=\"time\">3 min</span></div>\n<div class=\"grid2\">\n  <figure class=\"photo-card\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAXTBB8DASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAAEFBgcCBAgDCf/EAGoQAAEDAwIDAwUKCAcMBgcCDwECAwQABREGIQcSMRNBUQgUFiJhFTJxgZGSk5TR0iNCUlNUVVaxFzNDYnKhwSQ1REVGZXSClbKz4SY0NmNzhCVkdYOFosLwCRij0zdXpLTxJyhHw+Jmdv/EABsBAQADAQEBAQAAAAAAAAAAAAABAgMEBQYH/8QAQhEAAQMBBQUFBwMDBAIDAAIDAQACAxEEEhMhUTFBUpGhBWFxsdEUIjKBweHwFSNTQmKSBjPS8TRyJEOighZE4rL/2gAMAwEAAhEDEQA/AO+6WjvoxUIjuo60i1coqKzOJui4El2LK1bYmZLSuRxpc9oLQrwI5sg1IFdigkDapXjFL8dQtXFrQaPfaysI+Ge39teSuMfD5HXWtgH/AJ9v7akNdoovt1U460VATxt4bJPra704D7bi19teZ458M09dfaaH/wARa+2puO0S+3VWHSVA2+NXDl1IUnXemylXQ+6TW/8A81en8MnDvu1zpz/aTX3qXHaJfbqpx30dahaeLugF7J1rp4/BcWvvVsN8UNEun1NXWFXwXBr71Lp0S8NVLfZRUNXxX0IhWDrGxA/6e39teJ4xcPhnOttPjH+cG/tpddol9uqm5NGfCoL/AAzcO849N9Pf7Qb+2s08YOH6xlOtLAR4ie39tLjtEvt1U37qBUMVxa0IEc/pjYuTx8+ n the mini paragraph. Check this group early. Praise clear effort, not speed.", "html": "\n<div class=\"head\"><div><span class=\"stage\">15–38 MIN · ROUTE B</span><h2>Catch-up clinic</h2><p class=\"lead\">Use Worksheet 2 and complete it in this order.</p></div><span class=\"time\">23 min</span></div>\n<div class=\"stagegrid\">\n  <div><b>1</b><span>Stage recap</span><p>Write one short example for each stage.</p></div>\n  <div><b>2</b><span>Conjunctions that help</span><p>Review coordinating and subordinating conjunctions.</p></div>\n  <div><b>3</b><span>Sentence builders</span><p>Complete the sentence starters using your story.</p></div>\n  <div><b>4</b><span>Mini paragraph</span><p>Turn your notes into a short, clear paragraph.</p></div>\n</div>\n<div class=\"prompt\">Teacher move: conference here first. Students do not need a long paragraph — they need an accurate, clear one.</div>\n"}, {"title": "Check and improve", "time": 8, "notes": "Pause the room. Everyone checks their own work first, then swaps with a partner or checks with the teacher. One concrete improvement is enough.", "html": "\n<div class=\"head\"><div><span class=\"stage\">38–46 MIN · IMPROVE</span><h2>Self-check, then improve one thing</h2></div><span class=\"time\">8 min</span></div>\n<div class=\"grid2\">\n  <div class=\"card\">\n    <h3>Self-check questions</h3>\n    <ul>\n      <li>Have I used the stages in the right order?</li>\n      <li>Did I use specific events from my story?</li>\n      <li>Did I explain why they fit?</li>\n      <li>Did I use conjunctions accurately?</li>\n    </ul>\n  </div>\n  <div class=\"card gold\">\n    <h3>Improve one thing</h3>\n    <ul>\n      <li>Add a missing explanation</li>\n      <li>Replace a weak linking word</li>\n      <li>Fix a sentence fragment</li>\n      <li>Add a final judgement sentence</li>\n    </ul>\n  </div>\n</div>\n"}, {"title": "Share and mini-conference", "time": 10, "notes": "Invite volunteers or select two or three students to read an opening sentence or a strong stage explanation. Keep it brisk. Use this time to quietly catch any Route B students who still need help finishing.", "html": "\n<div class=\"head\"><div><span class=\"stage\">46–56 MIN · SHARE</span><h2>What sounds strong?</h2></div><span class=\"time\">10 min</span></div>\n<div class=\"grid2\">\n  <div class=\"card green\"><h3>Listen for</h3><p>specific events, accurate conjunctions, and clear explanation of why the stage fits.</p></div>\n  <div class=\"card\"><h3>Sentence stem for feedback</h3><p>“This works well because…”<br>“You could improve this by…”</p></div>\n</div>\n<div class=\"prompt\">Keep the tone practical. We are polishing understanding, not staging a TED talk.</div>\n"}, {"title": "Exit ticket", "time": 4, "notes": "Students write one final sentence. Collect this if you want a quick read on confidence. This is also a good calm ending after the flex work.", "html": "\n<div class=\"head\"><div><span class=\"stage\">56–60 MIN · EXIT</span><h2>Final sentence</h2></div><span class=\"time\">4 min</span></div>\n<div class=\"task\"><small>Choose one</small><div class=\"big\">A) The Hero's Journey is useful because ________, although ________.<br><br>B) One stage I can now explain clearly is ________ because ________.</div></div>\n<div class=\"card green\" style=\"margin-top:18px\"><h3>Teacher win condition</h3><p>If students leave with clearer stage knowledge and better explanatory writing, the lesson did its job. No fireworks required.</p></div>\n"}];
let current=0,secs=0,running=false,intv=null,hide=false;
const nav=document.getElementById('nav');
slides.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML='<div class="n">'+(i+1)+'</div><div><strong>'+s.title+'</strong><span style="display:block;font-size:12px;opacity:.8;margin-top:2px">'+s.time+' min</span></div>';b.onclick=()=>render(i);nav.appendChild(b);});

function render(i){
  current=i;
  const s=slides[i];
  document.getElementById('topTitle').textContent=s.title;
  document.getElementById('slide').innerHTML=s.html + '<div class="notes"><h4>Teacher notes</h4><p>'+s.notes+'</p></div>';
  document.getElementById('counter').textContent=(i+1)+' / '+slides.length;
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';
  [...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));
  reset(s.time);
  document.querySelector('.content').scrollTop=0;
  document.body.classList.toggle('hide-notes',hide);
}
function next(){if(current<slides.length-1)render(current+1)}
function prev(){if(current>0)render(current-1)}
function update(){let m=Math.floor(secs/60),s=secs%60;document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function reset(m){clearInterval(intv);running=false;secs=m*60;document.getElementById('timerBtn').textContent='Start';update()}
function toggleTimer(){if(running){clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Start'}else{running=true;document.getElementById('timerBtn').textContent='Pause';intv=setInterval(()=>{if(secs>0){secs--;update()}else{clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Done'}},1000)}}
function plus(){secs+=60;update()}
function minus(){secs=Math.max(0,secs-60);update()}
function toggle(id){document.getElementById(id).classList.toggle('show')}
function toggleNotes(){hide=!hide;document.body.classList.toggle('hide-notes',hide)}
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function openLB(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('show')}
function closeLB(){document.getElementById('lb').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();toggleTimer()}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();if(e.key==='Escape')closeLB();});
render(0);
</script></body></html>
