<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6SI Lesson 5 - Hero's Journey</title>
<style>
:root{--navy:#17375E;--navy2:#0F2B49;--teal:#2D817C;--orange:#D6902E;--paper:#fffdf8;--ink:#202A35;--muted:#68737E;--line:#D6DEE4;--pale:#EEF4F7;--green:#E6F1EA;--gold:#F8ECD8}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9eef1;color:var(--ink)}body{overflow:hidden}button{font:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:292px 1fr}aside{background:linear-gradient(180deg,var(--navy2),var(--navy));color:white;padding:20px 16px;display:flex;flex-direction:column;gap:14px}.brand small{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#bfd0df;font-weight:900}.brand h1{font:700 25px Georgia,serif;margin:8px 0}.brand p{font-size:12px;color:#dce7ef;line-height:1.4}#nav{display:flex;flex-direction:column;gap:6px;overflow:auto}#nav button{border:0;background:rgba(255,255,255,.07);color:white;padding:9px 10px;border-radius:11px;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:9px}#nav button.active{background:white;color:var(--navy2)}.n{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:900}#nav button.active .n{background:var(--gold);color:#7b5011}#nav strong{display:block;font-size:12px}#nav span{font-size:10px;opacity:.72}.sidefoot{margin-top:auto;display:flex;gap:7px}.sidefoot button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:white;padding:8px;border-radius:9px;font-weight:800}main{display:grid;grid-template-rows:72px 1fr 68px;min-width:0}header{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.kicker{font-size:10px;letter-spacing:.15em;color:var(--teal);font-weight:900;text-transform:uppercase}#topTitle{font:700 21px Georgia,serif;color:var(--navy2)}.tools{display:flex;gap:8px;align-items:center}.timer{display:flex;gap:6px;align-items:center;background:var(--pale);border:1px solid #cad8de;padding:6px 8px;border-radius:11px}.timer b{min-width:55px;text-align:center}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:8px 10px;border-radius:9px;font-weight:850}.btn.dark{background:var(--navy);color:white}
.content{padding:20px 24px;overflow:auto}#slide{max-width:1190px;margin:auto;background:var(--paper);border:1px solid #dce2e7;border-radius:22px;min-height:calc(100vh - 176px);padding:28px 32px;box-shadow:0 18px 50px rgba(16,43,73,.14)}.head{display:flex;justify-content:space-between;gap:18px}.stage{display:inline-block;background:var(--navy);color:white;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900}h2{font:700 38px/1.05 Georgia,serif;color:var(--navy2);margin:11px 0 7px}.lead{font-size:18px;line-height:1.5;color:#3e4b58;margin:0}.time{background:var(--gold);color:#865812;border-radius:11px;padding:8px 11px;font-weight:900}.prompt{margin-top:18px;border-left:5px solid var(--orange);background:#fff8ed;border-radius:0 15px 15px 0;padding:17px 20px;font:700 24px/1.35 Georgia,serif;color:#4b351c}.note{margin-top:17px;border:1px dashed #b9c6cf;background:#f8fafb;border-radius:13px;padding:12px 14px;color:#4b5966;font-size:13px}body.hide .note{display:none}.task{margin-top:17px;border:2px solid var(--teal);border-radius:17px;background:#fbffff;padding:18px 20px}.task small{display:block;color:var(--teal);text-transform:uppercase;letter-spacing:.13em;font-weight:900}.task .big{font:700 28px/1.3 Georgia,serif;color:var(--navy2);margin-top:6px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;font-size:16px;line-height:1.45}.card.green{background:var(--green)}.card.gold{background:var(--gold)}.card.soft{background:var(--pale)}.card h3{margin:0 0 7px;color:var(--teal);font-size:14px;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.fiveblank,.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}.fiveblank div,.grid5 div{min-height:110px;background:white;border:2px solid #d5e0e6;border-radius:15px;display:grid;place-items:center;text-align:center;padding:12px;font-weight:850;color:var(--navy)}.vertical{grid-template-columns:1fr}.vertical div{min-height:58px;display:flex;justify-content:flex-start;gap:12px}.reveal{margin-top:18px;background:var(--navy);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:900}.answer{display:none;margin-top:12px;background:var(--green);border-radius:12px;padding:16px;line-height:1.5}.answer.show{display:block}.photo-layout{display:grid;grid-template-columns:minmax(370px,.95fr) 1.25fr;gap:20px;align-items:start;margin-top:18px}.photo-card{margin:0;background:white;border:1px solid var(--line);border-radius:17px;padding:10px}.photo-card img{width:100%;max-height:59vh;object-fit:contain;border-radius:11px;cursor:zoom-in}.photo-card figcaption{font-size:11px;color:var(--muted);padding:8px 4px 1px}.model{margin-top:20px;border:1px solid var(--line);border-radius:18px;background:white;padding:18px;display:grid;grid-template-columns:65px 1fr;gap:16px}.badge{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:white;font-weight:900;font-size:22px}#quizBox{margin-top:20px}.qcard{background:white;border:1px solid var(--line);border-radius:18px;padding:24px}.qnum{font-size:12px;color:var(--teal);font-weight:900;text-transform:uppercase}.qtext{font:700 27px/1.3 Georgia,serif;color:var(--navy2);margin:12px 0 20px}.quizanswer{display:none;background:var(--green);border-radius:12px;padding:16px;font-weight:800}.quizanswer.show{display:block}.quiznav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:15px}.quiznav button{border:0;background:var(--navy);color:white;border-radius:10px;padding:9px 14px;font-weight:900}
footer{background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.progress{height:7px;background:#e8eef2;border-radius:99px;overflow:hidden;flex:1;max-width:560px}#prog{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));width:0}.pager{display:flex;align-items:center;gap:8px}.pager button{border:0;border-radius:10px;padding:9px 15px;font-weight:900}.prev{background:#eaf0f4;color:var(--navy)}.next{background:var(--navy);color:white}#counter{font-size:12px;color:var(--muted);font-weight:800;min-width:60px;text-align:center}.lb{position:fixed;inset:0;background:rgba(7,19,32,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.lb.show{display:flex}.lb img{max-width:96vw;max-height:94vh}.lb button{position:absolute;top:16px;right:20px;width:42px;height:42px;border:0;border-radius:50%;background:white;font-size:20px}

const slides=[{"title": "Do Now — Rebuild the Journey", "time": 5, "html": "<div class=\"head\"><div><span class=\"stage\">0–5 MIN · RETRIEVAL</span><h2>Can you rebuild the Hero's Journey?</h2><p class=\"lead\">Write all five stages in order from memory.</p></div><span class=\"time\">5 min</span></div><div class=\"fiveblank\"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div><button class=\"reveal\" onclick=\"toggle('recall')\">Reveal</button><div id=\"recall\" class=\"answer\">Call to adventure → Into the unknown → Trials and tests → The final challenge → Reward and return</div>"}, {"title": "Example Sprint", "time": 7, "html": "<div class=\"head\"><div><span class=\"stage\">5–12 MIN · QUICK APPLICATION</span><h2>One stage. One example.</h2><p class=\"lead\">I name a stage; you give me an example from any book, film, myth or game.</p></div><span class=\"time\">7 min</span></div><div class=\"grid5\"><div>Call to adventure</div><div>Into the unknown</div><div>Trials and tests</div><div>Final challenge</div><div>Reward and return</div></div><div class=\"prompt\">Your example needs an event — not just a title.</div>"}, {"title": "Activity 2 — What Are We Making?", "time": 6, "html": "<div class=\"head\"><div><span class=\"stage\">12–18 MIN · IGNITE p.12</span><h2>Create your own Hero's Journey flow diagram</h2><p class=\"lead\">Use examples from your own reading and films.</p></div><span class=\"time\">6 min</span></div><div class=\"photo-layout\"><figure class=\"photo-card\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCARqA4gDASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAgABAwYEBQcICf/EAGIQAAEDAwIDBAUFBwsRBwQABwECAxEABAUSIQYxQQcTUWEIFCJxgRUykaHRFiNCkpOxwRckM1JUcoKyw9LhGCU0NTdDRFViY3N1g5Sio7MnRVNldJXwJjZkhMK08UaF0+P/xAAbAQEBAQEBAQEBAAAAAAAAAAAAAQIDBAUGB//E ": "<div class=\"head\"><div><span class=\"stage\">MODEL</span><h2>Event + explanation</h2></div><span class=\"time\">4 min</span></div><div class=\"model\"><div class=\"badge\">2</div><div><h3>Into the unknown</h3><p><b>Weak:</b> “The hero goes somewhere new.”</p><p><b>Strong:</b> “The hero leaves the familiar world and enters a dangerous new setting, which fits 'into the unknown' because the rules and risks are no longer predictable.”</p></div></div><div class=\"prompt\">Specific event + why it fits = strong mapping.</div>"}, {"title": "Create Your Flow Diagram", "time": 17, "html": "<div class=\"head\"><div><span class=\"stage\">18–35 MIN · INDEPENDENT</span><h2>Build the journey</h2><p class=\"lead\">Use Worksheet 1. Choose a story you know well enough to explain.</p></div><span class=\"time\">17 min</span></div><div class=\"grid5 vertical\"><div><b>1</b> Call to adventure</div><div><b>2</b> Into the unknown</div><div><b>3</b> Trials and tests</div><div><b>4</b> Final challenge</div><div><b>5</b> Reward and return</div></div><div class=\"note\"><b>Teacher:</b> Challenge any box that only names an event. Ask: “Why does that event belong here?”</div>"}, {"title": "Gallery Walk / Peer Check", "time": 8, "html": "<div class=\"head\"><div><span class=\"stage\">35–43 MIN · SHARE</span><h2>Read someone else's journey</h2></div><span class=\"time\">8 min</span></div><div class=\"grid2\"><div class=\"card green\"><h3>Strongest mapping</h3><p>Which stage has the clearest event + explanation?</p></div><div class=\"card gold\"><h3>Question a stage</h3><p>Which stage would you challenge or ask them to justify?</p></div></div><div class=\"prompt\">Peer feedback should improve the reasoning, not the artwork.</div>"}, {"title": "Refine", "time": 5, "html": "<div class=\"head\"><div><span class=\"stage\">43–48 MIN · REVISE</span><h2>Improve one stage</h2></div><span class=\"time\">5 min</span></div><div class=\"task\"><small>Choose</small><div class=\"big\">Improve your least convincing stage using the feedback you received.</div></div><div class=\"card soft\" style=\"margin-top:18px\"><h3>Stretch</h3><p>Add: “The model becomes less neat here because…”</p></div>"}, {"title": "Quiz Time", "time": 9, "html": "<div class=\"head\"><div><span class=\"stage\">48–57 MIN · LOW-STAKES QUIZ</span><h2>10 questions. No drama.</h2><p class=\"lead\">Answer before revealing. Self-mark and correct immediately.</p></div><span class=\"time\">9 min</span></div><div id=\"quizBox\"></div><div class=\"quiznav\"><button onclick=\"prevQ()\">←</button><span id=\"qcount\"></span><button onclick=\"nextQ()\">→</button></div>"}, {"title": "Exit Reflection", "time": 3, "html": "<div class=\"head\"><div><span class=\"stage\">57–60 MIN · EXIT</span><h2>Finish the sentence</h2></div><span class=\"time\">3 min</span></div><div class=\"prompt\">The Hero's Journey is useful because __________, but __________.</div><div class=\"card green\" style=\"margin-top:18px\"><h3>Next</h3><p>Lesson 6 flex: trace a familiar story's journey in an extended paragraph using conjunctions, or catch up where needed.</p></div>"}];const quiz=[{"q": "Which stage begins when ordinary life is disrupted by a challenge or problem?", "a": "Call to adventure"}, {"q": "Which stage involves leaving what is familiar?", "a": "Into the unknown"}, {"q": "Which stage usually contains repeated obstacles, failures and learning?", "a": "Trials and tests"}, {"q": "Which stage is the hero's greatest or decisive test?", "a": "The final challenge"}, {"q": "Which stage shows what the hero gains and how they change?", "a": "Reward and return"}, {"q": "A hero loses a first attempt, gains an ally and learns a new skill. Which stage?", "a": "Trials and tests"}, {"q": "The hero finally confronts the central enemy. Which stage?", "a": "The final challenge"}, {"q": "True or false: 'return' must always mean physically going back home.", "a": "False — the return can be emotional, symbolic or literal."}, {"q": "Put the five stages in order.", "a": "Call to adventure → Into the unknown → Trials and tests → The final challenge → Reward and return"}, {"q": "Give one stage from a story you know and explain why it fits.", "a": "Open response — check stage accuracy + relevant evidence."}];let current=0,secs=0,running=false,intv=null,hide=false,qidx=0;const nav=document.getElementById('nav');slides.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML='<div class="n">'+(i+1)+'</div><div><strong>'+s.title+'</strong><span>'+s.time+' min</span></div>';b.onclick=()=>render(i);nav.appendChild(b);});
function render(i){current=i;document.getElementById('slide').innerHTML=slides[i].html;document.getElementById('topTitle').textContent=slides[i].title;document.getElementById('counter').textContent=(i+1)+' / '+slides.length;document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';[...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));reset(slides[i].time);document.querySelector('.content').scrollTop=0;if(slides[i].title==='Quiz Time'){qidx=0;renderQ();}}
function next(){if(current<slides.length-1)render(current+1)}function prev(){if(current>0)render(current-1)}function update(){let m=Math.floor(secs/60),s=secs%60;document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function reset(m){clearInterval(intv);running=false;secs=m*60;document.getElementById('timerBtn').textContent='Start';update()}function toggleTimer(){if(running){clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Start'}else{running=true;document.getElementById('timerBtn').textContent='Pause';intv=setInterval(()=>{if(secs>0){secs--;update()}else{clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Done'}},1000)}}function plus(){secs+=60;update()}function minus(){secs=Math.max(0,secs-60);update()}function toggle(id){document.getElementById(id).classList.toggle('show')}function toggleNotes(){hide=!hide;document.body.classList.toggle('hide',hide)}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}function openLB(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('show')}function closeLB(){document.getElementById('lb').classList.remove('show')}function renderQ(){const q=quiz[qidx];document.getElementById('quizBox').innerHTML='<div class="qcard"><div class="qnum">Question '+(qidx+1)+' of '+quiz.length+'</div><div class="qtext">'+q.q+'</div><button class="reveal" onclick="document.getElementById(\'qa\').classList.toggle(\'show\')">Reveal answer</button><div id="qa" class="quizanswer">'+q.a+'</div></div>';document.getElementById('qcount').textContent=(qidx+1)+' / '+quiz.length;}function nextQ(){if(qidx<quiz.length-1){qidx++;renderQ()}}function prevQ(){if(qidx>0){qidx--;renderQ()}}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();toggleTimer()}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();if(e.key==='Escape')closeLB();});render(0);
</script></body></html>
