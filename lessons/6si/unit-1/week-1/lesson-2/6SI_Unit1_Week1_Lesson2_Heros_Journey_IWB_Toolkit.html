<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6SI Lesson 2 - Hero's Journey IWB</title>
<style>
:root{--navy:#18395F;--navy2:#102B49;--teal:#2D817C;--orange:#D6902E;--paper:#FFFDF9;--ink:#202A35;--muted:#6D7782;--line:#D7DFE5;--pale:#EEF4F7;--green:#E5F1EA;--gold:#F8ECD8}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e8edf1;color:var(--ink)}body{overflow:hidden}button,input{font:inherit}
.app{height:100%;display:grid;grid-template-columns:292px 1fr}.side{background:linear-gradient(180deg,var(--navy2),var(--navy));color:white;padding:20px 16px;display:flex;flex-direction:column;gap:14px}.brand small{text-transform:uppercase;letter-spacing:.16em;color:#bfd0df;font-weight:900;font-size:11px}.brand h1{font:700 25px/1.05 Georgia,serif;margin:8px 0}.brand p{color:#d9e5ef;font-size:12.5px;line-height:1.4}#nav{display:flex;flex-direction:column;gap:6px;overflow:auto}#nav button{border:0;background:rgba(255,255,255,.07);color:white;border-radius:12px;padding:9px 10px;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:9px;cursor:pointer}#nav button.active{background:white;color:var(--navy2)}.n{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:900}#nav button.active .n{background:var(--gold);color:#7b5011}#nav strong{display:block;font-size:12px}#nav span{font-size:10px;opacity:.72}.sidefoot{margin-top:auto;display:flex;gap:7px}.sidefoot button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:white;padding:8px;border-radius:9px;font-weight:800}
.main{display:grid;grid-template-rows:72px 1fr 68px;min-width:0}.top{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.kicker{font-size:10px;letter-spacing:.15em;color:var(--teal);font-weight:900;text-transform:uppercase}#topTitle{font:700 21px Georgia,serif;color:var(--navy2)}.tools{display:flex;gap:8px;align-items:center}.timer{display:flex;gap:6px;align-items:center;background:var(--pale);border:1px solid #cad8de;padding:6px 8px;border-radius:11px}.timer b{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:8px 10px;border-radius:9px;font-weight:850;cursor:pointer}.btn.dark{background:var(--navy);color:white}
.content{padding:20px 24px;overflow:auto}#slide{max-width:1190px;margin:auto;background:var(--paper);border:1px solid #dce2e7;border-radius:22px;min-height:calc(100vh - 176px);padding:28px 32px;box-shadow:0 18px 50px rgba(16,43,73,.14)}.head{display:flex;justify-content:space-between;gap:18px}.stage{display:inline-block;background:var(--navy);color:white;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900}h2{font:700 38px/1.05 Georgia,serif;color:var(--navy2);margin:11px 0 7px}.lead{font-size:18px;line-height:1.5;color:#3e4b58;margin:0}.time{background:var(--gold);color:#865812;border-radius:11px;padding:8px 11px;font-weight:900;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.card.soft{background:var(--pale)}.card.green{background:var(--green)}.card.gold{background:var(--gold)}.card h3{margin:0 0 7px;color:var(--teal);font-size:14px;text-transform:uppercase}.card p,.card li{font-size:16px;line-height:1.45}.task{margin-top:17px;border:2px solid var(--teal);border-radius:17px;background:#fbffff;padding:18px 20px}.task small{display:block;color:var(--teal);text-transform:uppercase;letter-spacing:.13em;font-weight:900}.task .big{font:700 28px/1.3 Georgia,serif;color:var(--navy2);margin-top:6px}.prompt{margin-top:18px;border-left:5px solid var(--orange);background:#fff8ed;border-radius:0 15px 15px 0;padding:17px 20px;font:700 24px/1.35 Georgia,serif;color:#4b351c}.note{margin-top:17px;border:1px dashed #b9c6cf;background:#f8fafb;border-radius:13px;padding:12px 14px;color:#4b5966;font-size:13px}body.hideNotes .note{display:none}
.photo-layout{display:grid;grid-template-columns:minmax(360px,.95fr) 1.25fr;gap:20px;align-items:start;margin-top:18px}.photo-card{margin:0;background:white;border:1px solid var(--line);border-radius:17px;padding:10px}.photo-card img{width:100%;max-height:58vh;object-fit:contain;border-radius:11px;cursor:zoom-in}.photo-card figcaption{font-size:11px;color:var(--muted);padding:8px 4px 1px}
.stages{display:grid;gap:9px}.stages>div{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;background:white;padding:11px 13px;font-weight:800;color:var(--navy2)}.stages b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:white}.bigstage>div{display:grid;grid-template-columns:34px 190px 1fr}.bigstage input{border:0;border-bottom:1px solid #aeb9c2;padding:6px 8px;outline:none}
.sequence{display:grid;gap:10px;margin-top:20px}.sequence button{text-align:left;border:1px solid var(--line);background:white;border-radius:13px;padding:14px 16px;font-size:17px;cursor:pointer}.sequence button.on{background:var(--gold);border-color:#ddb878}.reveal{margin-top:18px;background:var(--navy);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:900;cursor:pointer}.answer{display:none;margin-top:13px;background:var(--green);border:1px solid #bed8c8;border-radius:12px;padding:16px;font-weight:850;color:var(--navy2)}.answer.show{display:block}
.video-card{margin-top:18px;border-radius:18px;padding:24px;background:linear-gradient(135deg,var(--navy2),var(--teal));color:white;text-align:center}.play{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:white;color:var(--navy);font-size:27px;margin:0 auto 10px}.video-card h3{font:700 28px Georgia,serif;margin:4px}.video-card p{color:#e4eef4}.video-btn{display:inline-block;background:white;color:var(--navy);text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:900}
.footer{background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.progress{height:7px;background:#e8eef2;border-radius:99px;overflow:hidden;flex:1;max-width:560px}#prog{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));width:0}.pager{display:flex;align-items:center;gap:8px}.pager button{border:0;border-radius:10px;padding:9px 15px;font-weight:900;cursor:pointer}.prev{background:#eaf0f4;color:var(--navy)}.next{background:var(--navy);color:white}#counter{font-size:12px;color:var(--muted);font-weight:800;min-width:60px;text-align:center}
.lightbox{position:fixed;inset:0;background:rgba(7,19,32,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.lightbox.show{display:flex}.lightbox img{max-width:96vw;max-height:94vh}.lightbox button{position:absolute;top:16px;right:20px;width:42px;height:42px;border-radius:50%;border:0;background:white;font-size:20px;font-weight:900}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid2,.grid3,.photo-layout{grid-template-columns:1fr}}
</style></head><body>

const slides=[{"title": "Lesson Launch", "time": 3, "html": "<div class=\"head\"><div><span class=\"stage\">UNIT 1 · LESSON 2</span><h2>The Hero's Journey</h2><p class=\"lead\">Today: learn a recurring story structure, then test whether it really fits the stories we know.</p></div><span class=\"time\">3 min</span></div><div class=\"task\"><small>Learning goal</small><div class=\"big\">I can identify the five stages and apply them to a familiar narrative.</div></div><div class=\"note\"><b>Teacher:</b> Keep the idea of a \"model, not a law\" in reserve until later.</div>"}, {"title": "Starter — Put It in Order", "time": 5, "html": "<div class=\"head\"><div><span class=\"stage\">0–5 MIN · RETRIEVAL</span><h2>What usually happens in an adventure?</h2><p class=\"lead\">Put these generic moments into the most logical order.</p></div><span class=\"time\">5 min</span></div><div class=\"sequence\" id=\"sequence\"><button onclick=\"pick(this)\">A hero faces the hardest test.</button><button onclick=\"pick(this)\">Something disrupts ordinary life.</button><button onclick=\"pick(this)\">The hero returns changed.</button><button onclick=\"pick(this)\">The hero enters an unfamiliar world.</button><button onclick=\"pick(this)\">The hero faces obstacles and learns.</button></div><div class=\"prompt\">There may be more than one defensible order. Justify yours.</div><div class=\"note\"><b>Teacher:</b> Do not reveal the official stage names yet.</div>"}, {"title": "Ignite p.12 — Meet the Model", "time": 7, "html": "<div class=\"head\"><div><span class=\"stage\">5–12 MIN · IGNITE p.12</span><h2>Meet the five-stage Hero's Journey</h2><p class=\"lead\">Use the textbook diagram as our course model.</p></div><span class=\"time\">7 min</span></div><div class=\"photo-layout\"><figure class=\"photo-card\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAg >1</b> Call to adventure</div><div><b>2</b> Into the unknown</div><div><b>3</b> Trials and tests</div><div><b>4</b> The final challenge</div><div><b>5</b> Reward and return</div></div></div></div><div class=\"note\"><b>Teacher:</b> Paraphrase each stage; stress that \"return\" can be emotional rather than literally going home.</div>"}, {"title": "Memory Check", "time": 4, "html": "<div class=\"head\"><div><span class=\"stage\">12–16 MIN · NO PEEKING</span><h2>Can you rebuild the journey?</h2><p class=\"lead\">With a partner, write all five stages in order from memory.</p></div><span class=\"time\">4 min</span></div><div class=\"task\"><small>Success</small><div class=\"big\">5 stages · correct order · one-sentence meaning for any two</div></div><button class=\"reveal\" onclick=\"document.getElementById('answer').classList.toggle('show')\">Reveal answer</button><div class=\"answer\" id=\"answer\">Call to adventure → Into the unknown → Trials and tests → The final challenge → Reward and return</div>"}, {"title": "Watch the Video", "time": 8, "html": "<div class=\"head\"><div><span class=\"stage\">16–24 MIN · VIDEO</span><h2>Does every Hero's Journey model look the same?</h2><p class=\"lead\">While watching, note what matches our five stages and anything that is extra or different.</p></div><span class=\"time\">8 min</span></div><div class=\"video-card\"><div><div class=\"play\">▶</div><h3>Hero's Journey video</h3><p>Open the unit's linked YouTube video in a new tab.</p><a class=\"video-btn\" href=\"https://www.youtube.com/watch?v=Hhk4N9AOoCA\" target=\"_blank\" rel=\"noopener\">Play video ↗</a></div></div><div class=\"grid2\"><div class=\"card green\"><h3>Matches</h3><p>What feels equivalent to our five stages?</p></div><div class=\"card gold\"><h3>Different / Extra</h3><p>What does the video add, split or rename?</p></div></div><div class=\"note\"><b>Teacher:</b> Key point: versions of the Hero's Journey vary. Ignite deliberately uses a simplified five-stage model.</div>"}, {"title": "Guided Mapping", "time": 10, "html": "<div class=\"head\"><div><span class=\"stage\">24–34 MIN · WE DO</span><h2>Map one story together</h2><p class=\"lead\">Choose a story most of the class knows. Build the journey with evidence.</p></div><span class=\"time\">10 min</span></div><div class=\"stages bigstage\"><div><b>1</b><span>Call to adventure</span><input placeholder=\"Class example…\"></div><div><b>2</b><span>Into the unknown</span><input placeholder=\"Class example…\"></div><div><b>3</b><span>Trials and tests</span><input placeholder=\"Class example…\"></div><div><b>4</b><span>Final challenge</span><input placeholder=\"Class example…\"></div><div><b>5</b><span>Reward and return</span><input placeholder=\"Class example…\"></div></div><div class=\"prompt\">Can one event fit more than one stage?</div><div class=\"note\"><b>Teacher:</b> Model cautious reasoning. Don't pretend every mapping is neat.</div>"}, {"title": "Your Story Map", "time": 12, "html": "<div class=\"head\"><div><span class=\"stage\">34–46 MIN · YOU DO</span><h2>Map a story you know well</h2><p class=\"lead\">Use Worksheet 1. Choose a book, film, game or myth and map all five stages.</p></div><span class=\"time\">12 min</span></div><div class=\"task\"><small>For every stage</small><div class=\"big\">Name the moment + explain why it fits.</div></div><div class=\"grid2\"><div class=\"card soft\"><h3>Support</h3><p>“The hero enters the unknown when… because…”</p></div><div class=\"card gold\"><h3>Stretch</h3><p>Mark any stage that is repeated, blurred or difficult to identify.</p></div></div><div class=\"note\"><b>Teacher:</b> Circulate and challenge unsupported labels: “What actually happens in the story?”</div>"}, {"title": "Does the Pattern Fit?", "time": 7, "html": "<div class=\"head\"><div><span class=\"stage\">46–53 MIN · EVALUATE</span><h2>Model… or formula?</h2><p class=\"lead\">Use Worksheet 2 to compare two familiar stories.</p></div><span class=\"time\">7 min</span></div><div class=\"grid3\"><div class=\"card green\"><h3>Strong fit</h3><p>Most stages are clear and convincing.</p></div><div class=\"card gold\"><h3>Partial fit</h3><p>Some stages blur, repeat or disappear.</p></div><div class=\"card soft\"><h3>Weak fit</h3><p>The mapping only works if we force it.</p></div></div><div class=\"prompt\">Are we discovering a pattern — or imposing one?</div>"}, {"title": "60-Second Pitch", "time": 5, "html": "<div class=\"head\"><div><span class=\"stage\">53–58 MIN · SPEAK</span><h2>Make your case in 60 seconds</h2><p class=\"lead\">Your pair must convince us that your chosen story is a strong, partial or weak Hero's Journey.</p></div><span class=\"time\">5 min</span></div><div class=\"task\"><small>Must include</small><div class=\"big\">a verdict + at least three stage references + one piece of strong evidence</div></div><div class=\"prompt\">Listeners: challenge one stage if the evidence feels weak.</div>"}, {"title": "Exit Ticket", "time": 2, "html": "<div class=\"head\"><div><span class=\"stage\">58–60 MIN · EXIT</span><h2>One stage. One story. One explanation.</h2><p class=\"lead\">Write two sentences.</p></div><span class=\"time\">2 min</span></div><div class=\"prompt\">Name one Hero's Journey stage and explain where it appears in a story you know.</div><div class=\"card green\" style=\"margin-top:18px\"><h3>Next lesson</h3><p>We apply the model to one of the earliest surviving adventure stories: <b>The Epic of Gilgamesh</b>.</p></div>"}];let current=0,secs=0,running=false,intv=null,notes=false;
const nav=document.getElementById('nav');slides.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML='<div class="n">'+(i+1)+'</div><div><strong>'+s.title+'</strong><span>'+s.time+' min</span></div>';b.onclick=()=>render(i);nav.appendChild(b);});
function render(i){current=i;document.getElementById('slide').innerHTML=slides[i].html;document.getElementById('topTitle').textContent=slides[i].title;document.getElementById('counter').textContent=(i+1)+' / '+slides.length;document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%';[...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));resetTimer(slides[i].time);document.querySelector('.content').scrollTop=0;}
function next(){if(current<slides.length-1)render(current+1)}function prev(){if(current>0)render(current-1)}function update(){let m=Math.floor(secs/60),s=secs%60;document.getElementById('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function resetTimer(m){clearInterval(intv);running=false;secs=m*60;document.getElementById('timerBtn').textContent='Start';update()}function toggleTimer(){if(running){clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Start'}else{running=true;document.getElementById('timerBtn').textContent='Pause';intv=setInterval(()=>{if(secs>0){secs--;update()}else{clearInterval(intv);running=false;document.getElementById('timerBtn').textContent='Done'}},1000)}}function plus(){secs+=60;update()}function minus(){secs=Math.max(0,secs-60);update()}function toggleNotes(){notes=!notes;document.body.classList.toggle('hideNotes',notes)}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}function pick(el){el.classList.toggle('on')}function openLightbox(src){document.getElementById('lbimg').src=src;document.getElementById('lb').classList.add('show')}function closeLB(){document.getElementById('lb').classList.remove('show')}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();toggleTimer()}if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='n')toggleNotes();if(e.key==='Escape')closeLB();});render(0);
</script></body></html>
