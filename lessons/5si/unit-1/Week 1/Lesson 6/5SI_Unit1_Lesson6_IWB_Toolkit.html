nt-size:19px}input[type=range]{width:250px;vertical-align:middle}select{font:16px system-ui;padding:10px;max-width:250px}blockquote{background:#fff2d5;color:#143247;border-left:8px solid #f6c56c;font:30px/1.4 Georgia;padding:24px;margin:20px 0}details{padding:16px;background:#ffffff12;border-radius:15px}summary{color:#ffd27a}nav{position:fixed;bottom:0;width:100%;display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:8px 16px;background:#06131ef5;border-top:1px solid #4a6d83;z-index:10}nav button{font-size:14px;padding:10px 12px;margin:2px}#clock{font:700 25px monospace;color:#ffce79;margin-left:auto}#count{font-size:16px}#cue{position:fixed;bottom:110px;right:20px;max-width:580px;background:#fff4da;color:#132d3f;padding:20px;border-radius:15px;font-size:20px;box-shadow:0 10px 35px #0009;z-index:15}#black{position:fixed;inset:0;background:#000;z-index:100}[hidden]{display:none!important}@media(max-width:900px){.beatgrid,.vocab{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}main{padding-bottom:230px}.graphKey{grid-template-columns:repeat(2,1fr)}}</style></head><body><main id="main"><div class="small">5SI ENGLISH · UNIT 1 · LESSON 6</div><h1 id="title"></h1><div id="body"></div></main><nav><button onclick="go(n-1)">← Back</button><button onclick="go(n+1)">Next →</button><span id="count"></span><select id="jump" aria-label="Jump to lesson screen" onchange="go(+this.value)"></select><button id="preset" onclick="preset()">Start timer</button><button id="pause" onclick="pauseTimer()">Pause</button><button onclick="resetTimer()">Reset timer</button><button onclick="teacher()">Teacher cue</button><button onclick="blackout()">Blackout</button><button onclick="full()">Fullscreen</button><span id="clock">0:00</span></nav><aside id="cue" hidden></aside><div id="black" hidden onclick="blackout()"></div><script>const slides=[{"title": "Structure, delay<br>and the ending", "body": "<p>What does Bradbury make us wait for?</p><p class=\"small\">5 reorder \u00b7 10 vocabulary \u00b7 20 curve \u00b7 15 discussion \u00b7 5 title</p>", "note": "Prepare the story and Worksheets 1\u20133. The graph plus two causal explanations is the assessed evidence.", "mins": 0, "kind": "hero"}, {"title": "Put the story back together", "body": "<div id=\"beats\" class=\"beatgrid\"></div><div><button onclick=\"moveBeat(-1)\">Move earlier \u2191</button><button onclick=\"moveBeat(1)\">Move later \u2193</button><button onclick=\"checkOrder()\">Check order</button><button onclick=\"revealOrder()\">Reveal order</button></div><p id=\"orderFeedback\" class=\"small\">Tap a card, then move it earlier or later.</p>", "note": "0\u20135: 2 minutes pairs, 2 minutes check text, 1 minute confirm. Worksheet 1. These cards follow the main action, not background chronology.", "mins": 5, "kind": "reorder"}, {"title": "Name the writer\u2019s choices", "body": "<div class=\"vocab\"><article><h3>Sequence</h3><p>The order in which events and information are presented.</p></article><article><h3>Pace</h3><p>How quickly or slowly the telling seems to move.</p></article><article><h3>Delay</h3><p>Postponing an expected action, answer or return to a focus.</p></article><article><h3>Shift of focus</h3><p>Moving the reader\u2019s attention to another person or event.</p></article><article><h3>Climax</h3><p>A point of greatest tension or decisive confrontation.</p></article><article><h3>Resolution</h3><p>What is settled at the end; some questions may remain open.</p></article></div>", "note": "5\u20138: explain the six terms. The peak or climax can be debated; justify the reader response.", "mins": 3, "kind": ""}, {"title": "What changes when we wait?", "body": "<div class=\"cols\"><article><h3>Immediate</h3><p>The rain returned. They remembered Margot and immediately released her.</p></article><article><h3>Delayed</h3><p>The rain returned. They remembered Margot. The account dwelt on silence, exchanged looks and a slow return before her release.</p></article></div><p class=\"small\">Teacher-created summaries, not quotations. What does the second version make us anticipate?</p>", "note": "8\u201311: teach how intervening actions and attention to hesitation postpone release. Slow pace can heighten tension.", "mins": 3, "kind": ""}, {"title": "Name it. Explain it.", "body": "<p id=\"vexample\"></p><button onclick=\"vReveal()\">Reveal a reading</button><button onclick=\"vNext()\">New example</button><p id=\"vanswer\" class=\"answer\"></p>", "note": "11\u201315: accept overlapping vocabulary when the pupil explains it. Naming a term alone is not analysis.", "mins": 4, "kind": "vcheck"}, {"title": "Calibrate the curve", "body": "<p><b>Vertical:</b> reader apprehension / uncertainty, 0\u201310.</p><p><b>Horizontal:</b> order of the main action, not elapsed time.</p><p class=\"gold\">Imagine a first reading. Do not give the reader later knowledge too early.</p>", "note": "15\u201318: demonstrate beat 1 on the next screen. Tension is not happiness, noise or character excitement.", "mins": 3, "kind": ""}, {"title": "Plot your interpretation", "body": "<div id=\"graph\"></div><div class=\"graphControls\"><label>Beat <select id=\"beatSelect\" onchange=\"pickBeat(+this.value)\"></select></label><label>Tension <input id=\"level\" type=\"range\" min=\"0\" max=\"10\" step=\"1\" value=\"5\" oninput=\"setLevel(+this.value)\"></label><strong id=\"levelRead\">Unplotted</strong><button onclick=\"setLevel(+$(&quot;level&quot;).value)\">Plot selected beat</button></div><p class=\"small\">Choose a beat and adjust its level, or tap the graph. Gold = class curve. Violet dashes = optional model.</p><button onclick=\"toggleModel()\">Show / hide one model</button><button onclick=\"clearGraph()\">Clear class curve</button>", "note": "18\u201325: plot all eight points on Worksheet 2. Keep model hidden until pupils have a reading. Show it later as an alternative, not a marking template.", "mins": 7, "kind": "graph"}, {"title": "Two annotations that explain", "body": "<p><b>A.</b> At beat(s) __, Bradbury [choice + detail]. This changes tension because the reader __.</p><p><b>B.</b> At beat(s) __, Bradbury [different choice + detail]. This changes tension because the reader __.</p><p class=\"gold\">At least one must explain delay. Add A and B to the curve.</p>", "note": "25\u201332: individual annotations on Worksheet 2. Exact short quotation or precise paraphrase. Ask what is postponed and why the wait matters.", "mins": 7, "kind": ""}, {"title": "Pressure-test the explanation", "body": "<blockquote>\u201cBradbury uses delay to create tension.\u201d</blockquote><button onclick=\"toggleAnswer()\">Reveal the missing bridge</button><div id=\"answer\" hidden><p>What is delayed? How? What are we waiting for, and why does it matter?</p><p class=\"small\">By lingering on the slow return, Bradbury postpones Margot\u2019s release, making the reader anticipate the difficult encounter.</p></div>", "note": "32\u201335: peer check and repair. Do not use this model in place of a pupil\u2019s second distinct annotation.", "mins": 3, "kind": ""}, {"title": "The door opens. What is settled?", "body": "<div class=\"cols\"><article><h3>Settled</h3><p>What definitely happens?</p></article><article><h3>Left open</h3><p>What are we not told?</p></article></div><p>Re-read from remembering Margot to the final release.</p><button onclick=\"toggleAnswer()\">Reveal indicative answers</button><div id=\"answer\" hidden><p>She is released. Her reaction, forgiveness and later consequences are not narrated.</p></div>", "note": "35\u201338: Worksheet 3. The door is opened and Margot is let out; do not call this practical action unresolved.", "mins": 3, "kind": "hero"}, {"title": "Discuss the wait", "body": "<p id=\"discussion\"></p><button onclick=\"nextDiscussion()\">Next prompt</button><p class=\"small\">Propose \u2192 locate evidence \u2192 explain the effect \u2192 challenge or qualify.</p>", "note": "38\u201343: pairs. Swap speaker and challenger roles. Use Worksheet 3 to record a detail and effect.", "mins": 5, "kind": "discussion"}, {"title": "Must tension fall to zero?", "body": "<div class=\"cols\"><article><h3>Practical release</h3><p>Her confinement ends.</p></article><article><h3>Emotional closure</h3><p>The consequences remain uncertain.</p></article></div><p>Defend two different final scores using the text.</p>", "note": "43\u201347: compare readings. Relief and unease can coexist. Do not force agreement with the teacher curve.", "mins": 4, "kind": ""}, {"title": "Return to your curve", "body": "<p>Keep or revise one point. Improve one causal annotation.</p><p>\u201cI keep/change point __ because Bradbury __, which makes the reader __.\u201d</p><button onclick=\"go(6)\">Revisit class graph</button>", "note": "47\u201350: revise Worksheet 2 and explain the revision on Worksheet 3. After viewing the graph, use the screen menu to return here.", "mins": 3, "kind": ""}, {"title": "A title with a reason", "body": "<p>Give the story an alternative title.</p><p>Explain how it draws attention to <b>structure, delay or the ending</b>.</p><details><summary>Need a starting point?</summary><p>Think about waiting, a change of focus, a return or what remains unresolved.</p></details>", "note": "50\u201355: 2 minutes title; 2 minutes explanation; 1 minute share and submit the graph. Titles do not replace causal annotations.", "mins": 5, "kind": "hero"}, {"title": "Hand in the thinking", "body": "<p>Eight points \u00b7 a consistent reader perspective \u00b7 two causal explanations.</p><p class=\"gold\">At least one explanation of delay.</p><p class=\"small\">Next lesson: develop one strong annotation into an analytical paragraph.</p>", "note": "Collect Worksheet 2. Use /10 rubric. Keep Worksheet 3 for discussion and title feedback.", "mins": 0, "kind": "art"}],assets={"hero": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocH function selectCard(i){selected=i;drawOrder()}
function moveBeat(dir){const target=selected+dir;if(target<0||target>7)return;[order[selected],order[target]]=[order[target],order[selected]];selected=target;drawOrder();$('orderFeedback').textContent='Order changed. Check against the story.'}
function checkOrder(){const correct=order.filter((x,i)=>x===i).length;$('orderFeedback').textContent=correct===8?'All eight beats are in order. What does the writer make us wait for?':correct+' of 8 positions correct. Look again at cause and consequence.'}
function revealOrder(){order=[0,1,2,3,4,5,6,7];selected=0;drawOrder();checkOrder()}
function drawVocab(){$('vexample').textContent=vocabExamples[v][0];$('vanswer').textContent=''}
function vNext(){v=(v+1)%vocabExamples.length;drawVocab()}function vReveal(){$('vanswer').textContent=vocabExamples[v][1]}
function toggleAnswer(){$('answer').hidden=!$('answer').hidden}
function nextDiscussion(){d=(d+1)%questions.length;$('discussion').textContent=questions[d]}
function pickBeat(i){beat=i;$('beatSelect').value=beat;$('level').value=values[beat]===null?5:values[beat];$('levelRead').textContent=values[beat]===null?'Unplotted':values[beat]+' / 10';drawGraph()}
function setLevel(level){values[beat]=Math.max(0,Math.min(10,Math.round(level)));$('level').value=values[beat];$('levelRead').textContent=values[beat]+' / 10';drawGraph()}
function toggleModel(){model=!model;drawGraph()}
function clearGraph(){values=Array(8).fill(null);pickBeat(0)}
function plotTap(event){const r=event.currentTarget.getBoundingClientRect();const x=(event.clientX-r.left)/r.width*1000,y=(event.clientY-r.top)/r.height*390;if(x<60||x>980||y<15||y>325)return;beat=Math.max(0,Math.min(7,Math.round((x-70)/900*7)));$('beatSelect').value=beat;setLevel((315-y)/29)}
function drawGraph(){let svg='<svg viewBox="0 0 1000 390" role="img" aria-label="Reader tension across eight story beats; tap a column to plot" onclick="plotTap(event)">';for(let t=0;t<=10;t++){let y=315-t*29;svg+='<line x1="70" y1="'+y+'" x2="970" y2="'+y+'" stroke="#ffffff20"/><text x="50" y="'+(y+6)+'" text-anchor="end">'+t+'</text>'}for(let i=0;i<8;i++){let x=70+i*900/7;svg+='<line x1="'+x+'" y1="25" x2="'+x+'" y2="315" stroke="#ffffff20"/><text x="'+x+'" y="345" text-anchor="middle">'+(i+1)+'</text>'}svg+='<text x="70" y="19" class="axis">READER TENSION</text><text x="970" y="379" text-anchor="end" class="axis">STORY ORDER →</text>';if(model){const m=[3,5,8,6,5,7,9,6];svg+='<polyline points="'+m.map((v,i)=>(70+i*900/7)+','+(315-v*29)).join(' ')+'" fill="none" stroke="#cfa9ff" stroke-width="4" stroke-dasharray="9 7"/>'}let prev=null;values.forEach((v,i)=>{if(v===null){prev=null;return}const x=70+i*900/7,y=315-v*29;if(prev)svg+='<line x1="'+prev[0]+'" y1="'+prev[1]+'" x2="'+x+'" y2="'+y+'" stroke="#ffd27a" stroke-width="4"/>';svg+='<circle cx="'+x+'" cy="'+y+'" r="'+(i===beat?9:6)+'" fill="#ffd27a" stroke="#061828" stroke-width="2"/>';prev=[x,y]});svg+='</svg><div class="graphKey">'+names.map((x,i)=>'<span>'+(i+1)+'. '+x+'</span>').join('')+'</div>';$('graph').innerHTML=svg}
function drawClock(){$('clock').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}
function startTimer(seconds){clearInterval(interval);total=remaining=seconds;running=true;$('pause').textContent='Pause';drawClock();interval=setInterval(()=>{if(running&&remaining>0){remaining--;drawClock();if(remaining===0){running=false;$('clock').textContent='Time complete';$('pause').textContent='Resume';clearInterval(interval)}}},1000)}
function preset(){startTimer((slides[n].mins||5)*60)}function pauseTimer(){if(remaining===0)return;running=!running;$('pause').textContent=running?'Pause':'Resume'}function resetTimer(){clearInterval(interval);remaining=total||300;running=false;$('pause').textContent='Resume';drawClock();interval=setInterval(()=>{if(running&&remaining>0){remaining--;drawClock();if(!remaining){running=false;$('clock').textContent='Time complete';clearInterval(interval)}}},1000)}
function teacher(){$('cue').textContent=slides[n].note;$('cue').hidden=!$('cue').hidden}function blackout(){$('black').hidden=!$('black').hidden}function full(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()}
$('jump').innerHTML=slides.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s.title.replace(/<br>/g,' ')+'</option>').join('');document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(n+1);if(e.key==='ArrowLeft')go(n-1);if(e.key.toLowerCase()==='t')teacher();if(e.key.toLowerCase()==='b')blackout();if(e.key.toLowerCase()==='f')full()});render();
</script></body></html>
