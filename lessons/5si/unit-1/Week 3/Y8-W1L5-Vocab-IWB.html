<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 English: Words in Context, and What Words Point To</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;600;800&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1d2433; --ink2:#5a6275; --line:#e4dccb;
  --rose:#f7d9dc; --rose-ink:#9b2f3f; --teal:#d3ece8; --teal-ink:#1d6b62;
  --amber:#fbe7c0; --amber-ink:#8a5a09; --lav:#e3def5; --lav-ink:#4b3d8f;
  --acc:#7a2231; --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.08);
  --sans:'Figtree',system-ui,sans-serif; --serif:'Literata',Georgia,serif; --hand:'Caveat',cursive;
}
[data-theme="dark"]{
  --bg:#171a22; --paper:#212532; --ink:#eef0f5; --ink2:#a9b0c2; --line:#343a4b;
  --rose:#4a2830; --rose-ink:#f3a9b5; --teal:#1f3d3a; --teal-ink:#8fdcd0;
  --amber:#463715; --amber-ink:#f5cf7d; --lav:#2f2a4c; --lav-ink:#c3b8f7;
  --acc:#f09aa8; --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,1.25vw,22px)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.6rem 1.4rem}
.brand{font-weight:800;color:var(--acc);font-size:.95rem;line-height:1.2}
.brand small{display:block;color:var(--ink2);font-weight:600}
nav{display:flex;gap:.4rem;flex:1}
nav button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.45em 1.2em;font-weight:700}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.tools{display:flex;gap:.4rem;align-items:center}
.tb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:.6rem;padding:.35em .7em;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4em;text-align:center}
.timer.flash{animation:fl .6s 6}
@keyframes fl{50%{background:var(--rose);color:var(--rose-ink)}}
main{max-width:70rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
h1{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.8rem);margin:.2rem 0 .8rem;line-height:1.15}
.lead{font-size:1.25rem;color:var(--ink2);margin:0 0 1.4rem;max-width:48rem}
.card{background:var(--paper);border-radius:1.1rem;box-shadow:var(--shadow);padding:1.5rem 1.8rem;margin-bottom:1.2rem}
.eq{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.6rem}
.eq .box{flex:1;min-width:11rem;border-radius:1rem;padding:1rem 1.2rem;text-align:center;font-weight:800;font-size:1.35rem}
.eq .box span{display:block;font-weight:600;font-size:.85rem;margin-top:.3rem;opacity:.9}
.b-point{background:var(--amber);color:var(--amber-ink)}
.b-ev{background:var(--lav);color:var(--lav-ink)}
.b-ex{background:var(--teal);color:var(--teal-ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;color:var(--ink2);font-weight:700}
.level{border-radius:999px;padding:.15em .8em;font-size:.85rem}
.lv-Easy{background:var(--teal);color:var(--teal-ink)}
.lv-Medium{background:var(--amber);color:var(--amber-ink)}
.lv-Hard{background:var(--rose);color:var(--rose-ink)}
.lv-Fun{background:var(--lav);color:var(--lav-ink)}
.text{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.45;margin:0 0 .8rem}
.q{font-style:italic;font-size:1.3rem;color:var(--acc);margin:0 0 1.2rem;font-weight:600}
.clue{border-radius:.25em;transition:background .25s,box-shadow .25s}
.show-clue .clue{background:var(--lav);box-shadow:0 0 0 .12em var(--lav-ink) inset;color:var(--lav-ink)}
.steps{display:grid;gap:.6rem}
.step{display:none;border-radius:.9rem;padding:.8rem 1.1rem;font-size:1.2rem;align-items:baseline;gap:.8rem}
.step.on{display:flex;animation:up .3s ease}
.step b{flex:0 0 9.5rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.s-point{background:var(--amber);color:var(--amber-ink)}
.s-ev{background:var(--lav);color:var(--lav-ink)}
.s-ex{background:var(--teal);color:var(--teal-ink)}
.s-bad{background:var(--rose);color:var(--rose-ink)}
.s-say{background:var(--rose);color:var(--rose-ink);font-family:var(--hand);font-size:1.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;align-items:center}
.btn{border:none;border-radius:.8rem;padding:.65em 1.3em;font-weight:800;background:var(--line);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.count{color:var(--ink2);font-weight:700}
.frame{font-family:var(--hand);font-size:1.5rem;color:var(--rose-ink);background:var(--rose);border-radius:.9rem;padding:.5rem 1.1rem;margin:0 .6rem 1.2rem 0;display:inline-block}
.parts{display:flex;gap:.4rem;margin:0 0 1rem;flex-wrap:wrap}
.parts button{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:.8rem;padding:.5em 1.1em;font-weight:800}
.parts button.on{border-color:var(--acc);color:var(--acc)}
.phead{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:1rem}
.phead h2{font-family:var(--serif);margin:0;font-size:1.8rem}
.phead .task{color:var(--ink2);font-weight:600;flex:1;min-width:14rem}
.item{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem 1rem;padding:1rem 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.num{background:var(--teal);color:var(--teal-ink);font-weight:800;border-radius:.6rem;text-align:center;padding:.35em 0;height:max-content}
.item .t{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.item .qq{font-style:italic;color:var(--acc);font-weight:600;margin-top:.3rem}
.item .reveal{grid-column:2;margin-top:.5rem}
.sub{grid-column:1/-1;font-weight:800;color:var(--ink2);margin-top:.4rem}
.ans{display:none;margin-top:.5rem;background:var(--teal);color:var(--teal-ink);border-radius:.8rem;padding:.6rem 1rem;font-size:1.05rem}
.ans.on{display:block}
.mini{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:.6rem;padding:.3em .8em;font-weight:700;font-size:.85rem}
.big .item .t{font-size:clamp(1.5rem,2.4vw,2.2rem)}
/* quote golf */
.holes,.draws{display:grid;gap:1rem}
.draws{grid-template-columns:repeat(auto-fit,minmax(24rem,1fr))}
.hole{border:2px dashed var(--line);border-radius:1rem;padding:1rem 1.2rem}
.hole .hh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:baseline;margin-bottom:.5rem}
.hole .hn{background:var(--amber);color:var(--amber-ink);font-weight:800;border-radius:999px;padding:.15em .9em}
.hole .pt{font-weight:800;font-size:1.2rem}
.hole .par{margin-left:auto;font-weight:800;color:var(--ink2)}
.hole .sent{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.strokes{display:none;margin-top:.6rem;background:var(--lav);color:var(--lav-ink);border-radius:.8rem;padding:.6rem 1rem;font-weight:700}
.strokes.on{display:block}
@media (max-width:700px){.step b{flex-basis:6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Year 8 English · Week 1, Lesson 5<small>Words in Context, and What Words Point To</small></div>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="tb" data-t="60">1m</button><button class="tb" data-t="60">1m</button><button class="tb" data-t="300">5m</button><button class="tb" data-t="600">10m</button>
    <span class="tb timer" id="timer">0:00</span>
    <button class="tb" id="theme" title="Light or dark">◐</button>
    <button class="tb" id="fs" title="Full screen">⛶</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- content ---------- */
const R = {
  N:['s-point','Clues around it'], L:['s-ev','Meaning here'], X:['s-ex','Swap test'],
  BAD:['s-bad','Too weak'], FIX:['s-ex','Stronger'], SAY:['s-say','Say it'],
  PICK:['s-ev','Points back to'], WHY:['s-ex','How you know']
};

const SKILL = {
  text:'Nobody spoke. The teacher’s voice was [clipped] as she read out the names.',
  q:'What does “clipped” mean here?',
  rows:[
    ['N','“Nobody spoke”, reading out names one by one: the room is tense and she is holding herself in.'],
    ['L','Short and sharp. She is cutting her words off.'],
    ['X','Swap in “quick”: the speed fits, but the anger vanishes. “Clipped” is quick AND controlled, which is why it is the better word.'],
    ['SAY','Use the words around it. Then swap your word in and check nothing is lost.']
  ]
};

const TOGETHER = [
  {lv:'Easy', text:'After a fortnight without rain, the village well was completely [drammed].',
   q:'Invented word. What does it mean, and how do you know?',
   rows:[['N','“a fortnight without rain” and “well”.'],
     ['L','Dried up, empty.'],
     ['X','Swap in “dry”: it works. That is how you prove a guess: put your word back in the sentence.']]},
  {lv:'Easy', text:'She spoke so [flimmerly] that even the front row leaned in.',
   q:'Invented word. What does it mean, and how do you know?',
   rows:[['N','“even the front row leaned in”: people lean in when they cannot hear.'],
     ['L','Faint, barely audible.'],
     ['X','Swap in “quietly”: it fits. Swap in “loudly”: the sentence stops making sense, which proves it.']]},
  {lv:'Medium', text:'The queue [crawled] forward.',
   q:'Which word could replace “crawled”? Why is “moved” weaker?',
   rows:[['N','A queue that crawls is not just going: it is barely going.'],
     ['L','“Inched”, “shuffled”, “dragged”.'],
     ['X','“Moved” is true but it throws away the slowness and the frustration. A word that fits is not the same as a word that keeps the meaning.']]},
  {lv:'Medium', text:'The old rope bridge looked so [precarious] that the guide sent us across one at a time.',
   q:'What does “precarious” mean here?',
   rows:[['N','“old”, and the guide will only risk one person at a time.'],
     ['L','Unsteady, likely to give way.'],
     ['X','Swap in “unsafe”: close. “Precarious” adds the wobble: it could go at any moment.']]},
  {lv:'Medium', text:'Leo packed his boots, his map and his sandwiches. He left [all of it] on the kitchen table.',
   q:'What does “all of it” point back to?',
   rows:[['PICK','“his boots, his map and his sandwiches”.'],
     ['WHY','Point at the exact words, not a summary like “his stuff”.'],
     ['X','The three things are listed in one sentence, so one short phrase can replace them in the next.']]},
  {lv:'Medium', text:'Priya read the message, then the one before it. [Neither] made any sense.',
   q:'What does “Neither” point back to?',
   rows:[['PICK','“the message” and “the one before it”.'],
     ['WHY','“Neither” means not one of two, so you are looking for exactly two things.'],
     ['X','The reference word tells you how many to look for. Use that as a check.']]},
  {lv:'Hard', text:'Sam handed the trophy to his sister. [This] was the moment [he] had been dreading all week.',
   q:'What does “This” refer to? Who is “he”?',
   rows:[['PICK','“This” = handing the trophy to his sister. “He” = Sam.'],
     ['WHY','“This” points back to the whole action in the sentence before, not to one noun. “He” is Sam, because the sentence follows Sam’s action and it is Sam who has been dreading it.'],
     ['X','Careful: “his sister” is female, so “he” cannot be her. Check who the sentence is following.']]},
  {lv:'Hard', text:'His apology sounded [rehearsed].',
   q:'What does “rehearsed” suggest about the apology?',
   rows:[['N','Rehearsing is what you do before a performance.'],
     ['L','Prepared in advance, delivered rather than felt.'],
     ['X','Swap in “planned”: it loses the acting. “Rehearsed” hints the apology is a performance, so we doubt he means it.']]},
  {lv:'Fun', text:'A: The crowd turned [fractious] when the gates stayed shut.   B: The toast was so [crindled] that it snapped in half.',
   q:'Detective round: one of these words is real English. Which one?',
   rows:[['PICK','A. “Fractious” is a real word: bad-tempered and difficult to control.'],
     ['WHY','B is invented, but you can still work it out: burnt hard and dry enough to snap.'],
     ['X','That is the point of Part B: you do not need to have met a word before to work out what it is doing.']]}
];

const SHEET = {
  A:{title:'Part A: Do Now', task:'5 min, on your own. Last lesson: author’s craft. The writer ___ so that the reader ___.', time:300, items:[
    {n:'A1', t:'It was the last time anyone saw her alive.', q:'Why might a writer open a chapter with this sentence?',
     a:'The writer gives away the ending first so that the reader watches everything that follows for clues, and reads the ordinary details with dread because we already know what is coming.'},
    {n:'A2', t:'Dad said nothing. He put the car into gear and drove.', q:'Why does the writer not tell us how Dad feels?',
     a:'Show, don’t tell. The writer gives us the silence and the ordinary actions so that the reader works out he is furious or upset, and feels the tension in the car exactly as the child in the passenger seat would.'}
  ]},
  B:{title:'Part B: Nonsense Word Detective', task:'Pairs. Four of these words are invented. Work out what each one means and which words told you. Bonus: two are real English words. Which two?', time:300, draw:true, btnTime:60, revealLabel:'Meaning, clues, real or invented', cards:[
    {n:'1', t:'The soup was so brimmy that I had to add cold water before I could drink it.', dev:'brimmy', a:'Invented. Means boiling hot. Clues: you add cold water, and you cannot drink it yet.'},
    {n:'2', t:'After three weeks without rain, the riverbed was completely skelthed.', dev:'skelthed', a:'Invented. Means dried out, empty. Clues: three weeks without rain, and it is a riverbed.'},
    {n:'3', t:'He gave a quick nardle of his head to show that he agreed.', dev:'nardle', a:'Invented. Means a nod. Clues: “of his head” and “to show that he agreed”.'},
    {n:'4', t:'The old bridge had become so frangible that the council closed it to traffic.', dev:'frangible', a:'REAL. Means fragile, easily broken. Clues: “old” and the council closing it to traffic.'},
    {n:'5', t:'She spoke in a voice so quillish that even the front row could not hear her.', dev:'quillish', a:'Invented. Means faint or barely audible. Clue: even the front row could not hear.'},
    {n:'6', t:'The crowd turned truculent when the referee blew the final whistle.', dev:'truculent', a:'REAL. Means aggressive and spoiling for a fight. Clues: a crowd, a referee, and the final whistle.'}
  ]},
  C:{title:'Part C: Drill', task:'C1 to C4: words in context. C5 to C7: reference words. Point at the exact words.', time:600, items:[
    {sub:'C1 to C4: words in context'},
    {n:'C1', t:'The queue crawled forward.', q:'Which word could replace “crawled”? Why is “moved” a weaker answer?',
     a:'“Inched”, “shuffled” or “dragged”. “Moved” is weaker because it only says the queue was not still: it throws away the slowness and the frustration that “crawled” carries.'},
    {n:'C2', t:'Her voice was brittle as she thanked them for coming.', q:'What does “brittle” suggest about her here?',
     a:'Brittle things are hard on the outside but crack under the smallest pressure. It suggests she is holding herself together in public and is very close to breaking: the politeness is a thin shell.'},
    {n:'C3', t:'He scrutinised the photograph for a long time.', q:'Closest meaning: glanced at, examined closely, or ignored?',
     a:'Examined closely. “For a long time” rules out a glance, and you cannot ignore something you are still looking at. Scrutinise also suggests he is searching it for something.'},
    {n:'C4', t:'The minister’s answer to the question was slippery.', q:'What does “slippery” tell you about the answer?',
     a:'You cannot get hold of it. The answer slid away from the question rather than answering it, and the word hints this was deliberate, so the reader is invited to distrust the minister.'},
    {sub:'C5 to C7: reference words. Write the exact words each one points back to.'},
    {n:'C5', t:'Maya put the letter in the drawer with the others. She had never opened a single one of them.', q:'What does “them” refer to?',
     a:'“the others”, meaning the earlier letters already in the drawer. Not the one she has just put in: “a single one of them” looks back at the pile.'},
    {n:'C6', t:'The council promised new bins, better lighting and more frequent buses. None of it happened.', q:'What does “it” refer to?',
     a:'“new bins, better lighting and more frequent buses”: all three promises together. One short word replaces the whole list.'},
    {n:'C7', t:'Ravi handed the envelope to his brother. This was the moment he had dreaded for weeks.', q:'What does “This” refer to? Who is “he”, and how can you tell?',
     a:'“This” refers to the whole action: handing the envelope to his brother. “He” is Ravi, because the sentence follows Ravi and it is his action being described. (If the writer meant the brother, they would have to name him: this is exactly why reference words need checking.)'}
  ]},
  D:{title:'Part D: Exit Ticket', task:'On your own, 2 marks: 1 for the reference word, 1 for the word choice.', time:300, items:[
    {n:'D', t:'The storm had uprooted three trees, smashed a greenhouse and left half the village without power. Nobody had expected any of it.',
     q:'(a) What does “it” refer to? (b) Give one word that could replace “uprooted”, and say what it suggests about the storm.',
     a:'(a) “it” refers to the damage listed before it: “uprooted three trees, smashed a greenhouse and left half the village without power”. (b) “Tore up” or “ripped out”. “Uprooted” means the whole root came out of the ground, so it suggests the storm was violent enough to pull trees out completely, not just break branches.'}
  ]}
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const marked = s => esc(s).replace(/\[([^\]]+)\]/g,'<span class="clue">$1</span>');

const S = {tab:0, card:0, part:'A'};
const TABS = ['1  The skill','2  Together','3  Worksheet'];
function nav(){
  const n=$('#nav'); n.innerHTML='';
  TABS.forEach((t,i)=>n.append(el('button',{class:i===S.tab?'on':'',onclick:()=>{S.tab=i;render();}},t)));
}

function stepCard(d, meta){
  const box=el('div',{class:'card'});
  if(meta) box.append(meta);
  const text=el('p',{class:'text',html:marked(d.text)});
  box.append(text, el('p',{class:'q'},d.q));
  const steps=el('div',{class:'steps'});
  const nodes=d.rows.map(([key,t])=>{const [c,h]=R[key]; const s=el('div',{class:'step '+c},el('b',{},h),el('span',{},t)); steps.append(s); return s;});
  box.append(steps);
  const labels=d.rows.map(([k])=>R[k][1]);
  let k=0;
  const next=el('button',{class:'btn main'},labels[0]);
  const hide=el('button',{class:'btn'},'Hide all');
  function upd(){
    text.classList.toggle('show-clue',k>0);
    nodes.forEach((s,i)=>s.classList.toggle('on',i<k));
    next.textContent = k>=labels.length ? 'Done' : labels[k];
    next.disabled = k>=labels.length;
  }
  next.onclick=()=>{k=Math.min(labels.length,k+1);upd();};
  hide.onclick=()=>{k=0;upd();};
  box.append(el('div',{class:'row'},next,hide));
  box._next=()=>{ if(k<labels.length){k++;upd();return true;} return false; };
  upd();
  return box;
}

function render(){
  nav();
  const m=$('#main'); m.innerHTML=''; window._active=null;
  if(S.tab===0){
    m.append(el('h1',{},'You can work out a word you have never met.'),
      el('p',{class:'lead'},'The words around it tell you. Then test your guess by swapping it in.'),
      el('div',{class:'eq'},
        el('div',{class:'box b-point'},'Word in context',el('span',{},'the words around it give the meaning here')),
        el('div',{class:'box b-ev'},'Reference words',el('span',{},'this, it, them, he: they point back to something already said')),
        el('div',{class:'box b-ex'},'Test yourself',el('span',{},'swap your word in, or point at the exact words'))));
    window._active=stepCard(SKILL);
    m.append(window._active,
      el('div',{class:'frame'},'It means … because the sentence says …'));
  }
  if(S.tab===1){
    const d=TOGETHER[S.card];
    m.append(el('h1',{},'Together'),
      el('div',{class:'frame'},'It means … because the sentence says …'),
      el('div',{class:'frame'},'Point at the exact words, never “his stuff”.'));
    const meta=el('div',{class:'meta'},el('span',{class:'count'},`${S.card+1} of ${TOGETHER.length}`),
      el('span',{class:'level lv-'+d.lv},d.lv==='Fun'?'Detective round':d.lv));
    window._active=stepCard(d,meta);
    m.append(window._active);
    const prev=el('button',{class:'btn',onclick:()=>{S.card--;render();}},'← Previous');
    const nxt=el('button',{class:'btn main',onclick:()=>{S.card++;render();}},'Next example →');
    prev.disabled=S.card===0; nxt.disabled=S.card===TOGETHER.length-1;
    m.append(el('div',{class:'row'},prev,el('span',{class:'spacer'}),nxt));
  }
  if(S.tab===2){
    m.append(el('h1',{},'Your turn: the worksheet'), el('p',{class:'lead'},'Write all answers in your book. Number each one.'));
    const parts=el('div',{class:'parts'});
    Object.keys(SHEET).forEach(k=>parts.append(el('button',{class:k===S.part?'on':'',onclick:()=>{S.part=k;render();}},SHEET[k].title)));
    m.append(parts);
    const P=SHEET[S.part];
    const card=el('div',{class:'card'+(S.part==='D'?' big':'')});
    card.append(el('div',{class:'phead'},el('h2',{},P.title),el('span',{class:'task'},P.task),
      el('button',{class:'mini',onclick:()=>startTimer(P.time)},`Start ${P.time/60} min timer`),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.add('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.add('show-clue'));}},'Show all answers'),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.remove('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.remove('show-clue'));}},'Hide all')));
    if(P.draw){
      const grid=el('div',{class:'draws'});
      P.cards.forEach(c=>{
        const ans=el('div',{class:'strokes'},el('b',{},c.dev+'. '),c.a);
        grid.append(el('div',{class:'hole'},
          el('div',{class:'hh'},el('span',{class:'hn'},c.n),el('span',{class:'pt'},c.t)),
          el('div',{class:'row'},
            el('button',{class:'mini',onclick:()=>startTimer(P.btnTime||30)},(P.btnTime||30)+' sec'),
            el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},P.revealLabel||'Device and meaning')),
          ans));
      });
      card.append(grid);
    }
    (P.items||[]).forEach(it=>{
      if(it.sub){ card.append(el('div',{class:'item'},el('div',{class:'sub'},it.sub))); return; }
      const ans=el('div',{class:'ans'},it.a);
      card.append(el('div',{class:'item'},
        el('div',{class:'num'},it.n),
        el('div',{},el('div',{class:'t'},it.t), it.q?el('div',{class:'qq'},it.q):null,
          el('div',{class:'reveal'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},'Model answer'),ans))));
    });
    m.append(card, el('div',{class:'frame'},'Which words told you?'));
  }
}

/* ---------- timer ---------- */
let tLeft=0, tId=null;
function drawT(){ $('#timer').textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`; }
function startTimer(s){
  clearInterval(tId); tLeft=s; drawT(); $('#timer').classList.remove('flash');
  tId=setInterval(()=>{ tLeft--; drawT(); if(tLeft<=0){ clearInterval(tId); $('#timer').classList.add('flash'); } },1000);
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#timer').onclick=()=>{ clearInterval(tId); tLeft=0; drawT(); };

/* ---------- theme, full screen, keys ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
document.documentElement.dataset.theme=mq.matches?'dark':'light';
$('#theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
$('#fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,button')) return;
  if(e.key===' '||e.key==='Enter'){ if(window._active&&window._active._next){ e.preventDefault(); window._active._next(); } }
  if(e.key==='ArrowRight'){ if(S.tab===1&&S.card<TOGETHER.length-1){S.card++;render();} else if(S.tab<2){S.tab++;render();} }
  if(e.key==='ArrowLeft'){ if(S.tab===1&&S.card>0){S.card--;render();} else if(S.tab>0){S.tab--;render();} }
});
render();
</script>
