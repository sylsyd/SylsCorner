<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 English: Word Questions at Exam Speed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;600;800&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1d2433; --ink2:#5a6275; --line:#e4dccb;
  --rose:#f7d9dc; --rose-ink:#9b2f3f; --teal:#d3ece8; --teal-ink:#1d6b62;
  --amber:#fbe7c0; --amber-ink:#8a5a09; --lav:#e3def5; --lav-ink:#4b3d8f;
  --acc:#7a2231; --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.08);
  --sans:'Figtree',system-ui,sans-serif; --serif:'Literata',Georgia,serif; --hand:'Caveat',cursive;
}
[data-theme="dark"]{
  --bg:#171a22; --paper:#212532; --ink:#eef0f5; --ink2:#a9b0c2; --line:#343a4b;
  --rose:#4a2830; --rose-ink:#f3a9b5; --teal:#1f3d3a; --teal-ink:#8fdcd0;
  --amber:#463715; --amber-ink:#f5cf7d; --lav:#2f2a4c; --lav-ink:#c3b8f7;
  --acc:#f09aa8; --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,1.25vw,22px)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.6rem 1.4rem}
.brand{font-weight:800;color:var(--acc);font-size:.95rem;line-height:1.2}
.brand small{display:block;color:var(--ink2);font-weight:600}
nav{display:flex;gap:.4rem;flex:1}
nav button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.45em 1.2em;font-weight:700}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.tools{display:flex;gap:.4rem;align-items:center}
.tb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:.6rem;padding:.35em .7em;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4em;text-align:center}
.timer.flash{animation:fl .6s 6}
@keyframes fl{50%{background:var(--rose);color:var(--rose-ink)}}
main{max-width:70rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
h1{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.8rem);margin:.2rem 0 .8rem;line-height:1.15}
.lead{font-size:1.25rem;color:var(--ink2);margin:0 0 1.4rem;max-width:48rem}
.card{background:var(--paper);border-radius:1.1rem;box-shadow:var(--shadow);padding:1.5rem 1.8rem;margin-bottom:1.2rem}
.eq{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.6rem}
.eq .box{flex:1;min-width:11rem;border-radius:1rem;padding:1rem 1.2rem;text-align:center;font-weight:800;font-size:1.35rem}
.eq .box span{display:block;font-weight:600;font-size:.85rem;margin-top:.3rem;opacity:.9}
.b-point{background:var(--amber);color:var(--amber-ink)}
.b-ev{background:var(--lav);color:var(--lav-ink)}
.b-ex{background:var(--teal);color:var(--teal-ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;color:var(--ink2);font-weight:700}
.level{border-radius:999px;padding:.15em .8em;font-size:.85rem}
.lv-Easy{background:var(--teal);color:var(--teal-ink)}
.lv-Medium{background:var(--amber);color:var(--amber-ink)}
.lv-Hard{background:var(--rose);color:var(--rose-ink)}
.lv-Fun{background:var(--lav);color:var(--lav-ink)}
.text{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.45;margin:0 0 .8rem}
.q{font-style:italic;font-size:1.3rem;color:var(--acc);margin:0 0 1.2rem;font-weight:600}
.clue{border-radius:.25em;transition:background .25s,box-shadow .25s}
.show-clue .clue{background:var(--lav);box-shadow:0 0 0 .12em var(--lav-ink) inset;color:var(--lav-ink)}
.steps{display:grid;gap:.6rem}
.step{display:none;border-radius:.9rem;padding:.8rem 1.1rem;font-size:1.2rem;align-items:baseline;gap:.8rem}
.step.on{display:flex;animation:up .3s ease}
.step b{flex:0 0 9.5rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.s-point{background:var(--amber);color:var(--amber-ink)}
.s-ev{background:var(--lav);color:var(--lav-ink)}
.s-ex{background:var(--teal);color:var(--teal-ink)}
.s-bad{background:var(--rose);color:var(--rose-ink)}
.s-say{background:var(--rose);color:var(--rose-ink);font-family:var(--hand);font-size:1.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;align-items:center}
.btn{border:none;border-radius:.8rem;padding:.65em 1.3em;font-weight:800;background:var(--line);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.count{color:var(--ink2);font-weight:700}
.frame{font-family:var(--hand);font-size:1.5rem;color:var(--rose-ink);background:var(--rose);border-radius:.9rem;padding:.5rem 1.1rem;margin:0 .6rem 1.2rem 0;display:inline-block}
.parts{display:flex;gap:.4rem;margin:0 0 1rem;flex-wrap:wrap}
.parts button{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:.8rem;padding:.5em 1.1em;font-weight:800}
.parts button.on{border-color:var(--acc);color:var(--acc)}
.phead{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:1rem}
.phead h2{font-family:var(--serif);margin:0;font-size:1.8rem}
.phead .task{color:var(--ink2);font-weight:600;flex:1;min-width:14rem}
.item{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem 1rem;padding:1rem 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.num{background:var(--teal);color:var(--teal-ink);font-weight:800;border-radius:.6rem;text-align:center;padding:.35em 0;height:max-content}
.item .t{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.item .qq{font-style:italic;color:var(--acc);font-weight:600;margin-top:.3rem}
.item .reveal{grid-column:2;margin-top:.5rem}
.sub{grid-column:1/-1;font-weight:800;color:var(--ink2);margin-top:.4rem}
.ans{display:none;margin-top:.5rem;background:var(--teal);color:var(--teal-ink);border-radius:.8rem;padding:.6rem 1rem;font-size:1.05rem}
.ans.on{display:block}
.mini{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:.6rem;padding:.3em .8em;font-weight:700;font-size:.85rem}
.big .item .t{font-size:clamp(1.5rem,2.4vw,2.2rem)}
/* quote golf */
.holes,.draws{display:grid;gap:1rem}
.quotebox{grid-column:1/-1;font-family:var(--serif);font-size:clamp(1.2rem,1.8vw,1.55rem);line-height:1.55;background:var(--bg);border-left:.35rem solid var(--acc);border-radius:.6rem;padding:.9rem 1.2rem}
.prose p{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.6rem);line-height:1.55;margin:0 0 1rem;max-width:52rem}
table.grid{border-collapse:collapse;width:100%;margin-bottom:1rem;font-size:1.05rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:.5rem .8rem;text-align:left}
table.grid th{background:var(--teal);color:var(--teal-ink)}
table.grid tr:last-child td{font-weight:800}
.bagitems{list-style:none;padding:0;margin:0 0 1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:.5rem}
.bagitems li{background:var(--amber);color:var(--amber-ink);border-radius:.7rem;padding:.55rem .9rem;font-size:1.2rem;font-weight:600}
.draws{grid-template-columns:repeat(auto-fit,minmax(24rem,1fr))}
.hole{border:2px dashed var(--line);border-radius:1rem;padding:1rem 1.2rem}
.hole .hh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:baseline;margin-bottom:.5rem}
.hole .hn{background:var(--amber);color:var(--amber-ink);font-weight:800;border-radius:999px;padding:.15em .9em}
.hole .pt{font-weight:800;font-size:1.2rem}
.hole .par{margin-left:auto;font-weight:800;color:var(--ink2)}
.hole .sent{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.strokes{display:none;margin-top:.6rem;background:var(--lav);color:var(--lav-ink);border-radius:.8rem;padding:.6rem 1rem;font-weight:700}
.strokes.on{display:block}
@media (max-width:700px){.step b{flex-basis:6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Year 8 English · Week 2, Lesson 5<small>Word Questions at Exam Speed</small></div>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="tb" data-t="60">1m</button><button class="tb" data-t="60">1m</button><button class="tb" data-t="300">5m</button><button class="tb" data-t="600">10m</button>
    <span class="tb timer" id="timer">0:00</span>
    <button class="tb" id="theme" title="Light or dark">◐</button>
    <button class="tb" id="fs" title="Full screen">⛶</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- content ---------- */
const R = {
  SWAP:['s-point','Swap it in'], CHECK:['s-ev','Does it hold?'], CODE:['s-bad','Error code'],
  X:['s-ex','Answer'], POINT:['s-ev','Point at the exact words'], WHY:['s-ex','Why'],
  PICK:['s-ev','The imposter'], SAY:['s-say','Rule']
};

const SKILL = {
  text:'“The bridge over the stream was [rickety].”   Candidates: unsteady · wobbly · bad · wooden',
  q:'Which words survive the swap test?',
  rows:[
    ['SWAP','Put each one back in the sentence and read it. “The bridge was unsteady.” Same meaning, same strength.'],
    ['CHECK','“Bad” is too weak: a bridge can be bad because it is ugly. “Wooden” is literal: it says what it is made of, not that it might give way. “Wobbly” works.'],
    ['CODE','Wrong strength = S. Took it literally = L. Those two cost most of the marks on this paper.'],
    ['SAY','One mark, under a minute. Swap it in, check the strength, move on.']
  ]
};

const TOGETHER = [
  {lv:'Easy', text:'“The baby [wailed] all night.”   cried · screamed · howled · murmured',
   q:'Find the imposter.',
   rows:[['PICK','murmured.'],
     ['WHY','It points the wrong way. The other three are loud and upset, which is what wailing is.'],
     ['SAY','Fast method: cross out anything that points the wrong way first, then compare what is left.']]},
  {lv:'Easy', text:'“He [sipped] his tea.”   drank slowly · tasted · gulped · took a little',
   q:'Find the imposter, and name the error.',
   rows:[['PICK','gulped.'],
     ['CODE','S: wrong strength. A sip is tiny and careful; a gulp is huge and fast.'],
     ['SAY','Same action is not enough. The size of it has to match too.']]},
  {lv:'Medium', text:'“Her smile was [warm].”   friendly · kind · hot · welcoming',
   q:'Find the imposter, and name the error.',
   rows:[['PICK','hot.'],
     ['CODE','L: took it literally. A smile has no temperature. “Warm” here is about how it makes you feel.'],
     ['SAY','If the word is describing a person, a voice or a smile, the dictionary picture is usually the trap.']]},
  {lv:'Medium', text:'“Dad repaired the gate and repainted the fence. [It] took all weekend.”',
   q:'Point test: what does “It” point back to?',
   rows:[['POINT','“repaired the gate and repainted the fence”: both jobs.'],
     ['CODE','Grabbing “the fence” because it is closest is N. Picking only one of the two jobs is P.'],
     ['SAY','Put your finger on the exact words. If there is a list, check whether the reference word covers all of it.']]},
  {lv:'Medium', text:'“The school bought a minibus, two pianos and a pottery kiln. [The pianos] arrived first. [They] were out of tune.”',
   q:'Point test: what does “They” point back to?',
   rows:[['POINT','“The pianos”.'],
     ['WHY','Being out of tune only fits one item on the list. The meaning of the sentence chooses for you.'],
     ['SAY','Sometimes the reference word covers the whole list, sometimes only one item. Read what the sentence says about “they” before you decide.']]},
  {lv:'Hard', text:'“Marco told his brother that he had lost the keys. [He] did not say anything for a long time.”',
   q:'Who is “He” in the second sentence? How can you tell?',
   rows:[['POINT','The brother.'],
     ['WHY','Marco has just spoken, so the silence belongs to the person who was told. The sentence is about the reaction, not the confession.'],
     ['SAY','When two people could fit, ask which one the sentence is following. Then say how you know: that is where the mark is.']]},
  {lv:'Hard', text:'“The cliff [glowered] over the little harbour.” [2 marks: give a replacement, and say what “glowered” adds that yours does not.]',
   q:'The two-mark version of a word question.',
   rows:[['SWAP','“Towered” or “rose”.'],
     ['X','“Glowered” adds a mood: it is the word for a person staring angrily, so the cliff seems to be watching the harbour with bad intentions.'],
     ['SAY','When a word question is worth 2, the second mark is always the shade of meaning your word loses.']]},
  {lv:'Hard', text:'Question [1]: give a word that could replace “sombre”.   Answer: “The writer chooses the word sombre, which is effective because it creates a dark and serious atmosphere for the reader and suggests…”',
   q:'What is going wrong here?',
   rows:[['CODE','No code: the meaning is probably right. The problem is the clock.'],
     ['X','“Gloomy.” One word. One mark. The answer above has spent a minute and a half on it.'],
     ['SAY','[1] means one clear answer. Bank the mark and move on: the time belongs to the 2-mark questions.']]},
  {lv:'Fun', text:'Imposter sprint. 1: [furious] → angry · annoyed · enraged · livid. 2: [exhausted] → tired out · drained · sleepy · shattered. 3: [cramped] → tight · cosy · squashed · confined.',
   q:'Thirty seconds. Call the imposters and the codes.',
   rows:[['PICK','1: annoyed. 2: sleepy. 3: cosy.'],
     ['CODE','1 and 2 are S: too weak. 3 is the sneaky one: “cosy” has the right size but the wrong feeling, and no code fits it, which is why you read the sentence, not just the word.'],
     ['SAY','Strength, direction, feeling. Three checks, thirty seconds.']]}
];

const SHEET = {
  A:{title:'Part A: Do Now', task:'4 min, on your own.', time:240, items:[
    {n:'A1', t:'The doorbell rang. Nobody moved.', q:'Why might a writer use two short sentences here?',
     a:'The two short sentences put a gap between the sound and the reaction, so that the reader feels the pause in the room. “Nobody moved” lands on its own, which makes the stillness look deliberate rather than accidental: somebody in that house does not want to answer the door.'},
    {n:'A2', t:'Answer: “The writer uses a short sentence to create suspense.”', q:'Why would this only get 1 mark out of 2?',
     a:'It names the choice and labels the effect, but it never says how. It does not explain what the short sentence does to the reader or why. Add the how: the sentence stops early, so the reader stops too, and the silence is left hanging.'}
  ]},
  B:{title:'Part B: Find the Imposter', task:'Teams, 30 seconds a round. Three of the four could replace the bold word. One changes the meaning or the strength. Bonus point for saying WHY.', time:60, claims:true, revealLabel:'Imposter and why', cards:[
    {n:'1', t:'The crowd roared when the goal went in.  cheered · yelled · whispered · bellowed',
     a:'Imposter: whispered. It points the opposite way. The other three are all loud. Code: S at best, really just wrong.'},
    {n:'2', t:'She glanced at the clock.  peeked · looked quickly · stared · flicked her eyes',
     a:'Imposter: stared. Code S, wrong strength: a glance lasts a second, a stare goes on and on, and it suggests she is fixed on something.'},
    {n:'3', t:'He was reluctant to leave the party.  unwilling · hesitant · eager · not keen',
     a:'Imposter: eager. The opposite. Reluctant means he did not want to go, and eager means he could not wait.'},
    {n:'4', t:'After the cleaners left, the room was immaculate.  spotless · perfectly clean · fairly tidy · flawless',
     a:'Imposter: fairly tidy. Code S, wrong strength: immaculate means not one mark anywhere, and “fairly” drops it to ordinary.'},
    {n:'5', t:'The manager’s reply was frosty.  cold · unfriendly · icy · freezing',
     a:'Imposter: freezing. Code L, taken literally: it describes temperature, not manner. “Cold” and “icy” both work for a person because we already use them that way.'},
    {n:'6', t:'The news devastated the whole town.  crushed · shattered · upset · destroyed',
     a:'Imposter: upset. Code S, far too weak. Devastated is total: the other three keep that force.'}
  ]},
  C:{title:'Part C: Two timed bursts', task:'Alone. Burst 1: 4 minutes, C1 to C5. Burst 2: 4 minutes, C6 to C9. Aim for under a minute each.', time:240, items:[
    {sub:'Burst 1: which word or phrase could replace the word in bold? C5 is worth 2.'},
    {n:'C1', t:'The path was treacherous after the rain.',
     a:'Dangerous, unsafe, slippery. Not “bad” (too weak) and not “wet” (literal: that is the rain, not the danger).'},
    {n:'C2', t:'Tom gave a feeble excuse and looked at the floor.',
     a:'Weak, pathetic, unconvincing. Not “small”: feeble here is about how convincing it is, not its size.'},
    {n:'C3', t:'Once the visitors left, the library was tranquil.',
     a:'Peaceful, calm, still. Not “boring” and not “empty”: tranquil is about the quality of the quiet, not the number of people.'},
    {n:'C4', t:'She was adamant that she had locked the door.',
     a:'Insistent, certain, firm, refusing to be moved. Not “sure”, which is too weak: adamant means she would not budge even when challenged.'},
    {n:'C5 [2]', t:'The old house loomed over the village. Give a replacement word, AND say what “loomed” adds that yours doesn’t.',
     a:'“Towered” or “stood over”. “Loomed” adds threat: it suggests the house seems to lean out of the gloom towards you and is bigger than it should be, which is why it is used for things we are uneasy about. 1 mark for the word, 1 for the shade of meaning.'},
    {sub:'Burst 2: write the exact words each bold reference word points back to.'},
    {n:'C6', t:'The coach praised the defence, the goalkeeper and the fans. They had never been so loud.',
     a:'“the fans”. Only one of the three can be loud in that way, so this is not the whole list. Grabbing all three is code P.'},
    {n:'C7', t:'Sara lent Mia her jacket, but it was far too small for her.',
     a:'“it” = Sara’s jacket (“her jacket”). “Her” at the end is Mia: the jacket is too small for the person wearing it. Answering “Sara” is code N, the nearest name.'},
    {n:'C8', t:'Plastic bags, straws and cups will be banned from June. This is expected to cut litter by half.',
     a:'“Plastic bags, straws and cups will be banned from June”: the whole ban, not just the cups. Taking one item is code P.'},
    {n:'C9', t:'The village voted to keep the old bridge rather than build a new road. Few regretted it.',
     a:'“to keep the old bridge rather than build a new road”: the decision itself. Answering “the bridge” is code N.'}
  ]},
  D:{title:'Part D: Mark it and code it', task:'12 min. Mark C1 to C9 as the answers are read out. Next to every wrong one, write its error code. Which code did you get most?', time:720,
    table:[['Code','What went wrong'],
      ['S','Wrong strength: right direction, too weak or too strong.'],
      ['L','Took it literally: used the dictionary picture instead of the meaning here.'],
      ['N','Grabbed the nearest noun instead of the right one.'],
      ['P','Only part of the list: the reference word covered more.']],
    items:[
      {n:'Code it', t:'“The path was treacherous” → “wet”.', a:'L. The rain is wet; the path is dangerous.'},
      {n:'Code it', t:'“The news devastated the town” → “upset”.', a:'S. Right direction, nothing like strong enough.'},
      {n:'Code it', t:'“Bags, straws and cups will be banned. This…” → “cups”.', a:'P. One item out of a list of three, and the ban itself has been dropped.'},
      {n:'Code it', t:'“Sara lent Mia her jacket, but it was too small for her.” → “Sara”.', a:'N. The nearest name, not the person wearing the jacket.'},
      {n:'So what', t:'Which code did you get most? Then what?', a:'Mostly S: say the word out loud in the sentence and ask if it is as strong. Mostly L: check whether the word is describing a thing or a person. Mostly N or P: put your finger on the words and read the whole sentence before them.'}
    ]},
  E:{title:'Part E: Exit Ticket', task:'On your own, 2 marks.', time:300, items:[
    {n:'E', t:'After the storm, the beach was desolate: no towels, no voices, just gulls and wet sand. It made her want to go home.',
     q:'(a) Give a word that could replace “desolate”. [1] (b) What does “It” refer to? [1]',
     a:'(a) Deserted, empty, bleak. Not “ruined” or “destroyed”: the beach is not damaged, it is abandoned. (b) “It” refers to the emptiness of the beach, described as “no towels, no voices, just gulls and wet sand”. Not the storm, which is over, and not the sand on its own.'}
  ]}
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const marked = s => esc(s).replace(/\[([^\]]+)\]/g,'<span class="clue">$1</span>');

const S = {tab:0, card:0, part:'A'};
const TABS = ['1  The skill','2  Together','3  Worksheet'];
function nav(){
  const n=$('#nav'); n.innerHTML='';
  TABS.forEach((t,i)=>n.append(el('button',{class:i===S.tab?'on':'',onclick:()=>{S.tab=i;render();}},t)));
}

function stepCard(d, meta){
  const box=el('div',{class:'card'});
  if(meta) box.append(meta);
  const text=el('p',{class:'text',html:marked(d.text)});
  box.append(text, el('p',{class:'q'},d.q));
  const steps=el('div',{class:'steps'});
  const nodes=d.rows.map(([key,t])=>{const [c,h]=R[key]; const s=el('div',{class:'step '+c},el('b',{},h),el('span',{},t)); steps.append(s); return s;});
  box.append(steps);
  const labels=d.rows.map(([k])=>R[k][1]);
  let k=0;
  const next=el('button',{class:'btn main'},labels[0]);
  const hide=el('button',{class:'btn'},'Hide all');
  function upd(){
    text.classList.toggle('show-clue',k>0);
    nodes.forEach((s,i)=>s.classList.toggle('on',i<k));
    next.textContent = k>=labels.length ? 'Done' : labels[k];
    next.disabled = k>=labels.length;
  }
  next.onclick=()=>{k=Math.min(labels.length,k+1);upd();};
  hide.onclick=()=>{k=0;upd();};
  box.append(el('div',{class:'row'},next,hide));
  box._next=()=>{ if(k<labels.length){k++;upd();return true;} return false; };
  upd();
  return box;
}

function render(){
  nav();
  const m=$('#main'); m.innerHTML=''; window._active=null;
  if(S.tab===0){
    m.append(el('h1',{},'One mark. Under a minute. Every time.'),
      el('p',{class:'lead'},'These are the quick questions on the real paper. Two tests, four ways to get them wrong.'),
      el('div',{class:'eq'},
        el('div',{class:'box b-point'},'Swap test',el('span',{},'put your word in its place: meaning AND strength must hold')),
        el('div',{class:'box b-ev'},'Point test',el('span',{},'for it, this, they: finger on the exact words')),
        el('div',{class:'box b-ex'},'Error codes',el('span',{},'S wrong strength · L literal · N nearest noun · P part of the list'))));
    window._active=stepCard(SKILL);
    m.append(window._active,
      el('div',{class:'frame'},'Swap it in. Does it still mean the same, and hit as hard?'));
  }
  if(S.tab===1){
    const d=TOGETHER[S.card];
    m.append(el('h1',{},'Together'),
      el('div',{class:'frame'},'S · L · N · P'),
      el('div',{class:'frame'},'[1] means one answer. Bank it and move on.'));
    const meta=el('div',{class:'meta'},el('span',{class:'count'},`${S.card+1} of ${TOGETHER.length}`),
      el('span',{class:'level lv-'+d.lv},d.lv));
    window._active=stepCard(d,meta);
    m.append(window._active);
    const prev=el('button',{class:'btn',onclick:()=>{S.card--;render();}},'← Previous');
    const nxt=el('button',{class:'btn main',onclick:()=>{S.card++;render();}},'Next example →');
    prev.disabled=S.card===0; nxt.disabled=S.card===TOGETHER.length-1;
    m.append(el('div',{class:'row'},prev,el('span',{class:'spacer'}),nxt));
  }
  if(S.tab===2){
    m.append(el('h1',{},'Your turn: the worksheet'), el('p',{class:'lead'},'Quick 1-mark questions. Aim for under a minute each.'));
    const parts=el('div',{class:'parts'});
    Object.keys(SHEET).forEach(k=>parts.append(el('button',{class:k===S.part?'on':'',onclick:()=>{S.part=k;render();}},SHEET[k].title)));
    m.append(parts);
    const P=SHEET[S.part];
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'phead'},el('h2',{},P.title),el('span',{class:'task'},P.task),
      el('button',{class:'mini',onclick:()=>startTimer(P.time)},`Start ${P.time/60} min timer`),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.add('on'));card.querySelectorAll('.bagitems li').forEach(l=>l.classList.add('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.add('show-clue'));}},'Show all answers'),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.remove('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.remove('show-clue'));}},'Hide all')));
    if(P.claims){
      const grid=el('div',{class:'draws'});
      P.cards.forEach(c=>{
        const ans=el('div',{class:'strokes'},c.a);
        grid.append(el('div',{class:'hole'},
          el('div',{class:'hh'},el('span',{class:'hn'},c.n),el('span',{class:'pt'},'“'+c.t+'”')),
          el('div',{class:'row'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},P.revealLabel||'Want / proves / left out')),
          ans));
      });
      card.append(grid);
    }
    if(P.prose){
      const box=el('div',{class:'prose'});
      P.prose.forEach(t=>box.append(el('p',{},t)));
      card.append(box);
    }
    if(P.table){
      const tb=el('table',{class:'grid'});
      P.table.forEach((r,i)=>{
        const tr=el('tr',{});
        r.forEach(c=>tr.append(el(i===0?'th':'td',{},c)));
        tr.append(el(i===0?'th':'td',{},i===0?'My mark':''));
        tb.append(tr);
      });
      card.append(tb);
    }
    (P.items||[]).forEach(it=>{
      if(it.sub){ card.append(el('div',{class:'item'},el('div',{class:'sub'},it.sub))); return; }
      if(it.quote){ card.append(el('div',{class:'item'},el('div',{class:'quotebox'},it.quote))); return; }
      const ans=el('div',{class:'ans'},it.a);
      card.append(el('div',{class:'item'},
        el('div',{class:'num'},it.n),
        el('div',{},el('div',{class:'t'},it.t), it.q?el('div',{class:'qq'},it.q):null,
          el('div',{class:'reveal'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},'Model answer'),ans))));
    });
    m.append(card, el('div',{class:'frame'},'Swap test. Point test. Code your mistakes.'));
  }
}

/* ---------- timer ---------- */
let tLeft=0, tId=null;
function drawT(){ $('#timer').textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`; }
function startTimer(s){
  clearInterval(tId); tLeft=s; drawT(); $('#timer').classList.remove('flash');
  tId=setInterval(()=>{ tLeft--; drawT(); if(tLeft<=0){ clearInterval(tId); $('#timer').classList.add('flash'); } },1000);
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#timer').onclick=()=>{ clearInterval(tId); tLeft=0; drawT(); };

/* ---------- theme, full screen, keys ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
document.documentElement.dataset.theme=mq.matches?'dark':'light';
$('#theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
$('#fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,button')) return;
  if(e.key===' '||e.key==='Enter'){ if(window._active&&window._active._next){ e.preventDefault(); window._active._next(); } }
  if(e.key==='ArrowRight'){ if(S.tab===1&&S.card<TOGETHER.length-1){S.card++;render();} else if(S.tab<2){S.tab++;render();} }
  if(e.key==='ArrowLeft'){ if(S.tab===1&&S.card>0){S.card--;render();} else if(S.tab>0){S.tab--;render();} }
});
render();
</script>
