<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 English: Author’s Craft, Compare the Choices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;600;800&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1d2433; --ink2:#5a6275; --line:#e4dccb;
  --rose:#f7d9dc; --rose-ink:#9b2f3f; --teal:#d3ece8; --teal-ink:#1d6b62;
  --amber:#fbe7c0; --amber-ink:#8a5a09; --lav:#e3def5; --lav-ink:#4b3d8f;
  --acc:#7a2231; --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.08);
  --sans:'Figtree',system-ui,sans-serif; --serif:'Literata',Georgia,serif; --hand:'Caveat',cursive;
}
[data-theme="dark"]{
  --bg:#171a22; --paper:#212532; --ink:#eef0f5; --ink2:#a9b0c2; --line:#343a4b;
  --rose:#4a2830; --rose-ink:#f3a9b5; --teal:#1f3d3a; --teal-ink:#8fdcd0;
  --amber:#463715; --amber-ink:#f5cf7d; --lav:#2f2a4c; --lav-ink:#c3b8f7;
  --acc:#f09aa8; --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,1.25vw,22px)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.6rem 1.4rem}
.brand{font-weight:800;color:var(--acc);font-size:.95rem;line-height:1.2}
.brand small{display:block;color:var(--ink2);font-weight:600}
nav{display:flex;gap:.4rem;flex:1}
nav button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.45em 1.2em;font-weight:700}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.tools{display:flex;gap:.4rem;align-items:center}
.tb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:.6rem;padding:.35em .7em;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4em;text-align:center}
.timer.flash{animation:fl .6s 6}
@keyframes fl{50%{background:var(--rose);color:var(--rose-ink)}}
main{max-width:70rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
h1{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.8rem);margin:.2rem 0 .8rem;line-height:1.15}
.lead{font-size:1.25rem;color:var(--ink2);margin:0 0 1.4rem;max-width:48rem}
.card{background:var(--paper);border-radius:1.1rem;box-shadow:var(--shadow);padding:1.5rem 1.8rem;margin-bottom:1.2rem}
.eq{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.6rem}
.eq .box{flex:1;min-width:11rem;border-radius:1rem;padding:1rem 1.2rem;text-align:center;font-weight:800;font-size:1.35rem}
.eq .box span{display:block;font-weight:600;font-size:.85rem;margin-top:.3rem;opacity:.9}
.b-point{background:var(--amber);color:var(--amber-ink)}
.b-ev{background:var(--lav);color:var(--lav-ink)}
.b-ex{background:var(--teal);color:var(--teal-ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;color:var(--ink2);font-weight:700}
.level{border-radius:999px;padding:.15em .8em;font-size:.85rem}
.lv-Easy{background:var(--teal);color:var(--teal-ink)}
.lv-Medium{background:var(--amber);color:var(--amber-ink)}
.lv-Hard{background:var(--rose);color:var(--rose-ink)}
.lv-Fun{background:var(--lav);color:var(--lav-ink)}
.text{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.45;margin:0 0 .8rem}
.q{font-style:italic;font-size:1.3rem;color:var(--acc);margin:0 0 1.2rem;font-weight:600}
.clue{border-radius:.25em;transition:background .25s,box-shadow .25s}
.show-clue .clue{background:var(--lav);box-shadow:0 0 0 .12em var(--lav-ink) inset;color:var(--lav-ink)}
.steps{display:grid;gap:.6rem}
.step{display:none;border-radius:.9rem;padding:.8rem 1.1rem;font-size:1.2rem;align-items:baseline;gap:.8rem}
.step.on{display:flex;animation:up .3s ease}
.step b{flex:0 0 9.5rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.s-point{background:var(--amber);color:var(--amber-ink)}
.s-ev{background:var(--lav);color:var(--lav-ink)}
.s-ex{background:var(--teal);color:var(--teal-ink)}
.s-bad{background:var(--rose);color:var(--rose-ink)}
.s-say{background:var(--rose);color:var(--rose-ink);font-family:var(--hand);font-size:1.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;align-items:center}
.btn{border:none;border-radius:.8rem;padding:.65em 1.3em;font-weight:800;background:var(--line);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.count{color:var(--ink2);font-weight:700}
.frame{font-family:var(--hand);font-size:1.5rem;color:var(--rose-ink);background:var(--rose);border-radius:.9rem;padding:.5rem 1.1rem;margin:0 .6rem 1.2rem 0;display:inline-block}
.parts{display:flex;gap:.4rem;margin:0 0 1rem;flex-wrap:wrap}
.parts button{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:.8rem;padding:.5em 1.1em;font-weight:800}
.parts button.on{border-color:var(--acc);color:var(--acc)}
.phead{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:1rem}
.phead h2{font-family:var(--serif);margin:0;font-size:1.8rem}
.phead .task{color:var(--ink2);font-weight:600;flex:1;min-width:14rem}
.item{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem 1rem;padding:1rem 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.num{background:var(--teal);color:var(--teal-ink);font-weight:800;border-radius:.6rem;text-align:center;padding:.35em 0;height:max-content}
.item .t{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.item .qq{font-style:italic;color:var(--acc);font-weight:600;margin-top:.3rem}
.item .reveal{grid-column:2;margin-top:.5rem}
.sub{grid-column:1/-1;font-weight:800;color:var(--ink2);margin-top:.4rem}
.ans{display:none;margin-top:.5rem;background:var(--teal);color:var(--teal-ink);border-radius:.8rem;padding:.6rem 1rem;font-size:1.05rem}
.ans.on{display:block}
.mini{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:.6rem;padding:.3em .8em;font-weight:700;font-size:.85rem}
.big .item .t{font-size:clamp(1.5rem,2.4vw,2.2rem)}
/* quote golf */
.holes,.draws{display:grid;gap:1rem}
.quotebox{grid-column:1/-1;font-family:var(--serif);font-size:clamp(1.2rem,1.8vw,1.55rem);line-height:1.55;background:var(--bg);border-left:.35rem solid var(--acc);border-radius:.6rem;padding:.9rem 1.2rem}
.prose p{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.6rem);line-height:1.55;margin:0 0 1rem;max-width:52rem}
table.grid{border-collapse:collapse;width:100%;margin-bottom:1rem;font-size:1.05rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:.5rem .8rem;text-align:left}
table.grid th{background:var(--teal);color:var(--teal-ink)}
table.grid tr:last-child td{font-weight:800}
.bagitems{list-style:none;padding:0;margin:0 0 1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:.5rem}
.bagitems li{background:var(--amber);color:var(--amber-ink);border-radius:.7rem;padding:.55rem .9rem;font-size:1.2rem;font-weight:600}
.draws{grid-template-columns:repeat(auto-fit,minmax(24rem,1fr))}
.hole{border:2px dashed var(--line);border-radius:1rem;padding:1rem 1.2rem}
.hole .hh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:baseline;margin-bottom:.5rem}
.hole .hn{background:var(--amber);color:var(--amber-ink);font-weight:800;border-radius:999px;padding:.15em .9em}
.hole .pt{font-weight:800;font-size:1.2rem}
.hole .par{margin-left:auto;font-weight:800;color:var(--ink2)}
.hole .sent{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.strokes{display:none;margin-top:.6rem;background:var(--lav);color:var(--lav-ink);border-radius:.8rem;padding:.6rem 1rem;font-weight:700}
.strokes.on{display:block}
@media (max-width:700px){.step b{flex-basis:6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Year 8 English · Week 2, Lesson 4<small>Author’s Craft: Compare the Choices</small></div>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="tb" data-t="60">1m</button><button class="tb" data-t="60">1m</button><button class="tb" data-t="300">5m</button><button class="tb" data-t="600">10m</button>
    <span class="tb timer" id="timer">0:00</span>
    <button class="tb" id="theme" title="Light or dark">◐</button>
    <button class="tb" id="fs" title="Full screen">⛶</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- content ---------- */
const R = {
  N:['s-point','The choice'], Q:['s-ev','Quoted'], X:['s-ex','So that the reader … because …'],
  BAD:['s-bad','1 mark'], FIX:['s-ex','2 marks'], PICK:['s-ev','Which one'], WHY:['s-ex','Why'],
  RUIN:['s-bad','Ruined'], GONE:['s-ex','What was removed'], SAY:['s-say','Rule']
};

const SKILL = {
  text:'A: “It was a scary night and Jack was frightened.”   B: “The hall light went out at [9:14]. Jack [started counting].”',
  q:'B works better. Can you say HOW?',
  rows:[
    ['N','B shows the fear through an action instead of naming it, and it gives an exact time.'],
    ['Q','“9:14” and “started counting”.'],
    ['X','So that the reader feels the night closing in, because an exact time tells us Jack is watching the clock, and counting is what people do to keep panic under control.'],
    ['SAY','2 marks = the choice + a quote + HOW it affects the reader. “It creates suspense” with no how is 1 mark.']
  ]
};

const TOGETHER = [
  {lv:'Easy', text:'A: “My sister was annoying me all day.”   B: “My sister [asked the same question eleven times] before breakfast.”',
   q:'Which works better, and why?',
   rows:[['PICK','B.'],
     ['WHY','A tells you the feeling. B gives you the evidence and lets you feel it.'],
     ['X','The writer gives us a number, “eleven times”, so that the reader feels the day grinding on, because a counted number proves the narrator has been keeping score.']]},
  {lv:'Easy', text:'“The referee lifted the whistle. [Nothing.]”   Answer: “The writer uses a short sentence, which creates tension.”',
   q:'Why is that answer only 1 mark?',
   rows:[['BAD','It names the choice and labels the effect. It never says how, so it would fit any short sentence in any text.'],
     ['FIX','“The writer stops at “Nothing.”, so that the reader waits with the crowd, because a one-word sentence takes longer to recover from than it does to read.”'],
     ['SAY','If your answer could be copied onto a different page and still make sense, it is not finished.']]},
  {lv:'Medium', text:'Opening: “[The parcel had my name on it.] I have not ordered anything [since March].”',
   q:'Ruin It. Wreck it, then name what you removed.',
   rows:[['RUIN','“A parcel arrived that I had not ordered, which was strange.”'],
     ['GONE','The two separate sentences that make the reader do the maths, the date, and the word “strange”, which the original never needed.'],
     ['X','The writer puts the facts side by side and says nothing about them, so that the reader draws the frightening conclusion first, because we trust what we work out more than what we are told.']]},
  {lv:'Medium', text:'Opening: “[There were twelve of us at the table.] [There were eleven chairs.]”',
   q:'Ruin It. What is doing the work?',
   rows:[['RUIN','“There were not quite enough chairs for everyone, so somebody had to stand.”'],
     ['GONE','The two matching sentences, the numbers, and the gap the reader fills in. The ruin does the subtraction for us and the tension goes with it.'],
     ['X','The writer repeats the sentence shape and changes one number, so that the reader notices the missing chair themselves and wonders who it belongs to.']]},
  {lv:'Medium', text:'A: “Dad was upset about the news.”   B: “Dad [laughed at the joke], went out to [check a car that did not need checking], and [stayed there].”',
   q:'Tell or show? And which detail does the most work?',
   rows:[['PICK','B shows it.'],
     ['WHY','“A car that did not need checking” is the one that hurts: it tells us he wanted a reason to be outside.'],
     ['X','The writer lets Dad laugh first, so that the reader sees the performance before it collapses, because the leaving only means something once we have watched him pretend.']]},
  {lv:'Hard', text:'“She checked the back seat. [Twice.] [Empty both times.]”',
   q:'Why end the paragraph there?',
   rows:[['N','Two fragments after a full sentence, each one shorter and flatter than the last.'],
     ['Q','“Twice.” and “Empty both times.”'],
     ['X','So that the reader understands she cannot believe what she is seeing, because checking twice is what people do when the first answer is unbearable, and the writer stops before anybody explains it.']]},
  {lv:'Hard', text:'“Every window on the street had its lights on. [Every window but one.]”',
   q:'Why build a pattern and then break it?',
   rows:[['N','A repeated sentence shape, broken in the second half of the line.'],
     ['Q','“Every window… Every window but one.”'],
     ['X','So that the reader looks straight at the exception, because once a pattern is set the only thing worth noticing is the thing that does not fit.']]},
  {lv:'Hard', text:'From a campaign leaflet: “[Who still writes letters?] Three hundred people in this town, [apparently].”',
   q:'Why ask a question and then answer it yourself?',
   rows:[['N','A rhetorical question, then an answer that contradicts the one the reader just gave.'],
     ['Q','“Who still writes letters?” and “apparently”.'],
     ['X','So that the reader is caught out by their own assumption, because we only feel corrected if we have already answered, and “apparently” makes the writer sound as surprised as we are.']]},
  {lv:'Fun', text:'Speed ruin. Sixty seconds for all three, then name what you took out. 1: “The dog came back without the lead.” 2: “I was not supposed to be on that train.” 3: “My mother kept one photograph in a drawer she never opened.”',
   q:'Ruin It, fast.',
   rows:[['RUIN','1: “The dog came home but the lead was missing.” 2: “I got on the wrong train.” 3: “My mother had an old photograph she did not look at.”'],
     ['GONE','1: the word “back”, which tells us somebody was holding the other end. 2: “supposed to”, which turns a mistake into a rule being broken. 3: the single photograph, and the drawer she keeps shut: the ruin loses both the number and the deliberate avoidance.'],
     ['SAY','The quickest way to find the craft is to take it out and see what dies.']]}
];

const SHEET = {
  A:{title:'Part A: Do Now', task:'4 min, on your own.', time:240, items:[
    {n:'A1', t:'The old car coughed twice and died at the traffic lights.', q:'Name the device and explain its effect.',
     a:'Personification: the car “coughed twice and died”. This makes the reader picture something old and ill giving up rather than a machine breaking, because coughing and dying belong to living things, so the breakdown feels like a last gasp.'},
    {n:'A2', t:'“The leg of the table” and “her laugh was a door slamming”. Which one is a dead metaphor, and why can’t you explain its effect?',
     a:'“The leg of the table” is dead. Nobody pictures a leg any more, so there is no image to explain and the answer collapses into “it means the part the table stands on”. “Her laugh was a door slamming” is live: you can hear it, and it suggests a laugh that ends the conversation.'}
  ]},
  B:{title:'Part B: Ruin It!', task:'Pairs, 10 min. Wreck each opening: rewrite it as boringly as possible, then name exactly what you removed. Swap: can your partner spot what is missing?', time:600, claims:true, revealLabel:'A sample ruin, and what it removed', cards:[
    {n:'1', t:'The last thing I expected to find in my sandwich was a key.',
     a:'Ruin: “I found a key in my sandwich. It was strange.” Removed: the surprise, and the key held back until the final word. The original makes you wait for the noun; the ruin hands it over in four words and then has to tell you how to feel about it.'},
    {n:'2', t:'Mum smiled at the doctor, thanked him twice, and cried the whole way home.',
     a:'Ruin: “Mum was upset about what the doctor said.” Removed: the showing, the contrast between the smile and the crying, and “thanked him twice”, which is politeness running on automatically after the news has landed. The ruin names the feeling and loses the mask.'},
    {n:'3', t:'Nobody remembered the new girl’s name. By Friday, nobody would ever forget it.',
     a:'Ruin: “The new girl became well known that week.” Removed: the repetition of “nobody” turned on its head, the jump forward to Friday, and the mystery of what she did. The original tells you the result and hides the event, which is why you read on.'},
    {n:'4', t:'The house had one rule: never open the green door. I opened it on a Tuesday.',
     a:'Ruin: “There was a door I was not allowed to open, so I opened it.” Removed: the colon that delivers the rule like a warning, the colour (green sticks; “a door” does not), and the flatness of “on a Tuesday”, which makes breaking the one rule sound like an ordinary errand.'}
  ]},
  C:{title:'Part C: On your own (9 marks)', task:'Read both openings, then answer. Match the length of your answer to the marks.', time:900, items:[
    {sub:'Opening A'},
    {quote:'It was a stormy night. Jack was scared because he was home alone and the power had gone out. He decided to go to bed.'},
    {sub:'Opening B'},
    {quote:'The lights went out at 9:14. Jack counted the seconds between the flash and the bang, the way Dad had taught him. Seven. Then four. Then none at all.'},
    {n:'C1 [1]', t:'Which opening hooks the reader better?',
     a:'Opening B. One sentence is enough here: do not write a paragraph for one mark.'},
    {n:'C2 [2]', t:'How does the writer of Opening B build tension? Refer to two choices.',
     a:'First, the exact time: the lights go out “at 9:14”, so the reader feels that Jack is watching the clock and that this is the moment everything starts. Second, the three fragments, “Seven. Then four. Then none at all.”, which shrink as the storm closes in, so the reader is counting down with him. 1 mark for each choice quoted and explained with a how.'},
    {n:'C3 [2]', t:'Opening A tells us Jack is “scared”. How does Opening B show it instead?',
     a:'Opening B never uses the word. It gives us what Jack does: he “counted the seconds… the way Dad had taught him”. This suggests he is frightened and reaching for something his father gave him to hold on to, because counting is what people do to keep panic in order, and the reader works the fear out instead of being told it.'},
    {n:'C4 [2]', t:'Why does Opening B end with “Then none at all.”?',
     a:'It is the shortest fragment and the only one without a number, and it is left to stand on its own. This makes the reader work out that there is no gap left between the flash and the bang, so the storm is directly overhead, because no gap means no distance. The writer stops there so the worst moment is the last thing on the page.'},
    {n:'C5 [2]', t:'From a school newsletter: “Imagine a school with no playground. Now stop imagining: it is ours.” Why does the writer begin with “Imagine”, then tell us to stop?',
     a:'The writer makes the reader build the picture themselves, then takes it away with “Now stop imagining”. This makes the reader feel the shock of discovering their own worst case is the real one, because people argue with facts but not with images they have just made in their own heads. The colon delivers it like a slap.'}
  ]},
  D:{title:'Part D: Swap and mark', task:'7 min. Swap books. Mark your partner’s C2 and C4 out of 2 with the scheme. Under each, write one line: “To get 2 you needed …”', time:420,
    table:[['Marks','What it looks like'],
      ['2','The choice + a quote + HOW it affects the reader.'],
      ['1','Names an effect with no how (“it creates suspense”).'],
      ['0','Retells the opening, or says which one is better with no reason.']],
    items:[
      {n:'Mark it', t:'“The writer uses short sentences at the end, which builds tension and makes you want to read on.”', a:'1 mark. The choice is named but there is no how: why do those sentences do that, and what does the reader work out? No quote either.'},
      {n:'Mark it', t:'“The writer ends on “Then none at all.”, so that the reader realises the storm is right above the house, because the gap between flash and bang has gone.”', a:'2 marks. Choice, quote, and a how that explains what the reader works out.'},
      {n:'Feedback', t:'Write one line under the score:', a:'“To get 2 you needed …” plus the missing piece, named: the quote, or the how, or what the reader is supposed to feel. Never “explain more”.'}
    ]},
  E:{title:'Part E: Exit Ticket', task:'On your own, 2 marks.', time:300, items:[
    {n:'E', t:'Grandma’s house was the same as always. The clock still ticked. The kettle still sang. Her chair was empty.',
     q:'Why does the writer list the things that are “still” the same before the last sentence?',
     a:'The repetition of “still” builds up everything that has carried on exactly as it always did, so that the reader is lulled into the ordinary. Then the last sentence breaks it: “Her chair was empty.” This makes the absence land harder, because when nothing else has changed, the one thing that has is the only thing you can see. The short final sentence gives the reader nowhere to go afterwards.'}
  ]}
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const marked = s => esc(s).replace(/\[([^\]]+)\]/g,'<span class="clue">$1</span>');

const S = {tab:0, card:0, part:'A'};
const TABS = ['1  The skill','2  Together','3  Worksheet'];
function nav(){
  const n=$('#nav'); n.innerHTML='';
  TABS.forEach((t,i)=>n.append(el('button',{class:i===S.tab?'on':'',onclick:()=>{S.tab=i;render();}},t)));
}

function stepCard(d, meta){
  const box=el('div',{class:'card'});
  if(meta) box.append(meta);
  const text=el('p',{class:'text',html:marked(d.text)});
  box.append(text, el('p',{class:'q'},d.q));
  const steps=el('div',{class:'steps'});
  const nodes=d.rows.map(([key,t])=>{const [c,h]=R[key]; const s=el('div',{class:'step '+c},el('b',{},h),el('span',{},t)); steps.append(s); return s;});
  box.append(steps);
  const labels=d.rows.map(([k])=>R[k][1]);
  let k=0;
  const next=el('button',{class:'btn main'},labels[0]);
  const hide=el('button',{class:'btn'},'Hide all');
  function upd(){
    text.classList.toggle('show-clue',k>0);
    nodes.forEach((s,i)=>s.classList.toggle('on',i<k));
    next.textContent = k>=labels.length ? 'Done' : labels[k];
    next.disabled = k>=labels.length;
  }
  next.onclick=()=>{k=Math.min(labels.length,k+1);upd();};
  hide.onclick=()=>{k=0;upd();};
  box.append(el('div',{class:'row'},next,hide));
  box._next=()=>{ if(k<labels.length){k++;upd();return true;} return false; };
  upd();
  return box;
}

function render(){
  nav();
  const m=$('#main'); m.innerHTML=''; window._active=null;
  if(S.tab===0){
    m.append(el('h1',{},'Why does this one work better than that one?'),
      el('p',{class:'lead'},'Name the choice, quote it, then say HOW it works on the reader. The how is the second mark.'),
      el('div',{class:'eq'},
        el('div',{class:'box b-point'},'The writer …',el('span',{},'the choice, quoted')),
        el('div',{class:'box b-ev'},'so that the reader …',el('span',{},'feels or thinks')),
        el('div',{class:'box b-ex'},'because …',el('span',{},'how it does that'))));
    window._active=stepCard(SKILL);
    m.append(window._active,
      el('div',{class:'frame'},'The writer … so that the reader … because …'));
  }
  if(S.tab===1){
    const d=TOGETHER[S.card];
    m.append(el('h1',{},'Together'),
      el('div',{class:'frame'},'The writer … so that the reader … because …'),
      el('div',{class:'frame'},'“It creates suspense” is half an answer.'));
    const meta=el('div',{class:'meta'},el('span',{class:'count'},`${S.card+1} of ${TOGETHER.length}`),
      el('span',{class:'level lv-'+d.lv},d.lv));
    window._active=stepCard(d,meta);
    m.append(window._active);
    const prev=el('button',{class:'btn',onclick:()=>{S.card--;render();}},'← Previous');
    const nxt=el('button',{class:'btn main',onclick:()=>{S.card++;render();}},'Next example →');
    prev.disabled=S.card===0; nxt.disabled=S.card===TOGETHER.length-1;
    m.append(el('div',{class:'row'},prev,el('span',{class:'spacer'}),nxt));
  }
  if(S.tab===2){
    m.append(el('h1',{},'Your turn: the worksheet'), el('p',{class:'lead'},'Why one piece of writing works better than another, marked against the scheme.'));
    const parts=el('div',{class:'parts'});
    Object.keys(SHEET).forEach(k=>parts.append(el('button',{class:k===S.part?'on':'',onclick:()=>{S.part=k;render();}},SHEET[k].title)));
    m.append(parts);
    const P=SHEET[S.part];
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'phead'},el('h2',{},P.title),el('span',{class:'task'},P.task),
      el('button',{class:'mini',onclick:()=>startTimer(P.time)},`Start ${P.time/60} min timer`),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.add('on'));card.querySelectorAll('.bagitems li').forEach(l=>l.classList.add('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.add('show-clue'));}},'Show all answers'),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.remove('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.remove('show-clue'));}},'Hide all')));
    if(P.claims){
      const grid=el('div',{class:'draws'});
      P.cards.forEach(c=>{
        const ans=el('div',{class:'strokes'},c.a);
        grid.append(el('div',{class:'hole'},
          el('div',{class:'hh'},el('span',{class:'hn'},c.n),el('span',{class:'pt'},'“'+c.t+'”')),
          el('div',{class:'row'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},P.revealLabel||'Want / proves / left out')),
          ans));
      });
      card.append(grid);
    }
    if(P.prose){
      const box=el('div',{class:'prose'});
      P.prose.forEach(t=>box.append(el('p',{},t)));
      card.append(box);
    }
    if(P.table){
      const tb=el('table',{class:'grid'});
      P.table.forEach((r,i)=>{
        const tr=el('tr',{});
        r.forEach(c=>tr.append(el(i===0?'th':'td',{},c)));
        tr.append(el(i===0?'th':'td',{},i===0?'My mark':''));
        tb.append(tr);
      });
      card.append(tb);
    }
    (P.items||[]).forEach(it=>{
      if(it.sub){ card.append(el('div',{class:'item'},el('div',{class:'sub'},it.sub))); return; }
      if(it.quote){ card.append(el('div',{class:'item'},el('div',{class:'quotebox'},it.quote))); return; }
      const ans=el('div',{class:'ans'},it.a);
      card.append(el('div',{class:'item'},
        el('div',{class:'num'},it.n),
        el('div',{},el('div',{class:'t'},it.t), it.q?el('div',{class:'qq'},it.q):null,
          el('div',{class:'reveal'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},'Model answer'),ans))));
    });
    m.append(card, el('div',{class:'frame'},'Choice. Quote. How.'));
  }
}

/* ---------- timer ---------- */
let tLeft=0, tId=null;
function drawT(){ $('#timer').textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`; }
function startTimer(s){
  clearInterval(tId); tLeft=s; drawT(); $('#timer').classList.remove('flash');
  tId=setInterval(()=>{ tLeft--; drawT(); if(tLeft<=0){ clearInterval(tId); $('#timer').classList.add('flash'); } },1000);
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#timer').onclick=()=>{ clearInterval(tId); tLeft=0; drawT(); };

/* ---------- theme, full screen, keys ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
document.documentElement.dataset.theme=mq.matches?'dark':'light';
$('#theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
$('#fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,button')) return;
  if(e.key===' '||e.key==='Enter'){ if(window._active&&window._active._next){ e.preventDefault(); window._active._next(); } }
  if(e.key==='ArrowRight'){ if(S.tab===1&&S.card<TOGETHER.length-1){S.card++;render();} else if(S.tab<2){S.tab++;render();} }
  if(e.key==='ArrowLeft'){ if(S.tab===1&&S.card>0){S.card--;render();} else if(S.tab>0){S.tab--;render();} }
});
render();
</script>
</body>
</html>
