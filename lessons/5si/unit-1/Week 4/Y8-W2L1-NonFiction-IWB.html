<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 English: Inference in Non-Fiction, Reading the Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;600;800&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#1d2433; --ink2:#5a6275; --line:#e4dccb;
  --rose:#f7d9dc; --rose-ink:#9b2f3f; --teal:#d3ece8; --teal-ink:#1d6b62;
  --amber:#fbe7c0; --amber-ink:#8a5a09; --lav:#e3def5; --lav-ink:#4b3d8f;
  --acc:#7a2231; --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.08);
  --sans:'Figtree',system-ui,sans-serif; --serif:'Literata',Georgia,serif; --hand:'Caveat',cursive;
}
[data-theme="dark"]{
  --bg:#171a22; --paper:#212532; --ink:#eef0f5; --ink2:#a9b0c2; --line:#343a4b;
  --rose:#4a2830; --rose-ink:#f3a9b5; --teal:#1f3d3a; --teal-ink:#8fdcd0;
  --amber:#463715; --amber-ink:#f5cf7d; --lav:#2f2a4c; --lav-ink:#c3b8f7;
  --acc:#f09aa8; --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:clamp(16px,1.25vw,22px)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;padding:.6rem 1.4rem}
.brand{font-weight:800;color:var(--acc);font-size:.95rem;line-height:1.2}
.brand small{display:block;color:var(--ink2);font-weight:600}
nav{display:flex;gap:.4rem;flex:1}
nav button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.45em 1.2em;font-weight:700}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--paper)}
.tools{display:flex;gap:.4rem;align-items:center}
.tb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:.6rem;padding:.35em .7em;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:3.4em;text-align:center}
.timer.flash{animation:fl .6s 6}
@keyframes fl{50%{background:var(--rose);color:var(--rose-ink)}}
main{max-width:70rem;margin:0 auto;padding:1.6rem 1.4rem 4rem}
h1{font-family:var(--serif);font-size:clamp(1.8rem,3vw,2.8rem);margin:.2rem 0 .8rem;line-height:1.15}
.lead{font-size:1.25rem;color:var(--ink2);margin:0 0 1.4rem;max-width:48rem}
.card{background:var(--paper);border-radius:1.1rem;box-shadow:var(--shadow);padding:1.5rem 1.8rem;margin-bottom:1.2rem}
.eq{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.6rem}
.eq .box{flex:1;min-width:11rem;border-radius:1rem;padding:1rem 1.2rem;text-align:center;font-weight:800;font-size:1.35rem}
.eq .box span{display:block;font-weight:600;font-size:.85rem;margin-top:.3rem;opacity:.9}
.b-point{background:var(--amber);color:var(--amber-ink)}
.b-ev{background:var(--lav);color:var(--lav-ink)}
.b-ex{background:var(--teal);color:var(--teal-ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem;color:var(--ink2);font-weight:700}
.level{border-radius:999px;padding:.15em .8em;font-size:.85rem}
.lv-Easy{background:var(--teal);color:var(--teal-ink)}
.lv-Medium{background:var(--amber);color:var(--amber-ink)}
.lv-Hard{background:var(--rose);color:var(--rose-ink)}
.lv-Fun{background:var(--lav);color:var(--lav-ink)}
.text{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.45;margin:0 0 .8rem}
.q{font-style:italic;font-size:1.3rem;color:var(--acc);margin:0 0 1.2rem;font-weight:600}
.clue{border-radius:.25em;transition:background .25s,box-shadow .25s}
.show-clue .clue{background:var(--lav);box-shadow:0 0 0 .12em var(--lav-ink) inset;color:var(--lav-ink)}
.steps{display:grid;gap:.6rem}
.step{display:none;border-radius:.9rem;padding:.8rem 1.1rem;font-size:1.2rem;align-items:baseline;gap:.8rem}
.step.on{display:flex;animation:up .3s ease}
.step b{flex:0 0 9.5rem;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.s-point{background:var(--amber);color:var(--amber-ink)}
.s-ev{background:var(--lav);color:var(--lav-ink)}
.s-ex{background:var(--teal);color:var(--teal-ink)}
.s-bad{background:var(--rose);color:var(--rose-ink)}
.s-say{background:var(--rose);color:var(--rose-ink);font-family:var(--hand);font-size:1.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;align-items:center}
.btn{border:none;border-radius:.8rem;padding:.65em 1.3em;font-weight:800;background:var(--line);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.count{color:var(--ink2);font-weight:700}
.frame{font-family:var(--hand);font-size:1.5rem;color:var(--rose-ink);background:var(--rose);border-radius:.9rem;padding:.5rem 1.1rem;margin:0 .6rem 1.2rem 0;display:inline-block}
.parts{display:flex;gap:.4rem;margin:0 0 1rem;flex-wrap:wrap}
.parts button{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:.8rem;padding:.5em 1.1em;font-weight:800}
.parts button.on{border-color:var(--acc);color:var(--acc)}
.phead{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:1rem}
.phead h2{font-family:var(--serif);margin:0;font-size:1.8rem}
.phead .task{color:var(--ink2);font-weight:600;flex:1;min-width:14rem}
.item{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem 1rem;padding:1rem 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.num{background:var(--teal);color:var(--teal-ink);font-weight:800;border-radius:.6rem;text-align:center;padding:.35em 0;height:max-content}
.item .t{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.item .qq{font-style:italic;color:var(--acc);font-weight:600;margin-top:.3rem}
.item .reveal{grid-column:2;margin-top:.5rem}
.sub{grid-column:1/-1;font-weight:800;color:var(--ink2);margin-top:.4rem}
.ans{display:none;margin-top:.5rem;background:var(--teal);color:var(--teal-ink);border-radius:.8rem;padding:.6rem 1rem;font-size:1.05rem}
.ans.on{display:block}
.mini{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:.6rem;padding:.3em .8em;font-weight:700;font-size:.85rem}
.big .item .t{font-size:clamp(1.5rem,2.4vw,2.2rem)}
/* quote golf */
.holes,.draws{display:grid;gap:1rem}
.quotebox{grid-column:1/-1;font-family:var(--serif);font-size:clamp(1.2rem,1.8vw,1.55rem);line-height:1.55;background:var(--bg);border-left:.35rem solid var(--acc);border-radius:.6rem;padding:.9rem 1.2rem}
.prose p{font-family:var(--serif);font-size:clamp(1.25rem,1.9vw,1.6rem);line-height:1.55;margin:0 0 1rem;max-width:52rem}
table.grid{border-collapse:collapse;width:100%;margin-bottom:1rem;font-size:1.05rem}
table.grid th,table.grid td{border:1px solid var(--line);padding:.5rem .8rem;text-align:left}
table.grid th{background:var(--teal);color:var(--teal-ink)}
table.grid tr:last-child td{font-weight:800}
.bagitems{list-style:none;padding:0;margin:0 0 1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:.5rem}
.bagitems li{background:var(--amber);color:var(--amber-ink);border-radius:.7rem;padding:.55rem .9rem;font-size:1.2rem;font-weight:600}
.draws{grid-template-columns:repeat(auto-fit,minmax(24rem,1fr))}
.hole{border:2px dashed var(--line);border-radius:1rem;padding:1rem 1.2rem}
.hole .hh{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:baseline;margin-bottom:.5rem}
.hole .hn{background:var(--amber);color:var(--amber-ink);font-weight:800;border-radius:999px;padding:.15em .9em}
.hole .pt{font-weight:800;font-size:1.2rem}
.hole .par{margin-left:auto;font-weight:800;color:var(--ink2)}
.hole .sent{font-family:var(--serif);font-size:1.3rem;line-height:1.45}
.strokes{display:none;margin-top:.6rem;background:var(--lav);color:var(--lav-ink);border-radius:.8rem;padding:.6rem 1rem;font-weight:700}
.strokes.on{display:block}
@media (max-width:700px){.step b{flex-basis:6rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Year 8 English · Week 2, Lesson 1<small>Inference in Non-Fiction: Reading the Spin</small></div>
  <nav id="nav"></nav>
  <div class="tools">
    <button class="tb" data-t="60">1m</button><button class="tb" data-t="60">1m</button><button class="tb" data-t="300">5m</button><button class="tb" data-t="600">10m</button>
    <span class="tb timer" id="timer">0:00</span>
    <button class="tb" id="theme" title="Light or dark">◐</button>
    <button class="tb" id="fs" title="Full screen">⛶</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ---------- content ---------- */
const R = {
  WANT:['s-point','They want you to believe'], PROVE:['s-ev','It actually proves'], OUT:['s-bad','Left out'],
  X:['s-ex','So what can you infer?'], PICK:['s-ev','Answer'], WHY:['s-ex','How you know'],
  MK:['s-point','Marks'], SAY:['s-say','Rule']
};

const SKILL = {
  text:'“[Voted best sandwich in the building.]”',
  q:'What is this claim really telling you?',
  rows:[
    ['WANT','That it is the best sandwich you can buy anywhere.'],
    ['PROVE','That somebody voted, in one building.'],
    ['OUT','How many people voted. How many sandwich shops are in the building. It could be one vote, and the only shop.'],
    ['SAY','Non-fiction is written to persuade you. Ask what the words prove, and what has quietly been left out.']
  ]
};

const TOGETHER = [
  {lv:'Easy', text:'“[Now 30% bigger!]”',
   q:'Small print detective.',
   rows:[['WANT','You are getting much more for your money.'],
     ['PROVE','It is bigger than something.'],
     ['OUT','Bigger than what? The old size, or a rival? And did the price go up by more than 30%?']]},
  {lv:'Easy', text:'“[Recommended by dentists.]”',
   q:'Small print detective.',
   rows:[['WANT','The dental profession backs this product.'],
     ['PROVE','At least two dentists said something positive.'],
     ['OUT','How many dentists, out of how many asked, and whether the company paid them.']]},
  {lv:'Medium', text:'“[8 out of 10 owners said their dogs preferred it.]”',
   q:'Small print detective. Watch the verb.',
   rows:[['WANT','Dogs love this food.'],
     ['PROVE','Eight owners, out of ten who answered, said so.'],
     ['OUT','How many owners were asked in total, who ran the survey, and the fact that “said” is an opinion: nobody asked the dogs.']]},
  {lv:'Medium', text:'“[Up to 70% off selected items.]”',
   q:'Two weasel phrases in one sentence. Find them.',
   rows:[['WANT','Everything in the shop is 70% off.'],
     ['PROVE','At least one item is discounted by no more than 70%.'],
     ['OUT','“Up to” includes 5%. “Selected” means the shop chose them. Most of the stock may be full price.']]},
  {lv:'Medium', text:'Sample answers to “What can you infer about the café?” The text: the tables were stacked, the menu board had been wiped clean and a delivery sat unopened by the door. [Which answer gets 2, 1 and 0?]',
   q:'Marking practice. You will do this for a partner in Part D.',
   rows:[['MK','2 marks: a valid inference AND two clues. 1 mark: an inference with one clue, or clues with no inference. 0 marks: retells the text.'],
     ['PICK','2 marks: “The café has closed, because the tables were stacked and the menu board had been wiped clean.” 1 mark: “The café has closed.” 0 marks: “The tables were stacked and a delivery was by the door.”'],
     ['WHY','The 0-mark answer is not wrong: it is just a list. Nothing has been worked out.']]},
  {lv:'Hard', text:'“Since the free parking trial began, town centre visits are up 20%. [However], three of the eight shops on the high street have closed since March.”',
   q:'What can you infer about the trial?',
   rows:[['WANT','The writer wants the numbers to sound like a success.'],
     ['PROVE','More people are visiting. It does not prove they are spending.'],
     ['X','I can infer the trial has brought people in without saving the shops, because visits are “up 20%” and yet “three of the eight shops” have closed. Watch for “however”: the turn is where the real story is.']]},
  {lv:'Hard', text:'“The head teacher says the new timetable is working well. I have taught here for twenty-two years. I was told the same thing in 2011, [and again in 2018].”',
   q:'What is the writer implying?',
   rows:[['PICK','That the promise is empty and nothing will change.'],
     ['WHY','Two clues: twenty-two years of experience, and the same claim made twice before. Neither of those earlier promises is said to have worked.'],
     ['X','Implying is saying something without saying it. Dates and repetition do the work here, so the writer never has to call anyone a liar.']]},
  {lv:'Hard', text:'“The charity’s annual report gives [nine pages] to its new logo and [two lines] to the closure of its night shelter.”',
   q:'What can you infer? Look at the proportions.',
   rows:[['WANT','That the year was about a fresh new image.'],
     ['PROVE','That the charity chose to give nine pages to a logo and two lines to closing a shelter.'],
     ['X','I can infer the charity is hiding the closure, because it gave “nine pages” to a logo and only “two lines” to the shelter. How much space something gets is itself a clue.']]},
  {lv:'Fun', text:'Weasel word round. “[Up to] 50% off.” “[Helps] fight plaque.” “Part of a [healthy] breakfast.” “[Some] users saw results.” “[Practically] new.”',
   q:'Which word in each claim is doing the escaping?',
   rows:[['PICK','up to, helps, part of, some, practically.'],
     ['WHY','Each one lets the company walk away. “Helps fight” is not “stops”. “Part of a healthy breakfast” is true of a glass of water.'],
     ['X','Circle the escape word first. Then ask what would have to be true for the claim to be a lie: usually, almost nothing.']]}
];

const SHEET = {
  A:{title:'Part A: Do Now', task:'4 min, on your own.', time:240, items:[
    {n:'A1', t:'The gates were locked, the flags had gone and a security van sat where the ticket booth used to be.', q:'What can you infer? Use two clues.',
     a:'The place has closed down, probably for good. Clues: “the flags had gone”, which nobody bothers to remove for a single day off, and “a security van sat where the ticket booth used to be”, which shows the site is now being guarded rather than run.'},
    {n:'A2', t:'Point: the hotel is run down. Evidence: “a lift that had been ‘out of order’ since spring”.', q:'Write the Explain only.',
     a:'This suggests nobody is maintaining the building, because a lift left broken from spring until now has been ignored for months, not days.'}
  ]},
  B:{title:'Part B: Small Print Detective', task:'Pairs, 10 min. For each claim: (1) what do they WANT you to believe? (2) what does it actually prove? (3) what has been left out?', time:600, claims:true, cards:[
    {n:'1', t:'Voted best café on Maple Street.', a:'Want: it is the best café anywhere. Proves: some people voted, on one street. Left out: how many voted, and how many cafés are on Maple Street. It may be the only one.'},
    {n:'2', t:'9 out of 10 cat owners said their cats prefer it.', a:'Want: cats love it. Proves: nine owners out of ten who answered said so. Left out: how many owners were asked in total, who paid for the survey, and that owners are guessing: nobody asked the cats.'},
    {n:'3', t:'Now with 30% fewer calories!', a:'Want: this is healthy food. Proves: it has fewer calories than something. Left out: fewer than what, how many calories are left, and whether the portion has shrunk by 30% too.'},
    {n:'4', t:'Up to 70% off selected items.', a:'Want: the whole shop is 70% off. Proves: at least one item is discounted by no more than 70%. Left out: which items, how many, and that “up to” includes 5%.'},
    {n:'5', t:'Clinically proven to reduce wrinkles in some users.', a:'Want: it works. Proves: in a test, it did something for an unnamed number of people. Left out: how many “some” is, how much reduction, over how long, and who funded the trial.'},
    {n:'6', t:'More parents choose BrightWhite than any other whitening toothpaste.', a:'Want: it is the best toothpaste. Proves: it outsells other whitening toothpastes. Left out: by how much, whether it works better, and how small the whitening category is compared with ordinary toothpaste.'}
  ]},
  C:{title:'Part C: On your own (6 marks)', task:'Read each text, then answer. The marks tell you how much to write.', time:900, items:[
    {sub:'Text 1: from a local news report'},
    {quote:'Since the leisure centre introduced its $2 evening swim, attendance after 6 p.m. has tripled. The centre has extended its lifeguard rota twice, and the car park now fills by half past five. However, membership sales have fallen for the third quarter running, and the centre’s café has cut its opening hours.'},
    {n:'C1 [2]', t:'What can you infer about the effect of the $2 evening swim? Use two clues.',
     a:'It has been a success at filling the pool in the evenings. Clues: attendance after 6 p.m. “has tripled”, and the centre “has extended its lifeguard rota twice”, which nobody pays for unless the crowds are real. The car park filling by half past five is a third clue.'},
    {n:'C2 [1]', t:'Membership sales have fallen. What does this suggest about the scheme overall?',
     a:'People are dropping memberships and paying $2 a swim instead, so the centre may be busier but earning less. The café cutting its hours points the same way.'},
    {sub:'Text 2: from a letter to the local paper'},
    {quote:'I have lived on Hill Road for thirty-one years. In that time I have watched the pavement narrow, the traffic double and the last shop close. The council tells us the new development will “revitalise” the area. I have heard that word before, in 2009, and again in 2016.'},
    {n:'C3 [2]', t:'What does the writer think of the council’s promise? Use two clues.',
     a:'He does not believe a word of it. Clues: he puts “revitalise” in quotation marks, which distances him from the council’s own word, and he has “heard that word before, in 2009, and again in 2016”. His list of thirty-one years of decline is a third clue.'},
    {n:'C4 [1]', t:'What is the writer implying by mentioning 2009 and 2016?',
     a:'That the same promise has been made twice already and nothing improved, so this one will come to nothing either. He implies it rather than saying it, which is harder to argue with.'}
  ]},
  D:{title:'Part D: Swap and mark', task:'8 min. Mark your partner’s C1 and C3 against the criteria. Write their score, then one sentence.', time:480,
    table:[['Marks','What it looks like'],
      ['2','A valid inference AND two clues from the text that support it.'],
      ['1','A valid inference with one clue, or clues listed with no inference drawn.'],
      ['0','Retells the text without working anything out.']],
    items:[
      {n:'Try', t:'“The evening swim is popular. Attendance after 6 p.m. has tripled and they have extended the lifeguard rota twice.”', a:'2 marks. Inference plus two clues, both quoted from the text.'},
      {n:'Try', t:'“Attendance has tripled, the rota was extended twice and the car park fills by half five.”', a:'0 marks. Three clues, nothing worked out. It only retells the text.'},
      {n:'Try', t:'“The writer does not trust the council because he has heard it all before.”', a:'1 mark. Valid inference, one clue, and the clue is paraphrased rather than quoted.'},
      {n:'Frame', t:'Write this sentence under your partner’s score:', q:'“To get the second mark you needed …”', a:'Be specific: name the clue they missed, or tell them which sentence to quote. “Write more” helps nobody.'}
    ]},
  E:{title:'Part E: Exit Ticket', task:'On your own, 2 marks: 1 for the inference, 1 for two clues.', time:300, items:[
    {n:'E', t:'The company’s annual report devotes fourteen pages to its tree-planting scheme and one paragraph to the factory closures. Profits, it notes in a footnote, are up.',
     q:'What can you infer about the company? Use two clues.',
     a:'The company is using the tree-planting to draw attention away from the job losses. Clues: “fourteen pages” for trees against “one paragraph” for the closures, and profits buried “in a footnote”, which is where you put something you would rather nobody read next to news of people losing their jobs.'}
  ]}
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const k in attrs){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const marked = s => esc(s).replace(/\[([^\]]+)\]/g,'<span class="clue">$1</span>');

const S = {tab:0, card:0, part:'A'};
const TABS = ['1  The skill','2  Together','3  Worksheet'];
function nav(){
  const n=$('#nav'); n.innerHTML='';
  TABS.forEach((t,i)=>n.append(el('button',{class:i===S.tab?'on':'',onclick:()=>{S.tab=i;render();}},t)));
}

function stepCard(d, meta){
  const box=el('div',{class:'card'});
  if(meta) box.append(meta);
  const text=el('p',{class:'text',html:marked(d.text)});
  box.append(text, el('p',{class:'q'},d.q));
  const steps=el('div',{class:'steps'});
  const nodes=d.rows.map(([key,t])=>{const [c,h]=R[key]; const s=el('div',{class:'step '+c},el('b',{},h),el('span',{},t)); steps.append(s); return s;});
  box.append(steps);
  const labels=d.rows.map(([k])=>R[k][1]);
  let k=0;
  const next=el('button',{class:'btn main'},labels[0]);
  const hide=el('button',{class:'btn'},'Hide all');
  function upd(){
    text.classList.toggle('show-clue',k>0);
    nodes.forEach((s,i)=>s.classList.toggle('on',i<k));
    next.textContent = k>=labels.length ? 'Done' : labels[k];
    next.disabled = k>=labels.length;
  }
  next.onclick=()=>{k=Math.min(labels.length,k+1);upd();};
  hide.onclick=()=>{k=0;upd();};
  box.append(el('div',{class:'row'},next,hide));
  box._next=()=>{ if(k<labels.length){k++;upd();return true;} return false; };
  upd();
  return box;
}

function render(){
  nav();
  const m=$('#main'); m.innerHTML=''; window._active=null;
  if(S.tab===0){
    m.append(el('h1',{},'Non-fiction is written to make you believe something.'),
      el('p',{class:'lead'},'Same skill as fiction, different purpose: work out what the writer wants, what the words actually prove, and what has been left out.'),
      el('div',{class:'eq'},
        el('div',{class:'box b-point'},'They want you to believe',el('span',{},'the impression the claim gives')),
        el('div',{class:'box b-ev'},'It actually proves',el('span',{},'strip it back to the facts in the words')),
        el('div',{class:'box b-ex'},'Left out',el('span',{},'the numbers, names and comparisons missing'))));
    window._active=stepCard(SKILL);
    m.append(window._active,
      el('div',{class:'frame'},'What does this actually prove?'));
  }
  if(S.tab===1){
    const d=TOGETHER[S.card];
    m.append(el('h1',{},'Together'),
      el('div',{class:'frame'},'I can infer … because … and …'),
      el('div',{class:'frame'},'What has been left out?'));
    const meta=el('div',{class:'meta'},el('span',{class:'count'},`${S.card+1} of ${TOGETHER.length}`),
      el('span',{class:'level lv-'+d.lv},d.lv));
    window._active=stepCard(d,meta);
    m.append(window._active);
    const prev=el('button',{class:'btn',onclick:()=>{S.card--;render();}},'← Previous');
    const nxt=el('button',{class:'btn main',onclick:()=>{S.card++;render();}},'Next example →');
    prev.disabled=S.card===0; nxt.disabled=S.card===TOGETHER.length-1;
    m.append(el('div',{class:'row'},prev,el('span',{class:'spacer'}),nxt));
  }
  if(S.tab===2){
    m.append(el('h1',{},'Your turn: the worksheet'), el('p',{class:'lead'},'Answer in your book. Today you work alone, then mark a partner’s answers against the criteria.'));
    const parts=el('div',{class:'parts'});
    Object.keys(SHEET).forEach(k=>parts.append(el('button',{class:k===S.part?'on':'',onclick:()=>{S.part=k;render();}},SHEET[k].title)));
    m.append(parts);
    const P=SHEET[S.part];
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'phead'},el('h2',{},P.title),el('span',{class:'task'},P.task),
      el('button',{class:'mini',onclick:()=>startTimer(P.time)},`Start ${P.time/60} min timer`),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.add('on'));card.querySelectorAll('.bagitems li').forEach(l=>l.classList.add('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.add('show-clue'));}},'Show all answers'),
      el('button',{class:'mini',onclick:()=>{card.querySelectorAll('.ans,.strokes').forEach(a=>a.classList.remove('on'));card.querySelectorAll('.sent').forEach(t=>t.classList.remove('show-clue'));}},'Hide all')));
    if(P.claims){
      const grid=el('div',{class:'draws'});
      P.cards.forEach(c=>{
        const ans=el('div',{class:'strokes'},c.a);
        grid.append(el('div',{class:'hole'},
          el('div',{class:'hh'},el('span',{class:'hn'},c.n),el('span',{class:'pt'},'“'+c.t+'”')),
          el('div',{class:'row'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},'Want / proves / left out')),
          ans));
      });
      card.append(grid);
    }
    if(P.prose){
      const box=el('div',{class:'prose'});
      P.prose.forEach(t=>box.append(el('p',{},t)));
      card.append(box);
    }
    if(P.table){
      const tb=el('table',{class:'grid'});
      P.table.forEach((r,i)=>{
        const tr=el('tr',{});
        r.forEach(c=>tr.append(el(i===0?'th':'td',{},c)));
        tr.append(el(i===0?'th':'td',{},i===0?'My mark':''));
        tb.append(tr);
      });
      card.append(tb);
    }
    (P.items||[]).forEach(it=>{
      if(it.sub){ card.append(el('div',{class:'item'},el('div',{class:'sub'},it.sub))); return; }
      if(it.quote){ card.append(el('div',{class:'item'},el('div',{class:'quotebox'},it.quote))); return; }
      const ans=el('div',{class:'ans'},it.a);
      card.append(el('div',{class:'item'},
        el('div',{class:'num'},it.n),
        el('div',{},el('div',{class:'t'},it.t), it.q?el('div',{class:'qq'},it.q):null,
          el('div',{class:'reveal'},el('button',{class:'mini',onclick:()=>ans.classList.toggle('on')},'Model answer'),ans))));
    });
    m.append(card, el('div',{class:'frame'},'Two clues, every time.'));
  }
}

/* ---------- timer ---------- */
let tLeft=0, tId=null;
function drawT(){ $('#timer').textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`; }
function startTimer(s){
  clearInterval(tId); tLeft=s; drawT(); $('#timer').classList.remove('flash');
  tId=setInterval(()=>{ tLeft--; drawT(); if(tLeft<=0){ clearInterval(tId); $('#timer').classList.add('flash'); } },1000);
}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#timer').onclick=()=>{ clearInterval(tId); tLeft=0; drawT(); };

/* ---------- theme, full screen, keys ---------- */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):{matches:false};
document.documentElement.dataset.theme=mq.matches?'dark':'light';
$('#theme').onclick=()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; };
$('#fs').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,button')) return;
  if(e.key===' '||e.key==='Enter'){ if(window._active&&window._active._next){ e.preventDefault(); window._active._next(); } }
  if(e.key==='ArrowRight'){ if(S.tab===1&&S.card<TOGETHER.length-1){S.card++;render();} else if(S.tab<2){S.tab++;render();} }
  if(e.key==='ArrowLeft'){ if(S.tab===1&&S.card>0){S.card--;render();} else if(S.tab>0){S.tab--;render();} }
});
render();
</script>
