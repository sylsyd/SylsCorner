<script>
const D={"intro": ["Oct 12, 2026 · @syl", "46 lessons over 7 weeks (Mon 2 Nov to Thu 17 Dec 2026) take 5SI from little or no essay knowledge to a five-paragraph theme essay on Family or Supernatural vs Reality. Three reading lessons a week finish the novel on Monday of Week 5, so students know the ending before they write a thesis. Weeks 5-6 build and practise the essay; Week 7 is feedback, planning and the common task.", "Two threads run all unit: a Theme tracker in students' books (two columns, one per task theme, filled after every reading lesson) and an essay skill built one piece at a time, roughly in the order the essay is assembled backwards from what the rubric rewards most.", "Friday Part 1 is a paragraph lesson from Week 1: students write one PEEL paragraph every week, and each week adds the newest skill (a well-chosen quote, a correctly punctuated quote, a formal voice, a zoomed-in explanation). By the practice essay they have written four, and the last question of each reading set rehearses the same skill."], "rubric": [["Answers the question; theme is \"recurring\"", "Tell a topic (family) from a theme (what the book says about it); show it at the start, middle and end", "W1 Tue", "Theme tracker every reading lesson"], ["Understanding of the text", "Know plot, characters and the four tales; say what events mean, not only what happens", "W1 Mon", "Every reading lesson, Fri online quizzes"], ["Body organised as instructed (PEEL)", "Point, Evidence, Explain, Link", "W1 Fri", "One paragraph every Friday W2-W4; W6 essay"], ["Appropriate and effective quotations", "Pick a short quote that proves the point; find it fast by chapter title", "W2 Tue", "Every paragraph"], ["Punctuation of quotes (Language)", "Inverted commas, comma and full stop placement, embedding a quote in your own sentence", "W2 Fri", "Fri online \"Fix the errors\""], ["Formal tone and register; no \"I think\"", "Third person, no contractions, literary present tense (\"Conor feels\")", "W3 Tue", "Every paragraph from W3"], ["Explaining evidence", "Zoom in on a word; \"This suggests...\", \"The word ... shows...\"; analysis verbs", "W4 Tue", "W4 Fri onwards"], ["Insight, deeper implications (Band 1)", "Test a claim against a detail that complicates it; write \"Although...\" claims that hold two truths (Grandma is harsh yet caring; the monster may be imagined yet the damage is real)", "W4 Tue (stretch), W5 Wed", "W5 Fri thesis, W6 essay"], ["How the writer achieves effects (Band 1)", "Name a method (symbol, repetition, the tales as parables, short sentences) and its effect", "W5 Wed", "W5 Thu reread, W6 essay"], ["Clear thesis with 3 distinct points", "One sentence: claim plus three separate points", "W5 Fri", "W6 essay, W7 Tue"], ["Introduction with grabber and TAGS", "Grabber, then Title, Author, Genre, Summary, then thesis", "W6 Tue", "W7 Wed rehearsal"], ["Paragraphs are linked; linking words", "End-of-paragraph link sentences; connectives that show the relationship (however, therefore, as a result), not just \"firstly\"", "W6 Wed", "W6 essay, W7 task"], ["Conclusion with clincher and greater significance", "Reword thesis, restate 3 points, why it matters, end on a thought, no new argument", "W6 Fri", "W7 task"], ["Varied sentences", "Simple, compound, complex, compound-complex", "W5 Tue", "W6 essay"], ["Task layout", "Name, date, \"Subject:\" line, indent each paragraph, skip a line between", "W6 Tue", "W6 essay, W7 task"]], "rubricIntro": ["The rubric gives 10 pts for content and 10 for language (coefficient 2). Band 1 in content is decided by insight and \"a developed response to the way the writer achieves his/her effects\"; Band 1 in language by grabber, clincher, linked paragraphs and ambitious vocabulary. Those discriminators get dedicated lessons, not just mentions."], "overview": ["Weekly rhythm, Weeks 1-4: Mon read + questions · Tue skill · Wed read + questions · Thu 1 read + questions · Thu 2 creative (paper and pencils only) · Fri 1 paragraph lesson · Fri 2 online review on Chromebooks. From Week 5, Wednesday is a skill lesson again and Mon/Thu become targeted rereads. Fri 2 results are read by strand (recall, evidence, explanation, language); the weakest strand becomes the warm-up of the next Tuesday.", "The 32 chapters are split over 12 reading lessons of 1,450-3,450 words (20-28 minutes read aloud with pauses, leaving 25-35 for questions). The fourth tale is read in one sitting with its explanation, so no one goes home on Conor letting go of his mother in the nightmare. Pacing rule: finishing the reading beats finishing the questions. If a lesson runs over, the remaining pages open the next Tuesday or Friday lesson; no reading homework is needed, and all writing, including the practice essay, happens in class.", "The novel is about a mother's terminal illness. Creative tasks stay fictional, nobody is asked about their own family, and it is worth checking quietly before Week 4 whether any student has a recent bereavement or an ill parent."], "glance": [["1", "2-6 Nov", "Mon Ch 1-2 · Wed Ch 3-5 · Thu Ch 6-7", "Theme vs topic; PEEL 1: first paragraph", "Draw the monster"], ["2", "9-13 Nov", "Mon holiday (Deepavali) · Wed Ch 8-9 · Thu Ch 10-11", "Choosing evidence; PEEL 2: quoting correctly", "Write a tale with a twist"], ["3", "16-20 Nov", "Mon Ch 12-14 · Wed Ch 15-17 · Thu Ch 18-20", "Formal register and present tense; PEEL 3: formal voice", "Comic strip: the second tale"], ["4", "23-27 Nov", "Mon Ch 21-24 · Wed Ch 25-27 · Thu Ch 28-30", "Explaining evidence; PEEL 4: Family (collected)", "Another point of view"], ["5", "30 Nov-4 Dec", "Mon Ch 31-32 (end) + Family reread · Thu reread: Supernatural vs Reality", "Feedback on PEEL; Writer's methods; Thesis statements", "Theme one-pager (art + writing)"], ["6", "7-11 Dec", "Mon reread: practice theme · Thu reread: the ending", "Introductions; Body paragraphs and links; Conclusions (practice essay built across the week)", "A fifth tale"], ["7", "14-17 Dec", "none", "Feedback and theme choice; Plan; Timed rehearsal; Common task on Thursday", "Thu 2 used for the task, or New cover design"]], "weeks": [{"title": "Week 1 (2-6 Nov): Into the novel, what a theme is", "notes": ["Students see the essay question on day one, so every reading lesson has a purpose: collecting evidence for two themes."], "lessons": [{"id": "w1-0", "day": "Mon", "focus": "Reading 1: Ch 1-2", "activity": "Unit launch: show the task question and the two themes. Read Ch 1-2. Questions: 6 literal, 2 inference (Why isn't Conor afraid of the monster? What does the breakfast scene show about life at home?).", "rubric": "Understanding of text", "week": 1, "holiday": false, "chapters": [1, 2]}, {"id": "w1-1", "day": "Tue", "focus": "Theme vs topic", "activity": "One simple example (topic \"family\" vs theme \"family can hurt and heal\"), then sort 8 statements as topic or theme. Set up the Theme tracker in books (Family / Supernatural vs Reality) and make the first entries from Ch 1-2.", "rubric": "Answers the question", "week": 1, "holiday": false, "chapters": []}, {"id": "w1-2", "day": "Wed", "focus": "Reading 2: Ch 3-5", "activity": "Read; questions on Harry, Lily and Miss Kwan, the Life Writing task and the monster's deal. Last 10 minutes: Real or dream? Sort the evidence so far (the leaves, \"Clearly.\", berries behind a closed window, the 12.07 clock) into Real / Imagined / Not sure, with one sentence giving a reason.", "rubric": "Supernatural vs Reality", "week": 1, "holiday": false, "chapters": [3, 4, 5]}, {"id": "w1-3", "day": "Thu 1", "focus": "Reading 3: Ch 6-7", "activity": "Read; questions on Grandma (sharp manner, but what does she actually do for Conor and his mum?) and \"Stories are wild creatures\". Last question: character web (Conor, Mum, Grandma, Dad, Lily, Harry, Miss Kwan, the monster), family links in one colour.", "rubric": "Understanding; Family evidence", "week": 1, "holiday": false, "chapters": [6, 7]}, {"id": "w1-4", "day": "Thu 2", "focus": "Draw the monster", "activity": "Pencil drawing of the monster from the Ch 1 description. Label 3 details with the exact words from the book (first practice copying quotes accurately).", "rubric": "Accurate quotation", "week": 1, "holiday": false, "chapters": []}, {"id": "w1-5", "day": "Fri 1", "focus": "PEEL 1: first paragraph", "activity": "PEEL in its simplest form, with the Explain zooming in on one word from the start. One model on the board: in Breakfast, Conor tells his mum \"It's okay\" twice; what does the repetition show about family? Build a second together on the leaves and \"Clearly.\" Students write their own on either theme with one quote. Kept as a baseline: they rewrite it in Week 4 and compare.", "rubric": "Body organised (PEEL)", "week": 1, "holiday": false, "chapters": []}, {"id": "w1-6", "day": "Fri 2", "focus": "Online review", "activity": "Chapter quiz (Ch 1-7) · Who said it? · Theme sort (Family / Supernatural vs Reality / Both)", "rubric": "Retrieval", "week": 1, "holiday": false, "chapters": []}], "number": 1}, {"title": "Week 2 (9-13 Nov, no Monday): Evidence and how to quote it", "notes": ["The week strengthens the \"E\" of PEEL: choosing a quote that proves something, then setting it out correctly inside a paragraph."], "lessons": [{"id": "w2-0", "day": "Mon", "focus": "Holiday", "activity": "Deepavali, no lesson.", "rubric": "", "week": 2, "holiday": true, "chapters": []}, {"id": "w2-1", "day": "Tue", "focus": "Choosing evidence", "activity": "One example claim (\"Conor looks after his mum\") with three possible quotes: which proves it best and why. Then 5 claims, 3 quotes each, class first, then pairs. Rule: short, exact, relevant. Quick drill: find a quote fast using chapter titles.", "rubric": "Appropriate, effective quotations", "week": 2, "holiday": false, "chapters": []}, {"id": "w2-2", "day": "Wed", "focus": "Reading 4: Ch 8-9", "activity": "Read the first tale; questions on the twist (the prince, the queen, the farmer's daughter) and \"Sometimes people need to lie to themselves most of all.\" Last question: choose the best quote to prove a given claim. Tracker entries.", "rubric": "Understanding; the tales as fantasy carrying real truths", "week": 2, "holiday": false, "chapters": [8, 9]}, {"id": "w2-3", "day": "Thu 1", "focus": "Reading 5: Ch 10-11", "activity": "Read; questions on Conor at school (Lily, Harry, feeling invisible), and Mum's news in \"Little Talk\" (the treatment is not working, Dad is coming). Last question: answer with one well-chosen quote. Tracker entries.", "rubric": "Understanding; both themes", "week": 2, "holiday": false, "chapters": [10, 11]}, {"id": "w2-4", "day": "Thu 2", "focus": "Write a tale with a twist", "activity": "150-200 word tale told in the monster's voice where the character who seems good is not, or the reverse.", "rubric": "Creative writing", "week": 2, "holiday": false, "chapters": []}, {"id": "w2-5", "day": "Fri 1", "focus": "PEEL 2: quoting correctly", "activity": "Inverted commas, copying exactly, embedding a short quote inside your own sentence, where the comma and full stop go (\"Fix the errors\" on 6 sentences). Then a PEEL paragraph on the first tale using one embedded quote.", "rubric": "Punctuation of quotes; PEEL", "week": 2, "holiday": false, "chapters": []}, {"id": "w2-6", "day": "Fri 2", "focus": "Online review", "activity": "Chapter quiz (Ch 8-11) · Punctuate the quote · Best quote for the claim", "rubric": "Retrieval; language accuracy", "week": 2, "holiday": false, "chapters": []}], "number": 2}, {"title": "Week 3 (16-20 Nov): Writing about a novel in a formal voice", "notes": ["Paragraphs move into the voice the rubric expects: formal, third person, present tense."], "lessons": [{"id": "w3-0", "day": "Mon", "focus": "Reading 6: Ch 12-14", "activity": "Read; questions on Grandma's house, Dad's visit and \"Americans don't get much holiday.\" Last question: one embedded, correctly punctuated quote. Tracker entries (Family is rich here).", "rubric": "Understanding; Family", "week": 3, "holiday": false, "chapters": [12, 13, 14]}, {"id": "w3-1", "day": "Tue", "focus": "Formal register and present tense", "activity": "Literary present tense (\"Conor feels\", not \"Conor felt\"), third person, no \"I think\", no contractions or slang. One example, rewrite 4 sentences together, then 8 alone.", "rubric": "Formal tone; tense accuracy", "week": 3, "holiday": false, "chapters": []}, {"id": "w3-2", "day": "Wed", "focus": "Reading 7: Ch 15-17", "activity": "Read the second tale and \"Destruction\"; questions on \"Belief is half of all healing\" and who really destroyed the sitting room. Last question: two formal, present-tense sentences with a quote.", "rubric": "Both themes", "week": 3, "holiday": false, "chapters": [15, 16, 17]}, {"id": "w3-3", "day": "Thu 1", "focus": "Reading 8: Ch 18-20", "activity": "Read; questions on being invisible at school and the medicine made from yew trees. Tracker entries.", "rubric": "Supernatural vs Reality", "week": 3, "holiday": false, "chapters": [18, 19, 20]}, {"id": "w3-4", "day": "Thu 2", "focus": "Comic strip: the second tale", "activity": "Six-panel comic of the Apothecary and the Parson, one present-tense caption per panel, one exact quote somewhere in the strip.", "rubric": "Creative; quotation", "week": 3, "holiday": false, "chapters": []}, {"id": "w3-5", "day": "Fri 1", "focus": "PEEL 3: formal voice", "activity": "PEEL 3 on \"Conor feels alone at school.\" Colour-code a model P, E, E, L, then students write their own in a formal, present-tense voice with an embedded quote and check it against a 4-line PEEL checklist.", "rubric": "Body organised as instructed", "week": 3, "holiday": false, "chapters": []}, {"id": "w3-6", "day": "Fri 2", "focus": "Online review", "activity": "Chapter quiz (Ch 12-20) · Label the PEEL · Formal or informal?", "rubric": "Retrieval; organisation", "week": 3, "holiday": false, "chapters": []}], "number": 3}, {"title": "Week 4 (23-27 Nov): Explaining evidence, the fourth tale", "notes": ["Thursday reads the fourth tale, its aftermath and the monster's explanation in one sitting, so no student leaves on Conor's guilt without hearing \"You were merely wishing for the end of pain.\""], "lessons": [{"id": "w4-0", "day": "Mon", "focus": "Reading 9: Ch 21-24", "activity": "Read; questions on the third tale (the invisible man), what happens to Harry, and \"I no longer see you.\" Last question: was the monster or Conor responsible? Answer with a quote.", "rubric": "Supernatural vs Reality", "week": 4, "holiday": false, "chapters": [21, 22, 23, 24]}, {"id": "w4-1", "day": "Tue", "focus": "Explaining evidence", "activity": "The \"E\" most students skip. One example: zoom in on one word in a quote and say what it suggests. Bank of analysis verbs (suggests, reveals, shows, emphasises, conveys). Explain 3 quotes together, 3 alone. Stretch: one \"Although...\" sentence that holds two readings (Although Grandma is sharp with Conor, ...).", "rubric": "Deeper implications; ambitious vocabulary", "week": 4, "holiday": false, "chapters": []}, {"id": "w4-2", "day": "Wed", "focus": "Reading 10: Ch 25-27", "activity": "Read; questions on Lily's note, Mum's conversation in \"100 Years\" (\"You be as angry as you need to be\") and \"What's the use of you?\". Tracker entries.", "rubric": "Family", "week": 4, "holiday": false, "chapters": [25, 26, 27]}, {"id": "w4-3", "day": "Thu 1", "focus": "Reading 11: Ch 28-30", "activity": "The Fourth Tale, The Rest of the Fourth Tale, Life After Death in one sitting. Short, calm question set: what truth has Conor been hiding? What does the monster mean by \"the most human wish of all\"? How can \"both be true\"?", "rubric": "Both themes; deeper implications", "week": 4, "holiday": false, "chapters": [28, 29, 30]}, {"id": "w4-4", "day": "Thu 2", "focus": "Another point of view", "activity": "150-200 words: one moment from the book told by Grandma, Mum or Dad (e.g. Grandma finding her sitting room). Fictional voice only.", "rubric": "Creative; Family", "week": 4, "holiday": false, "chapters": []}, {"id": "w4-5", "day": "Fri 1", "focus": "PEEL 4: Family", "activity": "Individual paragraph: \"Conor's father lets him down.\" Point, embedded quote, explanation with a word zoomed in, link back to the theme. Then reread the Week 1 baseline paragraph and note one improvement. Collected for Week 5 feedback.", "rubric": "PEEL; quotation; explanation", "week": 4, "holiday": false, "chapters": []}, {"id": "w4-6", "day": "Fri 2", "focus": "Online review", "activity": "Chapter quiz (Ch 21-30) · Choose the best explanation · Real or imagined? (evidence sort)", "rubric": "Retrieval; explanation", "week": 4, "holiday": false, "chapters": []}], "number": 4}, {"title": "Week 5 (30 Nov-4 Dec): Rereading for themes, writer's methods, thesis", "notes": ["Monday finishes the novel, then the reading lessons become targeted rereads that complete the Theme tracker, and the Band 1 discriminator (how the writer achieves effects) gets its own lesson."], "lessons": [{"id": "w5-0", "day": "Mon", "focus": "Reading 12: Ch 31-32, then reread for Family", "activity": "Read the last two chapters, Something in Common (Ch 31) and The Truth (Ch 32). Then reread short passages from Breakfast (Ch 2), Americans Don't Get Much Holiday (Ch 14) and 100 Years (Ch 26). Questions: what each shows about Conor's family and how it changes from start to end. Star the 6 strongest Family quotes in the tracker.", "rubric": "Recurring theme; Family evidence", "week": 5, "holiday": false, "chapters": [31, 32]}, {"id": "w5-1", "day": "Tue", "focus": "Feedback on PEEL", "activity": "Anonymised real paragraphs from last Friday (strong and weak) on the board, one at a time. Improve one together, then redraft own paragraph. Short add-on: the four sentence types, upgrade 2 of their own sentences.", "rubric": "PEEL; varied sentences", "week": 5, "holiday": false, "chapters": []}, {"id": "w5-2", "day": "Wed", "focus": "Writer's methods", "activity": "How Ness makes us question what is real: the repeated 12.07, physical evidence (leaves, berries, sapling), Conor's own doubts, damage that is real (Grandma's room, Harry). Frame: \"Ness uses ... to ...\". Write 3 method sentences, one per method.", "rubric": "How the writer achieves effects (Band 1)", "week": 5, "holiday": false, "chapters": []}, {"id": "w5-3", "day": "Thu 1", "focus": "Reread: Supernatural vs Reality", "activity": "Short passages from Breakfast (Ch 2), Three Stories (Ch 5), Destruction (Ch 17), Could It Be? (Ch 20), Punishment (Ch 24), The Truth (Ch 32). Questions include one method question per passage. Star the 6 strongest quotes.", "rubric": "Recurring theme; methods", "week": 5, "holiday": false, "chapters": []}, {"id": "w5-4", "day": "Thu 2", "focus": "Theme one-pager", "activity": "Longer art and writing piece on one theme: a central drawn symbol (yew tree, clock, nightmare), 3 exact quotes placed around it, a one-line \"what Ness is saying\", one method sentence. Becomes a revision sheet.", "rubric": "Creative; evidence selection", "week": 5, "holiday": false, "chapters": []}, {"id": "w5-5", "day": "Fri 1", "focus": "Thesis statements", "activity": "Thesis = claim + 3 distinct points. One example, sort 6 theses as strong or weak, fix 2 weak ones together. Write a thesis for the practice theme (see Week 6), then draft one for each task theme in the tracker. Stretch: an \"Although...\" thesis that holds two truths.", "rubric": "Clear thesis; 3 separate points", "week": 5, "holiday": false, "chapters": []}, {"id": "w5-6", "day": "Fri 2", "focus": "Online review", "activity": "Strong or weak thesis? · Method and effect matching · Whole-book quiz, part 1", "rubric": "Thesis; methods; retrieval", "week": 5, "holiday": false, "chapters": []}], "number": 5}, {"title": "Week 6 (7-11 Dec): Practice essay, built part by part", "notes": ["Practice question: \"Isolation is a recurring theme in A Monster Calls.\" It uses the same skills and some of the same chapters without pre-writing the real task. Each lesson teaches one part of the essay and students write that part straight away.", "Teacher marks the practice essays over the weekend with the real rubric and pulls anonymised extracts for Monday."], "lessons": [{"id": "w6-0", "day": "Mon", "focus": "Reread: Isolation", "activity": "Passages from Understanding (Ch 10), Invisible (Ch 18), I No Longer See You (Ch 22), A Note (Ch 25). Questions, then a planning grid: thesis, 3 points, 1-2 quotes per point.", "rubric": "Planning; evidence selection", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-1", "day": "Tue", "focus": "Introductions", "activity": "Grabber types (question, bold statement, short quote, striking image), then TAGS (Title, Author, Genre, Summary), then thesis. Task layout: name, date, \"Subject:\" line, indent, skip a line. Write the practice introduction.", "rubric": "Introduction with grabber; layout", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-2", "day": "Wed", "focus": "Body paragraphs and links", "activity": "Link sentences at the end of each body paragraph; connectives bank. Write body paragraphs 1 and 2.", "rubric": "Linked paragraphs; PEEL", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-3", "day": "Thu 1", "focus": "Reread: the ending", "activity": "Life After Death (Ch 30) and The Truth (Ch 32). Questions on \"humans are complicated beasts\", \"You do not write your life with words... You write it with actions\" and \"by doing so, he could finally let her go\": what is the book saying overall? Feeds the \"greater significance\" of every conclusion. Last 25 minutes: write body paragraph 3.", "rubric": "Deeper implications", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-4", "day": "Thu 2", "focus": "A fifth tale", "activity": "150-200 word tale the monster might tell Grandma or Lily, with a pencil illustration.", "rubric": "Creative writing", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-5", "day": "Fri 1", "focus": "Conclusions", "activity": "Reword the thesis, restate 3 points, say why it matters, end with a clincher. One example, improve a weak one together, write the practice conclusion. Self-check the whole essay with the checklist from the common task, then hand in.", "rubric": "Conclusion with clincher", "week": 6, "holiday": false, "chapters": []}, {"id": "w6-6", "day": "Fri 2", "focus": "Online review", "activity": "Order the introduction · Which link sentence works best? · Fix the errors (quotes, tense, register) · Whole-book quiz, part 2", "rubric": "Organisation; language accuracy", "week": 6, "holiday": false, "chapters": []}], "number": 6}, {"title": "Week 7 (14-17 Dec, no Friday): Feedback, planning, common task", "notes": ["The task sits on Thursday so it can use both Thursday lessons back to back (110 minutes) if the two-lesson format is chosen, with three preparation lessons before it. There is no Friday, so absentees sit it in January."], "lessons": [{"id": "w7-0", "day": "Mon", "focus": "Feedback and theme choice", "activity": "Anonymised extracts from the practice essays, strong and weak, one at a time. Each student writes 2 targets from the checklist. Choose Family or Supernatural vs Reality.", "rubric": "All", "week": 7, "holiday": false, "chapters": []}, {"id": "w7-1", "day": "Tue", "focus": "Plan", "activity": "Planning grid for the chosen theme: thesis, 3 points, 2 starred tracker quotes per point, one method per point. Test each point against a detail that complicates it. If closed book: quote-learning in pairs. If book allowed: find-it-fast drill by chapter title.", "rubric": "Thesis; quotation; insight", "week": 7, "holiday": false, "chapters": []}, {"id": "w7-2", "day": "Wed", "focus": "Timed rehearsal", "activity": "Introduction + first body paragraph in 30 minutes from the plan. Peer check with the checklist, then fix one target.", "rubric": "Introduction; PEEL; language", "week": 7, "holiday": false, "chapters": []}, {"id": "w7-3", "day": "Thu 1", "focus": "Common task", "activity": "One-lesson format: the whole task (5 min instructions, 5 planning, 35 writing, 8 checking, 2 hand-in). Two-lesson format: instructions, planning, writing begins. Checklist handed out, layout as on the task sheet.", "rubric": "Full rubric", "week": 7, "holiday": false, "chapters": []}, {"id": "w7-4", "day": "Thu 2", "focus": "Task part 2 or creative", "activity": "Two-lesson format: writing continues, final 10 minutes checking quotes, tense and layout. One-lesson format: New cover design, an original cover with a one-line tagline that states a theme.", "rubric": "Full rubric / creative", "week": 7, "holiday": false, "chapters": []}], "number": 7}], "evidenceIntro": ["Quotes checked against the text; chapter numbers match the reading schedule. Three likely body-paragraph points per theme."], "evidence": {"Family": [["Conor and Mum: love, and a son who has had to grow up", "Conor makes his own breakfast and runs the house; \"You be as angry as you need to be\"; \"I don't want you to go\"", "2, 26, 32"], ["Grandma: from conflict to shared grief", "Conor wrecks her sitting room; \"We have something in common.\"", "6, 17, 31"], ["Dad: absence and a new family", "Left for America with Stephanie; \"Americans don't get much holiday.\"", "4, 14"]], "Supernatural vs Reality": [["Is the monster real? Physical traces", "\"Every inch of his bedroom floor was covered in short, spiky yew tree leaves.\"; \"It had been a dream. What else could it have been?\"; berries, sapling; the clock at 12.07", "1, 2, 5, 9"], ["The tales: fantasy that tells real truths", "\"Stories are wild creatures\"; \"Sometimes people need to lie to themselves most of all.\"; \"Belief is half of all healing.\"; \"humans are complicated beasts\"", "7, 9, 16, 30"], ["Real damage and the real truth", "The sitting room and Harry: the monster acts, Conor is blamed; medicine made from yew trees; the nightmare and \"the truth\"; 12.07 as the moment Conor expects at the end (\"maybe even this 12.07\")", "17, 20, 24, 28-32"]]}, "evidenceNotes": ["Each body paragraph needs its own argument. A Family essay is not three character profiles; a Supernatural vs Reality essay is not a vote on whether the monster exists. The strongest essays explore the uncertainty and the emotional truth it carries."], "title": "Unit 2: A Monster Calls, Scope and Sequence (5SI)", "chapters": ["A Monster Calls", "Breakfast", "School", "Life Writing", "Three Stories", "Grandma", "The Wildness of Stories", "The First Tale", "The Rest of the First Tale", "Understanding", "Little Talk", "Grandma's House", "Champ", "Americans Don't Get Much Holiday", "The Second Tale", "The Rest of the Second Tale", "Destruction", "Invisible", "Yew Trees", "Could It Be?", "No Tale", "I No Longer See You", "The Third Tale", "Punishment", "A Note", "100 Years", "What's the Use of You?", "The Fourth Tale", "The Rest of the Fourth Tale", "Life After Death", "Something in Common", "The Truth"]};

const navs=[['overview','Unit overview'],['rubric','Essay rubric'],['evidence','Evidence bank'],['chapters','Chapter index']];
let current='overview',week=1,evidence='Family',query='',completed=new Set(),saveOK=true;
try{const saved=JSON.parse(localStorage.getItem('amc-unit2-planner-v1')||'{}');completed=new Set((saved.completed||[]).filter(id=>teaching.some(l=>l.id===id)));}catch(e){saveOK=false;}
function save(){try{localStorage.setItem('amc-unit2-planner-v1',JSON.stringify({completed:[...completed]}));saveOK=true;}catch(e){saveOK=false;}updateProgress();}
function updateProgress(){$('progressLabel').textContent=completed.size+' / 46 lessons complete';$('progressFill').style.width=(completed.size/46*100)+'%';$('saveState').textContent=saveOK?'Progress saved on this browser.':'Progress lasts for this session only.';}
function nav(){ $('mainnav').innerHTML=navs.map(([key,name])=>`<button class="navbtn ${current===key&&!query?'active':''}" data-view="${key}" ${current===key&&!query?'aria-current="page"':''}>${name}<span aria-hidden="true">↗</span></button>`).join('');$('weeknav').innerHTML=D.weeks.map((w,i)=>`<button class="navbtn ${current==='week'&&week===i+1&&!query?'active':''}" data-week="${i+1}" ${current==='week'&&week===i+1&&!query?'aria-current="page"':''}><span><span class="num">${String(i+1).padStart(2,'0')}</span> &nbsp;Week ${i+1}</span><span class="date">${esc(dates[i])}</span></button>`).join('');}
function show(view,n){query='';$('search').value='';$('clearSearch').hidden=true;current=view;if(n)week=Number(n);close();$('rail').classList.remove('open');$('menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);location.hash=view==='week'?'week-'+week:view;}
function heading(k,t,p=''){return `<div class="sectionhead"><div><div class="eyebrow">${esc(k)}</div><h1 class="view-title">${esc(t)}</h1>${p?'<div class="lead">'+esc(p)+'</div>':''}</div></div>`;}
function render(){nav();updateProgress();$('crumb').textContent=query?'Search the unit':current==='week'?'Weekly plan / Week '+week:(navs.find(n=>n[0]===current)||['','Unit overview'])[1];$('workspace').innerHTML=query?searchView():({overview:overview,rubric:rubric,evidence:evidenceView,chapters:chapters,week:weekView}[current]||overview)();}
function overview(){return `<section class="hero"><img src="${A.cover}" alt="Charcoal illustration of a towering tree monster beside a small boy"><div class="hero-copy"><div class="eyebrow">5SI · Unit 2 · Novel study</div><h1>A Monster<br>Calls</h1><div class="sub">From first encounter to final essay.</div><div class="dates">Monday 2 November – Thursday 17 December 2026</div><div class="stats"><div class="stat"><strong>07</strong><span>Weeks</span></div><div class="stat"><strong>46</strong><span>Lessons</span></div><div class="stat"><strong>32</strong><span>Chapters</span></div></div><div class="actions"><a class="primary" href="/lessons/5si/unit-2/week-1/">Enter Week 1 ↗</a><button class="secondary" data-source="intro">Read the unit approach</button></div></div></section><div class="path-title"><h2>The seven-week journey</h2><p>Choose a week to open its lessons.</p></div><div class="path">${D.weeks.map((w,i)=>`<button data-week="${i+1}"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="pathdate">${esc(dates[i])}</span><span class="name">${shortNames[i]}</span></button>`).join('')}</div><div class="introbtns"><button class="textlink" data-source="rhythm">Reading rhythm & pacing</button><button class="textlink" data-source="glance">Weekly plan at a glance</button><button class="textlink" data-view="rubric">What the essay demands ↗</button></div>`;}
function kind(l){return l.holiday?'No lesson':/Reading|Reread/.test(l.focus)?'Reading & questions':l.day==='Thu 2'?'Creative / task':l.day==='Fri 2'?'Chromebook review':/PEEL/.test(l.focus)?'Paragraph workshop':'Essay skill / preparation';}
function lessonCard(l,search=false){return `<button class="lesson-card ${completed.has(l.id)?'done':''} ${l.holiday?'holiday':''}" data-lesson="${l.id}"><span class="day">${search?'Week '+l.week+' · ':''}${esc(l.day)}</span><h3>${esc(l.focus)}</h3><span class="kind">${kind(l)}</span>${search?'<span class="excerpt">'+esc(l.activity.slice(0,155))+(l.activity.length>155?'…':'')+'</span>':''}<span class="cardbottom"><span>${l.holiday?'Deepavali':completed.has(l.id)?'Complete':l.chapters.length?'Ch '+l.chapters[0]+(l.chapters.length>1?'–'+l.chapters.at(-1):''):'55-minute lesson'}</span><span class="arrow" aria-hidden="true">↗</span></span></button>`;}
function weekView(){const w=D.weeks[week-1];return `${week===1?'<a class="week-start" href="/lessons/5si/unit-2/week-1/"><span><strong>Week 1 classroom lessons</strong><small>Six Week 1 activities are ready</small></span><span>Open Week 1 →</span></a>':''}<section class="weekbanner"><img src="${A[weekArt[week-1]]}" alt="Atmospheric charcoal artwork"><div class="weekcopy"><div class="eyebrow">The weekly plan · ${esc(dates[week-1])} 2026</div><h2>${esc(w.title)}</h2>${paragraphs(w.notes.slice(0,1))}</div></section><div class="weektoolbar"><button data-week="${week-1}" ${week===1?'disabled':''}>← Previous week</button><p>${w.lessons.filter(l=>!l.holiday).length} teaching lessons · click a card for the full plan</p><button data-week="${week+1}" ${week===7?'disabled':''}>Next week →</button></div><div class="schedule">${w.lessons.map(l=>lessonCard(l)).join('')}</div>${w.notes.length>1?'<div class="week-footer">'+paragraphs(w.notes.slice(1))+'</div>':''}`;}
function table(headers,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;}
function rubric(){return heading('Backwards from the task','What the essay demands')+`<div class="rubric-intro"><div class="lead">${paragraphs(D.rubricIntro)}</div><img src="${A.yew}" alt="Yew branches in charcoal"></div><div class="table-wrap"><table class="rubric-table"><thead><tr>${['Rubric / checklist requirement','What students must be able to do','First taught','Practised'].map(t=>'<th scope="col">'+t+'</th>').join('')}</tr></thead><tbody>${D.rubric.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2].replace(/W(\d) (Mon|Tue|Wed|Thu|Fri)/g,(m,w,day)=>`<button data-rubric-lesson="${w}|${day}">${esc(m)} ↗</button>`)}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`;}
function evidenceView(){const rows=D.evidence[evidence];return heading('Teacher reference','Theme evidence bank',D.evidenceIntro[0])+`<div class="evidence-switch" role="group" aria-label="Choose theme"><button class="${evidence==='Family'?'active':''}" data-theme="Family" aria-pressed="${evidence==='Family'}">Family</button><button class="${evidence==='Supernatural vs Reality'?'active':''}" data-theme="Supernatural vs Reality" aria-pressed="${evidence==='Supernatural vs Reality'}">Supernatural vs Reality</button></div><div class="evidence-grid">${rows.map((r,i)=>`<article class="evidence-card"><span class="number">0${i+1}</span><h3>${esc(r[0])}</h3><p class="quote">${esc(r[1])}</p><div class="tagrow">${chapterButtons(expandChapterList(r[2]))}</div></article>`).join('')}</div><div class="evidence-art"><img src="${A[evidence==='Family'?'hands':'window']}" alt="${evidence==='Family'?'Mother and child holding hands, drawn in charcoal':'An intact bedroom window with yew leaves, drawn in charcoal'}"></div><div class="evidence-notes">${paragraphs(D.evidenceNotes)}</div>`;}
function expandChapterList(s){return s.split(',').flatMap(x=>{const m=x.trim().match(/^(\d+)-(\d+)$/);return m?Array.from({length:+m[2]-+m[1]+1},(_,i)=>+m[1]+i):[parseInt(x)];}).filter(n=>n>0&&n<=32);}
function chapterButtons(ns){return ns.map(n=>`<button class="pill" data-chapter="${n}" title="${esc(D.chapters[n-1])}">Ch ${n} ↗</button>`).join('');}
function chapterReading(n){return allLessons.find(l=>l.chapters.includes(n));}
function chapters(){return heading('Find a passage fast','The 32 chapters','Select a chapter to see where it falls in the reading schedule.')+`<div class="chapter-grid">${D.chapters.map((title,i)=>{const l=chapterReading(i+1);return `<button class="chapter-card" data-chapter="${i+1}"><span class="chno">${String(i+1).padStart(2,'0')}</span><span><h3>${esc(title)}</h3><small>Week ${l.week} · ${l.day} ↗</small></span></button>`;}).join('')}</div>`;}
function searchView(){const matches=allLessons.filter(l=>(l.focus+' '+l.activity+' '+l.rubric+' Week '+l.week+' '+l.day+' '+l.chapters.map(n=>D.chapters[n-1]).join(' ')).toLowerCase().includes(query.toLowerCase()));return `<h1 class="search-title">${matches.length} lesson${matches.length===1?'':'s'} for “${esc(query)}”</h1>${matches.length?'<div class="schedule search-results">'+matches.map(l=>lessonCard(l,true)).join('')+'</div>':'<div class="empty">No lessons found. Try a theme, a chapter title or a skill such as PEEL.</div>'}`;}
function openDialog(label,body){$('dialogLabel').textContent=label;$('dialogContent').innerHTML=body;if(!$('dialog').open)$('dialog').showModal();$('dialog').querySelector('.dialog-inner').scrollTop=0;$('closeDialog').focus();}
function close(){if($('dialog').open)$('dialog').close();}
function classroomActivityLink(id){
  const activities={'w1-0':[1,'Meeting the Monster'],'w1-1':[2,'Topic or theme?'],'w1-2':[3,'Chapters 3 to 5'],'w1-3':[4,'Chapters 6 and 7'],'w1-5':[6,'Your first PEEL paragraph'],'w1-6':[7,'Seven Minutes Past Midnight']};
  const activity=activities[id];
  return activity?'<a class="primary open-class-lesson" href="/lessons/5si/unit-2/week-1/lesson-'+activity[0]+'/">Open '+esc(activity[1])+' →</a>':'';
}
function openLesson(id){const l=lesson(id),list=D.weeks[l.week-1].lessons,index=list.indexOf(l);openDialog('Week '+l.week+' · '+l.day+(l.holiday?' · No lesson':' · 55 minutes'),`<img class="dialog-art" src="${A[weekArt[l.week-1]]}" alt=""><div class="dialog-body"><h2 id="dialogTitle">${esc(l.focus)}</h2><div class="lesson-body"><div><div class="eyebrow">What students do</div><p style="margin-top:13px">${esc(l.activity)}</p>${classroomActivityLink(l.id)}${!l.holiday?`<label class="complete"><input id="completed" type="checkbox" data-complete="${l.id}" ${completed.has(id)?'checked':''}>Mark this lesson complete</label>`:''}</div><aside class="lesson-aside"><div class="eyebrow">Rubric link</div><p>${esc(l.rubric)||'No teaching lesson.'}</p>${!l.holiday?'<button class="link" data-view="rubric">Open the essay rubric ↗</button>':''}${l.chapters.length?'<h3>Reading chapters</h3><div class="chapterlinks">'+chapterButtons(l.chapters)+'</div>':''}</aside></div><div class="dialog-nav"><button data-lesson="${index>0?list[index-1].id:''}" ${index===0?'disabled':''}>← Previous lesson</button><button data-week="${l.week}">Week ${l.week} overview</button><button data-lesson="${index<list.length-1?list[index+1].id:''}" ${index===list.length-1?'disabled':''}>Next lesson →</button></div></div>`);}
function openChapter(n){const l=chapterReading(n);openDialog('Chapter '+n+' · Reading schedule',`<img class="dialog-art" src="${A.window}" alt=""><div class="dialog-body"><h2 id="dialogTitle">${esc(D.chapters[n-1])}</h2><p>First read: <strong>Week ${l.week}, ${esc(l.day)}</strong></p><button class="primary" style="margin-top:20px" data-lesson="${l.id}">Open ${esc(l.focus)} ↗</button><h3>Theme evidence</h3>${Object.entries(D.evidence).flatMap(([theme,rows])=>rows.filter(r=>expandChapterList(r[2]).includes(n)).map(r=>`<p><strong>${esc(theme)}:</strong> ${esc(r[0])}</p>`)).join('')||'<p>This chapter is available for the ongoing Theme tracker.</p>'}</div>`);}
function source(which){let title='',body='';if(which==='intro'){title='The unit approach';body=paragraphs(D.intro);}if(which==='rhythm'){title='Reading rhythm & pacing';body=paragraphs(D.overview);}if(which==='glance'){title='Unit at a glance';body=table(['Week','Dates','Reading lessons','Skill and paragraph lessons','Thu creative'],D.glance);}openDialog('Scope and sequence · Original plan',`<div class="dialog-body"><h2 id="dialogTitle">${title}</h2>${body}</div>`);}
function printPlan(){let body='<h1>'+esc(D.title)+'</h1>'+paragraphs(D.intro)+'<h2>What the essay demands</h2>'+paragraphs(D.rubricIntro)+table(['Rubric / checklist requirement','What students must be able to do','First taught','Practised'],D.rubric)+'<h2>Unit at a glance</h2>'+paragraphs(D.overview)+table(['Week','Dates','Reading lessons','Skill and paragraph lessons','Thu creative'],D.glance);body+=D.weeks.map(w=>'<section class="print-week"><h2>'+esc(w.title)+'</h2>'+paragraphs(w.notes)+w.lessons.map(l=>'<h3>'+esc(l.day)+' · '+esc(l.focus)+'</h3><p>'+esc(l.activity)+'</p><p><strong>Rubric link:</strong> '+esc(l.rubric)+'</p>').join('')+'</section>').join('');body+='<section class="print-week"><h2>Chapter titles</h2>'+D.chapters.map((t,i)=>'<p>'+(i+1)+' '+esc(t)+'</p>').join('')+'<h2>Theme evidence bank (teacher reference)</h2>'+paragraphs(D.evidenceIntro)+Object.entries(D.evidence).map(([k,r])=>'<h3>'+esc(k)+'</h3>'+table(['Point','Key evidence','Chapter'],r)).join('')+paragraphs(D.evidenceNotes)+'</section>';$('printContent').innerHTML=body;window.print();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.view)show(d.view);else if(d.week)show('week',d.week);else if(d.lesson)openLesson(d.lesson);else if(d.chapter)openChapter(+d.chapter);else if(d.source)source(d.source);else if(d.theme){evidence=d.theme;render();}else if(d.rubricLesson){const [w,day]=d.rubricLesson.split('|');const l=D.weeks[w-1].lessons.find(l=>l.day===day||l.day.startsWith(day+' '));if(l)openLesson(l.id);}});
document.addEventListener('change',e=>{if(e.target.dataset.complete){const id=e.target.dataset.complete;if(e.target.checked)completed.add(id);else completed.delete(id);save();render();$('status').textContent=completed.size+' of 46 lessons complete.';}});
$('search').addEventListener('input',()=>{query=$('search').value.trim();$('clearSearch').hidden=!query;render();});$('clearSearch').onclick=()=>{query='';$('search').value='';$('clearSearch').hidden=true;render();$('search').focus();};$('closeDialog').onclick=close;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
$('menu').onclick=()=>{const open=$('rail').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open));};
$('resetProgress').onclick=()=>openDialog('Lesson tracker',`<div class="dialog-body"><h2 id="dialogTitle">Reset lesson progress?</h2><p>This clears all completion ticks.</p><button class="primary" style="margin-top:22px" id="confirmReset">Reset ${completed.size} completed lesson${completed.size===1?'':'s'}</button></div>`);
document.addEventListener('click',e=>{if(e.target.id==='confirmReset'){completed.clear();save();close();render();}});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('status').textContent='Fullscreen is unavailable in this browser.';}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';});$('print').onclick=printPlan;
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('dialog').open)return;if(current==='week'&&e.key==='ArrowRight'&&week<7){e.preventDefault();show('week',week+1);}if(current==='week'&&e.key==='ArrowLeft'&&week>1){e.preventDefault();show('week',week-1);}if(e.key==='Escape'){$('rail').classList.remove('open');$('menu').setAttribute('aria-expanded','false');}});
function fromHash(){const h=location.hash.slice(1),m=h.match(/^week-([1-7])$/);if(m){current='week';week=+m[1];}else if(navs.some(n=>n[0]===h))current=h;render();}window.addEventListener('hashchange',()=>{if(!query)fromHash();});fromHash();
</script></body></html>
