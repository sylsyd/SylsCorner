<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 3: What Did You Do?</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d2433;--muted:#5a6275;--line:#e2dccd;--acc:#2e6f8e;--ok:#2e7d4f;--bad:#b5432b;
  --paper:#fffdf5;--rule:#bcd3e6;--margin:#e8a0a0;--hl:#ffe48a;--say:#e3def5;--say-ink:#4b3d8f;--write:#fbe7c0;--write-ink:#8a5a09;--scale:1;
  --ta:#d7ecdf;--tb:#d9e7f5;--tc:#f6dcd6}
[data-theme=dark]{--bg:#141820;--panel:#1f2430;--ink:#eef0f5;--muted:#a9b0c2;--line:#343a4b;--acc:#7cc0e0;--ok:#5bc189;--bad:#f08a6e;
  --paper:#1b2230;--rule:#2b4252;--margin:#6e3a3a;--hl:#5a4a10;--say:#2f2a4c;--say-ink:#c3b8f7;--write:#463715;--write-ink:#f5cf7d;
  --ta:#20362a;--tb:#1f2f40;--tc:#402622}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:calc(20px*var(--scale))/1.45 system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header,footer{display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--panel);flex-wrap:wrap}
header{border-bottom:2px solid var(--line)}footer{border-top:2px solid var(--line)}
#brand{font-weight:800}#brand small{display:block;color:var(--muted);font-weight:600;font-size:.7em}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:4px 12px;text-align:left;line-height:1.15}
.tab small{display:block;color:var(--muted)}
.tab[aria-current=true]{background:var(--c);border-color:var(--c);color:#fff}.tab[aria-current=true] small{color:inherit}
#stage{overflow:auto;padding:16px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:1.8em;line-height:1.1}
h3{margin:0 0 6px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.src{position:sticky;top:0;max-height:74vh;overflow:auto}
.mode{display:inline-block;border-radius:999px;padding:2px 14px;font-weight:800;font-size:.8em}
.mode.say{background:var(--say);color:var(--say-ink)}.mode.write{background:var(--write);color:var(--write-ink)}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 14px;font-weight:700}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btnrow{margin-bottom:6px}
.ans{display:none;margin-top:6px;background:color-mix(in srgb,var(--ok) 15%,var(--panel));border-radius:10px;padding:8px 12px}
.ans.on{display:block}
.hl .clue{background:var(--hl);border-radius:5px}
.step{display:none;padding:8px 12px;border-radius:10px;margin-top:6px;background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
.step.on{display:block}
.step .sl{display:inline-block;min-width:9em;text-transform:uppercase;font-size:.8em;letter-spacing:.04em}
.frame{background:var(--write);color:var(--write-ink);border-radius:12px;padding:8px 14px;font-weight:700;margin:4px 0}
.q{display:grid;grid-template-columns:3em 1fr;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}.q>i{font-style:normal;font-weight:800;color:var(--acc)}
.nb{--lh:1.7em;line-height:var(--lh);border:2px solid var(--line);border-radius:12px;padding:8px 18px 8px 58px;background-color:var(--paper);
  background-image:linear-gradient(to right,transparent 42px,var(--margin) 42px,var(--margin) 44px,transparent 44px),
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh))}
.nb .tag{font-weight:800;color:var(--bad);text-transform:uppercase;font-size:.75em;margin-left:-40px}
.tn{display:none;border:2px dashed var(--write-ink);border-radius:12px;padding:10px 14px}
body.showtn .tn{display:block}
.fr{display:none;color:var(--muted);font-style:italic}body.showfr .fr{display:inline}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tier{border-radius:14px;padding:12px 14px;border:2px solid var(--line)}
.tier.a{background:var(--ta)}.tier.b{background:var(--tb)}.tier.c{background:var(--tc)}
.tier h3 span{display:inline-block;background:var(--ink);color:var(--panel);border-radius:8px;padding:0 10px;margin-right:6px}
.wb{display:flex;flex-wrap:wrap;gap:8px;transition:filter .2s}.wb span{background:var(--say);color:var(--say-ink);border-radius:8px;padding:2px 10px;font-weight:700}
.wb.closed{filter:blur(7px)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{min-height:5.5em;border:3px solid var(--line);border-radius:16px;background:var(--panel);font-size:1.1em;font-weight:800;padding:10px}
.tile .num{font-size:2.2em;color:var(--acc)}.tile .top{display:none}
.tile.on{background:var(--say);color:var(--say-ink)}.tile.on .num{display:none}.tile.on .top{display:block}
.tile.on .top small{display:block;font-weight:600;font-size:.75em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
table.obs{border-collapse:collapse;width:100%;font-size:.85em}table.obs td,table.obs th{border:1px solid var(--line);padding:4px 8px;text-align:left}
#pack{display:none;position:fixed;inset:60px 40px 80px;z-index:9;overflow:auto;background:var(--panel);border:3px solid var(--acc);border-radius:16px;padding:18px 22px;box-shadow:0 10px 40px #0005}
body.showpack #pack{display:block}
#clock{font-weight:800;font-size:1.9em;font-variant-numeric:tabular-nums;min-width:3em;text-align:center}
#clock.done{color:var(--bad)}
#prog{flex:1 1 60px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}#prog i{display:block;height:100%;width:0;background:var(--acc)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
svg text{font-family:system-ui,sans-serif}
@media (max-width:900px){.split,.grid2,.tiers,.tiles{grid-template-columns:1fr}.src{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.train{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.car{border-radius:10px;padding:6px 16px;font-weight:800;color:#fff;font-size:1.05em}
.car.lw{background:#5a6275}
.car.who,.chip.who{background:#2e6f8e}.car.does,.chip.does{background:#b5432b}.car.what,.chip.what{background:#7b5ea7}.car.where,.chip.where{background:#2e7d4f}.car.when,.chip.when{background:#8a5a09}
.chip{display:inline-block;color:#fff;border-radius:8px;padding:1px 9px;font-weight:700;margin:2px 0}
.pgrid{display:grid;gap:10px}.pcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;font-family:system-ui,sans-serif;font-size:.9em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tiles2 span{display:inline-block;border:2px solid var(--acc);border-radius:8px;padding:2px 12px;margin:2px 4px 2px 0;font-weight:700;background:var(--panel)}
.strands{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.strands span{background:var(--say);color:var(--say-ink);border-radius:999px;padding:2px 14px;font-weight:800}
.muted{color:var(--muted);margin:4px 0 0}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}

  --bg:#fff4de; --panel:#fffbef; --ink:#181c33; --muted:#485068; --line:#232743;

  --write:#ffdc9b; --write-ink:#542717; --ta:#d8ef87; --tb:#c9e4ff; --tc:#ffd0dc;

body:has([data-tab="1"][aria-current=true]) {--pop:#b5d9ff}

body:has([data-tab="6"][aria-current=true]) {--pop:#ffb7c4}

button:hover {box-shadow:inset 0 0 0 1px currentColor}

/* Printed-magazine backdrops and photographic chapter strips */
body {--backdrop-ink:#2929ae; --backdrop-base:#fff1dc; --band-ink:#171a31;
  --pattern:radial-gradient(circle,currentColor 1.35px,transparent 1.6px);
  --pattern-size:14px 14px; --pattern-position:0 0}
body:has([data-tab="0"][aria-current=true]) {--backdrop-ink:#ce492e}
body:has([data-tab="1"][aria-current=true]) {--backdrop-ink:#184bbb; --backdrop-base:#eaf2ff;
  --pattern:repeating-linear-gradient(135deg,currentColor 0 1px,transparent 1px 13px)}
body:has([data-tab="2"][aria-current=true]) {--backdrop-ink:#9c2e9e; --backdrop-base:#ffe6f5;
  --chapter-photo:var(--ask-photo); --chapter-position:32%}
body:has([data-tab="3"][aria-current=true]) {--backdrop-ink:#4d7019; --backdrop-base:#f2f6cc;
  --pattern:repeating-linear-gradient(120deg,currentColor 0 1px,transparent 1px 12px)}
body:has([data-tab="4"][aria-current=true]) {--backdrop-ink:#bd4c07; --backdrop-base:#fff0c6;
  --chapter-photo:var(--opinion-photo); --chapter-position:29%}
body:has([data-tab="5"][aria-current=true]) {--backdrop-ink:#592cbb; --backdrop-base:#efe6ff;
  --chapter-photo:var(--minute-photo); --chapter-position:37%;
  --pattern:repeating-linear-gradient(135deg,currentColor 0 1px,transparent 1px 14px)}
body:has([data-tab="6"][aria-current=true]) {--backdrop-ink:#a52d53; --backdrop-base:#ffe6e6;
  --chapter-photo:var(--fix-photo); --chapter-position:54%}
body:has([data-tab="7"][aria-current=true]) {--backdrop-ink:#007c74; --backdrop-base:#dff6ed;
  --chapter-photo:var(--exit-photo); --chapter-position:53%}
body:has([data-tab="8"][aria-current=true]) {--backdrop-ink:#c14509; --backdrop-base:#ffedcf;
  --chapter-photo:var(--spare-photo); --chapter-position:58%;
  --pattern:repeating-linear-gradient(120deg,currentColor 0 1px,transparent 1px 12px)}
[data-theme=dark] body {--backdrop-base:#1b1b31}
#stage {
  position:relative; isolation:isolate;
  background:
    linear-gradient(146deg,transparent 0 66%,color-mix(in srgb,var(--pop) 48%,var(--backdrop-base)) 66% 88%,transparent 88%),
    linear-gradient(118deg,var(--backdrop-base) 0 48%,color-mix(in srgb,var(--pop) 65%,var(--backdrop-base)) 100%);
}
[data-theme=dark] #stage {
  background:linear-gradient(146deg,#1b1b31 0 66%,color-mix(in srgb,var(--pop) 21%,#17172c) 66% 88%,#202039 88%);
}
#stage::before {
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  color:var(--backdrop-ink); background-image:var(--pattern);
  background-size:var(--pattern-size); background-position:var(--pattern-position); opacity:.30;
  mask-image:linear-gradient(115deg,#000 0%,transparent 50%,#000 100%);
}
[data-theme=dark] #stage::before {color:var(--pop); opacity:.19}
.wrap > h1 {text-shadow:1px 1px var(--backdrop-base)}
.wrap:has(.src) > h1 {
  background:var(--pop); color:var(--band-ink); text-shadow:none;
  border:2px solid var(--band-ink); padding:5px 12px 8px; box-shadow:4px 4px #191a32;
}
.wrap > h1 {
  min-height:1.53em; display:flex; flex-direction:column; justify-content:center;
  padding:7px 35% 8px 13px; border:2px solid #191a32; border-radius:4px 4px 20px 4px;
  color:var(--band-ink); text-shadow:none; text-wrap:initial; box-shadow:4px 4px #191a32;
  background:
    linear-gradient(113deg,var(--pop) 0 65%,#191a32 65% 65.45%,transparent 65.45%),
    var(--chapter-photo) var(--chapter-position) / cover no-repeat;
  background-position:center, right var(--chapter-position);
  background-size:100% 100%, 38% auto;
}
.wrap > h1 .fr,
.wrap:has(.src) > h1 .fr {color:#333348}

body:has([data-tab="4"][aria-current=true]) {--band-ink:#38220a}
body:has([data-tab="5"][aria-current=true]) {--band-ink:#211345}
body:has([data-tab="6"][aria-current=true]) {--band-ink:#3c162a}
body:has([data-tab="7"][aria-current=true]) {--band-ink:#0d3235}

   {n:'G7',q:'started',a:'3: /ɪd/. The film started at eight.'},

   {n:'G9',q:'opened',a:'2: /d/. I opened the window.'}]))+
   tn('')}},
 {id:'talk',name:'Talk for 60 seconds',min:10,c:'#b5432b',mode:'say',html:function(){return h1('Last weekend: talk for 60 seconds'+fr('Le week-end dernier'))+
   '<div class="tiers">'+
   tier('a','A','Use the frames','<div class="frame">On Saturday I ___ed ___.</div><div class="frame">Then I ___ed ___.</div><div class="frame">On Sunday I ___ed ___.</div><div class="frame">It was ___.</div>')+
   tier('b','B','Use the starters','<div class="frame">First, I...</div><div class="frame">Then...</div><div class="frame">After that...</div><div class="frame">It was... because...</div>')+
   tier('c','C','No frames','Talk for <b>60 seconds</b>. Use at least <b>five -ed verbs</b>, <b>first, then, after that</b>, and <b>was</b> or <b>were</b>.')+'</div>'+
   card('<b>Verb help:</b> played · watched · walked · talked · stayed · listened · studied · visited · cooked · cleaned · <b>Listeners:</b> ask "How was it?"')+
   card(qset([{n:'T1',q:'Model talk (Tier B)',a:'Last weekend was quite good. First, on Saturday morning, I stayed in bed until ten. Then I played basketball with my friends in the park. After that we walked to a café. On Sunday I studied for my maths test and I cleaned my room. In the evening I watched a film with my family. It was funny.'}]))+
   tn('')}},
 {id:'nb',name:'Notebook',min:7,c:'#8a5a09',mode:'write',html:function(){return h1('Copy into your notebook'+fr('Copie dans ton cahier'))+'<div class="grid2">'+
   nb('Grammar: the past with -ed','<div>Every Saturday I <b>play</b>. Last Saturday I <b>played</b>.</div><div>Same for everyone: I / she / they <b>played</b>. No -s.</div><div><b>was:</b> I, he, she, it &nbsp;·&nbsp; <b>were:</b> you, we, they</div><div>3 sounds: watch<b>ed</b> /t/ · play<b>ed</b> /d/ · want<b>ed</b> /ɪd/</div><div>10 verbs: played, watched, walked, talked, stayed, listened, studied, visited, wanted, started</div>')+
   nb('Little words (back page)','<div><b>yesterday</b>: I walked to school yesterday.</div><div><b>last</b>: last night, last week, last weekend</div><div><b>ago</b>: two days ago, a week ago</div><div><b>first</b>: First, I cooked dinner.</div><div><b>then</b>: Then I watched TV.</div><div><b>after that</b>: After that, I talked to my friend.</div>')+'</div>'+
   tn('')}},
 {id:'exit',name:'Exit ticket',min:5,c:'#2e6f8e',mode:'write',html:function(){return h1('Exit ticket')+nb('Write three things you did yesterday, in order',qset([
   {n:'X1',q:'First, I ___.',a:'First, I walked to school.'},
   {n:'X2',q:'Then I ___.',a:'Then I talked to my friends at lunch.'},
   {n:'X3',q:'After that, I ___. It was ___.',a:'After that, I watched a film. It was great.'}]))+

 {id:'spare',name:'Spare: Every day or yesterday?',min:5,c:'#7b5ea7',mode:'say',html:function(){return h1('Spare game: every day or yesterday?'+fr('Présent ou passé ?'))+
   card('Fix the verb so it matches the time word.')+card(qset([
   {n:'W1',q:'Yesterday I watch TV.',a:'Yesterday I <b>watched</b> TV.'},
   {n:'W2',q:'Every day she walked to school.',a:'Every day she <b>walks</b> to school.'},
   {n:'W3',q:'Last night we stay at home.',a:'Last night we <b>stayed</b> at home.'},
   {n:'W4',q:'Two days ago he cleans his room.',a:'Two days ago he <b>cleaned</b> his room.'},
   {n:'W5',q:'I usually played football on Mondays.',a:'I usually <b>play</b> football on Mondays.'},
   {n:'W6',q:'Last weekend it is fun.',a:'Last weekend it <b>was</b> fun.'}]))+
   tn('')}}
];
var PACK='';
/* ===== ENGINE ===== */
var $=function(s){return document.querySelector(s)};
function h1(t){return '<h1>'+t+'</h1>'}
function card(x){return '<div class="card">'+x+'</div>'}
function tn(){return ''}
function frame(x){return '<div class="frame">'+x+'</div>'}
function fr(x){return '<span class="fr"> ('+x+')</span>'}
function tier(c,l,t,x){return '<div class="tier '+c+'"><h3><span>'+l+'</span>'+t+'</h3>'+x+'</div>'}
function marked(s){return s.replace(/\[([^\]]+)\]/g,'<span class="clue">$1</span>')}
function nb(title,body){return '<div class="nb"><div class="tag">In your notebook'+fr('Dans ton cahier')+'</div>'+(title?'<b>'+title+'</b>':'')+body+'</div>'}
function qset(items){return '<div class="qs"><div class="btnrow"><button class="btn" data-all="1">Show all answers</button> <button class="btn" data-all="0">Hide all</button></div>'+
  items.map(function(it){return '<div class="q"><i>'+it.n+'</i><div>'+it.q+' <button class="btn" data-rev>Answer</button><div class="ans">'+it.a+'</div></div></div>'}).join('')+'</div>'}
function stepped(d){return '<div class="stepped"><p style="font-size:1.4em;font-family:Georgia,serif;margin:0">'+marked(d.text)+'</p><p><i>'+d.q+'</i></p>'+
  d.steps.map(function(s,i){return '<div class="step"><b class="sl">'+(i+1)+'. '+s[0]+'</b> '+s[1]+'</div>'}).join('')+
  '<p><button class="btn pri" data-step>Next step (Space)</button> <button class="btn" data-unstep>Hide all</button></p></div>'}
var S={i:0,run:false,rem:{},tick:null,scale:1};
STAGES.forEach(function(s){S.rem[s.id]=s.min*60});
$('#pack').innerHTML=PACK;
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function drawClock(){var s=STAGES[S.i],r=S.rem[s.id];$('#clock').textContent=fmt(r);$('#clock').classList.toggle('done',r<=0);
  $('#prog i').style.width=(s.min?Math.max(0,100*(1-r/(s.min*60))):0)+'%';$('#tgo').textContent=S.run?'Pause':'Start'}
function render(){var s=STAGES[S.i];
  $('#tabs').innerHTML=STAGES.map(function(t,i){return '<button class="tab" style="--c:'+t.c+'" data-tab="'+i+'" aria-current="'+(i===S.i)+'"><b>'+(i+1)+'. '+t.name+'</b><small>'+t.min+' min</small></button>'}).join('');
  var badge=s.mode==='write'?'<span class="mode write">Write in your notebook</span>':s.mode==='say'?'<span class="mode say">Say it: no writing</span>':'<span class="mode say">Say it</span> <span class="mode write">then write it</span>';
  $('#stage').innerHTML='<div class="wrap"><div>'+badge+'</div>'+s.html()+'</div>';$('#stage').scrollTop=0;drawClock()}
function go(i){if(i<0||i>=STAGES.length)return;S.i=i;render()}
function toggle(){S.run=!S.run;clearInterval(S.tick);if(S.run)S.tick=setInterval(function(){var id=STAGES[S.i].id;if(S.rem[id]>0)S.rem[id]--;drawClock()},1000);drawClock()}
function nextStep(){var st=document.querySelector('.stepped');if(!st)return false;var n=st.querySelector('.step:not(.on)');if(!n)return false;n.classList.add('on');st.classList.add('hl');return true}
var A={toggle:toggle,reset:function(){S.rem[STAGES[S.i].id]=STAGES[S.i].min*60;drawClock()},plus:function(){S.rem[STAGES[S.i].id]+=60;drawClock()},
  prev:function(){go(S.i-1)},next:function(){go(S.i+1)},fr:function(){document.body.classList.toggle('showfr')},tn:function(){document.body.classList.toggle('showtn')},
  pack:function(){document.body.classList.toggle('showpack')},
  smaller:function(){S.scale=Math.max(.7,S.scale-.1);document.documentElement.style.setProperty('--scale',S.scale)},
  bigger:function(){S.scale=Math.min(1.8,S.scale+.1);document.documentElement.style.setProperty('--scale',S.scale)},
  theme:function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'},
  full:function(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(function(){});else document.exitFullscreen()}catch(e){}}};
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.a)return A[b.dataset.a]();
  if(b.dataset.tab)return go(+b.dataset.tab);
  if(b.hasAttribute('data-rev'))return b.nextElementSibling.classList.toggle('on');
  if(b.dataset.all){var on=b.dataset.all==='1';b.closest('.qs').querySelectorAll('.ans').forEach(function(x){x.classList.toggle('on',on)});return}
  if(b.hasAttribute('data-step'))return nextStep();
  if(b.hasAttribute('data-flip'))return b.classList.toggle('on');
  if(b.hasAttribute('data-wb')){var w=b.parentNode.querySelector('.wb');if(w)w.classList.toggle('closed');return}
  if(b.hasAttribute('data-unstep')){var st=b.closest('.stepped');st.classList.remove('hl');st.querySelectorAll('.step').forEach(function(x){x.classList.remove('on')})}});
document.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,textarea'))return;var k=e.key;
  if(k==='ArrowRight')go(S.i+1);else if(k==='ArrowLeft')go(S.i-1);
  else if(k===' '||k==='Enter'){e.preventDefault();nextStep()}
  else if(k==='s'||k==='S')toggle();else if(k==='n'||k==='N')A.tn();else if(k==='f'||k==='F')A.fr();
  else if(k==='Escape')document.body.classList.remove('showpack');
  else if(k==='+'||k==='=')A.bigger();else if(k==='-')A.smaller()});
render();
})();
</script></body></html>
