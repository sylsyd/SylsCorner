<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Classroom resources for Syl's Corner.">
  <title>Classroom | Syl's Corner</title>
  <link rel="stylesheet" href="css/classroom.css">
  <script src="js/classroom.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Syl's Corner home"><img src="assets/syl-corner-mark.png" alt=""><span>Syl's Corner</span></a>
    <nav class="page-nav"><a href="tools.html">Tools</a><a class="back" href="index.html#classes">All classes <span aria-hidden="true">←</span></a></nav>
  </header>
  <main>
    <section class="class-hero"><p id="eyebrow"></p><h1 id="title"></h1><p id="description"></p></section>
    <section class="content">
      <div class="resource-tabs" id="resource-tabs" role="tablist" aria-label="Class resources" hidden><button class="resource-tab active" type="button" role="tab" aria-selected="true">Games</button></div>
      <section class="games-panel" id="games-panel" hidden>
        <p class="label" id="games-label"></p>
        <h2 id="games-title"></h2>
        <p id="games-copy"></p>
        <a id="games-link" href="#">Open games <span aria-hidden="true">→</span></a>
      </section>
      <div class="empty-state" id="empty-state"><span id="symbol" aria-hidden="true"></span><p class="label" id="label"></p><h2 id="empty-title"></h2><p id="empty-copy"></p><a href="index.html#classes">Return to classroom hub <span aria-hidden="true">→</span></a></div>
    </section>
  </main>
